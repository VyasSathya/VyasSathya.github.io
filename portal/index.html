<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Project portal - Vyas Sathya</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Project" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <link rel="preload" href="../fonts/geist-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="portal.css?v=2" />
    <script>
      try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <header class="bar">
      <a class="mark" href="./"><b>VS</b><span>Project portal</span></a>
      <div class="bar-right">
        <button class="icon-btn theme" type="button" aria-label="Switch light or dark appearance">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.5" /><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor" /></svg>
        </button>
      </div>
    </header>
    <main id="app"><p class="empty">Loading your project...</p></main>
    <script src="core.js?v=2"></script>
    <script src="client.js?v=2"></script>
  </body>
</html>
