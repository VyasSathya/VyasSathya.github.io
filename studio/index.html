<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Studio - Vyas Sathya</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Studio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <link rel="preload" href="../fonts/geist-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="../portal/portal.css?v=7" />
    <link rel="stylesheet" href="studio.css?v=8" />
    <script>
      try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body class="wide">
    <header class="bar">
      <a class="mark" href="./"><b>VS</b><span>Studio</span></a>
      <div class="bar-right">
        <span class="sync" id="sync"></span>
        <button class="icon-btn" type="button" id="reload" aria-label="Refresh">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3.2h-3.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <button class="icon-btn theme" type="button" aria-label="Switch light or dark appearance">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.5" /><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor" /></svg>
        </button>
      </div>
    </header>
    <main id="app"><p class="empty">Loading...</p></main>
    <script src="../portal/core.js?v=2"></script>
    <script src="../portal/qrcode.js"></script>
    <script src="../demo/templates.js?v=5"></script>
    <script src="../portal/modules.js?v=4"></script>
    <script src="screens.js?v=3"></script>
    <script src="studio.js?v=5"></script>
  </body>
</html>
