<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Client portal demo - Vyas Sathya</title>
    <meta name="description" content="Click through a live client portal: progress, approvals, decisions, payments and check-ins." />
    <meta property="og:title" content="Client portal demo" />
    <meta property="og:description" content="What your clients see: progress, approvals, decisions, payments and check-ins." />
    <meta property="og:image" content="https://vyasapps.dev/media/og.jpg" />
    <link rel="canonical" href="https://vyasapps.dev/demo/" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="../fonts/geist-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="../portal/portal.css?v=3" />
    <style>
      .demo-bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem var(--pad);background:var(--fg);color:var(--bg);font-size:.8125rem}
      .demo-bar a{color:var(--bg);border-bottom:1px solid currentColor;white-space:nowrap;font-weight:500}
      .demo-bar span{opacity:.75}
      @media (max-width:560px){.demo-bar span{display:none}}
    </style>
    <script>
      try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div class="demo-bar"><span>Live demo. Harbor &amp; Pine is a sample business; nothing you do here is saved.</span><a href="../offer/">Get this for your business</a></div>
    <header class="bar">
      <a class="mark" href="../"><b>VS</b><span>Client portal demo</span></a>
      <div class="bar-right">
        <button class="icon-btn theme" type="button" aria-label="Switch light or dark appearance">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.5" /><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor" /></svg>
        </button>
      </div>
    </header>
    <main id="app"><p class="empty">Loading the demo project...</p></main>
    <script src="../portal/core.js?v=2"></script>
    <script src="demo-data.js?v=1"></script>
    <script src="../portal/client.js?v=2"></script>
  </body>
</html>
