<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Your dashboard demo - Vyas Sathya</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="../fonts/geist-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="../portal/portal.css?v=7" />
    <link rel="stylesheet" href="../studio/studio.css?v=8" />
    <style>
      #sync,#reload{display:none}
      .embed .bar{height:56px}
      .embed main{padding-top:24px}
    </style>
    <script>
      try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body class="wide">
    <header class="bar">
      <a class="mark" href="../offer/"><b>VS</b><span>Your dashboard</span></a>
      <div class="bar-right">
        <span class="sync" id="sync"></span>
        <button class="icon-btn" type="button" id="reload" aria-label="Refresh"></button>
        <button class="icon-btn theme" type="button" aria-label="Switch light or dark appearance">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.5" /><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor" /></svg>
        </button>
      </div>
    </header>
    <main id="app"><p class="empty">Loading...</p></main>
    <script src="../portal/core.js?v=2"></script>
    <script src="../portal/qrcode.js"></script>
    <script src="templates.js?v=5"></script>
    <script src="owner.js?v=3"></script>
    <script src="../studio/studio.js?v=5"></script>
  </body>
</html>
