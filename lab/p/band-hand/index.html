<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Band Hand</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--panel:#3A2B5A;--edge:#4D3B72;--sub:#CFC4E6;--blue:#2F8BFF;--red:#E8455B;--gold:#FFC94A;--orange:#FF9F43;--card:#FFF8EA}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1E1633;font-family:"Fredoka",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#fff;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{background:
  radial-gradient(ellipse 80% 50% at 20% 20%,rgba(120,70,190,.45),rgba(0,0,0,0) 70%),
  radial-gradient(ellipse 70% 45% at 90% 75%,rgba(40,140,150,.35),rgba(0,0,0,0) 70%),
  linear-gradient(#2A1D45,#1E1633)}
#stage{position:absolute;left:50%;top:50%;width:390px;height:844px;transform-origin:50% 50%}
.a{position:absolute}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
/* felt */
#felt{left:-4px;right:-4px;top:258px;height:300px;border-radius:40px;
  background:radial-gradient(ellipse 70% 60% at 50% 45%,rgba(60,190,170,.16),rgba(0,0,0,0) 70%);pointer-events:none}
/* blind */
.blind{left:10px;top:14px;width:196px;height:120px;border-radius:16px;background:var(--panel);border:2px solid var(--edge);overflow:hidden}
.blind .bh{height:30px;background:var(--blue);color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;letter-spacing:.3px;transition:background .3s}
.blind .bd{display:flex;gap:9px;padding:9px 10px;align-items:center}
.chip{width:46px;height:46px;border-radius:50%;--c:var(--blue);background:radial-gradient(circle,var(--c) 0 40%,#fff 40% 48%,var(--c) 48% 100%);border:3px dashed #fff;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.35);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blind .tx{color:var(--sub);font-size:12px;line-height:1.1}
.blind .tx b{display:block;color:#FF6B7F;font-size:24px;font-weight:700;margin-top:2px}
.blind .rw{position:absolute;left:10px;right:10px;bottom:7px;font-size:12px;color:var(--sub);display:flex;justify-content:space-between;gap:6px}
.blind .rw b{color:var(--gold);letter-spacing:1px;font-weight:600}
.blind .rw .rule{color:#FF8A9A;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{left:214px;right:10px;top:14px;height:56px;border-radius:14px;background:var(--panel);border:2px solid var(--edge);padding:6px 10px;color:var(--sub);font-size:12px;overflow:hidden}
.rs b{display:block;color:#fff;font-size:24px;font-weight:700;line-height:1.1;transition:transform .15s}
.rs .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--gold);width:0;transition:width .4s}
.tiny{position:absolute;display:flex;gap:6px;left:214px;right:10px;top:76px}
.tb{flex:1;height:58px;border-radius:12px;background:var(--panel);border:2px solid var(--edge);color:var(--sub);font-size:11px;text-align:center;padding-top:5px}
.tb b{display:block;font-size:22px;font-weight:700;margin-top:1px}
.tb b small{font-size:13px;color:var(--sub);font-weight:500}
/* leaders */
.leaders{left:10px;right:10px;top:146px;height:104px;border-radius:16px;background:rgba(0,0,0,.18);border:2px solid rgba(255,255,255,.06);display:flex;gap:8px;align-items:center;padding:0 10px}
.ld{width:56px;height:80px;border-radius:9px;background:linear-gradient(#FFF1C9,#FFD877);border:3px solid #E7A923;position:relative;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.4);flex:none;transition:transform .18s,box-shadow .18s}
.ld img{position:absolute;left:50%;bottom:2px;height:68px;max-width:52px;object-fit:contain;object-position:bottom;transform:translateX(-50%)}
.ld.go{transform:rotate(-6deg) translateY(-4px) scale(1.08);box-shadow:0 0 0 3px #fff,0 6px 16px rgba(255,201,74,.6)}
.ld.empty{background:none;border:2px dashed rgba(255,255,255,.14);box-shadow:none}
.lcount{margin-left:auto;align-self:flex-end;margin-bottom:8px;color:var(--sub);font-size:13px;font-weight:500}
/* hand name + score */
.hand-name{left:0;right:0;top:262px;text-align:center;color:#fff;font-weight:700;font-size:22px;letter-spacing:.3px;height:28px;transition:transform .15s}
.hand-name span{font-size:14px;color:var(--sub);font-weight:500;margin-left:6px}
.hand-name.flash{transform:scale(1.12)}
.score{left:50%;top:298px;transform:translateX(-50%);display:flex;align-items:center;gap:8px}
.score .bx{min-width:104px;height:50px;padding:0 10px;border-radius:12px;display:grid;place-items:center;font-size:30px;font-weight:700;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .09s}
.score .ch{background:var(--blue)}.score .mu{background:var(--red)}
.score .x{color:var(--red);font-size:28px;font-weight:700}
.bx.bump{transform:scale(1.14)}
.bx.shake{animation:shake .3s}
@keyframes shake{20%{transform:rotate(-7deg) scale(1.2)}50%{transform:rotate(6deg) scale(1.2)}80%{transform:rotate(-3deg) scale(1.1)}}
#total{left:50%;top:296px;transform:translateX(-50%) scale(.4);opacity:0;font-size:42px;font-weight:700;color:#fff;padding:0 18px;height:56px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(#FFB43A,#FF7A1A);box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 40px rgba(255,170,60,.6);pointer-events:none;white-space:nowrap;z-index:40}
#total.show{transition:transform .25s cubic-bezier(.2,1.6,.4,1),opacity .15s;transform:translateX(-50%) scale(1);opacity:1}
#total.fly{transition:transform .45s cubic-bezier(.6,0,.8,.4),opacity .45s,top .45s,left .45s;left:300px;top:10px;transform:translateX(-50%) scale(.35);opacity:.2}
/* cards */
.card{position:absolute;left:0;top:0;width:74px;height:104px;border-radius:10px;background:var(--card);border:2px solid #fff;
  box-shadow:0 4px 0 rgba(0,0,0,.35),0 8px 14px rgba(0,0,0,.25);overflow:hidden;cursor:pointer;
  transition:left .32s cubic-bezier(.3,1.25,.5,1),top .32s cubic-bezier(.3,1.25,.5,1),transform .32s cubic-bezier(.3,1.25,.5,1),opacity .3s,box-shadow .2s,filter .3s}
.card .bg{position:absolute;inset:0}
.card .fig{position:absolute;left:50%;bottom:14px;height:66px;transform:translateX(-50%);transform-origin:50% 100%;pointer-events:none}
.card .fig img{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.card .fig .fl{position:absolute;left:-35%;right:-35%;top:-12%;bottom:-12%;opacity:0;mix-blend-mode:screen;pointer-events:none}
.card .fig .mo{position:absolute;background-repeat:no-repeat;pointer-events:none}
.np{position:absolute;z-index:45;pointer-events:none;animation:np .8s ease-out forwards}
@keyframes np{0%{transform:translate(0,0) scale(.5) rotate(var(--r));opacity:0}15%{transform:translate(calc(var(--dx)*.2),-6px) scale(1) rotate(var(--r));opacity:1}100%{transform:translate(var(--dx),-36px) scale(.85) rotate(var(--r));opacity:0}}
.card .rk{position:absolute;left:6px;top:3px;font-size:18px;font-weight:700;line-height:1}
.card .fd{position:absolute;right:6px;top:6px;width:11px;height:11px;border-radius:50%}
.card .fb{position:absolute;left:0;right:0;bottom:0;height:13px;display:grid;place-items:center}
.card .fb em{font-style:normal;font-size:8.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:rgba(255,255,255,.95);line-height:1}
.card.sel{box-shadow:0 0 0 3px var(--gold),0 8px 14px rgba(0,0,0,.35)}
.card.glow{box-shadow:0 0 0 3px #fff,0 0 22px 4px var(--fc)}
.card.dim{filter:brightness(.6) saturate(.7)}
.card.muted{filter:grayscale(1) brightness(.75)}
.card.muted::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 46%,rgba(232,69,91,.9) 46% 54%,transparent 54%)}
.card.nope{animation:nope .25s}
@keyframes nope{30%{margin-left:-5px}70%{margin-left:5px}}
.pop{position:absolute;padding:2px 8px;border-radius:8px;font-weight:700;font-size:16px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.35);z-index:50;pointer-events:none;white-space:nowrap;animation:popUp .9s ease-out forwards}
.pop.r{background:var(--red)}.pop.b{background:var(--blue)}.pop.g{background:#E7A923}.pop.x{background:var(--red);font-size:19px}
@keyframes popUp{0%{transform:translateY(8px) scale(.5);opacity:0}18%{transform:translateY(-4px) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translateY(-26px) scale(1);opacity:0}}
/* buttons */
.btns{left:12px;right:12px;top:722px;display:flex;gap:8px;align-items:stretch}
.btn{height:58px;border-radius:14px;color:#fff;font-weight:600;font-size:18px;display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .08s,opacity .2s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.p{flex:1.35;background:var(--blue)}.btn.d{flex:1;background:var(--red)}
.btn[disabled]{opacity:.42;pointer-events:none}
.sort{flex:.9;display:flex;flex-direction:column;gap:4px;justify-content:center;align-items:stretch;background:var(--panel);border-radius:14px;padding:6px;border:2px solid var(--edge)}
.sort span{font-size:10px;color:var(--sub);text-align:center}
.sort div{display:flex;gap:4px}
.sort button{flex:1;height:22px;border-radius:7px;background:var(--orange);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.sort button.on{background:#FFB870;color:#3A2B5A}
.foot{left:14px;right:14px;top:796px;height:40px;display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:13px}
.money{color:var(--gold);font-size:22px;font-weight:700;min-width:60px;transition:transform .15s}
.money.bump{transform:scale(1.25)}
.pill{height:30px;padding:0 14px;border-radius:15px;background:var(--panel);border:2px solid var(--edge);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.icon{width:30px;height:30px;border-radius:15px;background:var(--panel);border:2px solid var(--edge);display:grid;place-items:center}
.deck{display:flex;align-items:center;gap:8px;min-width:60px;justify-content:flex-end}
.back{width:26px;height:36px;border-radius:5px;background:repeating-linear-gradient(45deg,#E8455B 0 4px,#C9354A 4px 8px);border:2px solid #fff;box-shadow:3px 3px 0 var(--card),3px 3px 0 1px rgba(0,0,0,.3)}
/* panels */
.panel{position:absolute;left:10px;right:10px;top:262px;bottom:58px;border-radius:20px;background:rgba(22,15,40,.94);border:2px solid var(--edge);
  box-shadow:0 20px 50px rgba(0,0,0,.5);padding:16px 14px;display:none;flex-direction:column;z-index:60}
.panel.show{display:flex;animation:rise .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
.panel h3{font-size:26px;font-weight:700;text-align:center;letter-spacing:.3px}
.panel .sub{color:var(--sub);text-align:center;font-size:14px;margin-top:2px}
.rows{margin:18px 6px 0;display:flex;flex-direction:column;gap:10px}
.rowl{display:flex;justify-content:space-between;align-items:center;font-size:17px;color:var(--sub);padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.05)}
.rowl b{color:var(--gold);font-weight:700;font-size:20px}
.panel .grow{flex:1}
.bigbtn{height:58px;border-radius:14px;font-size:20px;font-weight:600;color:#fff;background:var(--blue);box-shadow:0 5px 0 rgba(0,0,0,.35);width:100%}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.bigbtn.o{background:var(--orange)}
/* shop */
.shopsec{font-size:12px;color:var(--sub);letter-spacing:.8px;text-transform:uppercase;margin:12px 2px 8px;font-weight:600}
.offers{display:flex;gap:10px}
.offer{flex:1;border-radius:14px;background:var(--panel);border:2px solid var(--edge);padding:8px;display:flex;gap:9px;align-items:center;min-height:112px;position:relative}
.offer .tx{flex:1;min-width:0}
.offer .nm{font-size:13.5px;font-weight:600;line-height:1.15}
.offer .ds{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.2}
.offer .buy{margin-top:7px;height:28px;padding:0 12px;border-radius:9px;background:#E7A923;color:#fff;font-weight:700;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.offer .buy[disabled]{opacity:.4;pointer-events:none}
.offer.sold{opacity:.35;pointer-events:none}
.offer .mini{transform:scale(.78);transform-origin:0 50%;width:58px;height:82px;flex:none;position:relative}
.offer .mini .card{position:absolute;left:0;top:0;cursor:default;transition:none}
.offer .ld{width:56px;height:80px}
.arr{width:58px;height:82px;flex:none;border-radius:10px;background:linear-gradient(#3B7BFF,#2457D6);border:2px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.arr .dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;width:44px}
.arr .dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid #fff}
.arr b{font-size:15px}
.shopfoot{display:flex;gap:10px;margin-top:auto}
.shopfoot .bigbtn{flex:1;width:auto}
.shopfoot .bigbtn.o{flex:.55;font-size:17px}
body.off .score,body.off .hand-name{visibility:hidden}
/* hand list */
.hl{display:flex;flex-direction:column;gap:6px;margin-top:12px;overflow:auto}
.hr{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:11px;background:rgba(255,255,255,.05)}
.hr .dots{display:flex;gap:3px;width:70px;flex:none}
.hr .dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(255,255,255,.8)}
.hr .nm{flex:1;font-size:15px;font-weight:600}
.hr .nm span{font-size:12px;color:var(--sub);font-weight:500;margin-left:5px}
.hr .cm{display:flex;gap:4px;align-items:center;font-weight:700;font-size:14px}
.hr .cm i{font-style:normal;padding:1px 7px;border-radius:6px}
.close{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:17px;background:rgba(255,255,255,.08);display:grid;place-items:center}
/* tip */
#tip{position:absolute;left:10px;right:10px;top:256px;z-index:70;border-radius:16px;background:#2C2048;border:2px solid #E7A923;padding:12px 14px;display:none;align-items:center;gap:12px;box-shadow:0 14px 30px rgba(0,0,0,.5)}
#tip.show{display:flex;animation:rise .25s}
#tip .tx{flex:1}
#tip .nm{font-size:16px;font-weight:600}
#tip .ds{font-size:13.5px;color:var(--sub);margin-top:2px}
#tip .sell{height:40px;padding:0 14px;border-radius:11px;background:var(--red);font-weight:700;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
/* title */
#title{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:radial-gradient(ellipse 80% 50% at 30% 25%,rgba(120,70,190,.55),rgba(0,0,0,0) 70%),radial-gradient(ellipse 70% 45% at 80% 80%,rgba(40,140,150,.4),rgba(0,0,0,0) 70%),linear-gradient(#2A1D45,#1E1633);transition:opacity .4s}
#title.out{opacity:0;pointer-events:none}
#title .fan{position:relative;width:360px;height:230px;margin-top:-40px}
#title .fan .card{cursor:default;transition:none}
#title h1{font-size:62px;font-weight:700;letter-spacing:.5px;line-height:1;margin-top:18px;text-shadow:0 5px 0 rgba(0,0,0,.35)}
#title h1 em{font-style:normal;color:var(--gold)}
#title .go{margin-top:44px;width:220px}
#title .load{margin-top:44px;width:220px;height:10px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
#title .load i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
#shakebox.shake{animation:sshake .35s}
@keyframes sshake{20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
</style>
</head>
<body>
<div id="stage"><div id="shakebox" class="a" style="inset:0">
  <div class="a" id="felt"></div>
  <div class="a blind" id="blind">
    <div class="bh" id="bName">Open Mic</div>
    <div class="bd"><div class="chip" id="bChip"></div><div class="tx">Score at least<b id="bTarget">300</b></div></div>
    <div class="rw"><span id="bRule">Reward</span><b id="bReward">$$$</b></div>
  </div>
  <div class="a rs">Round score<b id="rScore">0</b><i class="bar" id="rBar"></i></div>
  <div class="tiny">
    <div class="tb">Hands<b id="tHands" style="color:#5AA8FF">4</b></div>
    <div class="tb">Discards<b id="tDisc" style="color:#FF6B7F">3</b></div>
    <div class="tb">Round<b id="tRound">1<small>/8</small></b></div>
  </div>
  <div class="a leaders" id="leaders"></div>
  <div class="a hand-name" id="hName"></div>
  <div class="a score"><div class="bx ch" id="sChips">0</div><div class="x">X</div><div class="bx mu" id="sMult">0</div></div>
  <div class="a" id="total">0</div>
  <div class="a" id="cards" style="inset:0;pointer-events:none"></div>
  <div class="a btns" id="btns">
    <button class="btn p" id="bPlay" disabled>Play hand</button>
    <div class="sort"><span>Sort hand</span><div><button id="sLvl" class="on">Level</button><button id="sFam">Family</button></div></div>
    <button class="btn d" id="bDisc" disabled>Discard</button>
  </div>
  <div class="a foot">
    <span class="money" id="money">$4</span>
    <span style="display:flex;gap:8px;align-items:center">
      <button class="pill" id="bHands"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="2" width="5" height="10" rx="1.5" fill="#fff"/><rect x="8" y="2" width="5" height="10" rx="1.5" fill="#fff" opacity=".6"/></svg>Hands</button>
      <button class="icon" id="bMute" aria-label="Sound"><svg width="16" height="16" viewBox="0 0 16 16" id="muteIco"><path d="M2 6h3l4-3v10L5 10H2z" fill="#fff"/><path d="M11 5.5q2 2.5 0 5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></button>
    </span>
    <span class="deck"><span id="deckN">52/52</span><i class="back"></i></span>
  </div>

  <div class="panel" id="shop">
    <h3>Shop</h3>
    <div class="shopsec">Bandleaders</div>
    <div class="offers" id="shopPerks"></div>
    <div class="shopsec">Upgrades</div>
    <div class="offers" id="shopUps"></div>
    <div class="grow"></div>
    <div class="shopfoot"><button class="bigbtn o" id="bReroll">Reroll $2</button><button class="bigbtn" id="bNext">Next round</button></div>
  </div>
  <div class="panel" id="over"></div>
  <div class="panel" id="handlist"><h3>Hands</h3><button class="close" id="hlClose"><svg width="14" height="14"><path d="M2 2l10 10M12 2L2 12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></button><div class="hl" id="hlRows"></div></div>
  <div id="tip"></div>
</div>
  <div id="title">
    <div class="fan" id="tFan"></div>
    <h1>Band <em>Hand</em></h1>
    <div class="load" id="tLoad"><i id="tLoadBar"></i></div>
    <button class="bigbtn go" id="tGo" style="display:none">Play</button>
  </div>
</div>
<script>
(function(){
'use strict';
/* ---------------- data ---------------- */
/* every character makes exactly ONE sound: one song stem, or (bells, drone) one synth voice of its own.
   multi takes the one stem of the family it stands for when it joins. */
var FAMS={
  drums:{label:'Drums',col:'#3D7BFF',stem:'drums',atlas:'drumline'},
  bass:{label:'Bass',col:'#E89A10',stem:'bass',atlas:'low_end'},
  brass:{label:'Brass',col:'#FF6A2B',stem:'brass',atlas:'brass'},
  strings:{label:'Strings',col:'#7A4DFF',stem:'strings',atlas:'strings'},
  woodwinds:{label:'Winds',col:'#4FB33A',stem:'woodwinds',atlas:'undertone'},
  guitar:{label:'Guitar',col:'#F0367E',stem:'guitar',atlas:'overdrive'},
  bells:{label:'Bells',col:'#16BCD0',synth:'bell',atlas:'strings'},
  lead:{label:'Lead',col:'#FF5C5C',stem:'voice_lead',atlas:'chorus'},
  chant:{label:'Chant',col:'#0FA88E',stem:'voice_bom',atlas:'shanty'},
  choir:{label:'Choir',col:'#B77CF2',stem:'voice_doowah_lo',atlas:'session'},

  ev.idx.forEach(function(i){
    var c=cards[i],fam=ev.fams[i];
    if(isMuted(c)||zero){steps.push({kind:'card',i:i,fam:fam,chips:0,muted:isMuted(c),fx:[]});return;}
    var add=c.lvl*(has('ziggy')?2:1),fx=[];
    var real=fam.charAt(0)==='*'?'multi':fam;scoredFams[real]=1;
    S.perks.forEach(function(p,pi){
      if(p.id==='lion'&&fam==='brass')fx.push({pi:pi,mult:3});
      if(p.id==='nix'&&fam==='strings')fx.push({pi:pi,chips:20});
      if(p.id==='cantor'&&fam==='lead')fx.push({pi:pi,x:1.5});
      if(p.id==='rigg'&&fam==='chant')fx.push({pi:pi,mult:4});
      if(p.id==='count'&&c.fam==='multi')fx.push({pi:pi,x:2});
    });
    steps.push({kind:'card',i:i,fam:fam,chips:add,fx:fx});
  });
  var cnt={};ev.fams.forEach(function(f){cnt[f]=(cnt[f]||0)+1;});
  var maxc=0,pairs=0;Object.keys(cnt).forEach(function(f){maxc=Math.max(maxc,cnt[f]);if(cnt[f]>=2)pairs++;});
  S.perks.forEach(function(p,pi){
    var s=null;
    if(p.id==='kesh'&&scoredFams.drums)s={mult:4};
    if(p.id==='fossil'){var nf=Object.keys(scoredFams).length;if(nf)s={mult:2*nf};}
    if(p.id==='choirm'&&ev.type==='vocal')s={x:3};
    if(p.id==='ummo'&&handLeft>0)s={mult:2*handLeft};
    if(p.id==='ozzy')s={money:1};
    if(p.id==='overlord'&&ev.type==='fullband')s={x:2};
    if(p.id==='encore'&&S.hands===0)s={x:3};
    if(p.id==='jo')s={mult:rnd(16)};
    if(p.id==='grub'&&S.money>=3)s={mult:Math.floor(S.money/3)};
    if(p.id==='monk'&&ev.type==='rhythm')s={x:2};
    if(p.id==='gorm'&&maxc>=3)s={mult:8};
    if(p.id==='velle'&&S.disc>0)s={chips:15*S.disc};
    if(p.id==='cat'&&pairs>=1)s={mult:8};
    if(p.id==='zazz'&&ev.type==='solo')s={x:4};
    if(s){s.kind='perk';s.pi=pi;steps.push(s);}
  });
  // totals
  var c=chips,m=mult;
  steps.forEach(function(s){
    if(s.kind==='card'){c+=s.chips;s.fx.forEach(function(f){if(f.chips)c+=f.chips;if(f.mult)m+=f.mult;if(f.x)m*=f.x;});}
    else{if(s.chips)c+=s.chips;if(s.mult)m+=s.mult;if(s.x)m*=s.x;}
  });
  return {base:{chips:chips,mult:mult},steps:steps,total:Math.floor(c*Math.round(m*10)/10),chips:c,mult:Math.round(m*10)/10};
}

/* ---------------- the band on stage ----------------
   A scored card joins the band on its own bar line and its ONE sound fades in there. It stays on stage,
   playing, until the next hand is played or the round ends; then it leaves and its sound goes out.
   On every note of its own part it pops, flashes in its colour and puffs a note; resting, it dims; singers' mouths open. */
var BAND=[],HEARD={},runT0=0,visPos=null,visT=0,puffs=0;
function newMember(c,famAs,used){
  var rf=c.fam==='multi'?(famAs.charAt(0)==='*'?null:famAs):c.fam,stem=null,synth=null;
  if(!rf||rf==='multi'){stem=STEMS.filter(function(s){return used.indexOf(s)<0;})[0]||'drums';}
  else if(FAMS[rf].synth)synth=FAMS[rf].synth;else stem=FAMS[rf].stem;
  var part=stem||(synth==='bell'?'bells':'drone');
  var d=cardEls[c.id],fig=d&&d.querySelector('.fig'),mo=fig&&fig.querySelector('.mo');
  return {c:c,el:d,fig:fig,mo:mo,fl:fig&&fig.querySelector('.fl'),cs:mo?parseFloat(mo.dataset.cs):0,stem:stem,synth:synth,part:part,
    sing:stem?stem.indexOf('voice')===0:synth==='drone',joinAt:1e9,in:false,bop:0,flash:0,jump:0,dim:0.7,lastHeard:-9,mc:0,mUntil:0,cell:-1,schedT:0,lastPuff:-9};
}
function bandLeave(){
  if(!BAND.length)return;
  BAND.forEach(function(m){if(cardEls[m.c.id])killCard(m.c,420,380);});
  BAND=[];setLayer(now(),0.08);
}
function layoutBand(){var m=BAND.length;BAND.forEach(function(b,i){var d=cardEls[b.c.id];if(d){placeCard(b.c,195-37+(i-(m-1)/2)*80,384,0,30+i);d.classList.remove('sel','dim','glow');}});}
function hitNote(m,n,t){
  m.bop=Math.min(1.5,0.55+0.45*n.w);m.flash=Math.min(1.3,0.6+0.4*n.w);m.lastHeard=t;
  if(m.sing){m.mc=(m.part==='voice_bom'||m.part==='voice_doowah_lo'||m.part==='drone')?3:(n.d>=0.4?2:4);m.mUntil=t+Math.max(0.12,Math.min(n.d,1.2));}
  else{m.mc=1;m.mUntil=t+0.11;}
  if(t-m.lastPuff>0.14&&puffs<28&&m.el){m.lastPuff=t;notePuff(m,n.w);}
}
function notePuff(m,w){
  var col=FAMS[m.c.fam].col,x=parseFloat(m.el.style.left)+26+Math.random()*22,y=parseFloat(m.el.style.top)+2;
  var p=el('div','np','<svg width="21" height="25" viewBox="-11 -15 22 26"><ellipse cx="-3" cy="6" rx="6" ry="4.4" transform="rotate(-26 -3 6)" fill="'+col+'" stroke="#231C33" stroke-width="2"/><path d="M2.4 5V-12Q10-8 8 0" stroke="#231C33" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>');
  p.style.left=x+'px';p.style.top=y+'px';p.style.setProperty('--dx',((Math.random()-0.5)*26).toFixed(1)+'px');p.style.setProperty('--r',((Math.random()-0.5)*40).toFixed(0)+'deg');
  if(w>=1.2)p.style.scale='1.25';
  $('shakebox').appendChild(p);puffs++;setTimeout(function(){p.remove();puffs--;},820);
}
function eachNote(list,a,b,fn){var lo=0,hi=list.length;while(lo<hi){var mid=(lo+hi)>>1;if(list[mid].t<=a)lo=mid+1;else hi=mid;}for(var i=lo;i<list.length&&list[i].t<=b;i++)fn(list[i]);}
function bandFrame(){
  requestAnimationFrame(bandFrame);
  var t=now(),dt=Math.min(0.05,Math.max(0,t-visT));visT=t;
  var T=t-(audioOk?(ctx.outputLatency||ctx.baseLatency||0):0);
  // the synth voices (bells, drone) are scheduled a little ahead on the same clock
  if(audioOk)BAND.forEach(function(m){if(!m.synth)return;var from=Math.max(m.schedT,m.joinAt-0.001,ctx.currentTime),to=ctx.currentTime+0.25;if(to<=from)return;
    notesIn(m.part,from,to-from).forEach(function(n){if(n.t<m.joinAt-0.002)return;if(m.synth==='bell')bell(n.pitch+12,n.t);else dronePad(n.t,BAR*0.98,n.pitch);});m.schedT=to;});
  var pb=songPos(T),pa=visPos==null?pb:visPos;visPos=pb;
  var skip=(pb>=pa?pb-pa:(LE-pa)+(pb-LS))>0.25;
  BAND.forEach(function(m){
    var on=T>=m.joinAt;
    if(on&&!m.in){m.in=true;m.jump=1;m.bop=1;m.lastHeard=t;if(m.synth)HEARD[m.part]=HEARD[m.part]||(performance.now()-runT0)/1000;}
    if(on&&!skip&&NL[m.part]){var L=NL[m.part],f=function(n){hitNote(m,n,t);};if(pb>=pa)eachNote(L,pa,pb,f);else{eachNote(L,pa,LE,f);eachNote(L,LS-1e-6,pb,f);}}
    m.bop=Math.max(0,m.bop-dt*6);m.flash=Math.max(0,m.flash-dt*7);m.jump=Math.max(0,m.jump-dt*2.6);
    var resting=!on||t-m.lastHeard>0.7;m.dim+=((resting?0.7:1)-m.dim)*Math.min(1,dt*8);
    if(!m.fig)return;
    var b=m.bop,jp=m.jump>0?Math.sin((1-m.jump)*Math.PI)*12:0;
    m.fig.style.transform='translateX(-50%) translateY('+(-jp).toFixed(1)+'px) scale('+(1+0.16*b).toFixed(3)+','+(1-0.18*b).toFixed(3)+')';
    m.fig.style.filter=m.dim<0.995?'brightness('+m.dim.toFixed(3)+') saturate('+(0.4+0.6*m.dim).toFixed(3)+')':'';
    if(m.fl)m.fl.style.opacity=Math.min(1,m.flash).toFixed(2);
    if(m.mo){var c=m.jump>0.05?7:(t<m.mUntil?m.mc:idleCell(m.c.fam==='multi'&&m.sing?'lead':m.c.fam));
      if(c!==m.cell){m.cell=c;m.mo.style.backgroundPosition='-'+(c*m.cs).toFixed(1)+'px 0';}}
  });
  if(audioOk)STEMS.forEach(function(s){var g=gains[s];if(g&&g.gain.value>0.05&&HEARD[s]==null)HEARD[s]=(performance.now()-runT0)/1000;});
}
requestAnimationFrame(bandFrame);

/* ---------------- round flow ---------------- */
function startRound(){
  bandLeave();
  Object.keys(cardEls).forEach(function(k){cardEls[k].remove();});cardEls={};
  document.body.classList.remove('off');
  S.score=0;S.hands=S.boss&&S.boss.id==='noise'?3:4;S.disc=S.boss&&S.boss.id==='soundguy'?0:3;
  S.pile=shuffle(S.deck.slice());S.hand=[];S.played=[];S.sel=[];S.inRound=true;S.busy=false;S.shop=null;
  $('cards').style.display='';$('btns').style.visibility='visible';
  draw();hud();preview();
}
function draw(){
  var need=8-S.hand.length,fresh=[];
  while(need-->0&&S.pile.length){var c=S.pile.pop();S.hand.push(c);fresh.push(c);}
  sortHand();
  fresh.forEach(function(c){placeCard(c,330,790,30,5);});
  void $('cards').offsetWidth;
  requestAnimationFrame(function(){layoutHand();});
  hud();
}
function tapCard(id){
  if(S.busy||!S.inRound)return;
  var inHand=S.hand.some(function(c){return c.id===id;});if(!inHand)return;
  var k=S.sel.indexOf(id);
  if(k>=0)S.sel.splice(k,1);
  else{if(S.sel.length>=5){bump(cardEls[id],'nope');return;}S.sel.push(id);}
  layoutHand();preview();hud();
}
function discard(){
  if(S.busy||!S.sel.length||S.disc<=0)return;
  S.disc--;
  var gone=S.hand.filter(function(c){return S.sel.indexOf(c.id)>=0;});
  S.hand=S.hand.filter(function(c){return S.sel.indexOf(c.id)<0;});S.sel=[];
  gone.forEach(function(c,i){setTimeout(function(){killCard(c,420,520);},i*50);});
  setTimeout(draw,200);preview();hud();
}
async function playHand(){
  if(S.busy||!S.sel.length)return;
  $('tip').classList.remove('show');
  S.busy=true;S.hands--;
  var cards=S.hand.filter(function(c){return S.sel.indexOf(c.id)>=0;});
  // keep selection order as in hand order
  S.hand=S.hand.filter(function(c){return S.sel.indexOf(c.id)<0;});S.sel=[];
  bandLeave(); // the last hand's band steps off; its sounds go out
  S.played=cards;layoutPlayed();layoutHand();hud();
  var ev=evaluate(cards);
  var res=buildSteps(cards,ev,S.hand.length);
  cards.forEach(function(c,i){if(ev.idx.indexOf(i)<0)cardEls[c.id].classList.add('dim');});
  $('hName').innerHTML=TBY[ev.type].n+'<span>lvl '+S.levels[ev.type]+'</span>';
  var chips=res.base.chips,mult=res.base.mult;
  $('sChips').textContent=fmt(chips);$('sMult').textContent=mult;
  // ---- the band, one at a time: each scored card joins on its own bar line (waiting up to two bars for one
  //      where its part actually plays), and only its one sound comes in there ----
  var cardSteps=res.steps.filter(function(s){return s.kind==='card';});
  var perkSteps=res.steps.filter(function(s){return s.kind==='perk';});
  var slot=nextGrid(now()+0.42,BAR),used=[];
  var plans=cardSteps.map(function(s){
    var c=cards[s.i],m=s.muted?null:newMember(c,s.fam,used),a=slot;
    if(m){for(var k=0;k<3;k++){if(notesIn(m.part,slot+k*BAR,BAR-0.02).length){a=slot+k*BAR;break;}}if(m.stem)used.push(m.stem);}
    var ticks=[];if(m)notesIn(m.part,a,BAR-0.02).forEach(function(n){if(!ticks.length||n.t-ticks[ticks.length-1].t>0.07)ticks.push(n);});
    if(ticks.length>8){var st=ticks.length/8,mm=[];for(var r=0;r<8;r++)mm.push(ticks[Math.floor(r*st)]);ticks=mm;}
    if(!ticks.length)ticks=[{t:a}];
    if(m){m.joinAt=a;BAND.push(m);setLayer(a,0.03);}
    slot=a+BAR;
    return {a:a,m:m,ticks:ticks};
  });
  var tPerk0=slot,tFinal=nextGrid(tPerk0+perkSteps.length*BEAT*0.5+0.05,BEAT);
  // ---- visuals on the clock ----
  await waitUntil((plans.length?plans[0].a:tPerk0)-0.02);
  bump($('hName'),'flash');
  for(var j=0;j<cardSteps.length;j++){
    var s=cardSteps[j],p=plans[j],c=cards[s.i],d=cardEls[c.id];
    var x=parseFloat(d.style.left);
    if(s.muted){await waitUntil(p.a);pop(x+14,358,'Muted','r');bump(d,'nope');continue;}
    await waitUntil(p.a-0.01);
    d.classList.add('glow');
    var per=s.chips/p.ticks.length,acc=0;
    for(var k=0;k<p.ticks.length;k++){
      await waitUntil(p.ticks[k].t);
      acc+=per;var shown=Math.round(acc);chips=res.base.chips+sumPrev(cardSteps,j)+shown;
      $('sChips').textContent=fmt(chips);bump($('sChips'));
      if(k===0)pop(x+14,358,'+'+s.chips,'b');
    }
    s.fx.forEach(function(f){
      var L=$('ld'+f.pi);if(L){L.classList.add('go');setTimeout(function(){L.classList.remove('go');},380);}
      if(f.chips){chips+=f.chips;s.chips+=0;pop(x+6,494,'+'+f.chips,'b');$('sChips').textContent=fmt(chips);bump($('sChips'));s._extra=(s._extra||0)+f.chips;}
      if(f.mult){mult+=f.mult;pop(x+6,494,'+'+f.mult+' mult','r');}
      if(f.x){mult=Math.round(mult*f.x*10)/10;pop(x+6,494,'X'+f.x,'x');bump($('sMult'),'shake');}
      $('sMult').textContent=mult;bump($('sMult'));
    });
    setTimeout((function(dd){return function(){dd.classList.remove('glow');};})(d),Math.max(200,BAR*1000-80));
  }
  for(var q=0;q<perkSteps.length;q++){
    var ps=perkSteps[q];await waitUntil(tPerk0+q*BEAT*0.5);
    var L=$('ld'+ps.pi),lx=L?L.offsetLeft+10:180;
    if(L){L.classList.add('go');(function(LL){setTimeout(function(){LL.classList.remove('go');},380);})(L);}
    if(ps.chips){chips+=ps.chips;$('sChips').textContent=fmt(chips);bump($('sChips'));pop(lx,128,'+'+ps.chips,'b');}
    if(ps.mult!=null&&!ps.x){mult+=ps.mult;$('sMult').textContent=mult;bump($('sMult'));pop(lx,128,'+'+ps.mult,'r');}
    if(ps.x){mult=Math.round(mult*ps.x*10)/10;$('sMult').textContent=mult;bump($('sMult'),'shake');pop(lx,128,'X'+ps.x,'x');}
    if(ps.money){setMoney(S.money+ps.money,true);pop(lx,128,'+$'+ps.money,'g');}
  }
  await waitUntil(tFinal);
  var total=res.total;
  var T=$('total');T.className='a';T.textContent=fmt(total);void T.offsetWidth;T.className='a show';
  if(total>=S.target*0.3){var sb=$('shakebox');sb.classList.remove('shake');void sb.offsetWidth;sb.classList.add('shake');}
  S.best=Math.max(S.best,total);
  await sleep(420);
  T.className='a show fly';
  await sleep(320);
  T.className='a';
  var from=S.score,to=S.score+total;S.score=to;
  await countUp($("rScore"),from,to,380);
  $('rBar').style.width=Math.min(100,S.score/S.target*100)+'%';
  // unscored and muted cards step off; the scored ones stay on stage as the band and keep playing
  var inBand={};BAND.forEach(function(m){inBand[m.c.id]=1;});
  S.played.forEach(function(c){if(!inBand[c.id])killCard(c,420,380);});S.played=[];layoutBand();
  $('hName').innerHTML='';$('sChips').textContent='0';$('sMult').textContent='0';
  await sleep(260);
  if(S.score>=S.target){S.busy=false;roundWon();return;}
  if(S.hands<=0){S.busy=false;runLost();return;}
  if(S.boss&&S.boss.id==='heckler'&&S.hand.length){
    var toss=shuffle(S.hand.slice()).slice(0,2);
    S.hand=S.hand.filter(function(c){return toss.indexOf(c)<0;});
    toss.forEach(function(c){var d=cardEls[c.id];if(d)pop(parseFloat(d.style.left)+10,520,'Heckled','r');killCard(c,-90,520);});
    await sleep(250);
  }
  draw();S.busy=false;hud();preview();
}
function sumPrev(cs,j){var t=0;for(var i=0;i<j;i++)t+=cs[i].chips+(cs[i]._extra||0);return t;}
function countUp(e,a,b,ms){return new Promise(function(res){var t0=performance.now();(function f(){var k=Math.min(1,(performance.now()-t0)/ms);e.textContent=fmt(a+(b-a)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f);else{bump(e);res();}})();setTimeout(function(){e.textContent=fmt(b);res();},ms+300);});}

/* ---------------- end of round ---------------- */
function clearTable(){bandLeave();S.hand.forEach(function(c){killCard(c,330,790);});S.hand=[];S.sel=[];S.inRound=false;$('btns').style.visibility='hidden';document.body.classList.add('off');hud();}
function roundWon(){
  clearTable();
  var R=ROUNDS[S.round],interest=Math.min(5,Math.floor(S.money/5));
  var gain=R.r+S.hands+interest;
  if(S.round===ROUNDS.length-1){setMoney(S.money+gain);return runWon();}
  var o=$('over');
  o.innerHTML='<h3>Cleared</h3><div class="sub">'+fmt(S.score)+' of '+fmt(S.target)+'</div><div class="rows">'+
    '<div class="rowl">Reward<b>$'+R.r+'</b></div><div class="rowl">Hands left<b>$'+S.hands+'</b></div><div class="rowl">Interest<b>$'+interest+'</b></div></div><div class="grow"></div><button class="bigbtn" id="bCash" style="background:#E7A923">Cash out $'+gain+'</button>';
  o.classList.add('show');
  $('bCash').addEventListener('click',function(){o.classList.remove('show');setMoney(S.money+gain,true);openShop();});
}
function runLost(){
  clearTable();
  var o=$('over');
  o.innerHTML='<h3 style="color:#FF6B7F">Booed off</h3><div class="sub">'+(S.boss?S.boss.n:ROUNDS[S.round].n)+'</div><div class="rows"><div class="rowl">Round<b style="color:#fff">'+(S.round+1)+' / 8</b></div><div class="rowl">Score<b style="color:#fff">'+fmt(S.score)+' / '+fmt(S.target)+'</b></div><div class="rowl">Best hand<b>'+fmt(S.best)+'</b></div></div><div class="grow"></div><button class="bigbtn" id="bAgain">New run</button>';
  o.classList.add('show');$('bAgain').addEventListener('click',function(){o.classList.remove('show');beginRun();});
}
function runWon(){
  var o=$('over');
  o.innerHTML='<h3 style="color:#FFC94A">Encore!</h3><div class="sub">The Critic is a fan now</div><div class="rows"><div class="rowl">Rounds<b style="color:#fff">8 / 8</b></div><div class="rowl">Best hand<b>'+fmt(S.best)+'</b></div><div class="rowl">Cash<b>$'+S.money+'</b></div></div><div class="grow"></div><button class="bigbtn" id="bAgain">New run</button>';
  o.classList.add('show');$('bAgain').addEventListener('click',function(){o.classList.remove('show');beginRun();});
}

/* ---------------- shop ---------------- */
function rollShop(){
  var owned=S.perks.map(function(p){return p.id;});
  var pool=shuffle(PERKS.filter(function(p){return owned.indexOf(p.id)<0;}));
  var ups=[];
  for(var i=0;i<2;i++){
    var kind=['arr','reh','rec'][rnd(3)];
    if(kind==='arr'){var t=TYPES[1+rnd(TYPES.length-1)];ups.push({kind:'arr',type:t.id,cost:3});}
    else if(kind==='reh'){var c=S.deck[rnd(S.deck.length)];ups.push({kind:'reh',card:c,add:3,cost:3});}
    else{var f=FORDER[rnd(FORDER.length)],ci=4+rnd(2);ups.push({kind:'rec',card:newCard(f,ci,4+rnd(6)),cost:4});}
  }
  S.shop={perks:pool.slice(0,2).map(function(p){return {p:p,sold:false};}),ups:ups};
}
function openShop(){S.rerollCost=2;rollShop();renderShop();$('shop').classList.add('show');}
function miniCard(c,lvl){var w=el('div','mini');var d=makeCard(c);if(lvl!=null)d.querySelector('.rk').textContent=lvl;w.appendChild(d);return w;}
function renderShop(){
  var sp=$('shopPerks');sp.innerHTML='';
  S.shop.perks.forEach(function(o){
    var p=o.p,d=el('div','offer'+(o.sold?' sold':''));
    d.appendChild(el('div','ld','<img src="img/'+p.k+'.webp" alt="">'));
    var tx=el('div','tx','<div class="nm">'+p.n+'</div><div class="ds">'+p.d+'</div>');
    var b=el('button','buy','$'+p.cost);b.disabled=o.sold||S.money<p.cost||S.perks.length>=5;
    b.addEventListener('click',function(){if(S.money<p.cost||S.perks.length>=5)return;o.sold=true;S.perks.push(p);setMoney(S.money-p.cost,true);renderLeaders();hud();renderShop();var L=$('ld'+(S.perks.length-1));if(L){L.classList.add('go');setTimeout(function(){L.classList.remove('go');},400);}});
    tx.appendChild(b);d.appendChild(tx);sp.appendChild(d);
  });
  var su=$('shopUps');su.innerHTML='';
  S.shop.ups.forEach(function(u){
    var d=el('div','offer'+(u.sold?' sold':'')),nm,ds;
    if(u.kind==='arr'){var t=TBY[u.type];var a=el('div','arr','<div class="dots">'+t.ex.map(function(f){return '<i style="background:'+famBg(f)+'"></i>';}).join('')+'</div><b>+1</b>');d.appendChild(a);nm=t.n;ds='lvl '+S.levels[u.type]+' to '+(S.levels[u.type]+1);}
    else if(u.kind==='reh'){d.appendChild(miniCard(u.card));nm=u.card.n;ds='Level '+u.card.lvl+' to '+(u.card.lvl+u.add);if(u.sold)ds='Rehearsed';}
    else{d.appendChild(miniCard(u.card));nm=u.card.n;ds='Joins the band';}
    var tx=el('div','tx','<div class="nm">'+nm+'</div><div class="ds">'+ds+'</div>');
    var b=el('button','buy','$'+u.cost);b.disabled=u.sold||S.money<u.cost;
    b.addEventListener('click',function(){
      if(S.money<u.cost)return;u.sold=true;setMoney(S.money-u.cost,true);
      if(u.kind==='arr')S.levels[u.type]++;else if(u.kind==='reh')u.card.lvl+=u.add;else S.deck.push(u.card);
      hud();renderShop();
    });
    tx.appendChild(b);d.appendChild(tx);su.appendChild(d);
  });
  $('bReroll').textContent='Reroll $'+S.rerollCost;$('bReroll').disabled=S.money<S.rerollCost;$('bReroll').style.opacity=S.money<S.rerollCost?.45:1;
  $('deckN').textContent=S.deck.length+'/'+S.deck.length;
}
$('bReroll').addEventListener('click',function(){if(S.money<S.rerollCost)return;setMoney(S.money-S.rerollCost,true);S.rerollCost++;var keepUps=S.shop.ups;rollShop();S.shop.ups=keepUps;renderShop();});
$('bNext').addEventListener('click',function(){$('shop').classList.remove('show');S.shop=null;S.round++;setBlind();startRound();});

/* ---------------- hand list ---------------- */
function renderHandList(){
  var R=$('hlRows');R.innerHTML='';
  TYPES.slice().reverse().forEach(function(t){
    var v=typeVals(t.id);
    R.appendChild(el('div','hr','<div class="dots">'+t.ex.map(function(f){return '<i style="background:'+famBg(f)+'"></i>';}).join('')+'</div><div class="nm">'+t.n+'<span>lvl '+S.levels[t.id]+'</span></div><div class="cm"><i style="background:#2F8BFF">'+v.c+'</i>X<i style="background:#E8455B">'+v.m+'</i></div>'));
  });
}
$('bHands').addEventListener('click',function(){var h=$('handlist');if(h.classList.contains('show')){h.classList.remove('show');return;}renderHandList();h.classList.add('show');});
$('hlClose').addEventListener('click',function(){$('handlist').classList.remove('show');});
$('bPlay').addEventListener('click',playHand);
$('bDisc').addEventListener('click',discard);
$('sLvl').addEventListener('click',function(){S.sort='lvl';$('sLvl').className='on';$('sFam').className='';if(!S.busy){sortHand();layoutHand();}});
$('sFam').addEventListener('click',function(){S.sort='fam';$('sFam').className='on';$('sLvl').className='';if(!S.busy){sortHand();layoutHand();}});
$('bMute').addEventListener('click',function(){setMute(!muted);});

/* ---------------- boot ---------------- */
function fit(){var w=window.innerWidth,h=window.innerHeight;var s=Math.min(w/390,h/844);$('stage').style.transform='translate(-50%,-50%) scale('+s+')';}
window.addEventListener('resize',fit);fit();
function beginRun(){
  bandLeave();HEARD={};runT0=performance.now();
  Object.keys(cardEls).forEach(function(k){cardEls[k].remove();});cardEls={};
  newRun();renderLeaders();setBlind();startRound();
}
fetch('cast.json').then(function(r){return r.json();}).then(function(j){
  CAST=j.cast;
  Object.keys(CAST).forEach(function(f){CAST[f].forEach(function(c){ARK[c.k]=c.ar;});});
  var fan=$('tFan');
  [['drums',0,8],['brass',3,9],['lead',0,10],['bass',1,7],['guitar',2,6]].forEach(function(a,i){
    var c={fam:a[0],k:CAST[a[0]][a[1]].k,lvl:a[2]};var d=makeCard(c);var off=i-2;
    d.style.left=(180-37+off*58)+'px';d.style.top=(80+Math.abs(off)*Math.abs(off)*7)+'px';d.style.transform='rotate('+(off*9)+'deg) scale(1.25)';d.style.zIndex=i;fan.appendChild(d);
  });
  return loadAudio(function(f){$('tLoadBar').style.width=Math.round(f*100)+'%';});
}).then(function(){
  $('tLoad').style.display='none';$('tGo').style.display='';
});
$('tGo').addEventListener('click',function(){
  startSong();$('title').classList.add('out');beginRun();
});
window.BH={get S(){return S;},evaluate:evaluate,buildSteps:buildSteps,TYPES:TYPES,PERKS:PERKS,
  get audioOk(){return audioOk;},
  gains:function(){var o={};STEMS.forEach(function(s){o[s]=gains[s]?gains[s].gain.value:null;});return o;},
  band:function(){return BAND.map(function(m){return {k:m.c.k,fam:m.c.fam,stem:m.stem,synth:m.synth,joinAt:m.joinAt,joined:now()>=m.joinAt,cell:m.cell,dim:m.dim};});},
  heard:function(){return JSON.parse(JSON.stringify(HEARD));},
  now:now,songPos:function(){return songPos(now());},BAR:BAR,
  setHand:function(spec){S.hand.forEach(function(c){killCard(c,0,0);});S.hand=spec.map(function(a){return newCard(a[0],0,a[1]);});S.sel=[];sortHand();layoutHand();hud();},
  selectFams:function(fs){S.sel=[];var used={};fs.forEach(function(f){var c=S.hand.filter(function(c){return c.fam===f&&!used[c.id];})[0];if(c){used[c.id]=1;S.sel.push(c.id);}});layoutHand();preview();hud();},
  addPerk:function(id){S.perks.push(PBY[id]);renderLeaders();},
  setRound:function(r){S.round=r;setBlind();startRound();}
};
})();
</script>
