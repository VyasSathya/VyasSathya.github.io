<style>
:root{--bg:#eceae4;--app:#fbfaf7;--ink:#16150f;--ink2:#6b6a62;--ink3:#a3a199;--line:#ebe9e2;--fill:#f1efe8;
  --accent:#f2b233;--accent-ink:#1a1400;--ok:#1f7a4d;--bezel:#16150f;--shadow:0 30px 80px rgba(22,21,15,.2)}
@media (prefers-color-scheme:dark){:root{--bg:#070706;--app:#10100f;--ink:#f4f2ea;--ink2:#a5a39a;--ink3:#6c6a63;--line:#222120;--fill:#1b1a18;
  --accent:#f5bd45;--accent-ink:#1a1400;--ok:#62c796;--bezel:#262523;--shadow:0 30px 80px rgba(0,0,0,.6)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.35;
  -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
svg{display:block;flex:none}
.phone{width:390px;height:min(844px,calc(100vh - 40px));background:var(--app);border-radius:46px;position:relative;overflow:hidden;box-shadow:0 0 0 10px var(--bezel),var(--shadow);display:flex;flex-direction:column}
.status{height:44px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px;font-weight:600;font-size:14px}

#view{flex:1;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:24px}
.scroll::-webkit-scrollbar{display:none}

.head{flex:none;padding:14px 20px 6px;display:flex;align-items:flex-start;gap:10px}
.head .t{flex:1;min-width:0}
.big{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1;display:inline-flex;align-items:center;gap:6px}
.sub{color:var(--ink2);font-size:14px;margin-top:3px}
.nav{flex:none;display:flex;align-items:center;padding:8px 10px;min-height:48px}
.nav .t{flex:1;min-width:0;padding:0 4px}
.nav .t b{display:block;font-weight:600}
.nav .t span{display:block;font-size:12.5px;color:var(--ink2)}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:active{background:var(--fill)}
.av{border-radius:50%;display:grid;place-items:center;font-weight:600;flex:none;color:#fff}

.strip{margin:8px 20px 4px;padding:10px 12px 10px 10px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:10px;font-weight:600;width:calc(100% - 40px)}
.strip span{flex:1}.strip span.av{flex:none}
.days{display:flex;gap:6px;padding:12px 20px 4px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days{gap:2px;padding:10px 14px 0}.days button{flex:1;min-width:46px;padding:6px 0 8px;border-radius:14px;font-weight:700;font-size:17px;color:var(--ink);text-align:center}.days button small{display:block;font-size:11px;font-weight:600;color:var(--ink3);margin-bottom:2px}.days button.on small{color:inherit;opacity:.7}.tile{width:56px;height:56px;border-radius:14px;background:var(--fill);flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:16px;letter-spacing:-.02em;line-height:1.1}.tile small{font-size:10.500px;font-weight:600;color:var(--ink3);letter-spacing:.04em;margin-top:2px}.tile.alt{background:var(--accent);color:var(--accent-ink)}.tile.alt small{color:inherit;opacity:.7}.it .m .sk{font-size:12.500px;font-weight:600;color:var(--ink);margin-top:1px}.mode{display:flex;margin:16px 20px 0;padding:4px;border-radius:14px;background:var(--fill)}.mode button{flex:1;height:38px;border-radius:10px;font-weight:600;text-align:center;color:var(--ink2)}.mode button.on{background:var(--app);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}.addtrip{margin:14px 20px 0;padding:12px 14px;border-radius:12px;border:1.500px dashed var(--ink3);display:flex;gap:10px;align-items:center;font-weight:600;width:calc(100% - 40px);color:var(--ink2)}
.days button.on{background:var(--ink);color:var(--app)}
.seg{display:flex;gap:22px;padding:14px 20px 0;border-bottom:1px solid var(--line)}
.seg button{padding-bottom:10px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button.on{color:var(--ink);border-color:var(--ink)}

.it{display:flex;align-items:center;gap:14px;padding:14px 20px;width:100%}
.it + .it{border-top:1px solid var(--line)}
.it .tm{width:52px;flex:none;font-weight:700;font-size:17px;letter-spacing:-.02em;line-height:1.1}
.it .tm small{display:block;font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.04em;margin-top:2px}
.it .m{flex:1;min-width:0}
.it .m b{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .m span{display:block;color:var(--ink2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .r{flex:none;color:var(--ink3);font-weight:600;font-size:14px}
.it .r.pay{color:var(--ink)}
.mk{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:12.5px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.mk.q{background:var(--fill);color:var(--ink2)}
.lbl{padding:22px 20px 6px;font-weight:600;font-size:14px;color:var(--ink2);display:flex;justify-content:space-between}
.trip{margin:14px 20px 0;padding:10px 14px;border-radius:12px;background:var(--fill);display:flex;gap:10px;align-items:center;font-weight:600;width:calc(100% - 40px)}
.trip span{flex:1;font-weight:500;color:var(--ink2)}

.pg{padding:4px 20px 0}
.pg .k{font-size:13px;font-weight:600;color:var(--ink2)}
.pg h1{font-size:30px;letter-spacing:-.03em;line-height:1.1;margin:6px 0 10px}
.pg p{margin:0;color:var(--ink2);font-size:16px}
.pg p b{color:var(--ink);font-weight:600}
.fresh{display:inline-flex;align-items:center;gap:8px;margin:16px 0 0;height:32px;padding:0 12px;border-radius:16px;background:var(--fill);font-weight:600;font-size:13.5px}
.fresh i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.facts{margin:20px 20px 0;border-top:1px solid var(--line)}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.facts span{color:var(--ink2)}
.facts b{font-weight:600;text-align:right}
.who{display:flex;align-items:center;gap:12px;padding:18px 20px 0}
.who .m{flex:1;min-width:0}
.who .m b{display:block;font-weight:600}
.who .m span{display:block;font-size:13.5px;color:var(--ink2)}
.claim{display:block;margin:22px 20px 0;color:var(--ink3);font-size:13.5px;text-decoration:underline;text-underline-offset:3px}

.btn{height:48px;border-radius:14px;padding:0 20px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--fill);white-space:nowrap}
.btn.pri{background:var(--ink);color:var(--app)}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.sm{height:38px;border-radius:12px;padding:0 14px;font-size:14px}
.btn.sq{width:48px;padding:0}.btn.sm.sq{width:38px}
.btn.grow{flex:1}
.btn.off{color:var(--ink3);pointer-events:none}
.btn:active{transform:scale(.985)}
.foot{flex:none;padding:12px 20px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;border-top:1px solid var(--line)}
.foot .m{flex:1;min-width:0}
.foot .m b{display:block;font-weight:700;font-size:17px}
.foot .m span{display:block;font-size:13px;color:var(--ink2)}

.tabs{flex:none;display:flex;border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink3);position:relative}
.tabs button.on{color:var(--ink)}
.tabs .dot{position:absolute;top:0;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--app)}

.req{margin:6px 20px 0;padding:16px;border-radius:18px;background:var(--fill)}

.msgs .req{margin:4px 0;align-self:stretch}
.comp{flex:none;display:flex;gap:8px;align-items:center;padding:8px 14px calc(12px + env(safe-area-inset-bottom))}
.comp .in{flex:1;height:44px;border-radius:22px;background:var(--fill);padding:0 16px;display:flex;align-items:center;color:var(--ink3)}

.tape{position:relative;border-radius:18px;height:200px;margin:16px 20px 0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#5b4526 0%,#231b10 48%,#0d0b08 100%);color:#fff;display:flex;align-items:flex-end;padding:14px}
.tape::before{content:"";position:absolute;left:50%;top:-30px;width:150px;height:250px;transform:translateX(-50%);background:linear-gradient(180deg,rgba(255,232,180,.36),rgba(255,232,180,0));clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}
.tape .pl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.95);color:#111;display:grid;place-items:center}
.tape b{position:relative}.tape span{position:relative;margin-left:auto;font-size:13px;font-weight:600}
.prof{display:flex;gap:14px;align-items:center;padding:6px 20px 0}
.prof h2{margin:0;font-size:24px;letter-spacing:-.02em}
.prof p{margin:2px 0 0;color:var(--ink2)}
.ln{display:flex;align-items:center;gap:12px;padding:14px 20px;width:100%}
.ln + .ln{border-top:1px solid var(--line)}
.ln .m{flex:1;min-width:0}
.ln .m b{display:block;font-weight:600}
.ln .m span{display:block;font-size:13.5px;color:var(--ink2)}
.ln .r{font-weight:600}
.ln.dim{opacity:.45}
.open{display:inline-block;width:26px;height:26px;border-radius:50%;border:1.500px dashed var(--ink3);margin-left:-6px;background:var(--app)}
.stack{display:flex;align-items:center;padding-left:6px}.stack .av{margin-left:-6px;box-shadow:0 0 0 2px var(--app)}
.thumbs{display:flex;gap:8px}
.thumbs button{width:40px;height:40px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--ink2)}
.thumbs button.on{background:var(--ink);color:var(--app)}
.pref{margin:10px 20px 2px;padding:10px 14px;border-radius:14px;background:var(--fill);display:flex;align-items:center;gap:10px;width:calc(100% - 40px)}
.pref .m{flex:1;min-width:0}.pref b{display:block;font-weight:600}.pref span{display:block;font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.on{background:var(--ok)}.sw.on::after{transform:translateX(18px)}

.veil{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .18s;z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--app);border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.8,.2,1);z-index:6;padding:10px 0 calc(20px + env(safe-area-inset-bottom))}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px}
.sheet h4{margin:8px 20px 4px;font-size:20px;letter-spacing:-.02em}
.opened .veil{opacity:1;pointer-events:auto}.opened .sheet{transform:none}
.toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,20px);background:var(--ink);color:var(--app);padding:11px 18px;border-radius:24px;font-weight:600;font-size:14px;opacity:0;transition:.2s;z-index:7;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.ob{flex:1;display:flex;flex-direction:column;padding:60px 24px 24px}
.ob h1{font-size:34px;letter-spacing:-.035em;line-height:1.05;margin:0 0 28px}
.ob .opt{display:block;width:100%;padding:20px;border-radius:18px;background:var(--fill);margin-bottom:10px;font-size:19px;font-weight:600;letter-spacing:-.01em}
.ob .opt.on{background:var(--ink);color:var(--app)}
.fld{height:56px;border-radius:16px;background:var(--fill);display:flex;align-items:center;gap:10px;padding:0 16px;font-weight:600;margin-bottom:10px;font-size:17px}
.sp{flex:1}
</style>
</head>

function mark(it){
  if(it.mine||(it.req&&S.accepted))return `<span class="mk">You're on</span>`;
  if(it.req)return `<span class="mk">Wants you</span>`;
  if(S.going[it.id])return `<span class="mk q">Going</span>`;
  if(S.asked[it.id])return `<span class="mk q">Asked</span>`;
  return it.k==='mic'?`<span class="r">${ic('mic',18)}</span>`:`<span class="r pay">${it.pay}</span>`;
}
const rowOf=(it,withDate)=>{const t=tm(it.h);return `<button class="it" data-go="push:it:${it.id}"><div class="tm">${t[0]}<small>${t[1]}</small></div><div class="m"><b>${it.n}</b><span>${it.v} ${D} ${it.hood}</span></div>${mark(it)}</button>`};

  <div class="ln"><div class="m"><b>Spot</b><span>5 ${N} 10 min</span></div><span class="r">$${c.rate}</span></div>
  <div class="ln"><div class="m"><b>Feature</b><span>15 ${N} 20 min</span></div><span class="r">$${c.rate*3}</span></div>`,
  foot:`<div class="foot"><div class="m"><b>$${c.rate}</b><span>${BD[S.bdate][0]} ${D} 7 min</span></div><button class="btn sq">${ic('inbox',20)}</button><button class="btn ${sent?'off':'acc'}" data-act="offer:${n}">${sent?ic('check',20)+' Asked':'Offer the spot'}</button></div>`,noTabs:1};
}

/* ---------- start ---------- */
function start(){
  if(S.ob===1)return {raw:`<div class="ob"><h1>Stage time,<br>wherever you are.</h1><button class="opt ${S.obRole==='comic'?'on':''}" data-act="obrole:comic">I do comedy</button><button class="opt ${S.obRole==='booker'?'on':''}" data-act="obrole:booker">I book shows</button><div class="sp"></div><button class="btn pri" data-act="ob:2" style="height:56px">Continue</button></div>`};
  return {raw:`<div class="ob"><h1>Where are you based?</h1><div class="fld">${ic('home',20)} Brooklyn, NY</div><div class="fld">${ic('ig',20)} @jordanvale</div><div class="sp"></div><button class="btn pri" data-act="obdone" style="height:56px">Continue</button></div>`};
}

/* ---------- sheets ---------- */
const SH={
 where:()=>`<h4>Where</h4>${['home',...S.trips].map(k=>`<button class="ln" data-act="area:${k}">${ic(k==='home'?'home':'plane',20)}<div class="m"><b>${AREAS[k].name}</b><span>${AREAS[k].sub}</span></div>${S.area===k?ic('check',20):''}</button>`).join('')}<button class="ln" data-sheet="addtrip">${ic('plus',20)}<div class="m"><b>Add a trip</b><span>City and dates</span></div></button>`,
 addtrip:()=>`<h4>Add a trip</h4><div style="padding:8px 20px 0"><div class="fld">${ic('plane',20)} Long Island, NY</div><div class="fld">${ic('cal',20)} Wed Nov 25 ${N} Sun Nov 29</div><button class="btn pri" data-act="addtrip" style="width:100%;height:52px">Add trip</button></div>`,
 fix:()=>`<h4>Something changed?</h4>${['Not running tonight','New time','Moved','Gone for good'].map(x=>`<button class="ln" data-act="fixed"><div class="m"><b>${x}</b></div></button>`).join('')}`,
 more:()=>`<h4>Laugh Riot</h4>${['Counter with a different rate','Offer another date','Reply with a note'].map(x=>`<button class="ln" data-close><div class="m"><b>${x}</b></div></button>`).join('')}`,
 plus:()=>`<h4>Send</h4>${(S.role==='comic'?['My tape','My rates','My open dates']:['A spot on my show','Call time and running order']).map(x=>`<button class="ln" data-close><div class="m"><b>${x}</b></div></button>`).join('')}`,
 pref:()=>`<h4>Who you like</h4><div class="ln"><div class="m"><b>Up to $50 a spot</b></div><button class="sw on"></button></div><div class="ln"><div class="m"><b>Clean</b></div><button class="sw on"></button></div><div class="ln"><div class="m"><b>Visiting comics</b></div><button class="sw on"></button></div>
  <div class="ln"><div class="m"><b>Show who is already booked</b></div><button class="sw ${S.showUn?'on':''}" data-act="un"></button></div>
  <div style="display:flex;gap:10px;padding:14px 20px 0"><button class="btn grow" data-act="usual:0">Show everyone</button><button class="btn pri grow" data-act="usual:1">Save as my usual</button></div>`
};

/* ---------- shell ---------- */
const TABS={comic:[['home','home','Home'],['mics','mic','Mics'],['shows','ticket','Shows'],['inbox','inbox','Inbox'],['me','user','Profile']],
 booker:[['home','cal','Shows'],['comics','people','Comics'],['inbox','inbox','Inbox'],['me','user','Account']]};
function screen(){
  if(S.role==='start')return start();
  const top=S.stack[S.stack.length-1];
  if(top){const [k,...a]=top.split(':'),arg=a.join(':');
    return k==='it'?itemPage(arg):k==='thread'?thread():k==='chat'?chat(arg):k==='night'?night(arg):k==='past'?past():comicPage(arg)}
  if(S.tab==='inbox')return inbox(); if(S.tab==='me')return me();
  if(S.role==='comic')return S.tab==='mics'?browse('mic'):S.tab==='shows'?browse('show'):home2();
  return S.tab==='comics'?comics():bshows();
}
function render(keep){
  const v=document.getElementById('view'),o=v.querySelector('.scroll'),y=keep&&o?o.scrollTop:0,s=screen();
  v.innerHTML=s.raw||`${s.top||''}<div class="scroll">${s.body}</div>${s.foot||''}${s.noTabs?'':`<div class="tabs">${TABS[S.role].map(t=>`<button class="${S.tab===t[0]?'on':''}" data-go="tab:${t[0]}">${ic(t[1],24)}${t[2]}${t[0]==='inbox'&&S.role==='comic'&&!S.accepted?'<i class="dot"></i>':''}</button>`).join('')}</div>`}`;
  const n=v.querySelector('.scroll');if(n)n.scrollTop=y;
  const ph=document.getElementById('phone');
  if(S.sheet){document.getElementById('sheet').innerHTML=SH[S.sheet]();ph.classList.add('opened')}else ph.classList.remove('opened');
  const h='#'+[S.role,S.tab,...S.stack].join('/');if(location.hash!==h)history.replaceState(null,'',h);
}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600)}
document.getElementById('veil').onclick=()=>{S.sheet=null;render(1)};
document.getElementById('phone').addEventListener('click',e=>{
  const b=e.target.closest('[data-go],[data-act],[data-sheet],[data-close]');if(!b)return;
  if(b.dataset.close!==undefined){S.sheet=null;return render(1)}
  if(b.dataset.sheet){S.sheet=b.dataset.sheet;return render(1)}
  if(b.dataset.go){const [k,...a]=b.dataset.go.split(':');
    if(k==='tab'){S.tab=a[0];S.stack=[]}else if(k==='push')S.stack.push(a.join(':'));else S.stack.pop();
    S.sheet=null;return render()}
  const [k,...a]=b.dataset.act.split(':'),arg=a.join(':');let keep=1;
  if(k==='day')S.day=+arg;
  else if(k==='kind')S.kind=arg;
  else if(k==='area'){S.area=arg;S.day=0;if(S.tab!=='mics'&&S.tab!=='shows')S.tab='shows';S.stack=[];S.sheet=null;keep=0}
  else if(k==='addtrip'){if(!S.trips.includes('li'))S.trips.unshift('li');S.area='li';S.day=1;S.tab='shows';S.stack=[];S.sheet=null;keep=0;toast('Long Island bookers can see you Nov 25 \u2013 29')}
  else if(k==='going'){S.going[arg]=!S.going[arg];if(S.going[arg])toast('On your calendar')}
  else if(k==='ask'){S.asked[arg]=1;toast('Sent with your tape and rate')}
  else if(k==='accept'){S.accepted=true;toast("You're on")}
  else if(k==='decline')toast('Declined');
  else if(k==='fixed'){S.sheet=null;toast('Thanks, updated for everyone')}
  else if(k==='find'){S.bdate=+arg;S.tab='comics';S.stack=[];keep=0}
  else if(k==='bdate')S.bdate=+arg;
  else if(k==='un')S.showUn=!S.showUn;
  else if(k==='usual'){S.usual=arg==='1';S.sheet=null;if(S.usual)toast('Saved as your usual')}
  else if(k==='offer'){S.offered[arg]=1;toast('Offer sent to '+arg.split(' ')[0])}
  else if(k==='thumb'){const [n,d]=arg.split(':');S.thumbs[n]=S.thumbs[n]===d?null:d}
  else if(k==='switch'){S.role=S.role==='comic'?'booker':'comic';S.tab='home';S.stack=[];keep=0}
  else if(k==='restart'){S.role='start';S.ob=1;keep=0}
  else if(k==='obrole')S.obRole=arg;
  else if(k==='ob')S.ob=+arg;
  else if(k==='obdone'){S.role=S.obRole;S.tab='home';S.stack=[];keep=0}
  render(keep);
});
(function(){const h=decodeURIComponent(location.hash.slice(1)).split('/').filter(Boolean),q=new URLSearchParams(location.search);
  if(h[0]&&h[0]!=='start'){S.role=h[0];S.tab=h[1]||'home';S.stack=h.slice(2)}else if(h[0]==='start')S.ob=+h[1]||1;
  if(q.get('trip'))S.trips.unshift('li');if(q.get('going'))q.get('going').split(',').forEach(x=>S.going[x]=1);if(q.get('area'))S.area=q.get('area');if(q.get('day'))S.day=+q.get('day');if(q.get('acc'))S.accepted=true;if(q.get('sheet'))S.sheet=q.get('sheet');if(q.get('un'))S.showUn=true;
  render()})();
</script>
</body>
</html>
