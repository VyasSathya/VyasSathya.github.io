<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Comedy booking mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f2; --app:#ffffff; --raised:#ffffff; --sunk:#f6f6f4; --line:#e8e8e4; --line2:#dcdcd6;
  --ink:#141413; --ink2:#55554f; --ink3:#8b8b84; --accent:#d9481f; --accent-ink:#ffffff; --accent-soft:#fdeee8;
  --ok:#1f7a4d; --ok-soft:#e7f4ec; --bezel:#111110; --shadow:0 30px 80px rgba(20,20,19,.18);
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0c0c0b; --app:#141413; --raised:#1b1b1a; --sunk:#1b1b1a; --line:#262624; --line2:#33332f;
    --ink:#f3f3ef; --ink2:#b1b1a9; --ink3:#7d7d76; --accent:#f0633a; --accent-ink:#160804; --accent-soft:#2a1711;
    --ok:#5cc391; --ok-soft:#14261d; --bezel:#2a2a28; --shadow:0 30px 80px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
svg{display:block}

.phone{width:390px;height:min(844px,calc(100vh - 40px));background:var(--app);border-radius:46px;position:relative;overflow:hidden;
  box-shadow:0 0 0 10px var(--bezel),var(--shadow);display:flex;flex-direction:column}
.status{height:44px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px;font-weight:600;font-size:14px}
.status i{display:flex;gap:5px;align-items:center}
@media (max-width:480px){
  body{display:block}
  .phone{width:100%;height:100%;border-radius:0;box-shadow:none}
  .status{display:none}
}

.top{flex:none;display:flex;align-items:center;gap:8px;padding:8px 16px;min-height:52px}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{display:block;color:var(--ink3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top.center .ttl{text-align:center}
.h1{font-size:26px;font-weight:700;letter-spacing:-.02em;flex:1}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink)}
.ib:active{background:var(--sunk)}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 14px;border-radius:18px;border:1px solid var(--line2);font-weight:600;font-size:15px}
.pill small{font-weight:500;color:var(--ink3);font-size:13px}

.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:20px}
.scroll::-webkit-scrollbar{display:none}
.sec{padding:18px 16px 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);display:flex;justify-content:space-between;align-items:center}
.sec button{font-size:13px;letter-spacing:0;text-transform:none;color:var(--accent);font-weight:600}
.pad{padding:0 16px}

.tabs{flex:none;display:flex;border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom));background:var(--app)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--ink3);padding:4px 0;position:relative}
.tabs button.on{color:var(--ink)}
.tabs button.on svg{stroke-width:2.1}
.tabs .dot{position:absolute;top:2px;left:calc(50% + 7px);width:7px;height:7px;border-radius:50%;background:var(--accent)}

.av{border-radius:50%;display:grid;place-items:center;font-weight:600;flex:none;color:#fff;letter-spacing:.01em}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--raised);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%}
.row + .row{border-top:1px solid var(--line)}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m span{display:block;color:var(--ink2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m em{display:block;font-style:normal;font-size:12.5px;color:var(--ok);font-weight:500;margin-top:1px}
.row .r{flex:none;text-align:right;font-size:13.5px;color:var(--ink2)}
.row .r b{display:block;color:var(--ink);font-weight:600;font-size:15px}
.row.dim{opacity:.48}
.list .row{padding-left:16px;padding-right:16px}
.chev{color:var(--ink3);flex:none}

.btn{height:44px;border-radius:12px;padding:0 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--app);white-space:nowrap}
.btn.pri{background:var(--ink);color:var(--app);border-color:var(--ink)}
.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{height:34px;border-radius:10px;padding:0 13px;font-size:13.5px}
.btn.sq{width:44px;padding:0}
.btn.grow{flex:1}
.btn[disabled]{opacity:.55}
.btn:active{transform:scale(.985)}
.acts{display:flex;gap:8px}

.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink2)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}

.week{display:flex;padding:4px 10px 10px;border-bottom:1px solid var(--line)}
.week div{flex:1;text-align:center;font-size:11px;color:var(--ink3);font-weight:500}
.week b{display:grid;place-items:center;width:34px;height:34px;margin:4px auto 3px;border-radius:50%;font-size:15px;font-weight:600;color:var(--ink)}
.week .today b{background:var(--ink);color:var(--app)}
.week i{display:block;width:5px;height:5px;border-radius:50%;margin:0 auto;border:1.2px solid transparent}
.week i.s{background:var(--accent);border-color:var(--accent)}
.week i.o{border-color:var(--accent)}

.next{padding:16px}
.next .when{font-size:13px;font-weight:600;color:var(--accent)}
.next h2{margin:4px 0 2px;font-size:22px;letter-spacing:-.015em;font-weight:700}
.next p{margin:0;color:var(--ink2)}
.kv{display:flex;gap:18px;margin:14px 0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kv div{font-size:12px;color:var(--ink3)}
.kv b{display:block;font-size:15px;color:var(--ink);font-weight:600;margin-top:1px}

.day{display:flex;gap:14px;padding:12px 16px;width:100%;align-items:flex-start}
.day + .day{border-top:1px solid var(--line)}
.day .d{width:38px;flex:none;text-align:center;font-size:11px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.day .d b{display:block;font-size:19px;color:var(--ink);font-weight:600;letter-spacing:-.01em;text-transform:none}
.band{margin:14px 16px 4px;padding:10px 12px;border-radius:var(--r-sm);background:var(--sunk);display:flex;align-items:center;gap:10px;font-weight:600;width:calc(100% - 32px)}
.band span{font-weight:500;color:var(--ink2);flex:1}

.chips{display:flex;gap:8px;padding:4px 16px 10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line2);font-weight:500;font-size:14px;white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--app);border-color:var(--ink)}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line2);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.on{background:var(--ok)}
.sw.on::after{transform:translateX(18px)}

.tape{position:relative;border-radius:var(--r);height:190px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#5a3a2c 0%,#261a16 45%,#0e0c0b 100%);color:#fff;display:flex;align-items:flex-end;padding:14px}
.tape::before{content:"";position:absolute;left:50%;top:-30px;width:150px;height:240px;transform:translateX(-50%);background:linear-gradient(180deg,rgba(255,226,190,.34),rgba(255,226,190,0));clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}
.tape .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.94);color:#111;display:grid;place-items:center}
.tape b{position:relative;font-weight:600}
.tape span{position:relative;margin-left:auto;font-size:13px;font-weight:600;background:rgba(0,0,0,.5);padding:2px 7px;border-radius:6px}
.tape.sm{height:120px}

.prof{padding:6px 16px 0;display:flex;gap:14px;align-items:center}
.prof h2{margin:0;font-size:22px;letter-spacing:-.015em}
.prof p{margin:2px 0 0;color:var(--ink2)}
.prof p.t{color:var(--accent);font-weight:500;font-size:13.5px}

.foot{flex:none;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;background:var(--app)}
.foot .m{flex:1;min-width:0}
.foot .m b{display:block;font-weight:600}
.foot .m span{display:block;font-size:12.5px;color:var(--ink3)}
.quota{flex:none;text-align:center;font-size:12px;color:var(--ink3);padding:0 16px 10px;background:var(--app)}

.msgs{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:80%;padding:9px 13px;border-radius:18px;background:var(--sunk);align-self:flex-start}
.bub.me{align-self:flex-end;background:var(--ink);color:var(--app)}
.stamp{align-self:center;font-size:12px;color:var(--ink3);margin:6px 0 2px}
.req{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--raised);align-self:stretch}
.req .lbl{font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:.05em;text-transform:uppercase}
.req h3{margin:4px 0 2px;font-size:17px;letter-spacing:-.01em}
.req p{margin:0;color:var(--ink2);font-size:14px}
.req .kv{margin:12px 0}
.comp{flex:none;display:flex;gap:8px;align-items:center;padding:8px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.comp .in{flex:1;height:40px;border-radius:20px;border:1px solid var(--line2);padding:0 14px;display:flex;align-items:center;color:var(--ink3)}

.veil{position:absolute;inset:0;background:rgba(0,0,0,.38);opacity:0;pointer-events:none;transition:opacity .18s;z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--app);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.8,.2,1);z-index:6;padding:8px 0 calc(18px + env(safe-area-inset-bottom))}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 6px}
.sheet h4{margin:8px 16px 6px;font-size:17px}
.open .veil{opacity:1;pointer-events:auto}
.open .sheet{transform:none}
.sico{width:36px;height:36px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;flex:none}

.ob{flex:1;display:flex;flex-direction:column;padding:28px 20px 20px}
.ob h1{font-size:28px;letter-spacing:-.025em;margin:24px 0 22px;line-height:1.12}
.ob .opt{display:flex;align-items:center;gap:14px;padding:18px 16px;border:1px solid var(--line2);border-radius:var(--r);width:100%;margin-bottom:10px}
.ob .opt b{display:block;font-size:17px;font-weight:600}
.ob .opt span{display:block;color:var(--ink2);font-size:13.5px}
.ob .opt.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.fld div{height:50px;border:1px solid var(--line2);border-radius:12px;display:flex;align-items:center;padding:0 14px;gap:8px;font-weight:500}
.steps{display:flex;gap:6px}
.steps i{height:3px;flex:1;border-radius:2px;background:var(--line2)}
.steps i.on{background:var(--ink)}
.spacer{flex:1}
.news .row{align-items:flex-start}
.news .row .m b{white-space:normal;font-weight:500}
.news .row .m b strong{font-weight:600}
.thumbs{display:flex;gap:6px}
.thumbs button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--ink2)}
.thumbs button.up.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.thumbs button.dn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.slot{border:1px dashed var(--line2);border-radius:var(--r-sm);margin:8px 16px;padding:10px 12px;display:flex;align-items:center;gap:12px}
.slot .m{flex:1}
.slot .m b{display:block;font-weight:600}
.slot .m span{font-size:13px;color:var(--ink3)}
.ctx{margin:2px 16px 10px;border:1px solid var(--line2);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:12px;width:calc(100% - 32px)}
.ctx .m{flex:1}
.ctx b{display:block;font-weight:600}
.ctx span{font-size:13px;color:var(--ink2)}
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:var(--app);padding:10px 16px;border-radius:22px;font-weight:600;font-size:14px;opacity:0;transition:.2s;z-index:7;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

  <div id="view" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>

</div>
<script>
const P={
 cal:'<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',

 plus:'<path d="M12 5v14M5 12h14"/>', check:'<path d="M5 12.500l4.500 4.500L19 7.500"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',

const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const HUES=[14,32,158,200,222,262,318,96];
const av=(name,s=44)=>{let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))%997;const i=name.split(' ').map(w=>w[0]).slice(0,2).join('');
  return `<span class="av" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.36)}px;background:hsl(${HUES[h%HUES.length]} 28% 42%)">${i}</span>`};

const S={role:'comic',tab:'home',stack:[],sheet:null,ob:1,obRole:'comic',added:{},
  accepted:false,area:'home',showUn:false,chip:'All',offered:{},thumbs:{},asked:{}};

const COMICS=[

 {n:'Imani Brooks',loc:'Queens',sig:'Rebooked often nearby',rate:60,cred:['Passed at Pearl Street Cellar']},
 {n:'Luis Ortega',loc:'Brooklyn',sig:'New here',rate:30,cred:['Two years in']},
 {n:'Hannah Weiss',loc:'Visiting from Austin',when:'Nov 27 – 29',sig:'Passed at Cedar Room',rate:45,visit:1,cred:['Passed at Cedar Room, Austin']},
 {n:'Cole Jensen',loc:'Brooklyn',un:'Booked 7:30 – 9:30 PM',rate:40},
 {n:'Rina Shah',loc:'Brooklyn',un:'Out of town Nov 26 – 30',rate:55}
];
const SHOWS={
 home:[
  {id:'mic1',d:'Tue',n:24,t:'Open mic',v:'The Low Room',w:'6:00 PM · Williamsburg',kind:'Mic',sub:'List at the door'},
  {id:'bt',d:'Thu',n:26,t:'Basement Tapes',v:"Marlow's",w:'8:00 PM · Bed-Stuy',kind:'Show',host:'Kit Navarro',ig:'kitnavarro',pay:'$30'},
  {id:'lr',d:'Fri',n:27,t:'Laugh Riot',v:'Pearl Street Cellar',w:'9:30 PM · Bushwick',kind:'Show',host:'Dana Whitlock',on:1,pay:'$50',req:1},
  {id:'nm',d:'Wed',n:2,t:'New Material Night',v:'Halfmoon Bar',w:'8:00 PM · Bushwick',kind:'Show',host:'Maya Okafor',on:1,pay:'$30'}],
 trip:[

   <label class="fld"><span>Instagram</span><div>${ic('ig',18)} @jordanvale</div></label>
   <div class="spacer"></div><button class="btn pri" data-act="ob:3" style="height:52px">Continue</button></div>`,raw:1};
  const ppl=[['Maya Okafor','Books Good Company · Brooklyn'],['Devin Park','Comic · Brooklyn'],['Dana Whitlock','Books Laugh Riot · Bushwick'],['Priya Raman','Comic · Brooklyn'],['Ana Ruiz','Books Cedar Room · Austin']];
  return {body:`<div class="ob" style="padding-left:0;padding-right:0"><div style="padding:0 20px">${steps}<h1 style="margin-bottom:10px">People you know</h1></div>
   <div class="list" style="flex:1;overflow:auto">${ppl.map(p=>`<div class="row">${av(p[0])}<div class="m"><b>${p[0]}</b><span>${p[1]}</span></div><button class="btn sm ${S.added[p[0]]?'':'pri'}" data-act="add:${p[0]}">${S.added[p[0]]?ic('check',15)+' Added':'Add'}</button></div>`).join('')}</div>
   <div style="padding:12px 20px 0"><button class="btn pri" data-act="obdone" style="height:52px;width:100%">Done</button></div></div>`,raw:1};
}

/* ---------- sheets ---------- */
const SHEETS={
 where:()=>`<h4>Where</h4><button class="row" data-close><div class="sico">${ic('home',18)}</div><div class="m"><b>Brooklyn</b><span>Home</span></div>${ic('check',20)}</button>
  <button class="row" data-act="austin"><div class="sico">${ic('plane',18)}</div><div class="m"><b>Austin</b><span>Dec 4 – 8 · bookers there can see you</span></div></button>
  <button class="row" data-close><div class="sico">${ic('plus',18)}</div><div class="m"><b>Add a trip</b><span>City and dates</span></div></button>`,
 more:()=>`<h4>Laugh Riot · Fri Nov 27</h4><button class="row" data-close><div class="sico">${ic('cash',18)}</div><div class="m"><b>Counter with a different rate</b></div></button>
  <button class="row" data-close><div class="sico">${ic('cal',18)}</div><div class="m"><b>Offer another date</b></div></button>
  <button class="row" data-close><div class="sico">${ic('inbox',18)}</div><div class="m"><b>Reply with a note</b></div></button>`,
 plus:()=>`<h4>Send</h4><button class="row" data-close><div class="sico">${ic('film',18)}</div><div class="m"><b>My tape</b><span>Tight five · 5:12</span></div></button>
  <button class="row" data-close><div class="sico">${ic('cash',18)}</div><div class="m"><b>My rates</b></div></button>
  <button class="row" data-close><div class="sico">${ic('cal',18)}</div><div class="m"><b>My open dates</b></div></button>
  <button class="row" data-close><div class="sico">${ic('mic',18)}</div><div class="m"><b>${S.role==='comic'?'A show I\'m on':'A spot on my show'}</b></div></button>`,
 plan:()=>`<h4>Membership</h4><button class="row" data-close><div class="m"><b>Free</b><span>10 new conversations a week</span></div>${ic('check',20)}</button>
  <button class="row" data-close><div class="m"><b>Pro</b><span>Unlimited conversations · see who viewed your tape</span></div></button>`
};

/* ---------- shell ---------- */
const TABS={comic:[['home','cal','Calendar'],['shows','mic','Shows'],['inbox','inbox','Inbox'],['news','news','News'],['me','user','Profile']],
 booker:[['home','cal','Calendar'],['find','search','Find'],['inbox','inbox','Inbox'],['news','news','News'],['me','user','Account']]};
function screen(){
  if(S.role==='start') return onboard();
  const top=S.stack[S.stack.length-1];
  if(top){const [k,...a]=top.split(':');const arg=a.join(':');
    if(k==='show')return showPage(arg); if(k==='comic')return comicPage(arg); return thread(k);}
  if(S.tab==='inbox')return inbox(); if(S.tab==='news')return news(); if(S.tab==='me')return me();
  if(S.role==='comic')return S.tab==='shows'?comicShows():comicHome();
  return S.tab==='find'?find():bookerHome();
}
function render(keep){
  const v=document.getElementById('view'),old=v.querySelector('.scroll'),y=keep&&old?old.scrollTop:0;
  const s=screen();
  const unread=S.role==='comic'&&!S.accepted;
  v.innerHTML=s.raw?s.body:`${s.top||''}<div class="scroll">${s.body}</div>${s.foot||''}${s.noTabs||S.stack.length&&s.foot?'':`<div class="tabs">${TABS[S.role].map(t=>`<button class="${S.tab===t[0]&&!S.stack.length?'on':''}" data-go="tab:${t[0]}">${ic(t[1],23)}${t[2]}${t[0]==='inbox'&&unread?'<i class="dot"></i>':''}</button>`).join('')}</div>`}`;
  const n=v.querySelector('.scroll'); if(n)n.scrollTop=y;
  const sh=document.getElementById('sheet'),ph=document.getElementById('phone');
  if(S.sheet){sh.innerHTML=SHEETS[S.sheet]();ph.classList.add('open')}else ph.classList.remove('open');
  const h='#'+[S.role,S.tab,...S.stack].join('/'); if(location.hash!==h)history.replaceState(null,'',h);
}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600)}
document.getElementById('veil').onclick=()=>{S.sheet=null;render(1)};
document.getElementById('phone').addEventListener('click',e=>{
  const b=e.target.closest('[data-go],[data-act],[data-sheet],[data-close]'); if(!b)return;
  if(b.dataset.close!==undefined){S.sheet=null;return render(1)}
  if(b.dataset.sheet){S.sheet=b.dataset.sheet;return render(1)}
  if(b.dataset.go){const [k,...a]=b.dataset.go.split(':');
    if(k==='tab'){S.tab=a[0];S.stack=[]} else if(k==='push')S.stack.push(a.join(':')); else S.stack.pop();
    S.sheet=null;return render()}
  const [k,...a]=b.dataset.act.split(':'),arg=a.join(':');let keep=1;
  if(k==='accept'){S.accepted=true;toast('On your calendar · Fri Nov 27')}
  else if(k==='decline')toast('Declined')
  else if(k==='austin'){S.area='trip';S.tab='shows';S.stack=[];S.sheet=null;keep=0}
  else if(k==='area')S.area=arg
  else if(k==='ask'){S.asked[arg]=1;toast('Sent with your tape and rate')}
  else if(k==='un')S.showUn=!S.showUn
  else if(k==='chip')S.chip=arg
  else if(k==='offer'){S.offered[arg]=1;toast('Offer sent to '+arg.split(' ')[0])}
  else if(k==='thumb'){const [n,d]=arg.split(':');S.thumbs[n]=S.thumbs[n]===d?null:d}
  else if(k==='switch'){S.role=S.role==='comic'?'booker':'comic';S.tab='home';S.stack=[];keep=0}
  else if(k==='restart'){S.role='start';S.ob=1;keep=0}
  else if(k==='obrole')S.obRole=arg
  else if(k==='ob')S.ob=+arg
  else if(k==='add')S.added[arg]=!S.added[arg]
  else if(k==='obdone'){S.role=S.obRole;S.tab='home';S.stack=[];keep=0}
  render(keep);
});
(function(){const h=decodeURIComponent(location.hash.slice(1)).split('/').filter(Boolean);
  if(h[0]==='start'){S.role='start';S.ob=+h[1]||1}
  else if(h[0]){S.role=h[0];S.tab=h[1]||'home';S.stack=h.slice(2);
    const q=new URLSearchParams(location.search);if(q.get('un'))S.showUn=true;if(q.get('acc'))S.accepted=true;if(q.get('area'))S.area=q.get('area');if(q.get('sheet'))S.sheet=q.get('sheet')}
  else{S.role='start'}
  render()})();
</script>
</body>
</html>
