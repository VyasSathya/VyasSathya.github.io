<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Merge Band</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--page:#F2EFE9;--ink:#231C33;--sub:#6E6780;--bezel:#15121C;--pink:#FF5C7A;--teal:#36D6B5;--gold:#FFD23F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#121017;--bezel:#000}}
:root[data-theme="dark"]{--page:#121017;--bezel:#000}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--page);font-family:"Fredoka",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
body.phone{background:#FFF4DE}
#frame{position:absolute;left:50%;top:50%;transform-origin:0 0}
body:not(.phone) #frame{background:var(--bezel);border-radius:56px;padding:9px;box-shadow:0 24px 60px rgba(20,10,40,.22),0 2px 6px rgba(20,10,40,.18)}
.scr{position:relative;width:390px;height:844px;overflow:hidden;background:linear-gradient(#BFE6FF 0,#DDF2FF 236px,#FFF4DE 236px);touch-action:none}
body:not(.phone) .scr{border-radius:47px}
.a{position:absolute}
svg.i{display:block}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}

/* top HUD */
.top{left:12px;right:12px;top:14px;display:flex;align-items:center;gap:6px;z-index:20}
.lvl{width:44px;height:44px;flex:none;position:relative}
.lvl b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:700;color:var(--ink);padding-top:4px}
.pill{flex:1;height:34px;border-radius:17px;background:#fff;border:2.5px solid var(--ink);display:flex;align-items:center;gap:5px;padding:0 3px 0 4px;font-weight:600;font-size:15px;color:var(--ink);box-shadow:0 3px 0 rgba(35,28,51,.18);position:relative}
.pill span{flex:1;font-variant-numeric:tabular-nums}
.plus{width:24px;height:24px;border-radius:50%;background:var(--teal);border:2px solid var(--ink);display:grid;place-items:center;flex:none;cursor:pointer}
.plus:active{transform:scale(.9)}
.pill .bar{position:absolute;left:28px;right:30px;bottom:3px;height:3px;border-radius:2px;background:#E6F7F2;overflow:hidden}
.pill .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--teal);border-radius:2px}

/* stage */
.stage{left:0;right:0;top:66px;height:170px;z-index:2}
.deck{position:absolute;left:-10px;right:-10px;bottom:-4px;height:52px;background:linear-gradient(#FFD9A8,#F7C68D);border-top:5px solid #FF8A5B;border-radius:50% 50% 0 0/18px 18px 0 0}
.bunt{position:absolute;left:0;right:0;top:6px;height:30px}
.lights{position:absolute;left:0;top:0;width:258px;height:170px;pointer-events:none}
.mem{position:absolute;bottom:0;transform-origin:50% 100%}
.mem .bob{transform-origin:50% 100%;display:flex;justify-content:center}
.mem img{display:block;filter:drop-shadow(0 4px 3px rgba(0,0,0,.22))}
.mem .sh{position:absolute;left:50%;bottom:-5px;height:12px;border-radius:50%;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(0,0,0,.25),rgba(0,0,0,0))}
.mem .pool{position:absolute;left:50%;bottom:-8px;height:18px;border-radius:50%;transform:translateX(-50%);opacity:0;background:radial-gradient(closest-side,var(--c),rgba(255,255,255,0))}
.mem .eq{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:3px;align-items:flex-end;height:20px}
.mem .eq i{width:6px;height:20px;border-radius:3px;background:var(--c);transform-origin:50% 100%;transform:scaleY(.25)}
.mem .lb{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);min-width:18px;height:16px;border-radius:8px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;padding:0 5px;white-space:nowrap}
.mem.l6 .lb{background:linear-gradient(#FFE27A,#F5B700);color:var(--ink)}
.mem .crown{position:absolute;left:50%;transform:translateX(-50%)}
.mem .bob{position:relative}
.mem .fl{position:absolute;left:50%;border-radius:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(closest-side,var(--c),rgba(255,255,255,0))}
.mem .mo{position:absolute;pointer-events:none;background-repeat:no-repeat;background-size:900% 100%}
.np{position:absolute;pointer-events:none;filter:drop-shadow(0 1px 0 #231C33)}
.chip{position:absolute;z-index:30;pointer-events:none;background:var(--ink);color:#fff;font-weight:600;font-size:13px;border-radius:12px;padding:3px 9px;white-space:nowrap;display:flex;align-items:center;gap:5px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}

/* order */
.order{position:absolute;right:12px;top:6px;width:124px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:8px 8px 9px;box-shadow:0 4px 0 rgba(35,28,51,.18);z-index:5}
.order .hd{font-size:12px;font-weight:600;color:var(--sub);text-align:center;display:flex;justify-content:center;align-items:center;gap:4px}
.order .hd svg{flex:none}
.order .its{display:flex;gap:6px;justify-content:center;margin:6px 0 7px}
.order .it{width:48px;height:48px;border-radius:12px;background:#FFF4DE;position:relative;overflow:hidden;border:2px solid #F0DDBE;cursor:pointer}
.order .it img{position:absolute;left:50%;bottom:2px;height:42px;max-width:44px;object-fit:contain;object-position:50% 100%;transform:translateX(-50%)}
.order .it .ok{position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--teal);display:grid;place-items:center;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.order .it.have .ok{transform:scale(1)}
.order .it.have{border-color:var(--teal);background:#E9FBF6}
.order .it .l{position:absolute;left:3px;top:2px;font-size:10px;font-weight:700;color:var(--ink)}
.order .btn{height:28px;border-radius:14px;background:#C9C3D3;color:#fff;font-weight:600;font-size:14px;display:grid;place-items:center;transition:background .2s}
.order.ready .btn{background:var(--pink);box-shadow:0 3px 0 #C23A57;cursor:pointer;animation:rdy .84s ease-in-out infinite}
@keyframes rdy{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.order .btn:active{transform:scale(.94)!important}
.order .rw{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);background:#FFF8E1;border:2px solid var(--ink);border-radius:10px;padding:0 6px 0 3px;height:20px;display:flex;align-items:center;gap:3px;font-size:12px;font-weight:700;white-space:nowrap}
.order.out{animation:oout .32s ease-in forwards}
.order.in{animation:oin .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes oout{to{transform:translateX(150px) rotate(10deg);opacity:0}}
@keyframes oin{from{transform:translateX(150px) rotate(10deg);opacity:0}to{transform:none;opacity:1}}

/* board */
.board{left:12px;top:252px;width:366px;height:366px;border-radius:20px;background:#E9CFA8;padding:3px;border:3px solid #D9B583;box-shadow:0 5px 0 #C99F6A;z-index:3}
.gridb{position:relative;width:100%;height:100%;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);border-radius:16px;overflow:hidden}
.t{position:relative;transition:background .15s}
.t.o{background:#FFF1DA}.t.e{background:#FFE6C2}
.t.fog{background:#D9D2E6}
.t.fog img{position:absolute;left:50%;bottom:6px;height:36px;max-width:42px;object-fit:contain;object-position:50% 100%;transform:translateX(-50%);filter:brightness(0) opacity(.13)}
.t.fog::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.5),rgba(255,255,255,0) 60%)}
.t.fog.next{background:#E3DCEF}
.t.fog.next::before{content:"";position:absolute;inset:3px;border-radius:9px;border:2px dashed rgba(35,28,51,.18)}
.t.glow{box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 18px rgba(255,210,63,.9);background:#FFF6C8;z-index:2}
.t.hint{box-shadow:inset 0 0 0 2px rgba(255,210,63,.9);background:#FFF8DC}
.t.sel{box-shadow:inset 0 0 0 3px var(--ink);background:#FFFBF1;border-radius:10px}
.t.drag{background:#F5DDB8}
.items{position:absolute;left:18px;top:258px;width:354px;height:354px;z-index:4;pointer-events:none}
.itm{position:absolute;left:0;top:0;width:50.57px;height:50.57px}
.itm .bob{position:absolute;left:0;right:0;bottom:3px;display:flex;justify-content:center;transform-origin:50% 100%}
.itm img{display:block;max-width:47px;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 2px 1px rgba(0,0,0,.2))}
.itm .lv{position:absolute;right:3px;top:3px;font-size:10px;font-weight:700;color:#fff;background:var(--ink);border-radius:5px;padding:0 4px;line-height:14px;z-index:2}
.itm.l6 .lv{background:linear-gradient(#FFE27A,#F5B700);color:var(--ink)}
.itm .gl{position:absolute;left:50%;top:54%;width:46px;height:46px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,226,110,.85),rgba(255,226,110,0))}
.itm.l5 .gl{background:radial-gradient(closest-side,rgba(255,170,220,.85),rgba(255,170,220,0))}
.itm.l6 .gl{background:radial-gradient(closest-side,rgba(255,215,64,1),rgba(255,215,64,0));animation:shine 1.2s ease-in-out infinite}
@keyframes shine{50%{opacity:.6}}
.itm .crown{position:absolute;left:50%;top:-6px;transform:translateX(-50%) rotate(-8deg);z-index:2}
.itm.gen .bob{bottom:0;top:0}
.itm.wig .bob{animation:wig .14s linear infinite}
@keyframes wig{0%,100%{transform:rotate(-5deg) scale(1.05)}50%{transform:rotate(5deg) scale(.97)}}
.itm.hide{opacity:0}
.itm.pop .bob{animation:pop .45s cubic-bezier(.3,1.9,.5,1)}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
.ghost{position:absolute;left:0;top:0;z-index:40;pointer-events:none;width:60px;height:60px}
.ghost .bob{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;transform:rotate(-8deg) scale(1.18);transform-origin:50% 100%;filter:drop-shadow(0 10px 6px rgba(0,0,0,.3))}
.ghost img{max-width:56px;object-fit:contain;object-position:50% 100%}
.prev{position:absolute;z-index:41;display:flex;align-items:center;gap:4px;background:var(--ink);border-radius:14px;padding:4px 8px 4px 4px;color:#fff;font-weight:600;font-size:13px;box-shadow:0 4px 10px rgba(0,0,0,.25);pointer-events:none;white-space:nowrap}
.prev .pi{width:34px;height:34px;border-radius:10px;background:#FFF4DE;position:relative;overflow:hidden}
.prev .pi img{position:absolute;left:50%;bottom:1px;height:32px;max-width:32px;object-fit:contain;object-position:50% 100%;transform:translateX(-50%)}

/* info */
.info{left:12px;right:12px;top:632px;height:62px;border-radius:18px;background:#fff;border:2.5px solid var(--ink);display:flex;align-items:center;gap:10px;padding:0 8px 0 7px;box-shadow:0 4px 0 rgba(35,28,51,.15);z-index:5}
.info .th{width:46px;height:46px;border-radius:12px;background:#FFF1DA;position:relative;overflow:hidden;flex:none}
.info .th img,.info .th svg{position:absolute;left:50%;bottom:2px;height:42px;max-width:44px;object-fit:contain;object-position:50% 100%;transform:translateX(-50%)}
.info .tx{flex:1;line-height:1.18;min-width:0}
.info .tx b{display:block;font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .tx span{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.info .tx span i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
.info .sell{height:36px;min-width:36px;border-radius:18px;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;gap:3px;font-weight:700;color:var(--ink);font-size:14px;padding:0 6px;cursor:pointer;background:#fff;transition:background .15s}
.info .sell.arm{background:var(--pink);color:#fff}
.info .sell[hidden]{display:none}

/* nav */
.nav{left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-start;padding-top:16px;z-index:5}
.nb{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.nb .ic{width:60px;height:60px;border-radius:20px;background:#fff;border:2.5px solid var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 var(--ink);position:relative;transition:transform .1s}
.nb:active .ic{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.nb.big .ic{width:76px;height:76px;border-radius:26px;background:var(--pink);margin-top:-10px}
.nb .badge{position:absolute;right:-6px;top:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--pink);color:#fff;font-size:12px;display:grid;place-items:center;border:2px solid #fff;padding:0 4px}
.nb .badge[hidden]{display:none}
.nb.hot .ic{background:#FFF6C8;transform:scale(1.1)}
.ring{position:absolute;inset:-6px;pointer-events:none}

/* panels */
.panel{left:12px;right:12px;z-index:25;background:#fff;border:2.5px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 rgba(35,28,51,.2);padding:12px;display:none}
.panel.on{display:block;animation:pin .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes pin{from{transform:translateY(20px) scale(.96);opacity:0}}
.panel h3{font-size:16px;font-weight:600;margin-bottom:10px;text-align:center}
.bagrow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.bs{aspect-ratio:1;border-radius:12px;background:#FFF4DE;border:2px solid #F0DDBE;position:relative;overflow:hidden;cursor:pointer}
.bs img{position:absolute;left:50%;bottom:2px;height:80%;max-width:90%;object-fit:contain;object-position:50% 100%;transform:translateX(-50%)}
.bs .l{position:absolute;right:3px;top:2px;font-size:10px;font-weight:700;color:#fff;background:var(--ink);border-radius:5px;padding:0 4px;line-height:14px}
.bs.e{background:#F6F1E8;border-style:dashed;cursor:default}
.offers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.of{border:2.5px solid var(--ink);border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;background:#FFF8EA;cursor:pointer}
.of b{font-size:20px;display:flex;align-items:center;gap:4px}
.of span{height:30px;border-radius:15px;background:var(--teal);border:2px solid var(--ink);color:var(--ink);font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px;padding:0 10px}
.of.no{opacity:.45}
.scrim{position:absolute;inset:0;z-index:24;display:none}
.scrim.on{display:block}

/* fx */
.fx{position:absolute;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.sp{position:absolute;width:14px;height:14px;background:var(--gold);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.rg{position:absolute;border-radius:50%;border:4px solid #fff;box-shadow:0 0 14px rgba(255,210,63,.9),inset 0 0 10px rgba(255,210,63,.6)}
.pf{position:absolute;border-radius:50%;background:#fff}
.ft{position:absolute;font-weight:700;font-size:18px;color:#fff;white-space:nowrap;text-shadow:0 2px 0 #231C33,2px 0 0 #231C33,-2px 0 0 #231C33,0 -2px 0 #231C33,2px 2px 0 #231C33,-2px 2px 0 #231C33,2px -2px 0 #231C33,-2px -2px 0 #231C33}
.toast{position:absolute;left:50%;top:560px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:600;font-size:14px;border-radius:14px;padding:6px 14px;z-index:60;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* start */
.start{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:linear-gradient(rgba(191,230,255,.92),rgba(255,244,222,.95));transition:opacity .4s}
.start.gone{opacity:0;pointer-events:none}
.start h1{font-size:44px;font-weight:700;color:#fff;letter-spacing:.5px;text-shadow:0 3px 0 #231C33,3px 0 0 #231C33,-3px 0 0 #231C33,0 -3px 0 #231C33,3px 3px 0 #231C33,-3px 3px 0 #231C33,3px -3px 0 #231C33,-3px -3px 0 #231C33,0 7px 0 rgba(35,28,51,.25)}
.start .line{display:flex;align-items:flex-end;gap:2px;height:120px}
.start .line img{filter:drop-shadow(0 4px 3px rgba(0,0,0,.22));animation:hop .834s ease-in-out infinite;transform-origin:50% 100%}
@keyframes hop{0%,100%{transform:scale(1,1)}12%{transform:scale(1.07,.92)}35%{transform:scale(.96,1.05)}60%{transform:scale(1,1)}}
.start p{font-size:16px;color:var(--sub);font-weight:500}
.go{height:60px;min-width:200px;border-radius:30px;background:var(--pink);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);color:#fff;font-family:inherit;font-weight:700;font-size:22px;cursor:pointer;padding:0 28px}
.go:disabled{background:#C9C3D3;cursor:default}
.go:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
@media (prefers-reduced-motion: reduce){.start .line img,.order.ready .btn{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="star" viewBox="0 0 48 48"><path d="M24 3l6.2 13.6 14.8 1.6-11 10 3.1 14.6L24 35.4 10.9 42.8 14 28.2 3 18.2l14.8-1.6z" fill="#FFC23D" stroke="#231C33" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#E8A400"/><circle cx="12" cy="11" r="10" fill="#FFD43B"/><circle cx="12" cy="11" r="6.5" fill="none" stroke="#E8A400" stroke-width="2"/><path d="M11 7v6.5a2 2 0 1 1-1.5-1.9V7h4v2" fill="none" stroke="#B87D00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="gem" viewBox="0 0 24 24"><path d="M5 4h14l4 6-11 12L1 10z" fill="#4FD3FF"/><path d="M5 4l3 6h8l3-6M1 10h22M8 10l4 12 4-12" fill="none" stroke="#1C7FB0" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 10l4-6 4 6z" fill="#B7F1FF"/></symbol>
    <symbol id="bolt" viewBox="0 0 24 24"><path d="M14 1L4 14h7l-2 9 11-14h-7z" fill="#36D6B5" stroke="#1C8F78" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="4" stroke-linecap="round"/></symbol>
    <symbol id="note" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="3.5" fill="currentColor"/><circle cx="17.5" cy="16" r="3.5" fill="currentColor"/></symbol>
    <symbol id="shop" viewBox="0 0 24 24"><path d="M3 9l2-5h14l2 5" fill="#FF5C7A" stroke="#231C33" stroke-width="2" stroke-linejoin="round"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z" fill="#fff" stroke="#231C33" stroke-width="2" stroke-linejoin="round"/><path d="M5 13v8h14v-8" fill="#fff" stroke="#231C33" stroke-width="2"/><rect x="10" y="15" width="4" height="6" fill="#36D6B5" stroke="#231C33" stroke-width="1.6"/></symbol>

/* ---------- audio: one clock ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null,bus=null,lim=null,t0=0,running=false,fakeT0=performance.now();
const BUF={};const LAYER={};
let LS=1.6678,LE=58.373,LL=LE-LS,BEAT=.41696;let NOTES={},BASSN=[];
function decode(ab){return new Promise((res,rej)=>{const p=ac.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej);});}
async function loadAudio(prog){
  const nj=await (await fetch('audio/notes.json')).json();
  LS=nj.loop.start_s;LE=nj.loop.end_s;LL=LE-LS;BEAT=nj.beat_seconds;
  for(const p of PARTS){
    const out=[],raw=nj.notes[p]||[];
    for(let i=0;i<raw.length;i++){const t=raw[i][0],k=raw[i][1];let w=1;
      if(p==='drums'){w=(k===35||k===36)?1:(k===38||k===40||k===37||k===39)?.85:(k===49||k===57)?1:.3;}
      let nx=LE;for(let j=i+1;j<raw.length;j++){if(raw[j][0]-t>.025){nx=raw[j][0];break;}}
      const d=Math.max(0,Math.min(1.2,nx-t)); // how long this note holds, up to the next one
      const last=out[out.length-1];if(last&&t-last.t<.025){last.w=Math.max(last.w,w);last.d=Math.max(last.d,d);continue;}
      out.push({t,w,k,d});}
    NOTES[p]=out;
  }
  BASSN=NOTES.bass||[];
  if(!AC)return;
  ac=new AC({latencyHint:'interactive'});
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  const files=[...PARTS];let done=0;
  await Promise.all(files.map(async f=>{const ab=await (await fetch('audio/'+f+'.mp3')).arrayBuffer();const b=await decode(ab);
    BUF[f]=b;prog(++done/files.length);}));
  lim=ac.createDynamicsCompressor();lim.threshold.value=-3;lim.knee.value=2;lim.ratio.value=16;lim.attack.value=.003;lim.release.value=.15;
  bus=ac.createGain();bus.gain.value=0;bus.connect(lim);lim.connect(ac.destination);
}
function lat(){return ac?(ac.outputLatency||ac.baseLatency||0):0;}
/* one stem per musician: every stem starts together at time 0 at gain 0, only the gains change.
   A musician who joins is queued onto the next bar line (and at least two bars after the last one),
   so the parts come in one at a time on the one song clock. */
const JOIN=[];let lastJoinU=-99;const BARS_APART=2;let FORCE_GAP=18; // gentle unlock: a new musician at least every 18 s
const inBand=f=>S.band.includes(f)||JOIN.some(j=>j.f===f);
function partGain(p){const f=FAM_OF[p];return f&&inBand(f)?.85+.03*(S.best[f]||1):0;} // a merged-up musician plays its one stem a touch louder
function startSong(){
  if(!ac||!BUF[PARTS[0]])return;
  const when=ac.currentTime+.06;t0=when;
  for(const p of PARTS){const s=ac.createBufferSource();s.buffer=BUF[p];s.loop=true;s.loopStart=LS;s.loopEnd=LE;
    const gn=ac.createGain();gn.gain.value=S.band.includes(FAM_OF[p])?partGain(p):0;s.connect(gn);gn.connect(bus);s.start(when,0);LAYER[p]=gn;}
  running=true;levelBus(.05);
}
function levelBus(tc){if(!running)return;const n=ORDER_F.filter(inBand).length;bus.gain.cancelScheduledValues(ac.currentTime);bus.gain.setTargetAtTime(.95/(1+.06*n),ac.currentTime,tc||.3);}

function nextBarU(u){const bar=BEAT*4;if(u<LS)return LS;return LS+Math.ceil((u-LS)/bar-1e-6)*bar;}
function setLayer(){
  if(!running)return;const nb=Math.max(ac.currentTime,nextBarCtx());
  for(const p of PARTS){const gp=LAYER[p].gain;const j=JOIN.find(x=>x.f===FAM_OF[p]);const at=j?Math.max(ac.currentTime,t0+j.atU):nb;
    gp.cancelScheduledValues(ac.currentTime);gp.setValueAtTime(gp.value,ac.currentTime);gp.setTargetAtTime(partGain(p),at,.02);}
  levelBus();
}
function join(f){
  if(!FAMS[f]||inBand(f))return false;
  if(!S.best[f])S.best[f]=1;
  const u=running?ac.currentTime-t0:songU();
  const atU=Math.max(nextBarU(u+.05),lastJoinU+BARS_APART*BEAT*4);
  lastJoinU=atU;JOIN.push({f,atU});setLayer();return true;
}
function songU(){ // heard position, unwrapped
  if(running)return ac.currentTime-t0-lat();
  return (performance.now()-fakeT0)/1000+LS;
}
function pos(u){return u<LE?u:LS+((u-LS)%LL);}
// notes of part p whose loop time falls in unwrapped (a,b]; cb(note, unwrappedTime)
function lb(arr,t){let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;if(arr[m].t<=t)lo=m+1;else hi=m;}return lo;}
function notesIn(p,a,b,cb){
  if(b<=a)return;const arr=NOTES[p];if(!arr||!arr.length)return;
  const pa=pos(a),pb=pos(b);
  if(pb>=pa&&b-a<LL){for(let i=lb(arr,pa);i<arr.length&&arr[i].t<=pb;i++)cb(arr[i],a+(arr[i].t-pa));}
  else{for(let i=lb(arr,pa);i<arr.length&&arr[i].t<=LE;i++)cb(arr[i],a+(arr[i].t-pa));

  if(dt<.09)dt+=BEAT;return u+dt;

  const a=S.cells[src],b=S.cells[tgt];const nl=a.lv+1;
  const da=EL[a.id],db=EL[b.id];
  S.cells[src]=null;const c={k:'m',f:a.f,lv:nl,id:uid++,pend:1};S.cells[tgt]=c;delete EL[a.id];delete EL[b.id];
  da.classList.remove('hide');da.classList.add('wig');db.classList.add('wig');da.style.zIndex=6;

  const d=makeItem(pm.c,pm.tgt);d.classList.add('pop');setTimeout(()=>d.classList.remove('pop'),460);
  const [x,y]=tileXY(pm.tgt);const cx=x+T/2,cy=y+T/2;
  burst(cx,cy,pm.c.lv>=4?14:10,pm.c.lv>=5?'#FF8FD0':null);ringAt(cx,cy,pm.c.lv>=4?90:70);
  if(pm.c.lv>=5)shake();
  raiseBest(pm.c.f,pm.c.lv);join(pm.c.f); // first merge of a musician brings it on stage
  if(selIdx<0||selIdx===pm.tgt)setInfo(pm.tgt);
  checkOrder();save();
}
function shake(){scr.animate([{transform:'translate(0,0)'},{transform:'translate(-4px,2px)'},{transform:'translate(4px,-2px)'},{transform:'translate(-2px,1px)'},{transform:'translate(0,0)'}],{duration:260});}

/* ---------- input ---------- */
let drag=null,press=null;
const ghostWrap=document.createElement('div');ghostWrap.className='ghost';ghostWrap.style.display='none';ghostWrap.innerHTML='<div class="bob"><img alt=""></div>';scr.appendChild(ghostWrap);
const prevEl=document.createElement('div');prevEl.className='prev';prevEl.style.display='none';scr.appendChild(prevEl);
const bagBtn=$('#nBag');
function clearHL(){for(const t of tiles)t.classList.remove('glow','hint','drag');bagBtn.classList.remove('hot');prevEl.style.display='none';}
scr.addEventListener('pointerdown',e=>{
  if(!$('#start').classList.contains('gone'))return;
  const [x,y]=toScr(e);const i=idxAt(x,y);
  if(i<0||drag)return;
  if(isPanelOpen())return;
  const c=S.cells[i];
  press={id:e.pointerId,i,x0:x,y0:y,kind:c?c.k:'empty'};
  try{scr.setPointerCapture(e.pointerId);}catch(_){}
});
scr.addEventListener('pointermove',e=>{
  if(!press||e.pointerId!==press.id)return;const [x,y]=toScr(e);
  if(!drag){
    if(press.kind!=='m')return;const c=S.cells[press.i];if(!c||c.pend)return;
    if(Math.hypot(x-press.x0,y-press.y0)<7)return;
    drag={i:press.i,c,el:EL[c.id]};drag.el.classList.add('hide');tiles[press.i].classList.add('drag');
    ghostWrap.querySelector('img').src=img(c.f,c.lv);ghostWrap.querySelector('img').style.height=(BOARD_H[c.lv-1]*1.05)+'px';ghostWrap.style.display='block';
    for(let k=0;k<49;k++){const o=S.cells[k];if(k!==press.i&&o&&o.k==='m'&&!o.pend&&o.f===c.f&&o.lv===c.lv&&c.lv<MAXLV)tiles[k].classList.add('hint');}
    if(selIdx!==press.i)setInfo(press.i);
    sfxSoft(420);
  }
  ghostWrap.style.transform='translate('+(x-30)+'px,'+(y-46)+'px)';
  for(const t of tiles)t.classList.remove('glow');bagBtn.classList.remove('hot');prevEl.style.display='none';
  const j=idxAt(x,y);const c=drag.c;
  if(j>=0&&j!==drag.i){const o=S.cells[j];
    if(o&&o.k==='m'&&!o.pend&&o.f===c.f&&o.lv===c.lv&&c.lv<MAXLV){tiles[j].classList.add('glow');
      prevEl.innerHTML='<span class="pi"><img src="'+img(c.f,c.lv+1)+'" alt=""></span>Lv '+(c.lv+1);prevEl.style.display='flex';
      const [tx,ty]=tileXY(j);prevEl.style.left=Math.max(4,Math.min(300,tx-22))+'px';prevEl.style.top=(ty-48)+'px';}}
  else if(j<0&&inEl(bagBtn,x,y,8))bagBtn.classList.add('hot');
});
function endPress(e,cancel){
  if(!press||e.pointerId!==press.id)return;const [x,y]=toScr(e);const p=press;press=null;
  if(!drag){
    if(cancel)return;
    if(p.kind==='gen'&&idxAt(x,y)===GEN_IDX){spawn();setInfo(null);return;}
    if(p.kind==='m'){const c=S.cells[p.i];if(c&&!c.pend){setInfo(p.i);const d=EL[c.id];if(d)d._bob.animate([{transform:'scale(1)'},{transform:'scale(1.2,.85)'},{transform:'scale(1)'}],{duration:220});}return;}
    if(p.kind==='fog'){const c=S.cells[p.i];tiles[p.i].classList.remove('shake');void tiles[p.i].offsetWidth;tiles[p.i].classList.add('shake');return;}
    setInfo(null);return;
  }
  const dg=drag;drag=null;ghostWrap.style.display='none';clearHL();dg.el.classList.remove('hide');
  const from=[x-25,y-40];
  const j=cancel?-1:idxAt(x,y);
  if(!cancel&&j<0&&inEl(bagBtn,x,y,8)){
    if(S.bag.length>=6){toast('Bag is full');moveEl(dg.el,dg.i,from);return;}
    S.cells[dg.i]=null;delete EL[dg.c.id];dg.el.remove();S.bag.push({f:dg.c.f,lv:dg.c.lv});bumpEl(bagBtn);renderBag();setInfo(null);sfxSoft(520);checkOrder();save();return;}
  if(j<0||j===dg.i){moveEl(dg.el,dg.i,from);return;}
  const o=S.cells[j];
  if(!o){S.cells[j]=dg.c;S.cells[dg.i]=null;moveEl(dg.el,j,from,120);setInfo(j);save();checkOrder();return;}
  if(o.k==='m'&&!o.pend&&o.f===dg.c.f&&o.lv===dg.c.lv&&dg.c.lv<MAXLV){moveEl(dg.el,j,from,110);merge(dg.i,j);return;}
  if(o.k==='m'&&!o.pend){const od=EL[o.id];S.cells[j]=dg.c;S.cells[dg.i]=o;moveEl(dg.el,j,from,120);const [tx,ty]=tileXY(j);moveEl(od,dg.i,[tx,ty],180);setInfo(j);save();return;}
  moveEl(dg.el,dg.i,from);
}
scr.addEventListener('pointerup',e=>endPress(e,false));
scr.addEventListener('pointercancel',e=>endPress(e,true));
scr.addEventListener('lostpointercapture',e=>{if(press&&e.pointerId===press.id&&drag)endPress(e,true);});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- bag / shop / song ---------- */
const scrim=$('#scrim'),bagP=$('#bagP'),shopP=$('#shopP');
function isPanelOpen(){return bagP.classList.contains('on')||shopP.classList.contains('on');}
function closePanels(){bagP.classList.remove('on');shopP.classList.remove('on');scrim.classList.remove('on');}
scrim.addEventListener('click',closePanels);
function renderBag(){
  const n=S.bag.length;const b=$('#bagN');b.hidden=!n;b.textContent=n;
  const row=$('#bagRow');row.innerHTML='';
  for(let k=0;k<6;k++){const it=S.bag[k];const d=document.createElement('div');d.className='bs'+(it?'':' e');
    if(it){d.innerHTML='<img src="'+img(it.f,it.lv)+'" alt=""><span class="l">'+it.lv+'</span>';d.addEventListener('click',()=>unbag(k));}row.appendChild(d);}
}
function unbag(k){
  const i=nearestEmpty(GEN_IDX);if(i<0){toast('Board is full');return;}
  const it=S.bag.splice(k,1)[0];const c={k:'m',f:it.f,lv:it.lv,id:uid++};S.cells[i]=c;const d=makeItem(c,i);
  const [bx,by]=elCenter(bagBtn);moveEl(d,i,[bx-25,by-25],360);sfxPop();renderBag();checkOrder();save();
  if(!S.bag.length)closePanels();
}
bagBtn.addEventListener('click',()=>{if(drag)return;const on=!bagP.classList.contains('on');closePanels();if(on){renderBag();bagP.classList.add('on');scrim.classList.add('on');}});
function openShop(){closePanels();refreshShop();shopP.classList.add('on');scrim.classList.add('on');}
$('#nShop').addEventListener('click',openShop);
document.querySelectorAll('[data-shop]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();openShop();}));
function refreshShop(){$('#ofE').classList.toggle('no',S.coins<120);$('#ofE2').classList.toggle('no',S.gems<5);}
function buyEnergy(n,cost,gem){
  if(gem?S.gems<cost:S.coins<cost){const el=gem?$('#pG'):$('#pC');el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');sfxSoft(180);return;}
  if(gem)S.gems-=cost;else S.coins-=cost;S.energy+=n;bumpEl($('#pE'));const [x,y]=elCenter($('#pE'));burst(x,y,8,'#36D6B5');sfxCoins(3);renderHud();refreshShop();save();
}
$('#ofE').addEventListener('click',()=>buyEnergy(30,120,false));
$('#ofE2').addEventListener('click',()=>buyEnergy(60,5,true));
$('#nSong').addEventListener('click',()=>{
  for(const f in MEM){const d=MEM[f];d.animate([{transform:'translateY(0)'},{transform:'translateY(-22px) scale(1.06,.95)'},{transform:'translateY(0)'}],{duration:BEAT*1000,delay:Math.random()*120,easing:'cubic-bezier(.3,0,.3,1)'});}
  const [x,y]=elCenter($('#songIc'));burst(x,y-20,8,'#FF5C7A');
});

/* ---------- fx ---------- */
function burst(x,y,n,col){
  for(let k=0;k<n;k++){const s=document.createElement('i');s.className='sp';if(col)s.style.background=k%2?col:'#FFD23F';
    const a=Math.random()*Math.PI*2,r=rnd(26,60),sz=rnd(.6,1.3);s.style.left=(x-7)+'px';s.style.top=(y-7)+'px';fx.appendChild(s);
    s.animate([{transform:'translate(0,0) scale('+sz+') rotate(0)',opacity:1},{transform:'translate('+Math.cos(a)*r+'px,'+(Math.sin(a)*r-10)+'px) scale(0) rotate(180deg)',opacity:.9}],{duration:rnd(420,650),easing:'cubic-bezier(.2,.8,.4,1)'}).onfinish=()=>s.remove();}
}
function ringAt(x,y,sz){const r=document.createElement('i');r.className='rg';r.style.cssText='left:'+(x-sz/2)+'px;top:'+(y-sz/2)+'px;width:'+sz+'px;height:'+sz+'px';fx.appendChild(r);
  r.animate([{transform:'scale(.3)',opacity:1},{transform:'scale(1.15)',opacity:0}],{duration:450,easing:'ease-out'}).onfinish=()=>r.remove();}
function puff(x,y){for(let k=0;k<9;k++){const p=document.createElement('i');p.className='pf';const s=rnd(14,26);p.style.cssText='left:'+(x-s/2)+'px;top:'+(y-s/2)+'px;width:'+s+'px;height:'+s+'px;background:'+(k%2?'#fff':'#E6DFF0');
  fx.appendChild(p);const a=k/9*Math.PI*2;p.animate([{transform:'translate(0,0) scale(.5)',opacity:1},{transform:'translate('+Math.cos(a)*34+'px,'+Math.sin(a)*34+'px) scale(1.3)',opacity:0}],{duration:520,easing:'ease-out'}).onfinish=()=>p.remove();}}
function floatText(x,y,t){const d=document.createElement('div');d.className='ft';d.textContent=t;d.style.left=(x-20)+'px';d.style.top=(y-10)+'px';fx.appendChild(d);
  d.animate([{transform:'translateY(0) scale(.6)',opacity:0},{transform:'translateY(-14px) scale(1.15)',opacity:1,offset:.25},{transform:'translateY(-46px) scale(1)',opacity:0}],{duration:1000,easing:'ease-out'}).onfinish=()=>d.remove();}
function coinsFly(x,y,n){const [tx,ty]=elCenter($('#pC').querySelector('svg'));
  for(let k=0;k<n;k++){const c=document.createElementNS('http://www.w3.org/2000/svg','svg');c.setAttribute('width',22);c.setAttribute('height',22);c.innerHTML='<use href="#coin"/>';
    c.style.cssText='position:absolute;left:'+(x-11)+'px;top:'+(y-11)+'px';fx.appendChild(c);const ox=rnd(-40,40),oy=rnd(-40,10);
    c.animate([{transform:'translate(0,0) scale(.4)'},{transform:'translate('+ox+'px,'+oy+'px) scale(1.1)',offset:.3},{transform:'translate('+(tx-x)+'px,'+(ty-y)+'px) scale(.7)'}],{duration:700+k*40,easing:'cubic-bezier(.5,0,.7,1)'}).onfinish=()=>{c.remove();if(k===n-1){bumpEl($('#pC'));}};}}
function chip(x,y,t,col){const d=document.createElement('div');d.className='chip';d.style.setProperty('--c',col);d.innerHTML='<i></i>'+t;fx.appendChild(d);
  const w=d.offsetWidth;d.style.left=Math.max(6,Math.min(384-w,x-w/2))+'px';d.style.top=Math.max(64,y)+'px';
  d.animate([{transform:'translateY(8px) scale(.6)',opacity:0},{transform:'translateY(0) scale(1.05)',opacity:1,offset:.15},{transform:'translateY(-4px)',opacity:1,offset:.8},{transform:'translateY(-12px)',opacity:0}],{duration:1500,easing:'ease-out'}).onfinish=()=>d.remove();}
let toastT=0;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),1100);}

/* ---------- frame loop: notes drive the bob ---------- */
const PULSE={};for(const p of PARTS)PULSE[p]=0;let lastU=null,beatPulse=0,lastBeat=-1,lastT=performance.now(),started=false;
window.__mb={renderAll,get S(){return S;},PULSE,pend,get running(){return running;},noteHits:{},JOIN,join,clearFog,completeOrder,
  layerGain:p=>LAYER[p]?LAYER[p].gain.value:null,busGain:()=>bus&&bus.gain.value,ctx:()=>ac,get t0(){return t0;},songU,FAMS,FAM_OF,PARTS,
  bar:()=>BEAT*4,LS:()=>LS,setGap:g=>{FORCE_GAP=g;},get lastJoinU(){return lastJoinU;},joinLog:[]};
// gentle forced unlock: if nobody new has joined for FORCE_GAP seconds, bring the next musician in
function pace(u){
  if(!started||JOIN.length||u-lastJoinU<FORCE_GAP)return;
  const left=ORDER_F.filter(f=>!inBand(f));if(!left.length)return;
  const onBoard=left.find(f=>S.cells.some(c=>c&&c.k==='m'&&c.f===f)||S.bag.some(b=>b.f===f));
  if(onBoard){join(onBoard);return;}
  if(FOG.some(([i,f])=>S.cells[i]&&S.cells[i].k==='fog'&&left.includes(f))){clearFog();return;}
  join(left[0]);
}
function tick(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  const u=songU();const nowS=now/1000;
  if(started)landJoins(u);
  if(lastU!=null&&u>lastU&&u-lastU<.5){
    for(const f of S.band){const p=FAMS[f].part;const d=MEM[f]; // only musicians on stage are heard, so only they move
      notesIn(p,lastU,u,n=>{PULSE[p]=Math.max(PULSE[p],n.w);if(d)noteHit(d,n,nowS);window.__mb.noteHits[p]=(window.__mb.noteHits[p]||0)+1;});}
  }
  lastU=u;pace(u);
  const pp=pos(u);const bi=Math.floor((pp-LS)/BEAT);if(bi!==lastBeat){lastBeat=bi;beatPulse=1;}
  const k=Math.exp(-dt*11);for(const p of PARTS)PULSE[p]*=k;beatPulse*=Math.exp(-dt*8);
  // board items
  for(const id in EL){const d=EL[id];const q=PULSE[FAMS[d._f].part];
    d._bob.style.transform=q>.02?'scale('+(1+.1*q)+','+(1-.09*q)+')':'';d._bob.style.filter=q>.05?'brightness('+(1+.28*q)+')':'';}
  for(const pm of pend){for(const d of pm.old){d._bob.style.transform='';}}
  // stage
  for(const f in MEM){const d=MEM[f];const q=Math.min(1.3,PULSE[FAMS[f].part]);
    d._bob.style.transform='translateY('+(-5*q)+'px) scale('+(1+.14*q)+','+(1-.15*q)+')';d._pool.style.opacity=(q*.9).toFixed(2);
    if(d._bars)d._bars.forEach((b,j)=>{b.style.transform='scaleY('+(.2+.8*Math.min(1,q*(1-j*.18+(j%2)*.12)))+')';});
    d._flash=Math.max(0,d._flash-dt*7);d._fl.style.opacity=Math.min(1,d._flash*.85).toFixed(2);
    const resting=nowS-d._heard>.7;d._dim+=((resting?.62:1)-d._dim)*Math.min(1,dt*8);d._bob.style.opacity=d._dim.toFixed(2);
    const c=nowS<d._mUntil?d._mc:(d._sing?0:5);if(c!==d._c){d._c=c;d._mo.style.backgroundPosition=(c*12.5)+'% 0';}}
  if(genEl)genEl._bob.style.transform='scale('+(1+.06*beatPulse)+','+(1-.05*beatPulse)+')';
  $('#songIc').style.transform='scale('+(1+.05*beatPulse)+')';
  const prog=Math.max(0,(pp-LS)/LL);$('#songRing').setAttribute('stroke-dashoffset',(257.6*(1-prog)).toFixed(1));
  // merges land
  for(let j=pend.length-1;j>=0;j--){if(u>=pend[j].landU){const pm=pend.splice(j,1)[0];land(pm);}}
  // energy
  if(S.energy<100){S.energy=Math.min(100,S.energy+dt/2);}
  const ev=Math.floor(S.energy);if(ev!==tick._e){tick._e=ev;$('#vE').textContent=ev;$('#eBar').style.width=Math.min(100,S.energy)+'%';}
  requestAnimationFrame(tick);
}
document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();else ac.resume();});

/* ---------- start ---------- */
S=load();
for(const f of ORDER_F)if(S.best[f]&&!S.unl.includes(f))S.unl.push(f);
renderAll();
const sl=$('#sLine');[['drumline',4,96],['low_end',5,112],['chorus',6,120],['brass',3,90]].forEach(([f,lv,h],j)=>{const im=document.createElement('img');im.src=img(f,lv);im.style.height=h+'px';im.style.animationDelay=(j*.1)+'s';sl.appendChild(im);});
const go=$('#go');
loadAudio(p=>{go.textContent='Loading '+Math.round(p*100)+'%';}).then(()=>{go.disabled=false;go.textContent='Play';},err=>{console.warn('audio',err);go.disabled=false;go.textContent='Play';});
go.addEventListener('click',()=>{
  if(ac&&ac.state!=='running')ac.resume();
  // the band always builds up one by one: only the first musician plays from the start, a saved band rejoins bar by bar
  const saved=S.band.slice();S.band=saved.slice(0,1);renderStage();
  fakeT0=performance.now();startSong();lastJoinU=0;started=true;for(const f of saved.slice(1))join(f);
  $('#start').classList.add('gone');setTimeout(()=>$('#start').style.display='none',420);
});
requestAnimationFrame(tick);
</script>
