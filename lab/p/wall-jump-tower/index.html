<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#140c1c">
<title>Wall Jump Tower</title>
<style>
@font-face{font-family:Inter;src:url(fonts/inter-variable.woff2) format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#140c1c}
body{display:flex;justify-content:center;font-family:Inter,system-ui,sans-serif}
canvas{display:block;width:100%;max-width:440px;height:100%;background:#140c1c;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#sa{position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="sa"></div>
<script src="sim.js"></script>
<script src="levels.js"></script>
<script src="rig.js"></script>
<script src="draw.js"></script>
<script src="game.js"></script>

</html>
