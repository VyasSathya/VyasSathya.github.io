<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Step Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2BB3A3; --deep:#1F8C80; --deeper:#18756B; --ink:#1E1E2E;
  --go:#5EF08A; --red:#FF5A5F; --yellow:#FFCC3D; --blue:#4F7CFF; --purple:#9B59F5; --dark:#1E1E2E;
  --white:#FFFFFF; --muted:#CFF3EE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none;touch-action:manipulation}
body{font-family:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;font-weight:800;transition:background .8s}
#app{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:max(env(safe-area-inset-top),10px) 16px max(env(safe-area-inset-bottom),12px)}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none;padding:0}

/* top bar */
#top{display:flex;align-items:center;gap:8px;height:44px;flex:none}
.pill{height:38px;border-radius:19px;display:flex;align-items:center;gap:6px;padding:0 14px;font-size:17px;white-space:nowrap;font-weight:900}
#coinPill{background:var(--deep);color:#fff}
#coinPill .coinIco{width:20px;height:20px}
#shieldPill{background:var(--deep);color:#fff;padding:0 11px;font-size:15px}
#rollPill{background:var(--yellow);color:#6A4500;margin-left:auto}
#menuBtn{width:38px;height:38px;border-radius:19px;background:var(--deep);display:flex;align-items:center;justify-content:center;flex:none}
.bump{animation:bump .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

/* board */
#boardWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;margin:6px 0}
#board{position:relative}
.tile{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.05;
  color:var(--ink);background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.17);font-weight:900;transition:transform .15s}
.tile.lit{animation:lit .45s ease-out}
@keyframes lit{0%{filter:brightness(1.35);transform:translateY(3px)}100%{filter:none;transform:none}}
.tile .sub{display:block;font-size:.62em;font-weight:800;opacity:.7;margin-top:2px}
.t-go{background:var(--go)}
.t-steal{background:var(--red);color:#fff}
.t-mystery{background:var(--yellow)}
.t-trap{background:var(--dark);color:#fff}
.t-shield{background:var(--blue);color:#fff}
.t-x2{background:var(--purple);color:#fff}
.t-bank{background:var(--yellow)}

#center{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#landmark{display:block;overflow:visible}
#lmTitle{font-size:1.15em;font-weight:900;margin-top:4px;line-height:1.1}
#lmNext{font-size:.86em;color:var(--muted);font-weight:800;margin-top:2px;line-height:1.15}
#buildBtn{margin-top:6px;height:2.2em;padding:0 1.1em;border-radius:1.1em;background:var(--yellow);color:#5A3B00;font-weight:900;font-size:.95em;
  box-shadow:0 4px 0 #C99A1A;display:none;align-items:center;gap:6px}
#buildBtn.show{display:inline-flex;animation:pulse 1.1s ease-in-out infinite}
#buildBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #C99A1A}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.piece{transform-box:fill-box;transform-origin:50% 100%}
.ghost *{fill:rgba(255,255,255,.07)!important;stroke:rgba(255,255,255,.28)!important;stroke-width:2;stroke-dasharray:4 4}
.ghost.next *{fill:rgba(255,255,255,.16)!important;stroke:rgba(255,255,255,.85)!important;stroke-width:2.5;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-16}}

.token{position:absolute;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.22);z-index:5;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;will-change:transform}
.token.me{border-width:4px;z-index:7;box-shadow:0 3px 0 rgba(0,0,0,.25),0 0 0 3px rgba(30,30,46,.85)}
.token .meface{width:100%;height:100%;display:block}

/* dice */
#diceLayer{position:absolute;display:flex;align-items:center;justify-content:center;gap:10%;pointer-events:none;z-index:9;perspective:600px}
.dieWrap{position:relative}
.cube{position:relative;transform-style:preserve-3d;width:100%;height:100%}
.face{position:absolute;inset:0;background:#fff;border-radius:18%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%;
  box-shadow:inset 0 0 0 2px #e6e6ee, inset 0 -6px 0 #e2e2ea;backface-visibility:hidden}
.pip{width:78%;height:78%;border-radius:50%;background:var(--ink);place-self:center}
.dieShadow{position:absolute;left:10%;right:10%;bottom:-22%;height:16%;border-radius:50%;background:rgba(0,0,0,.22)}
#diceTotal{position:absolute;font-size:2.4em;font-weight:900;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.2);pointer-events:none;z-index:10;opacity:0}

/* feed */
#feed{flex:none;height:52px;border-radius:26px;background:var(--deep);display:flex;align-items:center;gap:10px;padding:0 16px;font-size:15px;overflow:hidden;margin-bottom:10px}
#feedDot{width:18px;height:18px;border-radius:50%;flex:none;border:2px solid #fff;background:var(--yellow)}
#feedText{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2;font-size:14.5px}
#feed.new #feedText{animation:feedIn .35s ease-out}
@keyframes feedIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

/* controls */
#controls{flex:none;display:flex;gap:10px;height:84px}
#rollBtn{flex:1;border-radius:28px;background:var(--red);box-shadow:0 7px 0 #C93C42;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;transition:background .2s, box-shadow .2s}
#rollBtn:active,#rollBtn.press{transform:translateY(5px);box-shadow:0 2px 0 #C93C42}
#rollBtn .big{font-size:32px;font-weight:900;letter-spacing:.5px;line-height:1}
#rollBtn .small{font-size:13px;font-weight:800;opacity:.92;margin-top:4px}
#rollBtn.walkMode{background:var(--go);color:#0C4A2A;box-shadow:0 7px 0 #33B85F}
#rollBtn.walkMode:active{box-shadow:0 2px 0 #33B85F}
#rollBtn.walkMode .big{font-size:24px}
#rollBtn.busy{filter:saturate(.6) brightness(.92)}
#multBadge{position:absolute;top:-10px;right:14px;background:var(--purple);color:#fff;border:3px solid #fff;border-radius:14px;padding:2px 9px;font-size:13px;display:none}
#multBadge.show{display:block;animation:pulse 1s infinite}
#walkBtn{width:92px;border-radius:28px;background:#fff;color:var(--ink);box-shadow:0 7px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#walkBtn:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
#walkBtn .lbl{font-size:13px;font-weight:900;line-height:1}
#walkBtn svg{width:34px;height:34px}
#walkBtn.hide{display:none}
.walking .legA{animation:legA .35s linear infinite;transform-origin:50% 0;transform-box:fill-box}
.walking .legB{animation:legB .35s linear infinite;transform-origin:50% 0;transform-box:fill-box}
.walking .armA{animation:legB .35s linear infinite;transform-origin:50% 0;transform-box:fill-box}
.walking .armB{animation:legA .35s linear infinite;transform-origin:50% 0;transform-box:fill-box}
.walking .walker{animation:bob .175s ease-in-out infinite alternate}
@keyframes legA{0%,100%{transform:rotate(28deg)}50%{transform:rotate(-28deg)}}
@keyframes legB{0%,100%{transform:rotate(-28deg)}50%{transform:rotate(28deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2px)}}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.coin{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3B0 0 18%,#FFD23F 19% 62%,#E0A800 63%);
  box-shadow:0 0 0 2px #C98F00 inset;will-change:transform}
.float{position:absolute;font-weight:900;font-size:22px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25);transform:translate(-50%,-50%);white-space:nowrap}
.spark{position:absolute;width:10px;height:10px;margin:-5px;border-radius:2px;background:#fff}

/* overlays */
.overlay{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
.overlay.show{display:flex;animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#stealOv,#doneOv{background:radial-gradient(circle at 50% 40%,var(--deep),var(--deeper) 70%)}
#stealOv h2{margin:0;font-size:34px;font-weight:900;color:#fff}
#stealOv p{margin:6px 0 26px;font-size:16px;color:#E8E8F2;font-weight:800}
#vaults{display:flex;gap:22px;width:100%;max-width:400px;justify-content:center}
.vault{flex:1;max-width:98px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.vault .box{width:100%;aspect-ratio:1/1.1;position:relative;perspective:900px}
.vault .body{position:absolute;inset:0;border-radius:16px;background:#9AA3B8;box-shadow:0 7px 0 #6B7389;overflow:hidden}
.vault .inside{position:absolute;inset:10%;border-radius:10px;background:#3A3F52;display:flex;align-items:center;justify-content:center}
.vault .door{position:absolute;inset:6%;border-radius:12px;background:linear-gradient(#C9D0DE,#AEB6C8);box-shadow:inset 0 -5px 0 rgba(0,0,0,.12);
  transform-origin:0 50%;transition:transform .55s cubic-bezier(.3,1.4,.5,1);display:flex;align-items:center;justify-content:center}
.vault.open .door{transform:rotateY(-78deg)}
.vault .dial{width:46%;aspect-ratio:1;border-radius:50%;background:#5F667C;border:4px solid #E7EAF2;position:relative;transition:transform .5s}
.vault .dial::before,.vault .dial::after{content:"";position:absolute;left:50%;top:50%;width:70%;height:10%;background:#E7EAF2;border-radius:4px;transform:translate(-50%,-50%)}
.vault .dial::after{transform:translate(-50%,-50%) rotate(90deg)}
.vault.spin .dial{transform:rotate(300deg)}
.vault .name{font-size:17px;font-weight:900;display:flex;align-items:center;gap:6px}
.vault .name i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;display:inline-block}
.vault .amt{font-size:15px;font-weight:900;color:#FFD23F;min-height:20px}
.vault.dim{opacity:.5;filter:saturate(.4)}
.vault.shake .box{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
.goldpile{width:78%;height:70%}


#doneOv h2{font-size:30px;margin:12px 0 6px}
#doneOv p{margin:0 0 22px;font-size:16px;color:#E8E8F2}
.bigBtn{height:58px;padding:0 34px;border-radius:29px;background:var(--red);color:#fff;font-size:20px;font-weight:900;box-shadow:0 6px 0 #C93C42}
.bigBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #C93C42}

#menu{position:absolute;right:16px;top:calc(max(env(safe-area-inset-top),10px) + 48px);background:#fff;color:var(--ink);border-radius:16px;padding:6px;z-index:45;display:none;min-width:190px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#menu.show{display:block;animation:fadeIn .15s}
#menu button{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;font-size:15px;font-weight:800}
#menu button:active{background:#F0F0F5}
#menu .danger{color:#D93A40}

#tip{position:absolute;z-index:30;background:#fff;color:var(--ink);font-size:13px;font-weight:800;padding:8px 12px;border-radius:12px;max-width:200px;pointer-events:none;
  box-shadow:0 6px 18px rgba(0,0,0,.2);opacity:0;transition:opacity .15s;transform:translate(-50%,-100%)}
#tip.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="pill" id="coinPill"><svg class="coinIco" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#FFD23F" stroke="#C98F00" stroke-width="2"/><circle cx="10" cy="10" r="4.5" fill="none" stroke="#C98F00" stroke-width="1.6"/></svg><span id="coinNum">0</span></div>
    <div class="pill" id="shieldPill"><svg width="16" height="18" viewBox="0 0 16 18"><path d="M8 1 L15 4 V9 C15 13 12 16 8 17 C4 16 1 13 1 9 V4 Z" fill="#4F7CFF" stroke="#fff" stroke-width="1.6"/></svg><span id="shieldNum">0/3</span></div>
    <div class="pill" id="rollPill">Rolls <span id="rollNum">0</span></div>
    <button id="menuBtn" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 18 18"><circle cx="3" cy="9" r="2" fill="#fff"/><circle cx="9" cy="9" r="2" fill="#fff"/><circle cx="15" cy="9" r="2" fill="#fff"/></svg></button>
  </div>
  <div id="menu">
    <button id="soundBtn">Sound: on</button>
    <button id="resetBtn" class="danger">Reset progress</button>
  </div>

  <div id="boardWrap">
    <div id="board">
      <div id="center">
        <svg id="landmark" viewBox="0 0 200 150"></svg>
        <div id="lmTitle">Gym level 0 of 5</div>
        <div id="lmNext">Build next: 3,000 coins</div>
        <button id="buildBtn">Build <span id="buildCost">3,000</span></button>
      </div>
      <div id="diceLayer"></div>
      <div id="diceTotal"></div>
      <div id="tip"></div>
    </div>
  </div>

  <div id="feed"><span id="feedDot"></span><span id="feedText"></span></div>

  <div id="controls">
    <button id="rollBtn"><span id="multBadge">Next roll x2</span><span class="big" id="rollBig">ROLL</span><span class="small" id="rollSmall">1,000 steps = 1 roll. 0 steps today</span></button>
    <button id="walkBtn" aria-label="Walk 1,000 steps"></button>
  </div>
</div>

<div id="stealOv" class="overlay">
  <h2>Steal</h2>
  <p>Pick a friend's vault to raid</p>
  <div id="vaults"></div>
</div>

<div id="doneOv" class="overlay">
  <svg id="doneArt" width="180" height="140" viewBox="0 0 200 150"></svg>
  <h2 id="doneTitle">Gym complete</h2>
  <p id="doneSub">Board 2 is open</p>
  <button class="bigBtn" id="nextBoardBtn">Go to board 2</button>
</div>

<div id="fx"></div>

<script>
(function(){
"use strict";
var Q = new URLSearchParams(location.search);
var DEMO = Q.get("demo") === "1";

/* ---------- data ---------- */
var THEMES = [
  {name:"Gym",     bg:"#2BB3A3", deep:"#1F8C80", deeper:"#18756B", muted:"#CFF3EE"},
  {name:"Stadium", bg:"#5B5BD6", deep:"#4444B3", deeper:"#38389A", muted:"#DCDCFF"},
  {name:"Lighthouse", bg:"#F07B4F", deep:"#C95C34", deeper:"#A94A27", muted:"#FFE3D6"}
];
var FRIENDS = [
  {id:"jay", name:"Jay", color:"#FF8FC0"},
  {id:"mia", name:"Mia", color:"#9B59F5"},
  {id:"sam", name:"Sam", color:"#FF9A3D"}
];
// 16 tiles clockwise from top-left
var LAYOUTS = [
  ["go","c500","steal","mystery","c1000","trap","shield","c500","f:jay","x2","c800","mystery","f:mia","c500","steal","bank"],
  ["go","c800","mystery","f:sam","c1000","shield","steal","c500","trap","x2","c800","f:jay","mystery","c500","steal","bank"],
  ["go","c500","steal","shield","c1000","mystery","f:mia","c800","trap","x2","c500","f:sam","mystery","c1000","steal","bank"]
];
var BASE_COSTS = [3000,5000,8000,11000,15000];
var TIPS = {
  go:"GO: pass it for coins, land on it for double",
  coin:"Coins: land here to collect",
  steal:"Steal: raid a friend's vault",
  mystery:"Mystery box: coins, rolls or a shield",
  trap:"Trap: lose coins unless you have a shield",
  shield:"Shield: blocks one trap or raid (max 3)",
  x2:"Roll x2: your next roll pays double",
  bank:"Bank: collect a big coin payout",
  friend:"Friend's square: pay them, or take coins if your shield is up"
};

function themeFor(b){ return THEMES[(b-1) % THEMES.length]; }
function layoutFor(b){ return LAYOUTS[(b-1) % LAYOUTS.length]; }
function scale(b){ return 1 + 0.5*(b-1); }
function costFor(b,lvl){ return Math.round(BASE_COSTS[lvl]*(1+0.6*(b-1))/500)*500; }
function fmt(n){ return Math.round(n).toLocaleString("en-US"); }
function short(n){ return n>=1000 ? (n%1000===0 ? (n/1000)+"k" : (n/1000).toFixed(1).replace(/\.0$/,"")+"k") : String(n); }
function rnd(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function friend(id){ for (var i=0;i<FRIENDS.length;i++) if (FRIENDS[i].id===id) return FRIENDS[i]; }

/* ---------- state ---------- */
var KEY = "stepparty.v1";
function fresh(){
  return {coins:500, rolls:0, steps:0, pos:0, board:1, level:0, shields:0, mult:1, rollCount:0,
    friendPos:{jay:8, mia:12, sam:3}, feed:"Tap the walker for 1,000 steps. Each 1,000 steps is 1 roll.", feedWho:null, sound:true};
}
var S = fresh();
try { var raw = localStorage.getItem(KEY); if (raw && !DEMO) { var o = JSON.parse(raw); for (var k in o) S[k]=o[k]; } } catch(e) {}
function save(){ if (DEMO) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

/* ---------- audio ---------- */
var AC = null, master = null;
function audio(){
  if (!S.sound) return null;
  try {
    if (!AC) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); master = AC.createGain(); master.gain.value = .55; master.connect(AC.destination); }
    if (AC.state === "suspended") AC.resume();
  } catch(e) { return null; }
  return AC;
}
function tone(f, d, type, vol, f2, delay){
  var a = audio(); if (!a) return;
  var t = a.currentTime + (delay||0);
  var o = a.createOscillator(), g = a.createGain();
  o.type = type||"sine"; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t+d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol||.3, t+.008); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.02);
}
function noise(d, vol, freq, delay, q){
  var a = audio(); if (!a) return;
  var t = a.currentTime + (delay||0);
  var len = Math.max(1, Math.floor(a.sampleRate*d)), buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (var i=0;i<len;i++) ch[i] = (Math.random()*2-1) * (1 - i/len);
  var s = a.createBufferSource(); s.buffer = buf;
  var fl = a.createBiquadFilter(); fl.type = "bandpass"; fl.frequency.value = freq||1500; fl.Q.value = q||1.2;
  var g = a.createGain(); g.gain.value = vol||.3;
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t);
}
var SFX = {
  tap:function(){ tone(520,.07,"triangle",.25,780); },
  step:function(i){ noise(.05,.35,500+((i||0)%2)*180,0,2); tone(180,.06,"sine",.15,120); },
  roll:function(){ for (var i=0;i<9;i++) noise(.04,.4,2200+Math.random()*1500,i*.075,3); },
  land:function(){ tone(140,.18,"sine",.45,70); noise(.06,.3,900); },
  tick:function(i){ tone(600+i*45,.07,"square",.12,900+i*45); tone(1200+i*90,.04,"sine",.08); },
  coin:function(n){ n=n||1; for (var i=0;i<n;i++){ tone(1318,.09,"square",.08,null,i*.06); tone(1976,.14,"square",.07,null,i*.06+.05);} },
  ka:function(){ tone(880,.08,"triangle",.2,null,0); tone(1175,.08,"triangle",.2,null,.07); tone(1760,.18,"triangle",.22,null,.14); },
  shield:function(){ tone(300,.45,"sine",.25,1200); tone(600,.45,"triangle",.1,2400,.05); },
  snap:function(){ noise(.12,.8,700,0,1); tone(90,.25,"sawtooth",.3,40); },
  lose:function(){ tone(500,.18,"triangle",.25,250); tone(380,.25,"triangle",.25,180,.15); },
  box:function(){ for (var i=0;i<5;i++) tone(523*Math.pow(1.26,i),.12,"triangle",.18,null,i*.06); },
  drum:function(){ for (var i=0;i<10;i++) noise(.05,.3,250,i*.05,1); },
  build:function(){ var n=[523,659,784,1047,1319]; for (var i=0;i<n.length;i++) tone(n[i],.3,"triangle",.2,null,i*.08); noise(.2,.3,300,0,.8); },
  fanfare:function(){ var n=[523,659,784,1047,784,1047,1319]; for (var i=0;i<n.length;i++) tone(n[i],.28,"square",.09,null,i*.12); },
  roll1:function(){ tone(700,.08,"triangle",.2,1100); tone(1400,.12,"triangle",.15,null,.08); },
  err:function(){ tone(160,.15,"square",.12,120); }
};
function buzz(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch(e) {} }

/* ---------- dom ---------- */
function $(id){ return document.getElementById(id); }
var board = $("board"), center = $("center"), diceLayer = $("diceLayer"), fx = $("fx");
var tiles = [], tokens = {}, side = 0, cell = 0, gap = 0, vgap = 0;

function applyTheme(){
  var t = themeFor(S.board), r = document.documentElement.style;
  r.setProperty("--bg", t.bg); r.setProperty("--deep", t.deep); r.setProperty("--deeper", t.deeper); r.setProperty("--muted", t.muted);
  document.body.style.background = t.bg;
}
function tileInfo(kind){
  var sc = scale(S.board);
  if (kind==="go") return {cls:"t-go", label:"GO", tip:"go"};
  if (kind.charAt(0)==="c") { var v = parseInt(kind.slice(1),10)*sc; return {cls:"", label:"+"+short(v), val:v, tip:"coin"}; }
  if (kind==="steal") return {cls:"t-steal", label:"Steal", tip:"steal"};
  if (kind==="mystery") return {cls:"t-mystery", label:"?", tip:"mystery"};
  if (kind==="trap") return {cls:"t-trap", label:"Trap", tip:"trap"};
  if (kind==="shield") return {cls:"t-shield", label:"Shield", tip:"shield"};
  if (kind==="x2") return {cls:"t-x2", label:"Roll x2", tip:"x2"};
  if (kind==="bank") return {cls:"t-bank", label:"Bank", tip:"bank"};
  if (kind.indexOf("f:")===0) return {cls:"", label:friend(kind.slice(2)).name, tip:"friend"};
}
function rc(i){
  if (i<=4) return [0,i];
  if (i<=7) return [i-4,4];
  if (i<=12) return [4,12-i];
  return [16-i,0];
}
function buildBoard(){
  tiles.forEach(function(t){ t.remove(); }); tiles = [];
  var lay = layoutFor(S.board);
  for (var i=0;i<16;i++){
    var info = tileInfo(lay[i]);
    var d = document.createElement("div");
    d.className = "tile " + info.cls; d.dataset.i = i;
    d.textContent = info.label;
    if (info.label.length>6) d.style.fontSize = ".88em";
    (function(i,info){ d.addEventListener("pointerdown", function(){ showTip(i, TIPS[info.tip]); }); })(i,info);
    board.appendChild(d); tiles.push(d);
  }
  // tokens
  for (var k in tokens) tokens[k].remove(); tokens = {};
  FRIENDS.forEach(function(f){
    var t = document.createElement("div"); t.className = "token"; t.style.background = f.color; t.textContent = f.name.charAt(0);
    board.appendChild(t); tokens[f.id] = t;
  });
  var me = document.createElement("div"); me.className = "token me"; me.style.background = "#FFD23F";
  me.innerHTML = '<svg class="meface" viewBox="0 0 20 20"><circle cx="7" cy="9" r="1.6" fill="#1E1E2E"/><circle cx="13" cy="9" r="1.6" fill="#1E1E2E"/><path d="M6.5 12.5 Q10 15.5 13.5 12.5" stroke="#1E1E2E" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>';
  board.appendChild(me); tokens.me = me;
  layout();
}
function layout(){
  var wrap = $("boardWrap");
  var w = wrap.clientWidth, h = wrap.clientHeight;
  side = Math.floor(Math.min(w, (h - 8)/1.04));
  gap = side*0.035; cell = (side - 4*gap)/5;
  var bh = Math.floor(Math.min(h - 8, side*1.42));
  vgap = Math.max(gap, (bh - 5*cell)/4);
  board.style.width = side+"px"; board.style.height = bh+"px";
  board.style.fontSize = Math.max(12, side*0.043) + "px";
  tiles.forEach(function(t,i){
    var p = rc(i);
    t.style.left = (p[1]*(cell+gap))+"px"; t.style.top = (p[0]*(cell+vgap))+"px";
    t.style.width = cell+"px"; t.style.height = cell+"px"; t.style.borderRadius = (cell*0.2)+"px";
  });
  var inner = cell+gap, innerW = 3*cell+2*gap, innerT = cell+vgap, innerH = 3*cell+2*vgap;
  center.style.left = inner+"px"; center.style.top = (innerT+vgap*0.15)+"px"; center.style.width = innerW+"px"; center.style.height = (innerH-vgap*0.3)+"px";
  center.style.fontSize = Math.max(12, side*0.044)+"px";
  var lw = Math.min(innerW*0.9, (innerH - side*0.3)*1.33);
  $("landmark").style.width = lw+"px"; $("landmark").style.height = (lw*0.75)+"px";
  diceLayer.style.left = inner+"px"; diceLayer.style.top = innerT+"px"; diceLayer.style.width = innerW+"px"; diceLayer.style.height = innerH+"px";
  var dt = $("diceTotal"); dt.style.left = inner+"px"; dt.style.width = innerW+"px"; dt.style.top = (innerT+innerH*0.68)+"px"; dt.style.textAlign = "center";
  dt.style.fontSize = (side*0.1)+"px";
  var ts = cell*0.4;
  for (var k in tokens){ tokens[k].style.width = ts+"px"; tokens[k].style.height = ts+"px"; tokens[k].style.fontSize = (ts*0.48)+"px"; }
  var ms = cell*0.46; tokens.me.style.width = ms+"px"; tokens.me.style.height = ms+"px";
  placeAll();
}
function tokenXY(id, i){
  var p = rc(i);
  var x = p[1]*(cell+gap) + cell/2, y = p[0]*(cell+vgap) + cell*0.04;
  // spread tokens sharing a tile
  var here = [];
  ["jay","mia","sam","me"].forEach(function(k){ var pos = k==="me" ? S.pos : S.friendPos[k]; if (pos===i) here.push(k); });
  if (here.indexOf(id)<0) here.push(id);
  var n = here.length, idx = here.indexOf(id);
  if (n>1) x += (idx-(n-1)/2) * cell*0.3;
  return [x,y];
}
function setTok(id, x, y){
  var t = tokens[id], s = t.offsetWidth;
  t.style.left = (x - s/2)+"px"; t.style.top = (y - s/2)+"px";
}
function placeAll(){
  FRIENDS.forEach(function(f){ var p = tokenXY(f.id, S.friendPos[f.id]); setTok(f.id, p[0], p[1]); });
  var p = tokenXY("me", S.pos); setTok("me", p[0], p[1]);
}

function renderLandmark(animIdx){
  var th = themeFor(S.board);
  $("landmark").innerHTML = lmSVG(S.board, S.level);
  if (S.level >= 5) { $("lmTitle").textContent = th.name+" complete"; $("lmNext").textContent = "Board "+(S.board+1)+" is open"; }
  else {
    $("lmTitle").textContent = th.name+" level "+S.level+" of 5";
    $("lmNext").textContent = "Build next: "+fmt(costFor(S.board,S.level))+" coins";
  }
  updateBuildBtn();
  if (animIdx != null){
    var pc = document.getElementById("pc"+animIdx);
    if (pc) pc.animate([{transform:"translateY(-60px) scale(.4)",opacity:0},{transform:"translateY(6px) scale(1.12)",opacity:1,offset:.6},{transform:"translateY(-3px) scale(.96)",offset:.8},{transform:"none",opacity:1}],{duration:650,easing:"ease-out"});
  }
}
function updateBuildBtn(){
  var b = $("buildBtn");
  if (S.level < 5){
    var c = costFor(S.board,S.level);
    $("buildCost").textContent = fmt(c);
    b.classList.toggle("show", S.coins >= c);
    $("lmNext").style.display = S.coins >= c ? "none" : "";
  } else b.classList.remove("show");
}

/* ---------- hud ---------- */
var shownCoins = S.coins, coinAnim = null;
function hud(){
  $("rollNum").textContent = S.rolls;
  $("shieldNum").textContent = S.shields+"/3";
  var walk = S.rolls <= 0;
  var rb = $("rollBtn");
  rb.classList.toggle("walkMode", walk);
  $("walkBtn").classList.toggle("hide", walk);
  if (walk){
    $("rollBig").innerHTML = walkerSVG(30,"#0C4A2A") + ' WALK';
    $("rollSmall").textContent = "Out of rolls. Tap for 1,000 steps. "+fmt(S.steps)+" steps today";
  } else {
    $("rollBig").textContent = "ROLL";
    $("rollSmall").textContent = "1,000 steps = 1 roll. "+fmt(S.steps)+" steps today";
  }
  $("multBadge").classList.toggle("show", S.mult > 1);
  updateBuildBtn();
}
function setCoins(target){
  if (coinAnim) cancelAnimationFrame(coinAnim);
  var from = shownCoins, t0 = performance.now(), dur = 600;
  function step(now){
    var k = Math.min(1,(now-t0)/dur); k = 1-Math.pow(1-k,3);
    shownCoins = from + (target-from)*k; $("coinNum").textContent = fmt(shownCoins);
    if (k<1) coinAnim = requestAnimationFrame(step); else { shownCoins = target; coinAnim = null; }
  }
  coinAnim = requestAnimationFrame(step);
  bump($("coinPill"));
}
function bump(el){ el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
function feed(text, who){
  S.feed = text; S.feedWho = who||null;
  $("feedText").textContent = text;
  $("feedDot").style.background = who ? friend(who).color : "#FFD23F";
  var f = $("feed"); f.classList.remove("new"); void f.offsetWidth; f.classList.add("new");
}
function walkerSVG(sz, col){
  col = col || "#1E1E2E";
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 34 34" style="vertical-align:-3px"><g class="walker"><circle cx="17" cy="6" r="4" fill="'+col+'"/>'+
    '<rect class="armA" x="15.5" y="11" width="3" height="10" rx="1.5" fill="'+col+'"/><rect class="armB" x="15.5" y="11" width="3" height="10" rx="1.5" fill="'+col+'" opacity=".6"/>'+
    '<rect x="14" y="10" width="6" height="12" rx="3" fill="'+col+'"/>'+
    '<rect class="legA" x="15" y="20" width="3.4" height="12" rx="1.7" fill="'+col+'"/><rect class="legB" x="15.6" y="20" width="3.4" height="12" rx="1.7" fill="'+col+'" opacity=".6"/></g></svg>';
}
var tipTimer = null;
function showTip(i, text){
  if (busy) return;
  var tip = $("tip"), p = rc(i);
  tip.textContent = text;
  var x = p[1]*(cell+gap)+cell/2; x = Math.max(100, Math.min(side-100, x));
  tip.style.left = x+"px"; tip.style.top = (p[0]*(cell+vgap) - 6 + (p[0]===0 ? cell+tip.offsetHeight+16 : 0))+"px";
  tip.classList.add("show"); clearTimeout(tipTimer); tipTimer = setTimeout(function(){ tip.classList.remove("show"); }, 1800);
  SFX.tap();
}

/* ---------- fx helpers ---------- */
function rectOf(el){ var r = el.getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height/2, w:r.width, h:r.height}; }
function tileCenter(i){ return rectOf(tiles[i]); }
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function floatText(x, y, text, color, size){
  var d = document.createElement("div"); d.className = "float"; d.textContent = text; d.style.left = x+"px"; d.style.top = y+"px";
  if (color) d.style.color = color; if (size) d.style.fontSize = size+"px";
  fx.appendChild(d);
  d.animate([{transform:"translate(-50%,-30%) scale(.6)",opacity:0},{transform:"translate(-50%,-90%) scale(1.15)",opacity:1,offset:.25},{transform:"translate(-50%,-180%) scale(1)",opacity:0}],{duration:1300,easing:"ease-out"}).onfinish = function(){ d.remove(); };
}
function sparks(x, y, n, colors){
  for (var i=0;i<n;i++){
    var s = document.createElement("div"); s.className = "spark"; s.style.left = x+"px"; s.style.top = y+"px";
    s.style.background = colors[i%colors.length]; fx.appendChild(s);
    var a = Math.random()*Math.PI*2, r = 40+Math.random()*70;
    s.animate([{transform:"translate(0,0) rotate(0) scale(1)",opacity:1},{transform:"translate("+Math.cos(a)*r+"px,"+Math.sin(a)*r+"px) rotate("+rnd(90,400)+"deg) scale(.4)",opacity:0}],{duration:600+Math.random()*300,easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish = (function(s){ return function(){ s.remove(); }; })(s);
  }
}
// coins fly from (fx,fy) to (tx,ty); returns promise resolved when first arrives
function coinFly(from, to, n, opts){
  opts = opts || {};
  return new Promise(function(res){
    var arrived = 0, firstDone = false;
    for (var i=0;i<n;i++){
      (function(i){
        var c = document.createElement("div"); c.className = "coin"; c.style.left = from.x+"px"; c.style.top = from.y+"px"; fx.appendChild(c);
        var a = Math.random()*Math.PI*2, r = (opts.spread||50)*(.4+Math.random()*.8);
        var bx = Math.cos(a)*r, by = Math.sin(a)*r - (opts.up||30);
        var dx = to.x-from.x, dy = to.y-from.y;
        var anim = c.animate([
          {transform:"translate(0,0) scale(.3)",offset:0},
          {transform:"translate("+bx+"px,"+by+"px) scale(1.1)",offset:.32},
          {transform:"translate("+(bx*.6+dx*.3)+"px,"+(by*.6+dy*.3-30)+"px) scale(1)",offset:.55},
          {transform:"translate("+dx+"px,"+dy+"px) scale(.7)",offset:1}
        ],{duration:750+i*28,delay:i*22,easing:"cubic-bezier(.4,0,.6,1)",fill:"forwards"});
        anim.onfinish = function(){ c.remove(); arrived++; if (!opts.silent && arrived%3===1) tone(1500+Math.random()*500,.05,"square",.05);
          if (!firstDone){ firstDone = true; res(); } };
      })(i);
    }
  });
}
function gain(amount, fromPt, label){
  amount = Math.round(amount);
  S.coins += amount;
  floatText(fromPt.x, fromPt.y - 10, label || ("+"+fmt(amount)), "#FFF3B0", 26);
  SFX.coin(3); buzz(25);
  var pill = rectOf($("coinPill"));
  pill.x -= pill.w/2 - 20;
  return coinFly(fromPt, pill, Math.min(26, 8+Math.round(amount/250))).then(function(){ setCoins(S.coins); hud(); });
}
function loseCoins(amount, toPt, label){
  amount = Math.min(S.coins, Math.round(amount));
  S.coins -= amount; setCoins(S.coins);
  var pill = rectOf($("coinPill")); pill.x -= pill.w/2 - 20;
  floatText(pill.x+30, pill.y+30, "-"+fmt(amount), "#FF8A8E", 22);
  SFX.lose(); buzz([40,40,40]);
  hud();
  return coinFly(pill, toPt, Math.min(16, 5+Math.round(amount/250)), {spread:30, up:-10, silent:true});
}

/* ---------- dice ---------- */
var FACE_ROT = {1:[0,0],6:[0,180],3:[0,-90],4:[0,90],2:[-90,0],5:[90,0]};
var PIPS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
var FACE_T = {1:"rotateY(0deg)",6:"rotateY(180deg)",3:"rotateY(90deg)",4:"rotateY(-90deg)",2:"rotateX(90deg)",5:"rotateX(-90deg)"};
var dice = [];
function makeDice(){
  diceLayer.innerHTML = ""; dice = [];
  var s = cell*0.78;
  for (var d=0; d<2; d++){
    var w = document.createElement("div"); w.className = "dieWrap"; w.style.width = s+"px"; w.style.height = s+"px";
    var sh = document.createElement("div"); sh.className = "dieShadow"; w.appendChild(sh);
    var c = document.createElement("div"); c.className = "cube";
    for (var f=1; f<=6; f++){
      var fa = document.createElement("div"); fa.className = "face";
      fa.style.transform = FACE_T[f]+" translateZ("+(s/2)+"px)";
      for (var p=0;p<9;p++){ var cellEl = document.createElement("div"); if (PIPS[f].indexOf(p)>=0) cellEl.className = "pip"; if (f===1 && PIPS[f].indexOf(p)>=0) { cellEl.style.background = "#FF5A5F"; cellEl.style.width = "100%"; cellEl.style.height = "100%"; } fa.appendChild(cellEl); }
      c.appendChild(fa);
    }
    w.appendChild(c); diceLayer.appendChild(w); dice.push({w:w,c:c,sh:sh});
  }
  diceLayer.style.display = "none";
}
function rollDice(a, b){
  makeDice();
  diceLayer.style.display = "flex";
  center.animate([{opacity:1},{opacity:.15}],{duration:200,fill:"forwards"});
  SFX.roll(); buzz([15,30,15,30,15]);
  var vals = [a,b];
  var ps = dice.map(function(d, i){
    var v = vals[i], fr = FACE_ROT[v];
    var sx = (i?-1:1)*(720+rnd(0,2)*360), sy = (i?1:-1)*(720+rnd(0,2)*360);
    var tilt = rnd(-12,12);
    var k1 = "rotateX("+rnd(0,90)+"deg) rotateY("+rnd(0,90)+"deg) rotateZ(0deg)";
    var k2 = "rotateX("+(fr[0]+sx)+"deg) rotateY("+(fr[1]+sy)+"deg) rotateZ("+tilt+"deg)";
    var fin = "rotateX("+fr[0]+"deg) rotateY("+fr[1]+"deg) rotateZ("+tilt+"deg)";
    d.c.animate([{transform:k1},{transform:k2}],{duration:1000+i*120,easing:"cubic-bezier(.15,.6,.25,1)",fill:"forwards"});
    var dir = i ? 1 : -1;
    d.w.animate([
      {transform:"translate("+(dir*-60)+"px,40px) scale(.5)"},
      {transform:"translate("+(dir*-20)+"px,-70px) scale(1.05)",offset:.3},
      {transform:"translate(0,0) scale(1)",offset:.62},
      {transform:"translate(0,-18px) scale(1)",offset:.78},
      {transform:"translate(0,0) scale(1)"}
    ],{duration:1000+i*120,easing:"ease-out",fill:"forwards"});
    d.sh.animate([{opacity:.2,transform:"scale(.5)"},{opacity:.05,transform:"scale(.4)",offset:.3},{opacity:.3,transform:"scale(1)",offset:.62},{opacity:.2,transform:"scale(.8)",offset:.78},{opacity:.3,transform:"scale(1)"}],{duration:1000+i*120,fill:"forwards"});
    return wait(1000+i*120).then(function(){ d.c.style.transform = fin; });
  });
  setTimeout(function(){ tone(220,.08,"sine",.3); noise(.04,.4,1800,0,2); }, 620);
  setTimeout(function(){ tone(200,.08,"sine",.3); noise(.04,.4,1600,0,2); }, 740);
  return Promise.all(ps).then(function(){
    SFX.land(); buzz(35);
    var dt = $("diceTotal"); dt.textContent = (a+b);
    dt.animate([{opacity:0,transform:"scale(.4)"},{opacity:1,transform:"scale(1.2)",offset:.5},{opacity:1,transform:"scale(1)"}],{duration:350,fill:"forwards"});
    return wait(450);
  });
}
function hideDice(){
  var dt = $("diceTotal");
  diceLayer.animate([{opacity:1},{opacity:0}],{duration:250,fill:"forwards"}).onfinish = function(){ diceLayer.style.display="none"; diceLayer.getAnimations().forEach(function(a){a.cancel();}); };
  dt.animate([{opacity:1},{opacity:0}],{duration:250,fill:"forwards"});
  center.animate([{opacity:.15},{opacity:1}],{duration:300,fill:"forwards"});
}

/* ---------- movement ---------- */
function hop(id, from, steps, dur, sound){
  return new Promise(function(res){
    var i = 0, cur = from;
    function next(){
      if (i >= steps){ res(cur); return; }
      var nxt = (cur+1)%16;
      var a = tokenXY(id, cur), b;
      if (id==="me") S.pos = nxt; else S.friendPos[id] = nxt;
      b = tokenXY(id, nxt);
      var t = tokens[id], s = t.offsetWidth;
      t.style.left = (b[0]-s/2)+"px"; t.style.top = (b[1]-s/2)+"px";
      var dx = a[0]-b[0], dy = a[1]-b[1], hgt = cell*0.55;
      t.animate([
        {transform:"translate("+dx+"px,"+dy+"px) scale(1,1)"},
        {transform:"translate("+dx*.5+"px,"+(dy*.5-hgt)+"px) scale(.95,1.08)",offset:.5},
        {transform:"translate(0,0) scale(1.18,.82)",offset:.85},
        {transform:"translate(0,0) scale(1,1)"}
      ],{duration:dur,easing:"ease-in-out"});
      if (sound) { SFX.tick(i); buzz(8); }
      if (id==="me") setTimeout(function(){ var tl = tiles[nxt]; tl.classList.remove("lit"); void tl.offsetWidth; tl.classList.add("lit"); }, dur*.8);
      cur = nxt; i++;
      if (id==="me" && nxt===0 && i<steps) { var pg = tileCenter(0); setTimeout(function(){ gain(1000*scale(S.board), pg, "+"+fmt(1000*scale(S.board))+" passed GO"); }, dur*.8); }
      setTimeout(next, dur);
    }
    next();
  }).then(function(r){ placeAll(); return r; });
}

/* ---------- tile effects ---------- */
function tokenCenter(){ return rectOf(tokens.me); }
function shieldBubble(pop){
  var p = tokenCenter(), d = document.createElement("div");
  var s = cell*1.25;
  d.style.cssText = "position:absolute;left:"+(p.x-s/2)+"px;top:"+(p.y-s/2)+"px;width:"+s+"px;height:"+s+"px;border-radius:50%;border:4px solid #A9C1FF;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7),rgba(79,124,255,.35) 45%,rgba(79,124,255,.15))";
  fx.appendChild(d);
  var kf = pop ? [{transform:"scale(.2)",opacity:0},{transform:"scale(1.1)",opacity:1,offset:.35},{transform:"scale(1)",opacity:1,offset:.6},{transform:"scale(1.6)",opacity:0}]
               : [{transform:"scale(.2)",opacity:0},{transform:"scale(1.15)",opacity:1,offset:.35},{transform:"scale(1)",opacity:1,offset:.8},{transform:"scale(.9)",opacity:0}];
  d.animate(kf,{duration:1100,easing:"ease-out"}).onfinish = function(){ d.remove(); };
  SFX.shield(); buzz(30);
  if (pop) sparks(p.x,p.y,14,["#A9C1FF","#fff","#4F7CFF"]);
}
function trapSnap(){
  var p = tokenCenter(), s = cell*1.3;
  var d = document.createElement("div");
  d.style.cssText = "position:absolute;left:"+(p.x-s/2)+"px;top:"+(p.y-s/2+cell*0.2)+"px;width:"+s+"px;height:"+s+"px";
  var teeth = ""; for (var i=0;i<6;i++){ var x = 8+i*14; teeth += '<path d="M'+x+' 50 L'+(x+7)+' 36 L'+(x+14)+' 50 Z" fill="#E8E8F0"/>'; }
  var teethB = ""; for (var j=0;j<6;j++){ var x2 = 8+j*14; teethB += '<path d="M'+x2+' 50 L'+(x2+7)+' 64 L'+(x2+14)+' 50 Z" fill="#E8E8F0"/>'; }
  d.innerHTML = '<svg viewBox="0 0 100 100" width="100%" height="100%" style="overflow:visible"><ellipse cx="50" cy="86" rx="40" ry="8" fill="rgba(0,0,0,.25)"/>'+
    '<g class="jt" style="transform-origin:50px 50px"><path d="M4 50 A46 40 0 0 1 96 50 Z" fill="#5F667C" stroke="#1E1E2E" stroke-width="4"/>'+teeth+'</g>'+
    '<g class="jb" style="transform-origin:50px 50px"><path d="M4 50 A46 40 0 0 0 96 50 Z" fill="#5F667C" stroke="#1E1E2E" stroke-width="4"/>'+teethB+'</g></svg>';
  fx.appendChild(d);
  var jt = d.querySelector(".jt"), jb = d.querySelector(".jb");
  jt.animate([{transform:"translateY(-26px) rotate(-14deg)"},{transform:"translateY(-26px) rotate(-14deg)",offset:.4},{transform:"translateY(0) rotate(0)",offset:.55},{transform:"translateY(0)"}],{duration:700,fill:"forwards"});
  jb.animate([{transform:"translateY(26px) rotate(14deg)"},{transform:"translateY(26px) rotate(14deg)",offset:.4},{transform:"translateY(0) rotate(0)",offset:.55},{transform:"translateY(0)"}],{duration:700,fill:"forwards"});
  setTimeout(function(){ SFX.snap(); buzz([60,30,60]); document.getElementById("app").animate([{transform:"translate(0,0)"},{transform:"translate(-6px,3px)"},{transform:"translate(5px,-3px)"},{transform:"translate(-3px,2px)"},{transform:"none"}],{duration:300}); }, 300);
  return wait(1000).then(function(){ d.animate([{opacity:1},{opacity:0}],{duration:250}).onfinish=function(){ d.remove(); }; });
}
function mysteryBox(){
  var c = rectOf(center), s = Math.min(150, cell*1.9);
  var d = document.createElement("div");
  d.style.cssText = "position:absolute;left:"+(c.x-s/2)+"px;top:"+(c.y-s/2)+"px;width:"+s+"px;height:"+s+"px";
  d.innerHTML = '<svg viewBox="0 0 100 100" width="100%" height="100%" style="overflow:visible">'+
    '<ellipse cx="50" cy="94" rx="36" ry="6" fill="rgba(0,0,0,.2)"/>'+
    '<g class="bx"><rect x="16" y="44" width="68" height="48" rx="6" fill="#FFCC3D"/><rect x="44" y="44" width="12" height="48" fill="#FF5A5F"/></g>'+
    '<g class="lid"><rect x="10" y="30" width="80" height="18" rx="5" fill="#FFB800"/><rect x="44" y="30" width="12" height="18" fill="#E94A50"/>'+
    '<path d="M50 30 C36 14 26 22 34 30 Z M50 30 C64 14 74 22 66 30 Z" fill="#FF5A5F"/></g>'+
    '<text x="50" y="76" text-anchor="middle" font-size="22" font-weight="900" fill="#5A3B00" font-family="Nunito,sans-serif">?</text></svg>';
  fx.appendChild(d);
  center.animate([{opacity:1},{opacity:.12}],{duration:200,fill:"forwards"});
  d.animate([{transform:"scale(0)"},{transform:"scale(1.15)",offset:.6},{transform:"scale(1)"}],{duration:350,easing:"ease-out"});
  var bx = d.querySelector("svg");
  return wait(350).then(function(){
    bx.animate([{transform:"rotate(0)"},{transform:"rotate(-8deg)"},{transform:"rotate(8deg)"},{transform:"rotate(-6deg)"},{transform:"rotate(6deg)"},{transform:"rotate(0)"}],{duration:600});
    for (var i=0;i<4;i++) tone(300+i*40,.06,"square",.08,null,i*.13);
    return wait(620);
  }).then(function(){
    var lid = d.querySelector(".lid"); lid.style.transformBox = "fill-box"; lid.style.transformOrigin = "50% 100%";
    lid.animate([{transform:"translate(0,0) rotate(0)"},{transform:"translate(26px,-70px) rotate(40deg)",opacity:0}],{duration:500,easing:"cubic-bezier(.2,.8,.4,1)",fill:"forwards"});
    d.querySelector("text").style.display = "none";
    SFX.box(); buzz(30);
    sparks(c.x, c.y-10, 18, ["#FFD23F","#fff","#FF5A5F","#9B59F5"]);
    return {el:d, c:c};
  });
}

/* ---------- steal ---------- */
function stealScreen(mult){
  return new Promise(function(res){
    var ov = $("stealOv"), vs = $("vaults"); vs.innerHTML = ""; document.querySelector("#stealOv p").textContent = (mult>1 ? "Roll x2 is on. " : "")+"Tap a friend's vault to raid it";
    var sc = scale(S.board);
    var amounts = FRIENDS.map(function(){ return Math.round(rnd(14,24)*100*sc); });
    SFX.drum();
    FRIENDS.forEach(function(f, i){
      var v = document.createElement("div"); v.className = "vault";
      v.innerHTML = '<div class="box"><div class="body"><div class="inside"><svg class="goldpile" viewBox="0 0 60 50"><g fill="#FFD23F" stroke="#C98F00" stroke-width="2"><ellipse cx="18" cy="40" rx="13" ry="5"/><ellipse cx="18" cy="35" rx="13" ry="5"/><ellipse cx="18" cy="30" rx="13" ry="5"/><ellipse cx="42" cy="40" rx="13" ry="5"/><ellipse cx="42" cy="35" rx="13" ry="5"/><ellipse cx="42" cy="30" rx="13" ry="5"/><ellipse cx="42" cy="25" rx="13" ry="5"/><ellipse cx="30" cy="20" rx="13" ry="5"/><ellipse cx="30" cy="15" rx="13" ry="5"/></g></svg></div></div><div class="door"><div class="dial"></div></div></div>'+
        '<div class="name"><i style="background:'+f.color+'"></i>'+f.name+'</div><div class="amt"></div>';
      v.animate([{transform:"translateY(60px) scale(.6)",opacity:0},{transform:"none",opacity:1}],{duration:420,delay:i*90,easing:"cubic-bezier(.3,1.5,.5,1)",fill:"backwards"});
      vs.appendChild(v);
      var done = false;
      v.addEventListener("click", function(){
        if (ov.dataset.picked) return; ov.dataset.picked = "1"; done = true;
        SFX.tap(); buzz(20);
        v.classList.add("shake","spin");
        for (var k=0;k<5;k++) tone(700+k*90,.05,"square",.08,null,k*.07);
        setTimeout(function(){
          v.classList.add("open"); SFX.box(); buzz([30,20,60]);
          var amt = Math.round(amounts[i]*mult);
          v.querySelector(".amt").textContent = "+"+fmt(amt);
          var box = rectOf(v.querySelector(".box"));
          sparks(box.x, box.y, 16, ["#FFD23F","#fff","#FFF3B0"]);
          // others reveal
          Array.prototype.forEach.call(vs.children, function(o, j){ if (j!==i){ setTimeout(function(){ o.classList.add("open","dim"); o.querySelector(".amt").textContent = fmt(Math.round(amounts[j]*mult)); }, 500); } });
          setTimeout(function(){
            S.coins += amt;
            var sp = document.querySelector("#stealOv p"); sp.textContent = "You took "+fmt(amt)+" from "+f.name; sp.animate([{transform:"scale(.6)"},{transform:"scale(1.15)"},{transform:"none"}],{duration:400});
            SFX.coin(6); buzz(40);
            var pill = rectOf($("coinPill")); pill.x -= pill.w/2 - 20;
            coinFly(box, pill, 30, {spread:70, up:40}).then(function(){ setCoins(S.coins); hud(); });
            setTimeout(function(){
              ov.animate([{opacity:1},{opacity:0}],{duration:250}).onfinish = function(){ ov.classList.remove("show"); delete ov.dataset.picked; res({who:f, amt:amt}); };
            }, 1500);
          }, 650);
        }, 420);
      });
    });
    ov.classList.add("show");
    if (DEMO) setTimeout(function(){ if (!ov.dataset.picked) vs.children[1].click(); }, 1500);
  });
}

/* ---------- friends ---------- */
function friendsTurn(){
  var ps = FRIENDS.map(function(f, i){
    return wait(i*160).then(function(){ return hop(f.id, S.friendPos[f.id], rnd(2,9), 120, false); });
  });
  return Promise.all(ps).then(function(){
    // raid chance
    if (S.rollCount < 4 || S.coins < 600) return;
    if (Math.random() > 0.3) return;
    var f = pick(FRIENDS);
    if (S.shields > 0){
      S.shields--; hud(); shieldBubble(true);
      feed("Shield blocked "+f.name+"'s raid", f.id);
      return wait(900);
    }
    var amt = Math.min(Math.round(S.coins*0.2/100)*100, Math.round(1500*scale(S.board)/100)*100);
    if (amt < 100) return;
    feed(f.name+" stole "+fmt(amt)+" from you", f.id);
    var t = rectOf(tokens[f.id]);
    tokens[f.id].animate([{transform:"scale(1)"},{transform:"scale(1.5)"},{transform:"scale(1)"}],{duration:500});
    return loseCoins(amt, t).then(function(){ return wait(500); });
  });
}

/* ---------- main actions ---------- */
var busy = false;
function walk(){
  audio();
  var start = S.steps, end = S.steps + 1000;
  S.steps = end; S.rolls += 1; save();
  var wb = $("walkBtn"), rb = $("rollBtn");
  wb.classList.add("walking"); rb.classList.add("walking");
  var t0 = performance.now(), dur = 700, ticks = 0;
  function step(now){
    var k = Math.min(1,(now-t0)/dur);
    var cur = Math.round(start + (end-start)*(1-Math.pow(1-k,2)));
    var txt = S.rolls - 1 <= 0 && k < 1 ? "Walking... "+fmt(cur)+" steps today" : "1,000 steps = 1 roll. "+fmt(cur)+" steps today";
    $("rollSmall").textContent = txt;
    var tk = Math.floor(k*8); while (ticks < tk){ SFX.step(ticks); ticks++; }
    if (k<1) requestAnimationFrame(step);
    else {
      wb.classList.remove("walking"); rb.classList.remove("walking");
      SFX.roll1(); buzz(20);
      var rp = rectOf($("rollPill")); floatText(rp.x, rp.y+30, "+1 roll", "#FFE58A", 20);
      bump($("rollPill"));
      hud();
      if (S.rollCount===0 && S.steps===1000) feed("Tap ROLL to move around the board");
    }
  }
  requestAnimationFrame(step);
  buzz(10);
}
var forced = null; var SCRIPT = [[1,3],[2,3],[4,1]]; // first rolls: +1k, Roll x2, Steal
function roll(){
  if (busy) return;
  if (S.rolls <= 0){ walk(); return; }
  audio(); busy = true; $("rollBtn").classList.add("busy");
  $("tip").classList.remove("show");
  S.rolls--; S.rollCount++; hud();
  var d = forced ? forced : (S.rollCount <= SCRIPT.length && S.board===1 ? SCRIPT[S.rollCount-1] : [rnd(1,6), rnd(1,6)]); forced = null;
  var mult = S.mult; S.mult = 1;
  $("multBadge").classList.remove("show");
  rollDice(d[0], d[1]).then(function(){
    hideDice();
    return hop("me", S.pos, d[0]+d[1], 230, true);
  }).then(function(){
    return resolve(S.pos, mult);
  }).then(function(){
    return friendsTurn();
  }).then(function(){
    save(); hud();
  }).catch(function(e){ console.error(e); }).then(function(){
    busy = false; $("rollBtn").classList.remove("busy"); hud();
    if (DEMO && demoNext) demoNext();
  });
}
function resolve(i, mult){
  var kind = layoutFor(S.board)[i], info = tileInfo(kind), sc = scale(S.board), p = tileCenter(i);
  var mx = mult > 1 ? " (x2)" : "";
  if (kind==="go"){ var g = 2000*sc*mult; feed("Landed on GO: +"+fmt(g)+mx); return gain(g, p); }
  if (kind.charAt(0)==="c"){ var v = info.val*mult; feed("+"+fmt(v)+" coins"+mx); return gain(v, p); }
  if (kind==="bank"){ var bv = 2500*sc*mult; feed("Bank paid you "+fmt(bv)+mx); return gain(bv, p); }
  if (kind==="x2"){
    S.mult = 2; hud(); SFX.ka(); buzz([20,30,20]);
    floatText(p.x, p.y-20, "Next roll x2", "#E9D8FF", 24);
    sparks(p.x, p.y, 16, ["#9B59F5","#fff","#E9D8FF"]);
    feed("Roll x2: your next roll pays double");
    return wait(700);
  }
  if (kind==="shield"){
    if (S.shields < 3){ S.shields++; hud(); bump($("shieldPill")); feed("Shield up. It blocks one trap or raid"); }
    else { feed("Shields full (3 of 3). +"+fmt(500*sc)+" coins instead"); }
    shieldBubble(false);
    if (S.shields >= 3 && false) return;
    return wait(900);
  }
  if (kind==="trap"){
    if (S.shields > 0){ S.shields--; hud(); shieldBubble(true); feed("Your shield blocked the trap"); return wait(1000); }
    var loss = Math.round(800*sc);
    feed("Trap: you lost "+fmt(Math.min(loss,S.coins))+" coins");
    return trapSnap().then(function(){ return loseCoins(loss, p); });
  }
  if (kind==="mystery"){
    var r = Math.random(), prize;
    if (r < 0.5) prize = "coins"; else if (r < 0.78) prize = "rolls"; else prize = "shield";
    if (prize==="shield" && S.shields>=3) prize = "coins";
    return mysteryBox().then(function(m){
      var c = m.c, el = m.el;
      var pop = document.createElement("div"); pop.className = "float"; pop.style.left = c.x+"px"; pop.style.top = (c.y-40)+"px"; pop.style.fontSize = "26px";
      var out;
      if (prize==="coins"){ var amt = Math.round(rnd(12,20)*100*sc*mult); pop.textContent = "+"+fmt(amt)+" coins"; feed("Mystery box: +"+fmt(amt)+" coins"+mx); out = function(){ return gain(amt, c, " "); }; }
      else if (prize==="rolls"){ pop.textContent = "+2 rolls"; feed("Mystery box: +2 rolls"); out = function(){ S.rolls += 2; bump($("rollPill")); SFX.roll1(); hud(); return wait(300); }; }
      else { pop.textContent = "Shield"; feed("Mystery box: a shield"); out = function(){ S.shields++; hud(); bump($("shieldPill")); shieldBubble(false); return wait(300); }; }
      pop.style.color = "#fff"; fx.appendChild(pop);
      pop.animate([{transform:"translate(-50%,0) scale(.3)",opacity:0},{transform:"translate(-50%,-60%) scale(1.15)",opacity:1,offset:.5},{transform:"translate(-50%,-50%) scale(1)",opacity:1}],{duration:450,fill:"forwards"});
      return wait(600).then(out).then(function(){ return wait(500); }).then(function(){
        el.animate([{opacity:1},{opacity:0}],{duration:300}).onfinish = function(){ el.remove(); };
        pop.animate([{opacity:1},{opacity:0}],{duration:300}).onfinish = function(){ pop.remove(); };
        center.animate([{opacity:.12},{opacity:1}],{duration:300,fill:"forwards"});
      });
    });
  }
  if (kind==="steal"){
    feed("Steal! Pick a vault");
    return wait(350).then(function(){ return stealScreen(mult); }).then(function(r){ feed("You raided "+r.who.name+"'s vault for "+fmt(r.amt), r.who.id); return wait(600); });
  }
  if (kind.indexOf("f:")===0){
    var f = friend(kind.slice(2));
    if (S.shields > 0){
      var take = Math.round(1500*sc*mult); S.shields--; hud(); shieldBubble(true);
      feed("Your shield was up: took "+fmt(take)+" from "+f.name, f.id);
      return wait(500).then(function(){ return gain(take, rectOf(tokens[f.id] && S.friendPos[f.id]===i ? tokens[f.id] : tiles[i])); });
    }
    var pay = Math.round(500*sc);
    feed("You paid "+f.name+" "+fmt(Math.min(pay,S.coins))+". A shield would have let you take coins", f.id);
    return loseCoins(pay, p);
  }
  return wait(200);
}
function build(){
  if (busy || S.level >= 5) return;
  var c = costFor(S.board, S.level);
  if (S.coins < c){ SFX.err(); return; }
  audio(); busy = true;
  S.coins -= c; setCoins(S.coins);
  var pill = rectOf($("coinPill")); pill.x -= pill.w/2 - 20;
  var lm = rectOf($("landmark"));
  SFX.coin(4); buzz(20);
  $("buildBtn").classList.remove("show");
  coinFly(pill, lm, 22, {spread:30, up:10, silent:true}).then(function(){ return wait(250); }).then(function(){
    var idx = S.level; S.level++;
    renderLandmark(idx);
    SFX.build(); buzz([40,30,80]);
    sparks(lm.x, lm.y, 26, ["#FFD23F","#fff","#FF5A5F","#5EF08A"]);
    floatText(lm.x, lm.y - lm.h/2, "Level "+S.level+"!", "#fff", 30);
    $("landmark").animate([{transform:"scale(1)"},{transform:"scale(1.1)"},{transform:"scale(1)"}],{duration:500,delay:300,easing:"cubic-bezier(.3,1.6,.5,1)"});
    save();
    if (S.level < 5) feed(themeFor(S.board).name+" level "+S.level+" built. Next build: "+fmt(costFor(S.board,S.level))+" coins");
    return wait(900);
  }).then(function(){
    busy = false; hud();
    if (S.level >= 5) boardDone();
    if (DEMO && demoNext) demoNext();
  });
}
function boardDone(){
  var th = themeFor(S.board);
  $("doneArt").innerHTML = lmSVG(S.board, 5);
  $("doneTitle").textContent = th.name+" complete";
  $("doneSub").textContent = "Board "+(S.board+1)+" is open: new board, new landmark, bigger payouts";
  $("nextBoardBtn").textContent = "Go to board "+(S.board+1);
  $("doneOv").classList.add("show");
  SFX.fanfare(); buzz([60,40,60,40,120]);
  var r = rectOf($("doneArt"));
  for (var k=0;k<4;k++) setTimeout(function(){ sparks(r.x + rnd(-80,80), r.y + rnd(-40,40), 20, ["#FFD23F","#fff","#FF5A5F","#5EF08A","#9B59F5"]); }, k*250);
  if (DEMO) setTimeout(function(){ $("nextBoardBtn").click(); }, 1800);
}
function nextBoard(){
  SFX.tap();
  $("doneOv").classList.remove("show");
  S.board++; S.level = 0; S.pos = 0; S.mult = 1;
  S.friendPos = {jay:rnd(3,7), mia:rnd(8,12), sam:rnd(13,15)};
  applyTheme(); buildBoard(); renderLandmark(); hud();
  board.animate([{transform:"scale(.85) rotate(-4deg)",opacity:0},{transform:"scale(1.03)",opacity:1,offset:.7},{transform:"none",opacity:1}],{duration:600,easing:"ease-out"});
  feed("Board "+S.board+": build the "+themeFor(S.board).name+". First build "+fmt(costFor(S.board,0))+" coins");
  SFX.build(); save();
}

/* ---------- wiring ---------- */
$("walkBtn").innerHTML = walkerSVG(34) + '<span class="lbl">+1,000</span><span class="lbl" style="font-size:11px;opacity:.6">steps</span>';
function onTap(el, fn){ el.addEventListener("click", function(e){ e.preventDefault(); fn(e); }); }
onTap($("rollBtn"), function(){ if (S.rolls<=0){ if (!busy) walk(); } else roll(); });
onTap($("walkBtn"), function(){ walk(); });
onTap($("buildBtn"), build);
onTap($("nextBoardBtn"), nextBoard);
onTap($("menuBtn"), function(){ SFX.tap(); $("menu").classList.toggle("show"); });
var resetArm = false;
onTap($("resetBtn"), function(){
  if (!resetArm){ resetArm = true; $("resetBtn").textContent = "Tap again to reset"; return; }
  try { localStorage.removeItem(KEY); } catch(e) {}
  var snd = S.sound; S = fresh(); S.sound = snd; shownCoins = S.coins; $("coinNum").textContent = fmt(S.coins);
  resetArm = false; $("resetBtn").textContent = "Reset progress"; $("menu").classList.remove("show");
  applyTheme(); buildBoard(); renderLandmark(); feed(S.feed); hud(); save();
});
onTap($("soundBtn"), function(){ S.sound = !S.sound; $("soundBtn").textContent = "Sound: "+(S.sound?"on":"off"); save(); });
document.addEventListener("pointerdown", function(e){ if (!$("menu").contains(e.target) && e.target !== $("menuBtn") && !$("menuBtn").contains(e.target)) { $("menu").classList.remove("show"); resetArm=false; $("resetBtn").textContent="Reset progress"; } });
window.addEventListener("resize", function(){ layout(); });

applyTheme(); buildBoard(); renderLandmark();
$("coinNum").textContent = fmt(S.coins);
$("soundBtn").textContent = "Sound: "+(S.sound?"on":"off");
feed(S.feed, S.feedWho); hud();
if (window.ResizeObserver) new ResizeObserver(function(){ layout(); }).observe($("boardWrap"));

/* ---------- demo / test hooks ---------- */
var demoNext = null;
window.__game = {S:function(){return S;}, force:function(a,b){ forced=[a,b]; }, walk:walk, roll:roll, build:build, isBusy:function(){return busy;},
  set:function(o){ for (var k in o) S[k]=o[k]; shownCoins=S.coins; $("coinNum").textContent=fmt(S.coins); applyTheme(); buildBoard(); renderLandmark(); hud(); }};
if (DEMO){
  var stage = 0;
  demoNext = function(){
    stage++;
    setTimeout(function(){
      if (S.level < 5 && S.coins >= costFor(S.board,S.level)) { build(); return; }
      if (S.rolls <= 0) { walk(); setTimeout(function(){ roll(); }, 900); return; }
      roll();
    }, 900);
  };
  setTimeout(function(){ walk(); setTimeout(walk, 300); setTimeout(walk, 600); setTimeout(function(){ roll(); }, 1400); }, 800);
}
})();
</script>
