<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Seed Brawl Lanes</title>
<link rel="stylesheet" href="lanes.css">
<script type="importmap">{"imports":{"three":"./game/vendor/three.module.js","three/addons/":"./game/vendor/addons/"}}</script>
</head><body>
<div id="stage">
<canvas id="gl"></canvas>
<div id="boot"><div class="t">Seed Brawl</div><div class="bar"><i id="bootBar"></i></div></div>
<div id="labels"></div>
<div id="hud" hidden>
 <div id="top"><span id="sb" class="pill blue">0</span><span id="clock">5:00</span><span id="sr" class="pill red">0</span></div>
 <div id="stickL" class="stick" role="img" aria-label="Move"><i></i></div>
 <div id="btnAtk" class="btn atk" role="button" aria-label="Attack"><i></i><b id="ammo"></b></div>
 <div id="btnSup" class="btn sup" role="button" aria-label="Super"><i></i><svg viewBox="0 0 36 36"><circle id="supArc" cx="18" cy="18" r="16"/></svg><span id="supName"></span></div>
 <div id="dock">
  <div id="seeds"></div>
  <div id="row">
   <canvas id="lanes" width="192" height="112" role="button" aria-label="Lanes"></canvas>
   <div id="hand"></div>
   <div id="next" aria-label="Next card"><img alt=""><em></em><span>Next</span></div>
  </div>
 </div>
 <div id="pauseBtn" role="button" aria-label="Pause"><i></i><i></i></div>
 <div id="coach" hidden></div>
 <div id="toast"></div><div id="hurt"></div><div id="hitdir"><i></i></div>
</div>
<div id="endStamp" hidden></div>
<div id="pause" hidden><div class="dim"></div><div class="pp">
 <div id="pResume" class="pb gold" role="button">Resume</div>
 <div class="prow"><span>Music</span><div id="pMusic" class="psw" role="switch"><i></i></div></div>
 <div class="prow"><span>Sound</span><div id="pSound" class="psw" role="switch"><i></i></div></div>
 <div id="pLeave" class="pb ink" role="button"><span>Leave</span></div>
</div></div>
<div id="pick"></div>
<div id="over" hidden><h1 id="overT"></h1><button id="again">Play again</button><button id="swap">Change hero</button></div>
</div>
<script>
// loading: the bar follows the files as they arrive (pictures, models, sounds) and the steps main.js reports
(function () { var n = 0, step = 0, bar = document.getElementById('bootBar'), done = false;
  function draw() { if (done) return; var p = Math.max(step, 1 - Math.exp(-n / 70)) * 0.96; bar.style.width = (4 + p * 96) + '%'; }
  try { new PerformanceObserver(function (l) { n += l.getEntries().length; draw(); }).observe({ type: 'resource', buffered: true }); } catch (e) { }
  window.SBL_BOOT = { step: function (k) { step = Math.max(step, k); draw(); },
    done: function () { if (done) return; bar.style.width = '100%'; done = true; var b = document.getElementById('boot'); setTimeout(function () { b.classList.add('out'); setTimeout(function () { b.remove(); }, 400); }, 120); } };
  draw(); })();
</script>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="sound.js"></script>
<!-- MENU (shell branch): the app screens around the match; progress in meta.js, screens in menu.js -->
<link rel="stylesheet" href="menu.css"><script src="meta.js"></script>
<!-- /MENU -->
<script type="module" src="main.js"></script>
</body></html>
