<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Blob Choir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--sky1:#BDE7FF;--sky2:#E9F7FF;--deck:#FFD9A8;--trim:#FF8A5B;--ink:#2B2340;--panel:#FFF4DE;--soft:#7A6F86}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#2A3558;--sky2:#3B4A73;--deck:#C89A6E;--trim:#D9663C;--ink:#FFF1DA;--panel:#2B2340;--soft:#C9BFD6}}
:root[data-theme="dark"]{--sky1:#2A3558;--sky2:#3B4A73;--deck:#C89A6E;--trim:#D9663C;--ink:#FFF1DA;--panel:#2B2340;--soft:#C9BFD6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky1);font-family:Fredoka,system-ui,sans-serif;color:var(--ink);
  touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;background:linear-gradient(var(--sky2),var(--sky1) 58%,var(--deck) 58%,var(--deck) 100%)}
#stage::after{content:"";position:absolute;left:0;right:0;top:58%;height:10px;background:var(--trim);opacity:.9}
#row{z-index:1;position:absolute;left:0;right:0;bottom:6%;top:6%;display:grid;grid-template-columns:repeat(4,1fr)}
.col{position:relative;cursor:grab}
.col:active{cursor:grabbing}
.blob{position:absolute;left:50%;bottom:8%;width:min(23vw,270px);transform-origin:50% 100%;will-change:transform;pointer-events:none}
.blob img{width:100%;display:block;filter:drop-shadow(0 10px 8px rgba(43,35,64,.18))}
.blob img.m{position:absolute;inset:0;opacity:0}
.blob img.m.on{opacity:1}
.col.muted .blob{filter:saturate(.25) brightness(1.05);opacity:.55}
.name{position:absolute;left:0;right:0;bottom:1%;text-align:center;font-size:clamp(11px,1.6vw,15px);font-weight:500;color:var(--ink);opacity:.75}
.shadow{position:absolute;left:50%;bottom:6.5%;width:min(16vw,170px);height:14px;margin-left:calc(min(16vw,170px)/-2);border-radius:50%;background:rgba(43,35,64,.16)}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,35,64,.18);z-index:5}
#start button{font:600 22px Fredoka,sans-serif;color:var(--ink);background:var(--panel);border:0;border-radius:999px;padding:16px 34px;
  box-shadow:0 6px 0 rgba(43,35,64,.18);cursor:pointer}
#start button[disabled]{opacity:.6}
#bar{position:fixed;right:12px;top:12px;display:flex;gap:8px;z-index:4}
#bar button{font:500 14px Fredoka,sans-serif;color:var(--ink);background:var(--panel);border:0;border-radius:999px;padding:8px 14px;
  box-shadow:0 3px 0 rgba(43,35,64,.15);cursor:pointer}
#bar button.on{background:var(--trim);color:#fff}
</style>
</head>
<body>
<div id="stage"><div id="row"></div></div>
<div id="bar"><button id="beat">Band</button></div>
<div id="start"><button id="go" disabled>Loading</button></div>
<script>
/* Blob Choir: drag one singer, the others harmonise (Blob Opera's idea with Music Battler's cast and voice packs).
   Vyas 2026-11-22: "one fun part of the game is acutally controlling ones pitch at a time and the rest repsonding".
   Voices: Music Battler's ElevenLabs character packs (one sample per semitone, music-lab/sounds/el_*.js). Key D major. */
const PACKS = {};
window.__LAB = (name, notes) => { PACKS[name] = notes; };
const SINGERS = [
  {id:'tine_toad',      name:'Tine Toad',      lo:38, hi:57, vowels:[['el_bass_dum','oh'],['el_bass_bom','oh']], gain:1.0},
  {id:'skip_chorister', name:'Skip Chorister', lo:52, hi:69, vowels:[['el_multi_doo','oh'],['el_multi_la','ah']], gain:0.8},
  {id:'mire_gatherer',  name:'Mire Gatherer',  lo:57, hi:76, vowels:[['el_back_ooh','oh'],['el_back_wah','ah']], gain:0.75},
  {id:'tiny_peep',      name:'Tiny Peep',      lo:62, hi:84, vowels:[['el_lead_lo','oh'],['el_lead_la','ah']], gain:0.8},
];
const packNames = [...new Set(SINGERS.flatMap(s => s.vowels.map(v => v[0])))].concat(['el_drumline_kit']);
{ const l = document.createElement('script'); l.src = 'loops.js'; l.async = false; document.head.appendChild(l); }
packNames.forEach(n => { const s = document.createElement('script'); s.src = 'sounds/' + n + '.js'; s.async = false; document.head.appendChild(s); });

/* ---------- music: D major, chords that contain the lead note ---------- */
const TONIC = 62; const SCALE = [0,2,4,5,7,9,11];
const pc = m => ((m - TONIC) % 12 + 12) % 12;
const degOf = m => SCALE.indexOf(pc(m));
const scaleNotes = (lo, hi) => { const a = []; for (let m = lo; m <= hi; m++) if (degOf(m) >= 0) a.push(m); return a; };
const CHORDS = [[0,0],[3,.4],[4,.4],[5,.8],[1,1.2],[2,1.8]];          // [root degree, cost]: I IV V vi ii iii
const triad = r => [r, (r+2)%7, (r+4)%7].map(d => SCALE[d]);
let prevRoot = 0;
function harmonise(lead, leadNote) {
  const d = degOf(leadNote); let best = null;
  for (const [r, cost] of CHORDS) {
    const tones = triad(r); if (!tones.includes(SCALE[d])) continue;
    const plan = {}; let motion = 0; const used = new Set([pc(leadNote)]); let below = -1;
    for (const s of SINGERS) {
      if (s === lead) { below = leadNote; continue; }
      const cands = [];
      for (let m = s.lo; m <= s.hi; m++) if (tones.includes(pc(m))) cands.push(m);
      if (!cands.length) continue;
      const prev = s.note ?? (s.lo + s.hi) / 2;
      const isBass = s === SINGERS[0];
      cands.sort((a, b) => score(a) - score(b));
      function score(m) {
        let c = Math.abs(m - prev) * 0.25;
        if (isBass && pc(m) !== SCALE[r]) c += pc(m) === SCALE[(r+4)%7] ? 2.5 : 6;        // bass on the root, or the fifth
        if (!isBass && used.has(pc(m))) c += 3;                                            // fill the missing chord tones
        if (Math.abs(m - leadNote) < 2) c += 4;                                            // no rub against the lead
        const li = SINGERS.indexOf(lead), si = SINGERS.indexOf(s);                         // keep the voices in order:
        if ((si < li && m > leadNote) || (si > li && m < leadNote)) c += 5;                // lower singers below the lead
        if (m <= below) c += 4;                                                            // and never under the singer below
        return c;
      }
      plan[s.id] = cands[0]; used.add(pc(cands[0])); motion += Math.abs(cands[0] - prev); below = cands[0];
    }
    const total = cost + motion * 0.12 + (r === prevRoot ? -0.5 : 0);
    if (!best || total < best.total) best = {total, plan, r};
  }
  if (best) prevRoot = best.r;
  return best ? best.plan : {};
}

/* ---------- audio ---------- */
let ctx, master, wet, buffers = {}, ready = false;
function b64(s) { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; }
async function loadAll() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3; comp.connect(ctx.destination);
  master = ctx.createGain(); master.gain.value = 0.9; master.connect(comp);
  const conv = ctx.createConvolver(); const len = ctx.sampleRate * 2.6, ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); let lp = 0;
    for (let i = 0; i < len; i++) { lp = lp * 0.55 + (Math.random()*2-1) * 0.45; d[i] = lp * Math.pow(1 - i/len, 2.6); } }   // a soft, darker tail
  conv.buffer = ir; wet = ctx.createGain(); wet.gain.value = 0.38; wet.connect(conv); conv.connect(master);   // a bigger room (Blob Opera runs ~60% wet)
  const jobs = [];
  for (const n of packNames) { buffers[n] = {}; for (const [k, v] of Object.entries(PACKS[n] || {}))
    jobs.push(ctx.decodeAudioData(b64(v)).then(b => { buffers[n][+k] = b; }).catch(() => {})); }
  await Promise.all(jobs); ready = true;
}
function nearestBuf(pack, m) {
  const b = buffers[pack]; if (b[m]) return [b[m], 0];
  let best = null; for (const k in b) if (best === null || Math.abs(k - m) < Math.abs(best - m)) best = +k;
  return [b[best], m - best];
}
/* One voice per blob, the way Blob Opera's voices behave (docs/research/blob-singing/how-blob-opera-sounds.md):
   - pitch changes GLIDE (0.2 s) instead of restarting the sample; the consonant is heard only when a phrase starts
   - every note gets a live vibrato (5.4-6.1 Hz, random rate and depth, delayed onset) plus a slow random drift,
     so a held note never repeats the same way twice (our WORLD packs are flat in pitch)
   - held notes loop between the game's own loop points (BattlerData/sounds.json via loops.js)
   - vowel changes crossfade between the character's vowel packs */
function loopOf(pack, key, buf) {
  const L = window.LOOPS && LOOPS[pack] && LOOPS[pack].loops[key];
  let a = L ? L[0] : buf.duration * 0.3, b = L ? L[1] : buf.duration * 0.85;
  if (!(b > a + 0.12) || b > buf.duration) { a = buf.duration * 0.3; b = buf.duration * 0.85; }
  return [a, b];
}
function packGain(pack) { const r = window.LOOPS && LOOPS[pack] && LOOPS[pack].rms; return r ? Math.min(1.6, 0.17 / r) : 1; }
class Voice {
  constructor(s, pan) {
    this.s = s; this.out = ctx.createGain(); this.out.gain.value = s.gain;
    const p = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    if (p) { p.pan.value = pan; this.out.connect(p); p.connect(master); p.connect(wet); } else { this.out.connect(master); this.out.connect(wet); }
    this.cur = null;
  }
  make(m, vowel, fromMid) {
    const pack = this.s.vowels[vowel][0], [buf, off] = nearestBuf(pack, m); if (!buf) return null;
    const key = m - off, [ls, le] = loopOf(pack, key, buf), t = ctx.currentTime;
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true; src.loopStart = ls; src.loopEnd = le;
    const g = ctx.createGain(), pg = ctx.createGain(); pg.gain.value = packGain(pack);
    src.connect(g); g.connect(pg); pg.connect(this.out);
    // vibrato: an LFO in cents on detune, fading in after the onset, its rate and depth new every note
    const lfo = ctx.createOscillator(), depth = ctx.createGain(); lfo.frequency.value = 5.4 + Math.random() * 0.7;
    const cents = 22 + Math.random() * 18; depth.gain.setValueAtTime(0, t); depth.gain.setValueAtTime(0, t + 0.22);
    depth.gain.linearRampToValueAtTime(cents, t + 0.6); lfo.connect(depth); depth.connect(src.detune);
    const drift = ctx.createOscillator(), dg = ctx.createGain(); drift.frequency.value = 0.25 + Math.random() * 0.35; dg.gain.value = 6;
    drift.connect(dg); dg.connect(src.detune); lfo.start(t); drift.start(t);
    src.start(t, fromMid ? ls + Math.random() * 0.05 : 0);
    return {src, g, lfo, drift, key, m, vowel, base: Math.pow(2, off / 12)};
  }
  rate(v, m) { return Math.pow(2, (m - v.key) / 12); }
  /* first note of a phrase: attack with the consonant */
  start(m, vowel) {
    const v = this.make(m, vowel, false); if (!v) return; const t = ctx.currentTime;
    v.src.playbackRate.value = this.rate(v, m);
    v.g.gain.setValueAtTime(0, t); v.g.gain.linearRampToValueAtTime(1, t + 0.02);
    this.stop(0.04); this.cur = v;
  }
  /* a new pitch or vowel while singing: glide 0.2 s, no new consonant */
  glide(m, vowel) {
    const old = this.cur; if (!old) return this.start(m, vowel);
    const t = ctx.currentTime, G = 0.2;
    const v = this.make(m, vowel, true); if (!v) return;
    // both the old and the new sample slide together, then the old one fades out under the new one
    v.src.playbackRate.setValueAtTime(this.rate(v, old.m), t); v.src.playbackRate.linearRampToValueAtTime(this.rate(v, m), t + G);
    old.src.playbackRate.cancelScheduledValues(t); old.src.playbackRate.setValueAtTime(old.src.playbackRate.value, t);
    old.src.playbackRate.linearRampToValueAtTime(this.rate(old, m), t + G);
    v.g.gain.setValueAtTime(0, t); v.g.gain.linearRampToValueAtTime(1, t + 0.12);
    this.fade(old, 0.16); this.cur = v;
  }
  fade(v, rel) {
    const t = ctx.currentTime; v.g.gain.cancelScheduledValues(t); v.g.gain.setValueAtTime(v.g.gain.value, t);
    v.g.gain.linearRampToValueAtTime(0, t + rel); v.src.stop(t + rel + 0.03); v.lfo.stop(t + rel + 0.03); v.drift.stop(t + rel + 0.03);
  }
  stop(rel = 0.22) { if (this.cur) { this.fade(this.cur, rel); this.cur = null; } }
}

/* ---------- band: a soft drum loop (the drumline family's beatbox kit) ---------- */
let bandOn = false, bandTimer = null, step = 0;
function hit(m, gain) { const b = buffers.el_drumline_kit && buffers.el_drumline_kit[m]; if (!b) return;
  const s = ctx.createBufferSource(); s.buffer = b; const g = ctx.createGain(); g.gain.value = gain; s.connect(g); g.connect(master); s.start(); }
function band(on) {
  bandOn = on; document.getElementById('beat').classList.toggle('on', on); clearInterval(bandTimer);
  if (!on) return; const keys = Object.keys(buffers.el_drumline_kit || {}).map(Number).sort((a,b)=>a-b);
  const K = keys[0], S = keys[Math.min(2, keys.length-1)], H = keys[keys.length-1]; step = 0;
  bandTimer = setInterval(() => { const s = step++ % 8;
    if (s === 0 || s === 5) hit(K, .9); if (s === 2 || s === 6) hit(S, .7); if (s % 2 === 1) hit(H, .25); }, 60000 / 116 / 2);
}
document.getElementById('beat').onclick = () => ready && band(!bandOn);

/* ---------- the singers on stage ---------- */
const row = document.getElementById('row');
SINGERS.forEach((s, i) => {
  const col = document.createElement('div'); col.className = 'col'; col.dataset.i = i;
  col.innerHTML = `<div class="shadow"></div><div class="blob"><img src="img/${s.id}-smile.png" alt="">` +
    ['ah','oh','ee','cheer'].map(m => `<img class="m" data-m="${m}" src="img/${s.id}-${m}.png" alt="">`).join('') +
    `</div><div class="name">${s.name}</div>`;
  row.appendChild(col); s.col = col; s.el = col.querySelector('.blob'); s.on = true; s.note = null; s.vowel = 1; s.lift = 0; s.sq = 1;
});
function mouth(s, m) { s.el.querySelectorAll('img.m').forEach(im => im.classList.toggle('on', im.dataset.m === m)); }

let lead = null, timers = [];
/* the lead sounds at once; the others answer a moment later (they listen), and at the start of a phrase they come in
   one after another, 0.2 s apart, the nearest voice first. Followers sing the lead's vowel, as in Blob Opera. */
function singOne(s, n, v) {
  if (n === s.note && v === s.curVowel) return;
  if (s.note === null) s.voice.start(n, v); else s.voice.glide(n, v);
  s.note = n; s.curVowel = v; s.pulse = 1; mouth(s, s.vowels[v][1]);
}
function singAll(leadS, note, vowel) {
  const phraseStart = SINGERS.every(s => s.note === null);
  const plan = harmonise(leadS, note);
  singOne(leadS, note, vowel);
  const li = SINGERS.indexOf(leadS);
  SINGERS.filter(s => s !== leadS).sort((a, b) => Math.abs(SINGERS.indexOf(a) - li) - Math.abs(SINGERS.indexOf(b) - li))
    .forEach((s, k) => {
      const n = plan[s.id], wait = phraseStart ? 200 * (k + 1) : 70 + Math.random() * 40;
      timers.push(setTimeout(() => {
        if (!lead) return;
        if (!s.on || n === undefined) { if (s.voice.cur) { s.voice.stop(); s.note = null; mouth(s, null); } return; }
        singOne(s, n, Math.min(vowel, s.vowels.length - 1));
      }, wait));
    });
}
function stopAll() { timers.forEach(clearTimeout); timers = []; for (const s of SINGERS) { s.voice.stop(0.3); s.note = null; mouth(s, null); } prevRoot = 0; }

let drag = null;
row.addEventListener('pointerdown', e => {
  const col = e.target.closest('.col'); if (!col || !ready) return;
  col.setPointerCapture(e.pointerId);
  const s = SINGERS[+col.dataset.i];
  drag = {s, x: e.clientX, y: e.clientY, t: performance.now(), moved: false, col};
  if (!s.on) { s.on = true; col.classList.remove('muted'); }
  lead = s; move(e);
});
row.addEventListener('pointermove', e => { if (drag) move(e); });
function move(e) {
  const {s, col} = drag; const r = col.getBoundingClientRect();
  if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 8) drag.moved = true;
  if (drag.px !== undefined) s.dragVX = (s.dragVX || 0) * 0.5 + (e.clientX - drag.px) * 0.5 * 8;   // sideways motion leans the body
  drag.px = e.clientX;
  const fy = Math.min(1, Math.max(0, 1 - (e.clientY - r.top - r.height * 0.1) / (r.height * 0.8)));   // bottom low, top high
  const fx = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  // snap with hysteresis (Blob Opera: 0.3 of a step for pitch, 0.2 for the vowel) so a shaky finger does not flicker
  const notes = scaleNotes(s.lo, s.hi), pos = fy * (notes.length - 1);
  const cur = s.note !== null ? notes.indexOf(s.note) : -1;
  const idx = cur >= 0 && Math.abs(pos - cur) < 0.8 ? cur : Math.round(pos);
  const note = notes[idx];
  const vowel = s.curVowel === 0 ? (fx > 0.6 ? 1 : 0) : s.curVowel === 1 ? (fx < 0.4 ? 0 : 1) : (fx < 0.5 ? 0 : 1);
  s.vowel = vowel; s.lift = fy;
  if (note !== s.note || vowel !== s.curVowel) singAll(s, note, vowel);
}
function up(e) {
  if (!drag) return; const {s, col, moved, t} = drag; drag = null; lead = null;
  if (!moved && performance.now() - t < 280) {                       // a tap: switch this singer on or off
    s.on = !s.on; col.classList.toggle('muted', !s.on);
  }
  stopAll(); s.lift = 0;
}
row.addEventListener('pointerup', up); row.addEventListener('pointercancel', up);

/* soft bodies (docs/research/blob-singing/how-blob-opera-moves.md; the same spring as Toybox music-kit/live/spring.js):
   stretch and lean are damped springs (about 3 Hz; damping 0.3 free, 0.6 held) so a blob overshoots and settles,
   width keeps the volume, a kick on every new note, a lean toward the finger's sideways motion, breathing at 0.48 Hz,
   a soft white glow on the one you hold, and a 4% mouth pulse near 4.8 Hz while singing */
const W = 2 * Math.PI * 3;
let lastT = 0;
SINGERS.forEach(s => { s.st = 1; s.vs = 0; s.ln = 0; s.vl = 0; s.phase = Math.random() * 6.3; s.lastX = null; });
function frame(t) {
  const dt = Math.min(1 / 30, (t - lastT) / 1000 || 1 / 60); lastT = t;
  for (const s of SINGERS) {
    const sing = s.note !== null, k = sing ? (s.note - s.lo) / (s.hi - s.lo) : 0, held = s === lead;
    if (s.pulse > 0.9) { s.vs += 1.4; s.pulse = 0.5; }                                   // a new note: a little hop
    s.pulse = (s.pulse || 0) * 0.9;
    const target = sing ? 0.95 + k * 0.32 : 1 + Math.sin(t / 1000 * 0.48 * 6.283 + s.phase) * 0.02;
    const z = held ? 0.6 : 0.3, leanTarget = held ? (s.dragVX || 0) * 0.004 : 0;
    for (let i = 0; i < 4; i++) {
      const h = dt / 4;
      s.vs += (-W * W * (s.st - target) - 2 * z * W * s.vs) * h; s.st += s.vs * h;
      s.vl += (-W * W * (s.ln - leanTarget) - 2 * z * W * s.vl) * h; s.ln += s.vl * h;
    }
    s.st = Math.min(1.6, Math.max(0.6, s.st)); s.ln = Math.min(0.35, Math.max(-0.35, s.ln));
    s.dragVX = (s.dragVX || 0) * 0.85;
    const mp = sing ? 1 + 0.04 * Math.sin(t / 1000 * 4.8 * 6.283) : 1;
    const sy = s.st * mp, sx = 1 / Math.sqrt(s.st);
    const lift = held ? s.lift * 50 : sing ? k * 24 : 0;
    s.el.style.transform = `translateX(-50%) translateY(${-lift}px) skewX(${(-s.ln * 30).toFixed(2)}deg) scale(${sx.toFixed(3)},${sy.toFixed(3)})`;
    s.el.style.filter = held ? 'drop-shadow(0 0 10px rgba(255,255,255,.85))' : '';
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* start: audio needs a tap */
const go = document.getElementById('go');
window.addEventListener('load', () => { go.disabled = false; go.textContent = 'Sing'; });
go.onclick = async () => {
  go.disabled = true; go.textContent = 'Warming up';
  await loadAll(); SINGERS.forEach((s, i) => { s.voice = new Voice(s, [-0.45, -0.15, 0.15, 0.45][i]); s.curVowel = null; });
  document.getElementById('start').remove();
};
</script>
</body>
</html>
