<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Song sources</title><link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4DE;--panel:#FFFFFF;--ink:#2B2340;--soft:#7A6F86;--line:#EADFCB;--accent:#FF8A5B;--off:#EFE6D6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1A29;--panel:#2B2340;--ink:#FFF1DA;--soft:#C9BFD6;--line:#3A3150;--off:#352C4A}}
:root[data-theme="dark"]{--bg:#1E1A29;--panel:#2B2340;--ink:#FFF1DA;--soft:#C9BFD6;--line:#3A3150;--off:#352C4A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--ink);font:16px Fredoka,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h2{font-size:15px;font-weight:600;color:var(--soft);margin:26px 0 10px}
.r{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0;cursor:pointer}
.r.on{border-color:var(--accent)}
.play{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:15px;cursor:pointer}
.r span{font-weight:500}
.bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent)}
.mixer{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.top{display:flex;align-items:center;gap:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.all{flex:none;border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.p{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.p:last-child{border-bottom:0}
.p .n{flex:1;font-weight:500;transition:opacity .15s}.p.mute .n{opacity:.4}
.tg{flex:none;width:46px;height:28px;border-radius:14px;border:0;background:var(--accent);position:relative;cursor:pointer}
.tg::after{content:"";position:absolute;top:3px;left:21px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.p.mute .tg{background:var(--off)}.p.mute .tg::after{left:3px}
.solo{flex:none;border:1px solid var(--line);background:none;color:var(--soft);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.p.only .solo{border-color:var(--accent);color:var(--accent)}
.grp{font-size:13px;color:var(--soft);padding:12px 0 2px}
</style></head><body><main>
<h2>Songs</h2>
<div class="r" data-src="a/00.mp3"><button class="play" aria-label="Play">&#9654;</button><span>Sneaky: Suno's band plus monster voices</span><div class="bar"><i></i></div></div>
<h2>Sneaky, part by part, cleaned</h2>
<div class="mixer" data-dir="clean"></div>
<h2>Sneaky, part by part, as split</h2>
<div class="mixer" data-dir="parts"></div>
</main>
<script>
const PARTS=[["Suno's band",[["drums","Drums"],["bass","Bass"],["brass","Brass"],["woodwinds","Woodwinds"],["strings","Strings"],["keyboard","Keys"],["guitar","Guitar"],["percussion","Percussion"],["synth","Synth"]]],
 ["Monster voices",[["voice_lead","Lead, the sax tune"],["voice_scat","All Rounder, the sax tune"],["voice_bom","Bass, the \"bom\""],["voice_doowah_lo","Session, the guitar chords"]]]];
const audio=new Audio();let cur=null;const mixers=[];
function stopRow(){if(cur){cur.classList.remove('on');cur.querySelector('.play').innerHTML='&#9654;';cur.querySelector('i').style.width='0';}cur=null;audio.pause();}
audio.ontimeupdate=()=>{if(cur)cur.querySelector('i').style.width=(100*audio.currentTime/(audio.duration||1))+'%';};audio.onended=stopRow;
document.querySelectorAll('.r').forEach(r=>r.addEventListener('click',()=>{if(cur===r){stopRow();return;}stopRow();mixers.forEach(m=>m.stop());cur=r;r.classList.add('on');r.querySelector('.play').innerHTML='&#10074;&#10074;';audio.src=r.dataset.src;audio.play();}));
let ctx=null;
function makeMixer(el){
 const dir=el.dataset.dir;el.innerHTML='<div class="top"><button class="play" aria-label="Play">&#9654;</button><div class="bar"><i></i></div><button class="all">All on</button></div><div class="list"></div>';
 const mp=el.querySelector('.play'),bar=el.querySelector('.bar i'),box=el.querySelector('.list');const rows={},on={};
 PARTS.forEach(([g,list])=>{box.insertAdjacentHTML('beforeend',`<div class="grp">${g}</div>`);list.forEach(([id,name])=>{
  box.insertAdjacentHTML('beforeend',`<div class="p" data-id="${id}"><span class="n">${name}</span><button class="solo">Alone</button><button class="tg" aria-label="On or off"></button></div>`);rows[id]=box.lastElementChild;on[id]=true;});});
 let bufs={},gains={},srcs=[],t0=0,off=0,playing=false,dur=0,raf=0;
 async function load(){ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
  await Promise.all(Object.keys(rows).map(async k=>{if(bufs[k])return;const b=await (await fetch(dir+'/'+k+'.mp3')).arrayBuffer();bufs[k]=await new Promise((ok,no)=>ctx.decodeAudioData(b,ok,no));dur=Math.max(dur,bufs[k].duration);}));}
 function paint(){const live=Object.keys(on).filter(k=>on[k]);Object.keys(rows).forEach(k=>{rows[k].classList.toggle('mute',!on[k]);rows[k].classList.toggle('only',live.length===1&&on[k]);if(gains[k]&&ctx)gains[k].gain.setTargetAtTime(on[k]?1:0,ctx.currentTime,.01);});}
 function start(){srcs=[];const at=ctx.currentTime+.08;Object.keys(rows).forEach(k=>{const s=ctx.createBufferSource();s.buffer=bufs[k];const g=gains[k]||(gains[k]=ctx.createGain());g.gain.value=on[k]?1:0;s.connect(g);g.connect(ctx.destination);s.start(at,off);srcs.push(s);});
  t0=at-off;playing=true;mp.innerHTML='&#10074;&#10074;';tick();}
 function stop(keep){srcs.forEach(s=>{try{s.stop()}catch(e){}});srcs=[];if(playing&&keep&&ctx)off=Math.min(dur,ctx.currentTime-t0);if(!keep)off=0;playing=false;mp.innerHTML='&#9654;';cancelAnimationFrame(raf);if(!keep)bar.style.width='0';}
 function tick(){const p=(ctx.currentTime-t0)/dur;bar.style.width=Math.min(100,100*p)+'%';if(p>=1){stop();return;}raf=requestAnimationFrame(tick);}
 mp.addEventListener('click',async()=>{if(playing){stop(true);return;}stopRow();mixers.forEach(m=>{if(m.stop!==stop)m.stop();});mp.innerHTML='&hellip;';await load();if(ctx.state==='suspended')await ctx.resume();start();});
 box.addEventListener('click',e=>{const p=e.target.closest('.p');if(!p)return;const k=p.dataset.id;
  if(e.target.classList.contains('solo')){const only=Object.keys(on).filter(x=>on[x]).length===1&&on[k];Object.keys(on).forEach(x=>on[x]=only?true:x===k);}else on[k]=!on[k];
  paint();if(!playing&&!e.target.classList.contains('tg'))mp.click();});
 el.querySelector('.all').addEventListener('click',()=>{Object.keys(on).forEach(k=>on[k]=true);paint();});
 const api={stop,state:()=>({playing,n:Object.keys(bufs).length,dur,on:Object.keys(on).filter(k=>on[k])})};mixers.push(api);return api;}
document.querySelectorAll('.mixer').forEach(makeMixer);
</script></body></html>
