<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Battler looks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--muted:#78716c;--line:#e7e5e4;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0c0a09;--fg:#f5f5f4;--muted:#a8a29e;--line:#292524;--card:#1c1917}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 Inter,system-ui,sans-serif}
main{max-width:1240px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:22px;font-weight:600;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pics{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1px;background:var(--line)}
.pics img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;cursor:zoom-in;background:var(--line)}
.meta{padding:12px 14px}
.meta b{display:block;font-weight:600}
.meta span{color:var(--muted);font-size:13px}
dialog{border:0;padding:0;background:transparent;max-width:96vw;max-height:96vh}
dialog::backdrop{background:rgba(0,0,0,.85)}
dialog img{display:block;max-width:96vw;max-height:96vh;border-radius:8px}
@media (max-width:420px){.grid{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<main>
<h1>Music Battler looks</h1>
<div class="grid" id="g"></div>
</main>
<dialog id="d"><img id="di" alt=""></dialog>
<script>
const L=[
["glasswood","Glasswood","Forest creatures at dusk, a fairy ring of mushrooms"],
["tidelight","Tidelight Reef","Glowing sea creatures on a night reef"],
["bellforge","Bellforge Isles","Brass automata on sky islands, a music-box disc"],
["stormsong","Stormsong Steppe","Paper-cut weather spirits under a huge sky"],
["livinginstruments","Living Instruments","Creatures that are the instruments, in an overgrown ruin"],
["myth","Siren Coast","Mythic musicians on a moonlit sea, spells are songs"]];
const g=document.getElementById('g'),d=document.getElementById('d'),di=document.getElementById('di');
for(const[id,n,t]of L){const s=document.createElement('section');
s.innerHTML=`<div class="pics"><img src="web/${id}-arena.jpg" alt="${n} battle" loading="lazy"><img src="web/${id}-units.jpg" alt="${n} units" loading="lazy"></div><div class="meta"><b>${n}</b><span>${t}</span></div>`;g.appendChild(s)}
g.addEventListener('click',e=>{if(e.target.tagName==='IMG'){di.src=e.target.src;d.showModal()}});
d.addEventListener('click',()=>d.close());
</script>
</body>
</html>
