<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16403C">
<link rel="icon" href="img/player.webp">
<title>One Monster Band</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#231C33;--deep:#0A1E1D;--xp1:#9AF3FF;--xp2:#45C6F5;--hot:#FF5FA2;--gold:#FFD84A;--cream:#F6F0E2;--bg:#16403C;--acc:#FFD84A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:"Fredoka",system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.num{font-weight:700;color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

#hud{position:fixed;left:0;right:0;top:0;pointer-events:none;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));display:none}
#hud.on{display:block}
.xp{position:relative;height:18px;border-radius:10px;background:#0D2826;border:2px solid var(--deep);overflow:hidden;max-width:760px;margin:0 auto}
.xp i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(var(--xp1),var(--xp2));border-radius:8px;transition:width .12s}
.xp b{position:absolute;right:8px;top:-1px;font-size:13px;letter-spacing:.5px}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:4px auto 0;max-width:760px}
.kills{display:flex;align-items:center;gap:6px;font-size:17px}
.kills svg{flex:none}
.timer{font-size:30px;line-height:1.1}
.timer.boss{color:#FFD84A}
.pause{pointer-events:auto;justify-self:end;width:38px;height:38px;border-radius:12px;background:rgba(10,30,30,.55);border:2px solid rgba(255,255,255,.25);display:grid;place-items:center}
.slots{display:grid;gap:4px;margin:6px auto 0;max-width:760px;justify-content:start}
.slot{width:100%;max-width:32px;aspect-ratio:1;flex:none;border-radius:9px;background:var(--cream);border:2px solid var(--deep);overflow:hidden;position:relative}
.slot img{position:absolute;left:50%;top:8%;height:125%;transform:translateX(-50%)}
.slot.e{background:rgba(0,0,0,.22);border:2px dashed rgba(255,255,255,.28)}
.slot .lv{position:absolute;right:1px;bottom:0;font-size:9px;font-weight:700;color:#fff;background:var(--ink);border-radius:4px;padding:0 3px;line-height:12px}
.slot .glow{position:absolute;inset:0;border-radius:7px;opacity:0;box-shadow:inset 0 0 0 3px var(--c,#fff),inset 0 0 12px var(--c,#fff)}
.bossbar{display:none;max-width:420px;margin:8px auto 0;height:12px;border-radius:7px;background:#0A1E1D;border:2px solid var(--ink);overflow:hidden}
.bossbar.on{display:block}
.bossbar i{display:block;height:100%;width:100%;background:#FF5F7A;transition:width .1s}

.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;padding:24px 16px;text-align:center;
  padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
.screen.on{display:flex}
.dim{background:rgba(6,22,21,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
h1{font-size:clamp(44px,11vw,76px);font-weight:700;line-height:.95;letter-spacing:.5px}
h2{font-size:clamp(34px,8vw,52px);font-weight:700;line-height:1}
.troupe{display:flex;align-items:flex-end;justify-content:center;gap:2px;margin:22px 0 26px;height:120px}
.troupe img{display:block;filter:drop-shadow(0 5px 3px rgba(0,0,0,.28));animation:bop .42s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bop{0%,100%{transform:scale(1,1)}14%{transform:scale(1.07,.92)}38%{transform:scale(.96,1.05)}62%{transform:scale(1,1)}}
.go{min-width:200px;height:60px;border-radius:30px;background:var(--hot);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);font-size:24px;font-weight:700;color:#fff;padding:0 34px;transition:transform .08s}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.go[disabled]{background:#5E7F7A;cursor:default}
.go.ghost{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);box-shadow:none;font-size:18px;height:46px;min-width:0;margin-top:12px}
.sub{margin:10px 0 18px;font-size:18px;font-weight:500;color:rgba(255,255,255,.82)}

.cards{display:flex;gap:14px;margin-top:20px;justify-content:center;flex-wrap:wrap;max-width:760px}
.card{width:210px;border-radius:20px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);color:var(--ink);padding:12px 12px 14px;
  display:flex;flex-direction:column;align-items:center;transition:transform .1s}
.card:hover{background:#FFFBF2;border-color:#3A2F55}
.card:active{transform:translateY(3px);box-shadow:0 3px 0 var(--ink)}
.card .pic{width:100%;height:104px;border-radius:14px;background:var(--c);display:flex;align-items:flex-end;justify-content:center;position:relative;overflow:hidden}
.card .pic img{height:96px;filter:drop-shadow(0 4px 2px rgba(0,0,0,.25))}
.card .pic svg{margin-bottom:16px}
.card .tag{position:absolute;left:8px;top:8px;font-size:12px;font-weight:700;background:var(--ink);color:#fff;border-radius:8px;padding:1px 8px}
.card .nm{font-size:21px;font-weight:700;margin-top:9px;line-height:1.1}
.card .ln{font-size:15px;font-weight:500;color:#6E6780;margin-top:3px;line-height:1.2}
@media (max-width:700px){
  .cards{flex-direction:column;gap:10px;width:100%;max-width:360px}
  .card{width:100%;flex-direction:row;padding:10px;gap:12px;text-align:left;align-items:center}
  .card .pic{width:84px;height:84px;flex:none}
  .card .pic img{height:76px}
  .card .pic svg{margin-bottom:10px;transform:scale(.8)}
  .card .nm{margin-top:0}
}
.band{display:flex;gap:6px;justify-content:center;margin:4px 0 20px;flex-wrap:wrap;max-width:560px}
.band .slot{width:42px;max-width:42px}
#veil{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,60,90,0) 55%,rgba(255,60,90,.45))}
#rpov{position:fixed;inset:0;pointer-events:none;z-index:60}

/* the tour map */
#sMap{justify-content:flex-start;padding-left:0;padding-right:0;overflow-y:auto;touch-action:pan-y;background:linear-gradient(#0E2E2B,#16403C 40%,#1B4A45)}
#sMap h2{margin:8px 0 4px;flex:none}
.perks{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:480px;margin:6px 16px 8px;min-height:8px;flex:none}
.chip{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:3px 10px 3px 4px;border-radius:14px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.18)}
.chip i{width:20px;height:20px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-size:12px;background:var(--c);color:var(--ink)}
.path{position:relative;width:100%;max-width:520px;padding:10px 0 40px;flex:none}
.path svg.road{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:relative;display:flex;align-items:center;gap:14px;height:112px;padding:0 22px;width:100%;text-align:left}
.node.r{flex-direction:row-reverse;text-align:right}
.badge{width:88px;height:88px;flex:none;border-radius:50%;background:var(--c);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;transition:transform .1s}
.badge img{height:86%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.node:active .badge{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.node .t{font-size:22px;font-weight:700;line-height:1.05}
.node .s{font-size:14px;font-weight:500;color:rgba(255,255,255,.7);margin-top:3px}
.node.lock .badge{background:#3D5B57;filter:grayscale(.85) brightness(.75)}
.node.lock .t{color:rgba(255,255,255,.55)}
.node.next .badge{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 var(--ink),0 0 0 0 rgba(255,216,74,.6)}50%{box-shadow:0 5px 0 var(--ink),0 0 0 10px rgba(255,216,74,0)}}
.mark{position:absolute;right:2px;top:2px;width:26px;height:26px;border-radius:13px;background:#7CF29A;border:3px solid var(--ink);display:grid;place-items:center}
.node.lock .mark{background:#5E7F7A}
#sPick .crew{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:110px;margin:16px 0 6px}
#sPick .crew{max-width:100%}
#sPick .crew img{display:block;min-width:0;max-width:19vw;object-fit:contain;object-position:bottom;filter:drop-shadow(0 4px 3px rgba(0,0,0,.3))}
#sPick .crew img.boss{height:110px}
.tiers{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:420px;margin:4px 0 0}
.tier{height:34px;padding:0 13px;border-radius:17px;font-size:15px;font-weight:600;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2)}
.tier.won{border-color:rgba(124,242,154,.6)}
.tier.on{background:var(--gold);color:var(--ink);border-color:var(--ink)}
.tier.lock{opacity:.35;cursor:default}
#sPick .sub{margin:10px 0 16px;font-size:16px;min-height:20px}
.opts{display:flex;gap:8px;justify-content:center;margin-top:16px}
.opt{height:38px;padding:0 16px;border-radius:19px;font-size:15px;font-weight:600;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3)}
.opt.off{opacity:.55;text-decoration:line-through}
.prog{width:220px;height:10px;border-radius:6px;background:rgba(255,255,255,.15);margin:14px auto 0;overflow:hidden;visibility:hidden}
.prog.on{visibility:visible}
.prog i{display:block;height:100%;width:0;background:var(--gold)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="veil"></div>

<div id="hud">
  <div class="xp"><i id="xpf"></i><b id="lvt">LV 1</b></div>
  <div class="bar">
    <div class="kills num"><svg width="20" height="18" viewBox="0 0 20 18"><path d="M3 9a7 7 0 0 1 14 0v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="#F6F0E2" stroke="#231C33" stroke-width="2"/><circle cx="7.5" cy="9" r="1.6" fill="#231C33"/><circle cx="12.5" cy="9" r="1.6" fill="#231C33"/><path d="M2 6h16" stroke="#231C33" stroke-width="2"/><path d="M4 6q6-6 12 0" fill="#3A3150"/></svg><span id="kt">0</span></div>
    <div class="timer num" id="tt">0:00</div>
    <button class="pause" id="pb" aria-label="Pause"><svg width="16" height="18" viewBox="0 0 16 18"><rect x="2" y="1" width="4" height="16" rx="1.5" fill="#fff"/><rect x="10" y="1" width="4" height="16" rx="1.5" fill="#fff"/></svg></button>
  </div>
  <div class="slots" id="slots"></div>
  <div class="bossbar" id="bossbar"><i id="bossf"></i></div>
</div>

<div class="screen dim on" id="sStart">
  <h1 class="num">One Monster<br>Band</h1>
  <div class="troupe" id="troupe"></div>
  <button class="go" id="bStart" disabled>Loading</button>
  <div class="opts"><button class="opt" data-opt="sound">Sound on</button><button class="opt" data-opt="music">Music on</button></div>
</div>

<div class="screen" id="sMap">
  <h2 class="num">The Tour</h2>
  <div class="perks" id="perks"></div>
  <div class="path" id="path"></div>
</div>

<div class="screen dim" id="sPick">
  <h2 class="num" id="pkT"></h2>
  <div class="crew" id="pkC"></div>
  <div class="tiers" id="pkTiers"></div>
  <div class="sub" id="pkR"></div>
  <button class="go" id="bGo">Play</button>
  <div class="prog" id="pkP"><i></i></div>
  <button class="go ghost" id="bBack">Back</button>
</div>

<div class="screen dim" id="sLevel">
  <h2 class="num">Level up!</h2>
  <div class="cards" id="cards"></div>
</div>

<div class="screen dim" id="sPause">
  <h2 class="num">Paused</h2>
  <div style="height:22px"></div>
  <button class="go" id="bResume">Resume</button>
  <div class="opts"><button class="opt" data-opt="sound">Sound on</button><button class="opt" data-opt="music">Music on</button></div>
  <button class="go ghost" id="bQuit">Leave the stage</button>
</div>

<div class="screen dim" id="sOver">
  <h2 class="num" id="oT">Encore!</h2>
  <div class="sub" id="oS"></div>
  <div class="band" id="oB"></div>
  <div class="cards" id="oP"></div>
  <button class="go" id="bAgain">Play again</button>
  <button class="go ghost" id="bMap">Tour map</button>
</div>

<div id="rpov"></div>

<script src="vendor/hotkeys.js"></script>
<script src="vendor/replay.js"></script>
<script>
(()=>{
'use strict';
const SIM=!!window.__BS_SIM; // the headless balance check (tools/sim.mjs) runs the same code with no sound and no drawing
const $=s=>document.querySelector(s);
const cv=$('#cv'),g=cv.getContext('2d');
let W=0,H=0,DPR=1,Z=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth||390;H=innerHeight||844;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  Z=Math.max(.8,Math.min(1.4,Math.sqrt(W*H)/640));}
addEventListener('resize',resize);resize();

/* ---------- the band: one character per part of the song ---------- */
const FAM={
  voice_lead:{name:'Lead',img:'player',col:'#FF7AB8',atk:'Bubbles',up:'Extra bubble',dps:18},
  drums:{name:'Drums',img:'drums',col:'#86B6FF',atk:'Ring pulse',up:'Wider ring',dps:12},
  bass:{name:'Bass',img:'bass',col:'#FFB347',atk:'Heavy shot',up:'Pierces more',dps:22},
  brass:{name:'Brass',img:'brass',col:'#FFD84A',atk:'Cone blast',up:'Wider cone',dps:16},
  strings:{name:'Strings',img:'strings',col:'#C9A2FF',atk:'Piercing line',up:'Extra line',dps:14},
  woodwinds:{name:'Woodwinds',img:'woodwinds',col:'#FF8080',atk:'Homing notes',up:'Extra note',dps:20},
  guitar:{name:'Guitar',img:'guitar',col:'#FFF27A',atk:'Chain zap',up:'Longer chain',dps:18},
  keyboard:{name:'Keys',img:'keyboard',col:'#FF9ED2',atk:'Chord stars',up:'More stars',dps:16},
  percussion:{name:'Shaker',img:'percussion',col:'#6FE3C8',atk:'Tambourine toss',up:'Extra tambourine',dps:14},
  synth:{name:'Synth',img:'synth',col:'#5FD8FF',atk:'Beam',up:'Longer beam',dps:15},
  vocals:{name:'Diva',img:'vocals',col:'#FF6FA8',atk:'Siren ring, slows',up:'Wider ring',dps:15},
  voice_bom:{name:'Bom',img:'voice_bom',col:'#8CF5A6',atk:'Push bubble',up:'Bigger bubble',dps:14},
  voice_doowah_lo:{name:'Doo-wah',img:'voice_doowah_lo',col:'#FFE680',atk:'Orbit bubbles',up:'Extra bubble',dps:14},
  voice_scat:{name:'Scat',img:'voice_scat',col:'#8FF0E0',atk:'Bubble spray',up:'More bubbles',dps:16},
  voice_suno_line:{name:'Crooner',img:'voice_suno_line',col:'#FF8FB0',atk:'Bubble spray',up:'More bubbles',dps:16}
};
const ORDER=['voice_lead','drums','bass','keyboard','guitar','brass','woodwinds','strings','synth','percussion','voice_bom','voice_doowah_lo','vocals','voice_scat','voice_suno_line'];
const MAXLV=5;
/* enemies of a place: its pictures weakest first, with the sneaky crew's numbers by rank */
const MOUTH={"voice_lead":{"picture":"player","atlas":"chorus","x":0.5527,"y":0.6176,"width":0.223},"drums":{"picture":"drums","atlas":"drumline","x":0.5169,"y":0.3141,"width":0.135},"bass":{"picture":"bass","atlas":"low_end","x":0.5222,"y":0.5358,"width":0.0315},"guitar":{"picture":"guitar","atlas":"overdrive","x":0.3411,"y":0.3355,"width":0.1072},"strings":{"picture":"strings","atlas":"strings","x":0.5062,"y":0.4475,"width":0.105},"brass":{"picture":"brass","atlas":"brass","x":0.459,"y":0.2901,"width":0.139},"woodwinds":{"picture":"woodwinds","atlas":"undertone","x":0.4746,"y":0.4454,"width":0.1271},"voice_bom":{"picture":"voice_bom","atlas":"shanty","x":0.5098,"y":0.5033,"width":0.3918},"voice_doowah_lo":{"picture":"voice_doowah_lo","atlas":"session","x":0.5529,"y":0.3144,"width":0.1261},"voice_scat":{"picture":"voice_scat","atlas":"weather","x":0.4985,"y":0.4172,"width":0.2753},
  "keyboard":{"picture":"keyboard","atlas":"strings","x":0.56,"y":0.43,"width":0.2},"percussion":{"picture":"percussion","atlas":"drumline","x":0.39,"y":0.46,"width":0.16},"synth":{"picture":"synth","atlas":"undertone","x":0.49,"y":0.39,"width":0.17},"vocals":{"picture":"vocals","atlas":"chorus","x":0.5,"y":0.52,"width":0.21},"voice_suno_line":{"picture":"voice_suno_line","atlas":"shanty","x":0.6,"y":0.5,"width":0.21}};

/* the tour's upgrades, kept between levels (one picked after each first clear) */
const PERKS={
  lungs:{name:'Big lungs',ln:'More health',col:'#FF9EC0',ic:'+'},
  feet:{name:'Quick feet',ln:'Move faster',col:'#9AF3FF',ic:'>'},
  magnet:{name:'Note magnet',ln:'Pick up from further',col:'#FFE680',ic:'o'},
  loud:{name:'Turn it up',ln:'The band hits harder',col:'#FFB347',ic:'!'},
  skin:{name:'Thick skin',ln:'Take less damage',col:'#B7F5A0',ic:'#'},
  snack:{name:'Green room',ln:'Heal over time',col:'#C9A2FF',ic:'~'},
  roadie:{name:'Roadie',ln:'Start with the drummer',col:'#86B6FF',ic:'d'},
  encore:{name:'Encore',ln:'Get back up once',col:'#FFD84A',ic:'*'}
};
const PERK_MAX={roadie:1,encore:1};
const SAVE_KEY='bandSurvivors.tour.v1';
let SAVE={cleared:{},perks:{}};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s&&s.cleared)SAVE=Object.assign({cleared:{},perks:{}},s);}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(SAVE));}catch(e){}}

/* ---------- sound effects: one player, per-id caps, never-drop for the big moments ----------
   Cues come from sfx/cues.json (Creative lead's set from Toybox, cues/band-survivors.json): {id: {files: [...], gain,
   cap (at most this many at once), gap (seconds between starts), keep (never dropped)}}. No file, no sound: the game
   stays silent for that event. The Sound switch mutes effects only; the Music switch mutes the song. */
const OPT_KEY='bandSurvivors.options.v1';let OPT={sound:true,music:true};
try{const o=JSON.parse(localStorage.getItem(OPT_KEY)||'null');if(o)OPT=Object.assign(OPT,o);}catch(e){}
function saveOpt(){try{localStorage.setItem(OPT_KEY,JSON.stringify(OPT));}catch(e){}}
let sfxBus=null,CUES={};const SFXBUF={},SFXLIVE={},SFXLAST={};
async function loadSfx(){if(SIM)return;try{CUES=await loadJSON('sfx/cues.json');}catch(e){CUES={};return;}
  for(const id in CUES)for(const f of (CUES[id].files||[]))if(!SFXBUF[f])fetch('sfx/'+f).then(r=>r.arrayBuffer()).then(decode).then(b=>{SFXBUF[f]=b;}).catch(()=>{});}
function sfx(id,vol){ // a level's own cue (win@day-lawn, cut from its song) wins over the shared one
  if(SIM||!ac||!sfxBus||!OPT.sound)return;if(LV&&CUES[id+'@'+LV.id])id=id+'@'+LV.id;const c=CUES[id];if(!c||!c.files||!c.files.length)return;
  const t=ac.currentTime,live=SFXLIVE[id]||0;
  if(!c.keep&&(live>=(c.cap||4)||t-(SFXLAST[id]||-9)<(c.gap||0)))return;
  const f=c.files[Math.floor(Math.random()*c.files.length)],buf=SFXBUF[f];if(!buf)return;
  const src=ac.createBufferSource(),g=ac.createGain();src.buffer=buf;g.gain.value=(c.gain==null?1:c.gain)*(vol||1);
  if(c.pitch)src.playbackRate.value=1+(Math.random()*2-1)*c.pitch;
  src.connect(g);g.connect(sfxBus);src.start();SFXLIVE[id]=live+1;SFXLAST[id]=t;src.onended=()=>{SFXLIVE[id]=Math.max(0,(SFXLIVE[id]||1)-1);};}
function setOpt(k,v){OPT[k]=v;saveOpt();if(!ac)return;
  if(k==='sound'&&sfxBus)sfxBus.gain.setTargetAtTime(v?1:0,ac.currentTime,.05);
  if(k==='music'&&bus&&S.mode!=='map'&&S.mode!=='start')levelBus(.05);renderOpt();}
function renderOpt(){if(SIM)return;document.querySelectorAll('[data-opt]').forEach(b=>{const k=b.dataset.opt;b.classList.toggle('off',!OPT[k]);b.setAttribute('aria-pressed',OPT[k]?'true':'false');

/* ---------- HUD ---------- */
const slotEls={};
function renderSlots(){
  if(SIM)return;
  const box=$('#slots');box.innerHTML='';for(const k in slotEls)delete slotEls[k];
  box.style.gridTemplateColumns='repeat('+PARTS.length+',minmax(0,32px))';
  const mine=band.map(m=>m.part);
  for(let i=0;i<PARTS.length;i++){
    const p=mine[i];const d=document.createElement('div');d.className='slot'+(p?'':' e');
    if(p){d.innerHTML='<img src="img/'+FAM[p].img+'.webp" alt=""><i class="glow" style="--c:'+FAM[p].col+'"></i><span class="lv">'+owned[p]+'</span>';slotEls[p]=d.querySelector('.glow');}
    box.appendChild(d);
  }
}
function pulseSlot(p){if(SIM)return;const el=slotEls[p];if(!el||!el.animate)return;el.animate([{opacity:1},{opacity:0}],{duration:220,easing:'ease-out'});}
function fmt(t){t=Math.max(0,Math.floor(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
let hudK=-1,hudT=-1;
function hud(){
  $('#xpf').style.width=(100*Math.min(1,S.xp/S.need))+'%';$('#lvt').textContent='LV '+S.lvl;
  if(S.kills!==hudK){hudK=S.kills;$('#kt').textContent=S.kills.toLocaleString('en-US');}
  const tt=Math.floor(S.t);if(tt!==hudT){hudT=tt;const el=$('#tt');el.textContent=fmt(S.t);}
  const bb=$('#bossbar');bb.classList.toggle('on',!!S.boss);$('#tt').classList.toggle('boss',!!S.boss);
  if(S.boss)$('#bossf').style.width=(100*Math.max(0,S.boss.hp/S.boss.max))+'%';
  $('#veil').style.opacity=Math.max(S.hurt*1.6,S.hp<30?.35+.15*Math.sin(S.t*8):0);
}

/* ---------- targeting ---------- */
function nearest(x,y,maxd,skip){let b=null,bd=maxd*maxd;for(const e of enemies){if(e.dead||(skip&&skip.has(e)))continue;const d=dist2(x,y,e.x,e.y-e.h*.4);if(d<bd){bd=d;b=e;}}return b;}
function nearestN(x,y,n,maxd){const arr=[];for(const e of enemies){if(e.dead)continue;const d=dist2(x,y,e.x,e.y);if(d<maxd*maxd)arr.push([d,e]);}arr.sort((a,b)=>a[0]-b[0]);return arr.slice(0,n).map(a=>a[1]);}
function aimFrom(x,y,maxd){const e=nearest(x,y,maxd);return e?Math.atan2(e.y-e.h*.4-y,e.x-x):S.fa;}

/* ---------- firing on the notes ---------- */
function fireNotes(){
  const u=songRaw();let a=lastU;lastU=u;
  if(u<=a)return;if(u-a>.25)a=u-.25;
  const pa=pos(a),pb=pos(u);
  for(const m of band.concat(combos)){const list=m.list;if(!list||m.enterU!==null)continue;
    if(pb>=pa)eachIn(list,pa,pb,m);else{eachIn(list,pa,LE,m);eachIn(list,LS-1e-6,pb,m);}}
}
function eachIn(list,a,b,m){let lo=0,hi=list.length;while(lo<hi){const mid=(lo+hi)>>1;if(list[mid].t<=a)lo=mid+1;else hi=mid;}
  for(let i=lo;i<list.length&&list[i].t<=b;i++)(m.combo?fireCombo:fire)(m,list[i]);}
function dmgMul(){return 1+.12*perk('loud');}
function fire(m,note){
  const p=m.part,lv=m.lv,f=FAM[p];
  const dmg=f.dps*(m.lead?1:1.2)*(1+.3*(lv-1))*note.w/m.rate*dmgMul();
  const tnow=now();
  m.bop=Math.min(1.5,.55+.45*Math.min(2,note.w));m.flash=Math.min(1.3,.6+.4*Math.min(2,note.w));m.lastHeard=tnow;pulseSlot(p);
  if(m.heldSing&&note.d>=.4)m.leanUntil=tnow+Math.min(note.d,1.2);
  if(!SIM)voiceFx(m,note);
  if(m.heldSing){m.mc=(p==='voice_bom'||p==='voice_doowah_lo')?3:(note.d>=.4?2:4);m.mUntil=tnow+Math.max(.12,Math.min(note.d,1.2));}
  else{m.mc=1;m.mUntil=tnow+.11;}
  if(fireLog.length>600)fireLog.shift();fireLog.push({p,t:note.t,at:pos(songRaw())});
  const ox=m.x,oy=m.y-(m.lead?26:18);
  if(note.d>=HELD&&p!=='drums'&&p!=='percussion'){ // a held line: one wave that rolls out for the length of the note
    const an=aimFrom(ox,oy,420);shots.push({k:'wave',x:ox,y:oy,an,half:.55+lv*.05,r:12,R:170+lv*18+Math.min(1.5,note.d)*60,sp:300,dmg,hit:new Set(),col:f.col,life:2});return;}
  switch(p){
    case 'voice_lead':{const n=1+(lv>=2)+(lv>=4);const base=aimFrom(ox,oy,380);
      for(let i=0;i<n;i++){const an=base+(i-(n-1)/2)*.32;shots.push({k:'bub',x:ox,y:oy,vx:Math.cos(an)*230,vy:Math.sin(an)*230,r:11+lv,life:2.2,dmg,col:f.col,pop:30+lv*4});}break;}
    case 'drums':{const R=(72+lv*14)*(note.w>=1.3?1:note.w>=.8?.75:.55);shots.push({k:'ring',x:ox,y:oy+10,r:0,R,t:0,life:.26,dmg,hit:new Set(),col:f.col});break;}
    case 'vocals':{const R=110+lv*16;shots.push({k:'ring',x:ox,y:oy+10,r:0,R,t:0,life:.4,dmg,hit:new Set(),col:f.col,slow:1.2});break;}
    case 'bass':{const an=aimFrom(ox,oy,440);shots.push({k:'heavy',x:ox,y:oy,vx:Math.cos(an)*235,vy:Math.sin(an)*235,r:14+lv*1.5,life:2.4,dmg,pierce:1+lv,hit:new Set(),col:f.col});break;}
    case 'brass':{const an=aimFrom(ox,oy,280),R=118+lv*14,half=.4+lv*.06;
      for(const e of enemies){if(e.dead)continue;const dx=e.x-ox,dy=e.y-e.h*.4-oy,d=Math.hypot(dx,dy);if(d>R+e.r)continue;
        let da=Math.atan2(dy,dx)-an;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(da)<half+ e.r/Math.max(d,1))hit(e,dmg,Math.cos(an)*70,Math.sin(an)*70);}
      if(!SIM)fx.push({k:'cone',x:ox,y:oy,an,R,half,t:0,life:.22,col:f.col});break;}
    case 'strings':{const n=1+(lv>=2)+(lv>=4);const tg=nearestN(ox,oy,n,560);
      for(let i=0;i<n;i++){const e=tg[i];const an=e?Math.atan2(e.y-e.h*.4-oy,e.x-ox):S.fa+(i-(n-1)/2)*.5;
        shots.push({k:'line',x:ox,y:oy,vx:Math.cos(an)*780,vy:Math.sin(an)*780,an,life:.7,dmg,hit:new Set(),col:f.col,r:8});}break;}
    case 'woodwinds':{const n=1+(lv>=2)+(lv>=4);
      for(let i=0;i<n;i++){const an=-Math.PI/2+(i-(n-1)/2)*.9+rnd(-.3,.3);shots.push({k:'homing',x:ox,y:oy,vx:Math.cos(an)*200,vy:Math.sin(an)*200,an,life:3,dmg,col:f.col,r:10,tgt:null});}break;}
    case 'guitar':{let from={x:ox,y:oy};const chain=2+lv,pts=[[ox,oy]],hs=new Set();let e=nearest(ox,oy,300),k=0;
      while(e&&k<chain){hs.add(e);const ex=e.x,ey=e.y-e.h*.45;pts.push([ex,ey]);hit(e,dmg*Math.pow(.88,k),(ex-from.x)*.3,(ey-from.y)*.3);from={x:ex,y:ey};k++;e=nearest(ex,ey,150,hs);}
      if(pts.length>1&&!SIM)fx.push({k:'zap',pts:jag(pts),t:0,life:.16,col:f.col});break;}
    case 'keyboard':{const n=1+(lv>=2)+(lv>=4);const tg=nearestN(ox,oy,6,380);
      for(let i=0;i<n;i++){const e=tg.length?tg[Math.floor(Math.random()*tg.length)]:null;const x=e?e.x:ox+rnd(-120,120),y=e?e.y-e.h*.4:oy+rnd(-120,120),R=34+lv*5;
        for(const o of enemies){if(!o.dead&&dist2(x,y,o.x,o.y-o.h*.4)<(R+o.r)*(R+o.r))hit(o,dmg/n*1.3,0,0);}
        if(!SIM)fx.push({k:'star',x,y,R,t:0,life:.3,col:f.col});}break;}
    case 'percussion':{const n=1+(lv>=3);for(let i=0;i<n;i++){const an=aimFrom(ox,oy,320)+(i?Math.PI:0);
      shots.push({k:'boom',x:ox,y:oy,vx:Math.cos(an)*330,vy:Math.sin(an)*330,an,t:0,life:1.1,dmg,r:12+lv,cd:new Map(),col:f.col});}break;}
    case 'synth':{const an=aimFrom(ox,oy,360),L=220+lv*30,ex=ox+Math.cos(an)*L,ey=oy+Math.sin(an)*L;
      for(const e of enemies){if(e.dead)continue;const px=e.x-ox,py=e.y-e.h*.4-oy;const tt=Math.max(0,Math.min(1,(px*Math.cos(an)+py*Math.sin(an))/L));
        const qx=ox+Math.cos(an)*L*tt,qy=oy+Math.sin(an)*L*tt;if(dist2(qx,qy,e.x,e.y-e.h*.4)<(e.r+10)*(e.r+10))hit(e,dmg,Math.cos(an)*25,Math.sin(an)*25);}
      if(!SIM)fx.push({k:'beam',x:ox,y:oy,ex,ey,t:0,life:.14,col:f.col});break;}
    case 'voice_bom':{const an=aimFrom(ox,oy,380);shots.push({k:'big',x:ox,y:oy,vx:Math.cos(an)*140,vy:Math.sin(an)*140,r:22+lv*4,life:1.6,dmg,hit:new Set(),col:f.col});break;}
    case 'voice_doowah_lo':{const n=1+(lv>=2)+(lv>=4);const b=Math.random()*6.28;
      for(let i=0;i<n;i++)shots.push({k:'orbit',a:b+i*6.28/n,R:20,RT:96+lv*6,x:S.x,y:S.y,life:1.9,t:0,dmg,cd:new Map(),col:f.col,r:13+lv});break;}
    case 'voice_scat':case 'voice_suno_line':{const n=5+lv*2;for(let i=0;i<n;i++){const an=Math.random()*6.28,sp=rnd(260,360);
      shots.push({k:'spr',x:ox,y:oy,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,r:7,life:rnd(.45,.65),dmg:dmg*.35,col:f.col});}break;}
  }
}
function voiceFx(m,note){
  let c=0;for(const q of fx)if(q.k==='snote')c++;if(c>36)return;
  const f=FAM[m.part],h=m.lead?66:50,big=note.w>=1.2;
  fx.push({k:'snote',x:m.x+rnd(-8,8),y:m.y-h*.8,vx:rnd(-22,22),vy:-rnd(46,70),rot:rnd(-.4,.4),vr:rnd(-1.5,1.5),t:0,life:.75,col:f.col,s:(m.lead?.8:.62)*(big?1.2:1),w:note.w});}
function memberTick(dt){const tn=now(),u=tn-t0-lat();
  for(const m of band){m.bop=Math.max(0,m.bop-dt*6);m.flash=Math.max(0,m.flash-dt*7);
    if(m.enterU!==null&&u>=m.enterU){m.enterU=null;m.jump=1;m.bop=1;m.lastHeard=tn;
      if(!SIM)for(let i=0;i<2;i++)fx.push({k:'pop',x:m.x,y:m.y-(m.lead?30:22),r:26+i*22,t:-i*.09,life:.5,col:FAM[m.part].col});}
    m.jump=Math.max(0,m.jump-dt*2.6);
    const resting=m.enterU!==null||tn-m.lastHeard>.7;
    m.dim+=((resting?.6:1)-m.dim)*Math.min(1,dt*8);
    m.lean+=(((tn<m.leanUntil)?1:0)-m.lean)*Math.min(1,dt*9);}}
function jag(pts){const out=[pts[0]];for(let i=1;i<pts.length;i++){const[a,b]=[pts[i-1],pts[i]];for(let s=1;s<=4;s++){const t=s/4;out.push(s===4?b:[a[0]+(b[0]-a[0])*t+rnd(-9,9),a[1]+(b[1]-a[1])*t+rnd(-9,9)]);}}return out;}

/* ---------- hits, kills, drops ---------- */
function hit(e,d,kx,ky){
  if(e.dead)return;sfx(e.boss?'hit_boss':'hit');e.hp-=d;e.flash=.1;const res=e.boss?.08:e.elite?.35:1;e.kx+=kx*res;e.ky+=ky*res;
  if(!SIM){if(texts.length>30)texts.shift();texts.push({x:e.x+rnd(-6,6),y:e.y-e.h-4,v:Math.max(1,Math.round(d)),t:0,big:d>=40});}
  if(e.hp<=0)kill(e);
}
function kill(e){
  e.dead=true;sfx(e.boss?'boss_down':e.elite?'elite_down':'kill');S.kills++;
  if(REP){rev('kill',e.x,e.y-e.h*.4,e.h/50);if(e.boss){rev('boss',e.x,e.y-e.h*.4,0);if(S.mode==='play')rnote('Band',e.final?'beat the final boss':'beat a mini-boss','',e.x,e.y);}}
  const s=e.h/50;
  if(!SIM){for(let i=0;i<7;i++){const an=i/7*6.28+rnd(-.3,.3);fx.push({k:'puff',x:e.x,y:e.y-e.h*.4,vx:Math.cos(an)*rnd(30,70)*s,vy:Math.sin(an)*rnd(30,70)*s,r:rnd(7,12)*s,t:0,life:rnd(.35,.5)});}
    fx.push({k:'note',x:e.x,y:e.y-e.h*.6,vx:rnd(-40,40),vy:-rnd(110,150),rot:rnd(-.4,.4),vr:rnd(-3,3),t:0,life:.9,col:FAM[PARTS[Math.floor(Math.random()*PARTS.length)]].col,s:s});}
  if(e.boss){S.boss=null;S.shake=.6;if(e.final){S.bossDone=true;S.bossT=S.t;}
    for(let i=0;i<(e.final?24:10);i++)dropGem(e.x+rnd(-60,60),e.y+rnd(-40,40),3,i===0);if(!e.final)gems.push({x:e.x,y:e.y,v:0,heal:false,box:true,mag:false,sp:0,t:0});
    if(!SIM)for(let i=0;i<20;i++)fx.push({k:'note',x:e.x+rnd(-40,40),y:e.y-60,vx:rnd(-120,120),vy:-rnd(140,260),rot:0,vr:rnd(-4,4),t:0,life:1.4,col:LV.accent,s:1.4});}
  else if(e.elite){dropGem(e.x,e.y,8,true);gems.push({x:e.x+12,y:e.y,v:0,heal:false,box:true,mag:false,sp:0,t:0});}
  else dropGem(e.x,e.y,1,false);
}
function dropGem(x,y,v,heal){
  if(gems.length>420&&!heal&&v>0){let b=null,bd=1e9;for(const q of gems){const d=dist2(x,y,q.x,q.y);if(d<bd){bd=d;b=q;}}if(b){b.v+=v;return;}}
  gems.push({x,y,v,heal,mag:false,sp:0,t:0});
}
function gainXP(v){S.xp+=v;while(S.xp>=S.need){S.xp-=S.need;S.lvl++;S.need=GM.ramp.xp_base+(S.lvl-1)*GM.ramp.xp_step;S.pend++;}}

/* ---------- level up ---------- */
let choices=[],lvAt=0;
function nextParts(){return ORDER.filter(q=>PARTS.includes(q)&&!owned[q]);}
function makeChoices(){
  const pool=[];
  for(const p of PARTS){if(owned[p]&&owned[p]<MAXLV)pool.push({p,isNew:false,w:1});}
  const no=PARTS.filter(q=>owned[q]).length;const nx=nextParts();
  const c=[];if(nx.length&&S.t>=memberAt(no)-12)nx.slice(0,2).forEach(p=>c.push({p,isNew:true}));
  const NC=TIER().cards||3;
  while(c.length<NC&&pool.length){let tw=pool.reduce((a,x)=>a+x.w,0),r=Math.random()*tw,i=0;for(;i<pool.length-1;i++){r-=pool[i].w;if(r<=0)break;}c.push(pool.splice(i,1)[0]);}
  if(c.length<NC)c.push({heal:true});
  return c.slice(0,NC);
}
function openLevel(){
  sfx('level_up');
  S.mode='level';joy=null;choices=makeChoices();
  if(SIM){S.mode='play';choose(botPick(choices),true);return;}
  const box=$('#cards');box.innerHTML='';
  choices.forEach((c,i)=>{const b=document.createElement('button');b.className='card';
    if(c.heal){b.style.setProperty('--c','#FFC9DD');b.innerHTML='<div class="pic"><svg width="70" height="64" viewBox="0 0 70 64"><path d="M35 60C10 42 2 30 2 18A16 16 0 0 1 35 10a16 16 0 0 1 33 8c0 12-8 24-33 42z" fill="#FF5FA2" stroke="#231C33" stroke-width="4"/></svg></div><div><div class="nm">Snack</div><div class="ln">Heal 40</div></div>';}
    else{const f=FAM[c.p];b.style.setProperty('--c',hexA(f.col,.55));
      b.innerHTML='<div class="pic"><img src="img/'+f.img+'.webp" alt=""><span class="tag">'+(c.isNew?'New':'Lv '+(owned[c.p]+1))+'</span></div><div><div class="nm">'+f.name+'</div><div class="ln">'+(c.isNew?f.atk:f.up+', more damage')+'</div></div>';}
    b.addEventListener('click',()=>choose(i));box.appendChild(b);});
  $('#sLevel').classList.add('on');lvAt=performance.now();
}
function choose(i,sim){
  if(!sim&&(S.mode!=='level'||!choices[i]||performance.now()-lvAt<300))return;const c=choices[i];
  if(c.heal)S.hp=Math.min(S.max,S.hp+40);
  else if(c.isNew){owned[c.p]=1;const nm={part:c.p,lv:1,x:S.x+rnd(-20,20),y:S.y+rnd(-20,20),bop:0,face:1};assignNotes(nm);band.push(nm);
    nm.enterU=nextBarCtx()-t0;setLayer();
    if(!SIM)for(let k=0;k<10;k++)fx.push({k:'puff',x:S.x,y:S.y-20,vx:rnd(-80,80),vy:rnd(-80,80),r:rnd(6,10),t:0,life:.4});}
  else{owned[c.p]++;for(const m of band)if(m.part===c.p){m.lv=owned[c.p];m.bop=1;}}
  renderSlots();S.pend--;if(!SIM)$('#sLevel').classList.remove('on');
  if(S.pend>0)openLevel();else{S.mode='play';lastU=songRaw();}
}

/* ---------- the director: the ramp from levels/game.json (VS game data by share of the run) on the song's beat;
   rings on drum fills, elites on chorus downbeats, mini-bosses on the big moments, the final boss on the drop ---------- */
function vsMin(){return Math.min(16,15*S.t/RUN);} // our run is VS minutes 0-15 (docs/research/survivors-difficulty-numbers.md 3.2)
function bandDps(){let v=0;for(const m of band)v+=FAM[m.part].dps*(m.lead?1:1.2)*(1+.3*(m.lv-1));return v*dmgMul();}
const RP=()=>GM.ramp,D=()=>LV.diff-1,TIER=()=>tierRules();
function hpScale(){const r=RP();return r.hp_base*Math.pow(r.hp_growth_per_m,vsMin())*(1+r.hp_per_diff*D())*(LV.hard||1)*(TIER().hp||1);} // hard: the per-song knob tools/sim.mjs --calibrate sets
function enemyDmg(){const m=vsMin();let v=5;for(const[at,d]of RP().enemy_damage)if(m>=at)v=d;return v*(1+RP().damage_per_diff*D());}
function spawnRate(){const r=RP();return r.spawn_base*Math.pow(r.spawn_growth_per_m,vsMin())*(1+r.spawn_per_diff*D())*(TIER().spawn||1);}
function hordeOn(){const h=RP().horde,m=vsMin();return h&&m>=h.from_m&&m<h.to_m;}
function aliveFloor(){const r=RP();let f=Math.min(r.cap,r.floor_base*Math.pow(r.floor_growth_per_m,vsMin()));if(hordeOn())f=Math.max(f,r.horde.floor);return f;}
function energyNow(){const u=pos(songRaw());if(u<LS)return .4;const b=Math.floor((u-LS)/BAR)%NB;return LV.energy[b]==null?.5:LV.energy[b];}
function rankPool(){const m=vsMin(),at=RP().rank_at_m,p=[];LV.enemies.forEach((k,i)=>{if(m>=(at[i]==null?8:at[i]))p.push(i);});return p.length?p:[0];}
function spawn(kind,x,y,opt){
  opt=opt||{};let st,img,hp,dmg;const hs=hpScale(),r=RP(),dd=1+r.damage_per_diff*D(),knob=(1+r.hp_per_diff*D())*(LV.hard||1)*(TIER().hp||1);
  if(kind==='boss'){img=LV.boss;st={spd:opt.final?74:66,h:126};
    hp=(opt.final?r.boss_hp_per_level:opt.mid?r.mid_hp_per_level:r.mini_hp_per_level)*S.lvl*knob; // VS: boss health = base x player level
    dmg=r.boss_damage*dd*(TIER().boss_damage||1);}
  else if(kind==='elite'){const i=opt.i!=null?opt.i:Math.floor(Math.random()*LV.elites.length);img=LV.elites[i];st=GM.elites[i%2];hp=st.hp*hs*(TIER().elite_hp||1);dmg=r.elite_damage*dd;}
  else{const i=kind;img=LV.enemies[i];st=GM.ranks[i]||GM.ranks[GM.ranks.length-1];hp=st.hp*hs*rnd(.9,1.1)*(opt.weak||1);dmg=enemyDmg();}
  const e={img,x,y,hp,max:hp,spd:st.spd*(kind==='boss'?1:rnd(.9,1.1))*(1+S.t*r.enemy_speed_per_s)*1.1*(TIER().speed||1),h:st.h*(opt.big||1),r:st.h*(opt.big||1)*.34,flash:0,kx:0,ky:0,cd:0,
    elite:kind==='elite',boss:kind==='boss',final:!!opt.final,seed:Math.random()*9,dead:false,dmg,slowT:0};

function director(dt){

/* ---------- update ---------- */
const GRID=48;let grid=new Map();
function gk(x,y){return((Math.floor(x/GRID)+5000)*10007)+(Math.floor(y/GRID)+5000);}
function update(dt){
  S.t+=dt;if(SIM)simT+=dt;
  const[dx,dy]=moveDir();const sp=128*(1+.08*perk('feet'));
  S.x+=dx*sp*dt;S.y+=dy*sp*dt;
  if(Math.abs(dx)>.05)S.face=dx<0?-1:1;
  if(dx||dy){S.fa=Math.atan2(dy,dx);S.walk+=dt;}else S.walk=0;
  S.hurt=Math.max(0,S.hurt-dt*2.5);S.shake=Math.max(0,S.shake-dt);
  S.hp=Math.min(S.max,S.hp+dt*(RP().regen_per_s+.35*perk('snack')));S.inv=Math.max(0,(S.inv||0)-dt);
  if(REP){lowCheck(dt);if(swarms.length)swarmCheck();}
  const others=band.filter(m=>!m.lead),n=others.length;
  memberTick(dt);for(const m of band){if(m.lead){m.x=S.x;m.y=S.y;}}
  others.forEach((m,i)=>{const an=i/Math.max(1,n)*6.283+S.t*.35,r=60+n*5;const tx=S.x+Math.cos(an)*r,ty=S.y+Math.sin(an)*r*.78;
    const k=Math.min(1,dt*3.2);const ox=m.x;m.x+=(tx-m.x)*k;m.y+=(ty-m.y)*k;if(Math.abs(m.x-ox)>.4)m.face=m.x<ox?-1:1;});
  fireNotes();
  director(dt);
  grid=new Map();
  for(const e of enemies){if(e.dead)continue;const k=gk(e.x,e.y);let c=grid.get(k);if(!c)grid.set(k,c=[]);c.push(e);}
  const far=(Math.max(W,H)/Z)*1.1,armor=1-.1*perk('skin');
  for(const e of enemies){
    if(e.dead)continue;
    let vx=S.x-e.x,vy=S.y-e.y;const d=Math.hypot(vx,vy)||1;vx/=d;vy/=d;
    if(d>far&&!e.boss){const[x,y]=edgePoint();e.x=x;e.y=y;continue;}
    e.slowT=Math.max(0,e.slowT-dt);const spd=e.spd*(e.slowT>0?.5:1)*(e.final&&S.t>RUN+30?1.6:1);
    e.x+=(vx*spd+e.kx)*dt;e.y+=(vy*spd+e.ky)*dt;
    const dec=Math.exp(-7*dt);e.kx*=dec;e.ky*=dec;
    e.flash=Math.max(0,e.flash-dt);e.cd=Math.max(0,e.cd-dt);e.face=vx<0?-1:1;
    const cx=Math.floor(e.x/GRID),cy=Math.floor(e.y/GRID);
    for(let ix=cx-1;ix<=cx+1;ix++)for(let iy=cy-1;iy<=cy+1;iy++){const c=grid.get(((ix+5000)*10007)+(iy+5000));if(!c)continue;
      for(const o of c){if(o===e||o.dead)continue;const sx=e.x-o.x,sy=e.y-o.y,dd=sx*sx+sy*sy,rr=(e.r+o.r)*.9;
        if(dd<rr*rr&&dd>.01){const l=Math.sqrt(dd),push=(rr-l)*.5;const wE=e.boss?.1:1;e.x+=sx/l*push*wE;e.y+=sy/l*push*wE;}}}
    if(d<e.r+16&&e.cd<=0&&!(S.inv>0)){e.cd=RP().enemy_hit_cooldown_s;if(!S.god){S.hp-=e.dmg*armor;sfx('hurt');if(SIM){const k=e.final?'final':e.boss?'mini':e.elite?'elite':'crowd';S.dmgLog[k]=(S.dmgLog[k]||0)+Math.round(e.dmg*armor);}S.hurt=1;S.inv=RP().hit_invincible_s;S.shake=Math.max(S.shake,.12);}
      S.minHp=Math.min(S.minHp,Math.max(0,S.hp)/S.max);
      if(S.hp<=0&&S.mode==='play'){if(perk('encore')&&!S.revived){S.revived=true;S.hp=S.max*.5;S.inv=2;for(const o of enemies)if(!o.boss&&dist2(o.x,o.y,S.x,S.y)<200*200){o.hp=0;kill(o);}}else{S.hp=0;lose();return;}}}
  }
  for(const s of shots){
    s.life-=dt;
    if(s.k==='ring'){s.t+=dt;const q=Math.min(1,s.t/s.life);s.r=s.R*(1-Math.pow(1-q,2.2));
      for(const e of enemies){if(e.dead||s.hit.has(e))continue;const d=Math.sqrt(dist2(s.x,s.y,e.x,e.y-e.h*.3));if(d<s.r+e.r*.6){s.hit.add(e);const a=Math.atan2(e.y-s.y,e.x-s.x);if(s.slow)e.slowT=s.slow;const pu=s.push||60;hit(e,s.dmg,Math.cos(a)*pu,Math.sin(a)*pu);}}
      continue;}

      for(const e of enemies){if(e.dead||s.hit.has(e))continue;const dx=e.x-s.x,dy=e.y-e.h*.4-s.y,d=Math.hypot(dx,dy);if(Math.abs(d-s.r)>16+e.r)continue;

      continue;}
    if(s.k==='orbit'){s.t+=dt;s.R+=(s.RT-s.R)*Math.min(1,dt*6);s.a+=dt*3.4;s.x=S.x+Math.cos(s.a)*s.R;s.y=S.y-22+Math.sin(s.a)*s.R*.8;
      for(const e of enemies){if(e.dead)continue;if(dist2(s.x,s.y,e.x,e.y-e.h*.4)<(s.r+e.r)*(s.r+e.r)){const last=s.cd.get(e)||-9;if(s.t-last>.45){s.cd.set(e,s.t);const a=Math.atan2(e.y-s.y,e.x-s.x);hit(e,s.dmg,Math.cos(a)*80,Math.sin(a)*80);}}}
      continue;}
    if(s.k==='boom'){s.t+=dt;const back=s.t>s.life*.5;if(back){const a=Math.atan2(S.y-22-s.y,S.x-s.x);s.vx=Math.cos(a)*360;s.vy=Math.sin(a)*360;}
      s.x+=s.vx*dt;s.y+=s.vy*dt;
      for(const e of enemies){if(e.dead)continue;if(dist2(s.x,s.y,e.x,e.y-e.h*.4)<(s.r+e.r)*(s.r+e.r)){const last=s.cd.get(e)||-9;if(s.t-last>.3){s.cd.set(e,s.t);hit(e,s.dmg*.6,s.vx*.1,s.vy*.1);}}}
      continue;}
    if(s.k==='homing'){if(!s.tgt||s.tgt.dead)s.tgt=nearest(s.x,s.y,520);
      if(s.tgt){const want=Math.atan2(s.tgt.y-s.tgt.h*.4-s.y,s.tgt.x-s.x);let da=want-s.an;da=Math.atan2(Math.sin(da),Math.cos(da));s.an+=Math.max(-7*dt,Math.min(7*dt,da));}
      const sp2=Math.min(330,Math.hypot(s.vx,s.vy)+dt*260);s.vx=Math.cos(s.an)*sp2;s.vy=Math.sin(s.an)*sp2;}
    s.x+=s.vx*dt;s.y+=s.vy*dt;
    for(const e of enemies){if(e.dead)continue;const rr=s.r+e.r;if(dist2(s.x,s.y,e.x,e.y-e.h*.4)>rr*rr)continue;
      if(s.hit&&s.hit.has(e))continue;
      const a=Math.atan2(s.vy,s.vx);
      if(s.k==='bub'){for(const o of enemies){if(!o.dead&&dist2(s.x,s.y,o.x,o.y-o.h*.4)<(s.pop+o.r)*(s.pop+o.r))hit(o,s.dmg,Math.cos(a)*40,Math.sin(a)*40);}
        if(!SIM)fx.push({k:'pop',x:s.x,y:s.y,r:s.pop,t:0,life:.25,col:s.col});if(REP)rev('pop',s.x,s.y,s.pop+rid(RCOL,s.col)*1000);s.life=0;break;}
      if(s.k==='heavy'){s.hit.add(e);hit(e,s.dmg,Math.cos(a)*170,Math.sin(a)*170);if(!SIM)fx.push({k:'pop',x:e.x,y:e.y-e.h*.4,r:22,t:0,life:.18,col:s.col});if(REP)rev('pop',e.x,e.y-e.h*.4,22+rid(RCOL,s.col)*1000);if(--s.pierce<0){s.life=0;break;}continue;}
      if(s.k==='line'){s.hit.add(e);hit(e,s.dmg,Math.cos(a)*30,Math.sin(a)*30);continue;}

  const magR=130*(1+.4*perk('magnet'));
  for(const q of gems){q.t+=dt;const d=Math.sqrt(dist2(q.x,q.y,S.x,S.y-16));

/* ---------- drawing ---------- */
function hash(a,b){let h=(a*374761393+b*668265263)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296;}
let GC={};
function groundColors(){const b=LV?LV.ground:'#1E524C',a=LV?LV.accent:'#FFD84A';
  GC={base:b,blob:hexA(mixHex(b,'#ffffff',.25),.12),tuft:hexA(mixHex(b,a,.35),.45),pebA:hexA(mixHex(b,'#ffffff',.35),.3),pebB:hexA(mixHex(b,a,.5),.28),

  const T=128,hw=W/2/z,hh=H/2/z,x0=Math.floor((cx-hw)/T)-1,x1=Math.floor((cx+hw)/T)+1,y0=Math.floor((cy-hh)/T)-1,y1=Math.floor((cy+hh)/T)+1;

    const r=hash(ix,iy),bx=ix*T,by=iy*T;
    if(r<.16){g.fillStyle=GC.blob;g.beginPath();g.ellipse(bx+64,by+64,90,52,0,0,7);g.fill();}
    for(let j=0;j<3;j++){const q=hash(ix*7+j,iy*13-j),px=bx+hash(ix+j*3,iy)*T,py=by+hash(ix,iy+j*5)*T;

      g.lineWidth=4;g.strokeStyle='rgba(255,255,255,'+(.4+.5*a)+')';g.stroke();}

      g.fillStyle=s.col;g.strokeStyle='#231C33';g.lineWidth=3;g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill();g.stroke();g.fillStyle='rgba(255,255,255,.6)';g.beginPath();g.arc(s.x-s.r*.35,s.y-s.r*.35,s.r*.28,0,7);g.fill();}

    perkChoices.forEach(k=>{const p=PERKS[k],b=document.createElement('button');b.className='card';b.style.setProperty('--c',hexA(p.col,.6));
      b.innerHTML='<div class="pic"><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="'+p.col+'" stroke="#231C33" stroke-width="4"/><text x="32" y="43" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="30" fill="#231C33">'+p.ic+'</text></svg></div><div><div class="nm">'+p.name+'</div><div class="ln">'+p.ln+'</div></div>';
      b.addEventListener('click',()=>{SAVE.perks[k]=perk(k)+1;persist();perkChoices=[];box.innerHTML='';$('#oS').textContent=LV.title+' cleared';$('#bAgain').style.display='';$('#bMap').textContent='Next stop';});box.appendChild(b);});
    $('#bAgain').textContent='Play again';$('#bAgain').style.display=perkChoices.length?'none':'';$('#bMap').textContent=perkChoices.length?'Tour map':'Next stop';
    show('#sOver',true);},1100);}
function fillBand(){const b=$('#oB');b.innerHTML='';for(const m of band){const d=document.createElement('div');d.className='slot';d.innerHTML='<img src="img/'+FAM[m.part].img+'.webp" alt=""><span class="lv">'+m.lv+'</span>';b.appendChild(d);}}
function togglePause(){
  if(REP&&REP.isPlaying())REP.end();
  if(S.mode==='play'){S.mode='pause';joy=null;ac.suspend();show('#sPause',true);}
  else if(S.mode==='pause'){show('#sPause',false);ac.resume().then(()=>{S.mode='play';lastU=songRaw();});}
}
function toMap(){if(perkChoices.length){SAVE.perks[perkChoices[0]]=perk(perkChoices[0])+1;persist();perkChoices=[];}
  stopSong();if(ac){bus.gain.cancelScheduledValues(ac.currentTime);bus.gain.value=0;if(ac.state!=='running')ac.resume();}renderMap();}
/* desktop keys (vendor/hotkeys.js, the Toybox default). Movement, 1 2 3 and P / Esc are in the input section above. */
if(!SIM&&window.ToyboxHotkeys){
  const on=id=>$(id).classList.contains('on');
  const press=()=>{ // Enter or Space: the main button of whatever is on show
    if(on('#sPause'))$('#bResume').click();
    else if(on('#sOver')){const a=$('#bAgain'),m=$('#bMap');if(document.querySelector('#oP .card'))return false;(S.won||a.style.display==='none'?m:a).click();}
    else if(on('#sPick')){if(!$('#bGo').disabled)$('#bGo').click();}
    else if(on('#sStart')){if(!$('#bStart').disabled)$('#bStart').click();}
    else if(on('#sMap')){const n=document.querySelector('#path .node.next')||document.querySelector('#path .node:not(.lock)');if(n)n.click();}
    else return false;};
  ToyboxHotkeys({
    volume:{get:()=>OPT.vol===undefined?1:OPT.vol,set:v=>{OPT.vol=v;muted=false;saveOpt();applyMaster();}},
    mute:{get:()=>muted,set:x=>{muted=x;applyMaster();}},
    actions:[{keys:['enter',' '],run:press},{keys:['escape','backspace'],run:()=>{if(!on('#sPick'))return false;$('#bBack').click();}}],
    hints:()=>on('#sPause')?[[['P'],'Resume']]:on('#sLevel')?[[['1','2','3'],'Pick a card']]:
      S.mode==='play'?[[['W','A','S','D'],'Move'],[['P'],'Pause']]:on('#sPick')?[[['Enter'],'Play'],[['Esc'],'Back']]:[[['Enter'],'Play']]});
}
if(!SIM){
  $('#pb').addEventListener('click',togglePause);
  $('#bResume').addEventListener('click',togglePause);
  document.querySelectorAll('[data-opt]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();ensureCtx();setOpt(b.dataset.opt,!OPT[b.dataset.opt]);}));renderOpt();
  document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('button'))sfx('ui_tap');},true);
  $('#bQuit').addEventListener('click',()=>{show('#sPause',false);toMap();});
  $('#bStart').addEventListener('click',()=>{ensureCtx();ac.resume();renderMap();});
  $('#bGo').addEventListener('click',goLevel);
  $('#bBack').addEventListener('click',()=>show('#sPick',false));
  $('#bAgain').addEventListener('click',()=>{show('#sOver',false);begin();});
  $('#bMap').addEventListener('click',toMap);
  document.addEventListener('visibilitychange',()=>{
    if(!ac)return;
    if(document.hidden){if(S.mode==='play')togglePause();else if(S.mode==='level'||S.mode==='over')ac.suspend();}
    else if(S.mode==='level'||S.mode==='over')ac.resume();
  });
}

let prevT=0;
function frame(nowMs){
  requestAnimationFrame(frame);
  if(REP&&REP.update(nowMs)){prevT=nowMs;return;} // a replay is playing: it drew this frame
  const dt=Math.min(.05,(nowMs-(prevT||nowMs))/1000);prevT=nowMs;
  if(S.mode==='play')update(dt);
  else if(S.mode==='over'){for(const f of fx){f.t+=dt;if(f.vx!==undefined){f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.k==='note')f.vy+=180*dt;}}fx=fx.filter(f=>f.t<f.life);
    memberTick(dt);overRec-=dt;if(S.won)fireNotesVisual();}
  if(S.mode==='play'||S.mode==='over'){S.camx+=(S.x-S.camx)*Math.min(1,dt*8);S.camy+=(S.y-S.camy)*Math.min(1,dt*8);}
  draw();if(S.mode==='play'||S.mode==='level'||S.mode==='pause')hud();
  if(REP&&(S.mode==='play'||(S.mode==='over'&&S.won&&overRec>0)))REP.record(nowMs);
}
// after a win the band keeps bopping to the song
function fireNotesVisual(){const u=songRaw();let a=lastU;lastU=u;if(u<=a)return;if(u-a>.25)a=u-.25;const pa=pos(a),pb=pos(u);
  for(const m of band){const l=m.list;const f=(x,y)=>{let lo=0,hi=l.length;while(lo<hi){const mid=(lo+hi)>>1;if(l[mid].t<=x)lo=mid+1;else hi=mid;}if(lo<l.length&&l[lo].t<=y){const nt=l[lo];m.bop=Math.min(1.5,.55+.45*Math.min(2,nt.w));m.flash=1;m.lastHeard=now();voiceFx(m,nt);m.mc=m.heldSing?(m.part==='voice_bom'||m.part==='voice_doowah_lo'?3:nt.d>=.4?2:4):1;m.mUntil=now()+Math.max(.12,Math.min(nt.d,1.2));}};
    if(pb>=pa)f(pa,pb);else{f(pa,LE);f(LS-1e-6,pb);}}}

/* ---------- the bots for the balance check ---------- */
let BOT='kite';
function botPick(cs){
  if(BOT==='idle')return 0;
  const hpLow=S.hp<S.max*.45;const iHeal=cs.findIndex(c=>c.heal);if(hpLow&&iHeal>=0)return iHeal;
  const iNew=cs.findIndex(c=>c.isNew);if(iNew>=0)return iNew;
  let best=0,bv=-1;cs.forEach((c,i)=>{if(c.heal)return;const v=FAM[c.p].dps*(c.p==='voice_lead'?1:1.2)+Math.random()*4;if(v>bv){bv=v;best=i;}});return best;
}
function botSteer(){ // look in 16 directions, walk the one with the fewest enemies close along it; fight a boss at mid range; pick up notes when safe
  if(BOT==='idle'){botDir=null;return;}
  const near=[];for(const e of enemies){const dx=e.x-S.x,dy=e.y-S.y;if(dx*dx+dy*dy<300*300)near.push(e);}
  let gem=null,gd=1e12;for(const q of gems){const d=dist2(q.x,q.y,S.x,S.y);if(d<gd){gd=d;gem=q;}}
  let best=null,bv=-1e9;
  for(let i=0;i<16;i++){const an=i/16*6.283,cx=Math.cos(an),cy=Math.sin(an);let v=0;
    for(const e of near){const dx=e.x-S.x,dy=e.y-S.y,d=Math.hypot(dx,dy)||1;const along=(dx*cx+dy*cy)/d;
      const w=(e.boss?4:e.elite?2:1)*(1+along)*(1+along)/Math.max(30,d);v-=w*60;}
    if(S.boss){const dx=S.boss.x-S.x,dy=S.boss.y-S.y,d=Math.hypot(dx,dy)||1;if(d>240)v+=(dx*cx+dy*cy)/d*.6;}
    if(gem&&gd<380*380){const d=Math.sqrt(gd)||1;v+=((gem.x-S.x)*cx+(gem.y-S.y)*cy)/d*.35;}
    v-=Math.hypot(S.x+cx*200,S.y+cy*200)/4000; // drift back toward the middle of the map, not off forever
    if(botDir)v+=(botDir[0]*cx+botDir[1]*cy)*.25;
    if(v>bv){bv=v;best=[cx,cy];}}
  botDir=best;
}
async function simRun(id,opt){
  opt=opt||{};BOT=opt.bot||'kite';botDir=null;Object.assign(GM.ramp,opt.tune||{});TIER_I=opt.tier||0;SAVE={cleared:{},perks:Object.assign({},opt.perks||{})};
  const lv=LEVELS.find(l=>l.id===id);await loadLevel(lv,()=>{});simT=0;await begin();
  const dt=1/30,cap=RUN+150;let t=0;
  const trace=[];let nt=0;
  while(S.mode==='play'&&t<cap){botSteer();update(dt);t+=dt;
    if(opt.trace&&S.t>=nt){nt+=10;trace.push([Math.round(S.t),Math.round(S.hp),enemies.length,band.length,S.kills,S.lvl,fireLog.length,Math.round(hpScale()),enemies.length?Math.round(Math.min(...enemies.map(e=>Math.hypot(e.x-S.x,e.y-S.y)))):0,S.boss?Math.round(S.boss.hp)+"/"+Math.round(S.boss.max)+"@"+Math.round(Math.hypot(S.boss.x-S.x,S.boss.y-S.y)):"-",Math.round(bandDps())]);}}
  if(opt.trace)console.log('t hp enemies band kills lvl fires hpScale nearest\n'+trace.map(r=>r.join(' ')).join('\n'));
  return {level:id,bot:BOT,result:S.won?'win':S.mode==='over'?'lose':'timeout',t:Math.round(S.t),bossAt:Math.round(FINAL_AT),run:RUN,
    bossKillT:S.bossT?Math.round(S.bossT):null,combos:combos.map(c=>c.id).join('+'),dmgLog:JSON.stringify(S.dmgLog),minHp:Math.round(S.minHp*100),kills:S.kills,lvl:S.lvl,band:band.length+'/'+PARTS.length};
}

/* ---------- boot ---------- */
if(!SIM){
  (function troupe(){const t=$('#troupe');[['bass',78],['drums',86],['player',112],['brass',84],['guitar',80]].forEach(([k,h],i)=>{const im=document.createElement('img');im.src='img/'+k+'.webp';im.alt='';im.style.height=h+'px';im.style.animationDelay=(i*.09)+'s';t.appendChild(im);});})();
  groundColors();requestAnimationFrame(frame);
  loadLevels().then(()=>{const b=$('#bStart');b.disabled=false;b.textContent='Play';})
    .catch(err=>{console.error(err);$('#bStart').textContent='Could not load';});
}
window.__bs={S,get band(){return band;},get enemies(){return enemies;},get owned(){return owned;},get shots(){return shots;},get gems(){return gems;},fireLog,NOTES,RATE,GM:()=>GM,SAVE:()=>SAVE,combos:()=>combos,openCase:()=>openCase(),
  levels:()=>LEVELS,loadLevels,simRun,songPos:()=>pos(songRaw()),gainXP:v=>{gainXP(v);},choose,setTime:t=>{S.t=t;},god:on=>{S.god=on;},ctx:()=>ac,
  layerGain:p=>LAYER[p]&&LAYER[p].gain.value,busGain:()=>bus&&bus.gain.value,unlockAll:()=>{LEVELS.forEach(l=>SAVE.cleared[l.id]=true);persist();},
  play:i=>{pickI=i;return goLevel();},map:()=>renderMap(),
  replay:()=>REP,testBoss:()=>{const e=spawn('boss',S.x+150,S.y,{big:.75});S.boss=e;return e;},hit:(e,d)=>hit(e,d,0,0)};
})();
