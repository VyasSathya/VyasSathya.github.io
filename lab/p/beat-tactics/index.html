<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Beat Tactics</title>
<style>
:root{--bg:#f4f4f2;--field:#fff;--ink:#16181d;--mute:#6b7080;--line:rgba(0,0,0,.09);--acc:#119c80;--panel:rgba(255,255,255,.88)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1014;--field:#151820;--ink:#e8eaee;--mute:#8a90a0;--line:rgba(255,255,255,.08);--acc:#4fd1b5;--panel:rgba(21,24,32,.88)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column}
#hud{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);flex:none}
#name{font-weight:600;font-size:15px;letter-spacing:-.01em}
#stats{display:flex;gap:14px;font-variant-numeric:tabular-nums}
#stats span{font-size:15px;font-weight:600}
#stats i{font-style:normal;font-size:12px;color:var(--mute);font-weight:500;margin-right:4px}
#stage{position:relative;flex:1;min-height:0}
canvas{display:block;touch-action:none}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#ov .p{pointer-events:auto;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:22px 24px;text-align:center;width:340px;max-width:86%}
#ov .t{font-size:22px;font-weight:650;letter-spacing:-.02em}
#ov .s{font-size:14px;color:var(--mute);margin-top:6px;line-height:1.45}
button{font:inherit;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:10px;padding:10px 18px;font-size:15px;font-weight:600}
#ov button{margin-top:16px;background:var(--acc);color:#fff;border:0;width:100%}
#tray{position:absolute;left:0;right:0;bottom:0;height:72px;display:none;align-items:center;justify-content:center;pointer-events:none}
#tray button{pointer-events:auto;min-width:140px}
#tray button.on{background:var(--acc);color:#fff;border-color:transparent}
nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);flex:none}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mute);font-size:13px;font-weight:600;padding:14px 0}
nav button.on{color:var(--ink);box-shadow:inset 0 2px 0 var(--acc)}
</style>
</head>
<body>
<div id="hud"><div id="name"></div><div id="stats"></div></div>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="tray"><button id="ready">Ready</button></div>
  <div id="ov"><div class="p"><div class="t"></div><div class="s"></div><button>Play</button></div></div>
</div>
<nav id="nav"></nav>
<script>
"use strict";
const Q=new URLSearchParams(location.search);
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
const P=dark?{bg:'#0e1014',tA:'#141821',tB:'#181d27',ink:'#e8eaee',mute:'#8a90a0',line:'rgba(255,255,255,.08)',acc:'#4fd1b5',bad:'#f0606e',gold:'#f5b544',wall:'#2c3344',
  kick:'#f0606e',snare:'#f5b544',hat:'#8b9bff',bass:'#c08cff',lead:'#4fd1b5'}
 :{bg:'#f4f4f2',tA:'#ffffff',tB:'#ebebe7',ink:'#16181d',mute:'#6b7080',line:'rgba(0,0,0,.09)',acc:'#119c80',bad:'#d9384a',gold:'#d98a0b',wall:'#cdd2db',
  kick:'#d9384a',snare:'#d98a0b',hat:'#5566e0',bass:'#8a4fd8',lead:'#119c80'};
const ri=n=>Math.floor(Math.random()*n),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,f)=>a+(b-a)*f,ease=f=>1-Math.pow(1-f,3);
const stage=document.getElementById('stage'),cv=document.getElementById('c'),g=cv.getContext('2d');
let W=0,H=0;

// ---------------- audio
let ac=null,out=null,noise=null;
function audioInit(){
  if(!ac){
    try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
    out=ac.createGain();out.gain.value=Q.has('mute')?0:.8;out.connect(comp);comp.connect(ac.destination);
    const n=ac.sampleRate;noise=ac.createBuffer(1,n,n);const d=noise.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  }
  if(ac.state!=='running')ac.resume();
}
document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();else ac.resume()});
const mf=m=>440*Math.pow(2,(m-69)/12);
function env(node,t,a,peak,d){const gn=ac.createGain();gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+a);gn.gain.exponentialRampToValueAtTime(.0001,t+a+d);node.connect(gn);gn.connect(out);return gn}
function osc(type,f,t,dur){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(t+dur+.06);return o}
function nz(t,dur){const s=ac.createBufferSource();s.buffer=noise;s.start(t,Math.random()*.5);s.stop(t+dur+.06);return s}
function filt(type,f,q){const b=ac.createBiquadFilter();b.type=type;b.frequency.value=f;if(q)b.Q.value=q;return b}
const S={
  kick(t,v=1){const o=osc('sine',150,t,.35);o.frequency.exponentialRampToValueAtTime(42,t+.13);env(o,t,.002,.9*v,.3)},
  snare(t,v=1){const n=nz(t,.2),f=filt('highpass',1400);n.connect(f);env(f,t,.002,.42*v,.16);const o=osc('triangle',190,t,.1);env(o,t,.002,.22*v,.08)},
  hat(t,v=1){const n=nz(t,.06),f=filt('highpass',7500);n.connect(f);env(f,t,.001,.15*v,.035)},
  clap(t,v=1){for(let i=0;i<3;i++){const tt=t+i*.011,n=nz(tt,.14),f=filt('bandpass',1300,1.2);n.connect(f);env(f,tt,.001,.38*v,i===2?.14:.02)}},
  bass(t,m,dur,v=1){const o=osc('sawtooth',mf(m),t,dur),f=filt('lowpass',520,2);o.connect(f);env(f,t,.005,.3*v,dur)},
  sub(t,m){const o=osc('sine',mf(m),t,.6);o.frequency.exponentialRampToValueAtTime(mf(m)/2,t+.5);env(o,t,.005,.7,.55);const n=nz(t,.3),f=filt('lowpass',900);n.connect(f);env(f,t,.002,.35,.25)},
  lead(t,m,dur,v=1){const o=osc('square',mf(m),t,dur),f=filt('lowpass',2400);o.connect(f);env(f,t,.008,.12*v,dur);const o2=osc('triangle',mf(m+12),t,dur);env(o2,t,.008,.06*v,dur*.8)},
  pluck(t,m,v=1){const o=osc('triangle',mf(m),t,.3);env(o,t,.003,.2*v,.24)},
  wood(t,m=84,v=1){const o=osc('sine',mf(m),t,.08);env(o,t,.001,.25*v,.05)},
  click(t,v=1){const o=osc('sine',1800,t,.03);env(o,t,.001,.07*v,.02)},
  stab(t,ms,v=1){for(const m of ms){const o=osc('sawtooth',mf(m),t,.35),f=filt('lowpass',1800);o.connect(f);env(f,t,.004,.09*v,.3)}},
  thud(t){const o=osc('sine',95,t,.3);o.frequency.exponentialRampToValueAtTime(40,t+.25);env(o,t,.002,.8,.25);const n=nz(t,.15),f=filt('lowpass',600);n.connect(f);env(f,t,.002,.4,.12)},
  pad(t,ms,dur){for(const m of ms){const o=osc('triangle',mf(m),t,dur);env(o,t,.15,.05,dur)}}
};

// ---------------- clock: game logic resolves each beat a hair early so its sounds can be scheduled exactly on the beat
const CLK={on:false,spb:.6,b:0,next:0,lastB:-1,lastT:0};
const LOOK=.045;
function clockStart(bpm){CLK.spb=60/bpm;CLK.b=0;CLK.next=ac.currentTime+.35;CLK.lastB=-1;CLK.lastT=0;CLK.on=true}
function setBpm(bpm){CLK.spb=60/bpm}
function tickClock(){if(!CLK.on)return;while(CLK.on&&ac.currentTime>=CLK.next-LOOK){const b=CLK.b,t=CLK.next;CLK.lastB=b;CLK.lastT=t;CLK.b++;CLK.next+=CLK.spb;game.onBeat(b,t)}}
function vis(now){let b=CLK.lastB,t=CLK.lastT;if(b>=0&&now<t){b--;t-=CLK.spb}return{b,idx:((b%4)+4)%4,ph:CLK.on&&b>=0?clamp((now-t)/CLK.spb,0,1):1}}
const later=[];function at(t,fn){later.push({t,fn})}

// ---------------- drawing helpers
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function circle(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function epos(o,now){let f=1;if(o.mt){f=now<o.mt?0:ease(clamp((now-o.mt)/.1,0,1))}return{x:lerp(o.px,o.x,f),y:lerp(o.py,o.y,f)}}
function chev(cx,cy,dx,dy,s,col,a){g.globalAlpha=a;g.fillStyle=col;const px=-dy,py=dx;g.beginPath();g.moveTo(cx+dx*s,cy+dy*s);g.lineTo(cx-dx*s*.3+px*s*.8,cy-dy*s*.3+py*s*.8);g.lineTo(cx-dx*s*.3-px*s*.8,cy-dy*s*.3-py*s*.8);g.closePath();g.fill();g.globalAlpha=1}
function beatDots(now,y,col){const v=vis(now);for(let i=0;i<4;i++){const x=W/2+(i-1.5)*20,on=CLK.on&&v.b>=0&&i===v.idx,k=on?Math.max(0,1-v.ph*2.2):0;
  if(on)circle(x,y,4+3*k,col||P.acc);else{g.globalAlpha=.35;circle(x,y,3.5,P.mute);g.globalAlpha=1}}}
function label(text,x,y,size,col,align,weight){g.fillStyle=col;g.font=`${weight||600} ${size}px Inter,system-ui,-apple-system,sans-serif`;g.textAlign=align||'center';g.textBaseline='middle';g.fillText(text,x,y)}
function drawFx(list,now,bx,by,cs){for(let i=list.length-1;i>=0;i--){const f=list[i],a=now-f.t;if(a<0)continue;
  if(f.k==='pop'){const T=.45;if(a>T){list.splice(i,1);continue}const k=a/T,cx=bx+(f.x+.5)*cs,cy=by+(f.y+.5)*cs;
    g.globalAlpha=1-k;g.strokeStyle=f.col;g.lineWidth=3;g.beginPath();g.arc(cx,cy,cs*(.25+.45*k),0,7);g.stroke();
    if(f.text)label(f.text,cx,cy-cs*.3-k*cs*.4,14,f.col,'center',700);g.globalAlpha=1}
  else if(f.k==='tiles'){const T=.35;if(a>T){list.splice(i,1);continue}g.globalAlpha=(1-a/T)*.55;g.fillStyle=f.col;for(const q of f.tiles){rr(bx+q.x*cs+1,by+q.y*cs+1,cs-2,cs-2,6);g.fill()}g.globalAlpha=1}
  else if(f.k==='text'){const T=1.1;if(a>T){list.splice(i,1);continue}g.globalAlpha=Math.min(1,(T-a)*3);label(f.text,W/2,by+cs*2-a*14,22,f.col||P.ink,'center',700);g.globalAlpha=1}}}

// =====================================================================
// Band Room: every enemy is one part of the song and moves when its part plays
function makeBandRoom(){
  const C=7,R=9,LOOP=[[1,0],[0,1],[-1,0],[0,-1]];
  const CH=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];          // Am F C G
  const MEL=[76,null,74,72, 69,null,72,74, 76,79,76,null, 74,72,69,null];
  const HP={thumper:1,snapper:1,ticker:1,rumbler:2,singer:3};
  const COL={thumper:'kick',snapper:'snare',ticker:'hat',rumbler:'bass',singer:'lead'};
  const PTS={thumper:10,snapper:10,ticker:10,rumbler:30,singer:50};
  const ROOMS=[['thumper','thumper','ticker'],['thumper','ticker','snapper','snapper'],['thumper','thumper','snapper','rumbler'],['ticker','snapper','rumbler','singer']];
  let room,hearts,score,combo,pl,en,walls,door,doorOpen,queued,actedB,over,fx,pending,curB=-1,curT=0,curBar=0,steps=0,bx=0,by=0,cs=40;
  function bpmFor(r){return Math.min(138,92+r*6)}
  function stats(){setStats([['Room',room],['HP',hearts],['Score',score]])}
  function wallAt(x,y){return x<0||y<0||x>=C||y>=R||walls.has(x+','+y)}
  function occ(x,y){return en.find(e=>e.x===x&&e.y===y)}
  function blocked(x,y){return wallAt(x,y)||!!occ(x,y)}
  function newRoom(){
    walls=new Set();en=[];doorOpen=false;door={x:3,y:0};
    pl={x:3,y:R-1,px:3,py:R-1,mt:0,hitT:-9,bump:null};
    const nW=room<2?0:Math.min(5,room);
    for(let i=0;i<nW;i++)for(let k=0;k<30;k++){const x=ri(C),y=2+ri(R-4);if(x!==3&&!walls.has(x+','+y)){walls.add(x+','+y);break}}
    const pool=['thumper','snapper','ticker','rumbler','thumper','ticker','snapper'];
    const list=room<=ROOMS.length?ROOMS[room-1]:Array.from({length:Math.min(7,3+Math.floor(room/2))},()=>pool[ri(pool.length)]).concat(['singer']);
    for(const type of list)for(let k=0;k<80;k++){const x=ri(C),y=ri(R-3);
      if(wallAt(x,y)||occ(x,y)||Math.abs(x-pl.x)+Math.abs(y-pl.y)<4)continue;
      en.push({type,x,y,px:x,py:y,mt:0,hp:HP[type],max:HP[type],dir:Math.random()<.5?[1,0]:[0,1],li:ri(4),ls:0,hitT:-9,beatT:-9,lunge:null});break}
  }
  function reset(){room=1;hearts=3;score=0;combo=0;over=false;fx=[];queued=null;actedB=-1;pending=false;curB=-1;steps=0;newRoom();stats()}
  function start(){reset();clockStart(bpmFor(room))}
  function layout(){const top=58,bot=20;cs=Math.floor(Math.min((W-24)/C,(H-top-bot)/R));bx=Math.round((W-cs*C)/2);by=Math.round(top+(H-top-bot-cs*R)/2)}
  function acts(e,idx,b){switch(e.type){case'thumper':return idx%2===0;case'snapper':return idx%2===1;case'ticker':return true;case'rumbler':return idx<2;case'singer':return MEL[b%16]!=null}}
  function chase(e){const dx=pl.x-e.x,dy=pl.y-e.y,ax=[Math.sign(dx),0],ay=[0,Math.sign(dy)],o=[];
    if(Math.abs(dx)>=Math.abs(dy)){if(dx)o.push(ax);if(dy)o.push(ay)}else{if(dy)o.push(ay);if(dx)o.push(ax)}
    for(const d of o){const x=e.x+d[0],y=e.y+d[1];if(!blocked(x,y))return{x,y}}return null}
  function intent(e,idx,b){
    if(!acts(e,idx,b))return null;
    switch(e.type){
      case'thumper':return chase(e);
      case'rumbler':return idx===0?{blast:true}:chase(e);
      case'snapper':{let x=e.x+e.dir[0],y=e.y+e.dir[1];if(!blocked(x,y))return{x,y};x=e.x-e.dir[0];y=e.y-e.dir[1];if(!blocked(x,y))return{x,y,rev:true};return null}
      case'ticker':{const d=LOOP[e.li],x=e.x+d[0],y=e.y+d[1];return blocked(x,y)?{stuck:true}:{x,y}}
      case'singer':{let best=null,bd=Math.abs(e.x-pl.x)+Math.abs(e.y-pl.y);for(const d of LOOP){const x=e.x+d[0],y=e.y+d[1];if(blocked(x,y)||(x===pl.x&&y===pl.y))continue;const dd=Math.abs(x-pl.x)+Math.abs(y-pl.y);if(dd>bd){bd=dd;best={x,y}}}return best||{stay:true}}
    }}
  function blastTiles(e){const o=[];for(const d of LOOP){let x=e.x+d[0],y=e.y+d[1];while(!wallAt(x,y)){o.push({x,y});x+=d[0];y+=d[1]}}return o}
  function hurt(t){if(over||t-pl.hitT<.05)return;pl.hitT=t;hearts--;combo=0;S.thud(t);at(t,stats);
    if(hearts<=0){over=true;at(t+.7,()=>{CLK.on=false;showOv('Out of hearts','Room '+room+', score '+score,'Play again',start)})}}
  function act(e,b,t){const idx=b%4,it=intent(e,idx,b);e.beatT=t;if(!it)return;
    if(it.blast){const tl=blastTiles(e);fx.push({k:'tiles',tiles:tl,t,col:P.bad});S.sub(t,CH[curBar][0]-24);if(tl.some(q=>q.x===pl.x&&q.y===pl.y))hurt(t);return}
    if(it.stuck){e.li=(e.li+1)%4;e.ls=0;return}
    if(it.stay)return;
    if(it.x===pl.x&&it.y===pl.y){if(e.type!=='singer'){e.lunge={x:it.x-e.x,y:it.y-e.y,t};hurt(t)}return}
    if(blocked(it.x,it.y))return;
    if(it.rev)e.dir=[-e.dir[0],-e.dir[1]];
    e.px=e.x;e.py=e.y;e.x=it.x;e.y=it.y;e.mt=t;
    if(e.type==='ticker'&&++e.ls>=2){e.ls=0;e.li=(e.li+1)%4}}
  function kill(e,t){e.dead=true;en.splice(en.indexOf(e),1);const pts=PTS[e.type]*(1+Math.floor(combo/4));score+=pts;
    fx.push({k:'pop',x:e.x,y:e.y,t,col:P[COL[e.type]],text:'+'+pts});S.stab(t,CH[curBar].map(m=>m+12));
    if(!en.length){doorOpen=true;hearts=Math.min(3,hearts+1)}at(t,stats)}
  function doPlayer(d,t,tight){
    const x=pl.x+d[0],y=pl.y+d[1];combo=tight?combo+1:0;
    if(doorOpen&&x===door.x&&y===door.y){pl.px=pl.x;pl.py=pl.y;pl.x=x;pl.y=y;pl.mt=t;pending=true;S.stab(t,CH[curBar].map(m=>m+24),.8);return}
    if(wallAt(x,y)){pl.bump={x:d[0],y:d[1],t};return}
    const e=occ(x,y);
    if(e){pl.bump={x:d[0],y:d[1],t};e.hp--;e.hitT=t;if(e.hp<=0)kill(e,t);else S.wood(t,72)}
    else{pl.px=pl.x;pl.py=pl.y;pl.x=x;pl.y=y;pl.mt=t}
    S.pluck(t,CH[curBar][steps++%3]+12,.9)}
  function music(b,t){const idx=b%4,spb=CLK.spb,ch=CH[curBar],has=ty=>en.some(e=>e.type===ty);
    if(!en.length){S.click(t,idx?.6:1);if(idx===0)S.pad(t,ch,spb*4);return}
    S.click(t,.3);
    if(has('ticker')){S.hat(t,.7);S.hat(t+spb/2,1)}
    if(has('thumper')&&idx%2===0)S.kick(t);
    if(has('snapper')&&idx%2===1)S.snare(t);
    if(has('rumbler')){const r=ch[0]-24;S.bass(t,r,spb*.42);S.bass(t+spb/2,idx===3?r+7:r+12,spb*.4)}
    if(has('singer')){const m=MEL[b%16];if(m)S.lead(t,m,spb*.85)}}
  function onBeat(b,t){
    if(over)return;
    if(pending){pending=false;room++;newRoom();setBpm(bpmFor(room));fx.push({k:'text',text:'Room '+room,t,col:P.ink});at(t,stats)}
    const idx=b%4;curBar=Math.floor(b/4)%4;curB=b;curT=t;
    if(queued){const q=queued;queued=null;actedB=b;doPlayer(q.d,t,t-q.at<.16)}else if(en.length)combo=0;
    for(const e of en.slice())if(!e.dead&&!over&&acts(e,idx,b))act(e,b,t);
    music(b,t)}
  function input(d){if(over||!CLK.on||pending)return;const now=ac.currentTime;
    if(actedB!==curB&&now-curT<=.14){actedB=curB;doPlayer(d,Math.max(now,curT),Math.abs(now-curT)<.1);return}
    queued={d,at:now}}
  function down(x,y){const px=bx+(pl.x+.5)*cs,py=by+(pl.y+.5)*cs,dx=x-px,dy=y-py;if(Math.abs(dx)<cs*.4&&Math.abs(dy)<cs*.4)return;
    input(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)])}
  function key(k){const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[k];if(m)input(m)}
  function drawEnemy(e,now){
    const p=epos(e,now);let ox=0,oy=0;
    if(e.lunge){const a=now-e.lunge.t;if(a>=0&&a<.2){const k=Math.sin(Math.PI*a/.2)*.35;ox=e.lunge.x*k;oy=e.lunge.y*k}}
    const cx=bx+(p.x+.5+ox)*cs,cy=by+(p.y+.5+oy)*cs,ba=now-e.beatT,s=cs*.3*(1+(ba>=0&&ba<.16?.16*(1-ba/.16):0));
    const col=now-e.hitT>=0&&now-e.hitT<.12?P.ink:P[COL[e.type]];
    g.fillStyle=col;
    if(e.type==='thumper'){rr(cx-s,cy-s,2*s,2*s,s*.35);g.fill()}
    else if(e.type==='snapper'){g.beginPath();g.moveTo(cx,cy-s*1.2);g.lineTo(cx+s*1.2,cy);g.lineTo(cx,cy+s*1.2);g.lineTo(cx-s*1.2,cy);g.closePath();g.fill()}

    else{g.beginPath();g.moveTo(cx,cy-s*1.25);g.lineTo(cx+s*1.15,cy+s*.9);g.lineTo(cx-s*1.15,cy+s*.9);g.closePath();g.fill()}
    if(e.max>1)for(let i=0;i<e.max;i++){const x=cx+(i-(e.max-1)/2)*8;if(i<e.hp)circle(x,cy+s+8,2.6,P[COL[e.type]]);else{g.globalAlpha=.3;circle(x,cy+s+8,2.6,P.mute);g.globalAlpha=1}}}
  function draw(now){
    const v=vis(now),ha=now-pl.hitT,sh=ha>=0&&ha<.25?(1-ha/.25)*7:0;
    g.save();if(sh)g.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);
    for(let y=0;y<R;y++)for(let x=0;x<C;x++){const w=walls.has(x+','+y);g.fillStyle=w?P.wall:((x+y)%2?P.tA:P.tB);rr(bx+x*cs+1,by+y*cs+1,cs-2,cs-2,6);g.fill();
      if(w){g.strokeStyle=P.mute;g.globalAlpha=.35;g.lineWidth=1.5;g.beginPath();for(let i=1;i<4;i++){const o=cs*i/4;g.moveTo(bx+x*cs+o,by+y*cs+4);g.lineTo(bx+x*cs+o,by+(y+1)*cs-4)}g.stroke();g.globalAlpha=1}}
    if(CLK.on){const k=Math.max(0,1-v.ph*3);if(k>0){g.globalAlpha=k*.07;g.fillStyle=P.acc;rr(bx,by,cs*C,cs*R,8);g.fill();g.globalAlpha=1}}
    if(doorOpen){const k=.5+.5*Math.sin(now*6);g.globalAlpha=.2+.2*k;g.fillStyle=P.acc;rr(bx+door.x*cs+1,by+door.y*cs+1,cs-2,cs-2,6);g.fill();g.globalAlpha=1;
      g.strokeStyle=P.acc;g.lineWidth=2;rr(bx+door.x*cs+2,by+door.y*cs+2,cs-4,cs-4,6);g.stroke();chev(bx+(door.x+.5)*cs,by+(door.y+.5)*cs,0,-1,cs*.18,P.acc,1)}
    // rumbler warning: faint two beats out, strong one beat out

    // next-beat moves
    if(CLK.on&&curB>=0&&!over){const nb=curB+1,ni=nb%4;for(const e of en){if(!acts(e,ni,nb)||e.type==='rumbler'&&ni===0)continue;const it=intent(e,ni,nb);if(!it||it.x==null)continue;
      const dx=it.x-e.x,dy=it.y-e.y,hit=it.x===pl.x&&it.y===pl.y;chev(bx+(e.x+.5+dx*.5)*cs,by+(e.y+.5+dy*.5)*cs,dx,dy,cs*.13,hit?P.bad:P[COL[e.type]],hit?1:.75)}}
    for(const e of en)drawEnemy(e,now);

    const cx=bx+(p.x+.5+ox)*cs,cy=by+(p.y+.5+oy)*cs,hurtNow=ha>=0&&ha<.3;
    circle(cx,cy,cs*.32,hurtNow?P.bad:P.ink);g.strokeStyle=P.acc;g.lineWidth=3;g.beginPath();g.arc(cx,cy,cs*.32+4,0,7);g.stroke();
    drawFx(fx,now,bx,by,cs);
    g.restore();
    const ty=Math.max(22,by-22);beatDots(now,ty);
    if(combo>=2)label('Tight x'+combo,bx+4,ty,13,P.acc,'left',650);
    if(CLK.on&&!en.length&&!over)label('Door open',bx+cs*C-4,ty,13,P.acc,'right',650);
  }
  return{name:'Band Room',blurb:'Tap beside your hero to step. Your step lands on the next beat. Each enemy is one part of the song and moves when its part plays.',reset,start,layout,onBeat,draw,down,key,tray:false,dbg:()=>({room,hearts,score,combo,over,pl,en,doorOpen,door,walls:[...walls]})};
}

// Bar Plan: draw four steps while the bar counts down, they play out next bar as a melody
function makeBarPlan(){
  const C=6,R=8,ROWN=[81,79,76,74,72,69,67,64],CH=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],PLAN_BARS=2,N4=[[1,0],[-1,0],[0,1],[0,-1]];
  const COL={hopper:'bass',turret:'kick',drifter:'hat'};
  let level,hearts,score,pl,en,phase,planLeft,ready,path,sim,over,fx,cycle,curB=-1,bx=0,by=0,cs=40,dragging=false,downTile=null,downAct='',moved=false;
  const readyBtn=document.getElementById('ready');
  readyBtn.onclick=()=>{if(phase==='plan'&&game===self){ready=true;readyBtn.classList.add('on')}};
  function bpmFor(l){return Math.min(120,82+(l-1)*5)}
  function stats(){setStats([['Level',level],['HP',hearts],['Score',score]])}
  function spawn(){en=[];const L=level;
    const list=L===1?['hopper','hopper']:L===2?['hopper','hopper','drifter']:L===3?['hopper','hopper','turret']:L===4?['hopper','hopper','hopper','turret']:['hopper','hopper','hopper','turret','drifter'].concat(L>=7?['turret']:[]);
    for(const type of list)for(let k=0;k<100;k++){const x=ri(C),y=ri(R-3);
      if(en.some(e=>e.x===x&&e.y===y)||Math.abs(x-pl.x)+Math.abs(y-pl.y)<3)continue;if(type==='turret'&&(x===pl.x||y===pl.y))continue;
      en.push({type,x,y,px:x,py:y,mt:0,alive:true,plan:[],strikes:[[],[],[],[]],deadT:-9});break}}
  function plan(){cycle++;const K=(x,y)=>x+','+y,taken=[new Set(),new Set(),new Set(),new Set()];
    for(const e of en)if(e.type==='turret')for(let k=0;k<4;k++)taken[k].add(K(e.x,e.y));
    for(const e of en){e.strikes=[[],[],[],[]];
      if(e.type==='turret'){e.plan=[0,1,2,3].map(()=>({x:e.x,y:e.y}));const row=[],col=[];for(let x=0;x<C;x++)if(x!==e.x)row.push({x,y:e.y});for(let y=0;y<R;y++)if(y!==e.y)col.push({x:e.x,y});
        if(cycle%2){e.strikes[1]=row;e.strikes[3]=col}else{e.strikes[1]=col;e.strikes[3]=row}continue}
      let p={x:e.x,y:e.y};e.plan=[];
      for(let k=0;k<4;k++){let n=p;const go=e.type==='hopper'?Math.random()>.15:(k===1||k===3);
        if(go){const st=e.type==='drifter'?2:1,o=[];for(const d of N4){const x=p.x+d[0]*st,y=p.y+d[1]*st;if(x<0||y<0||x>=C||y>=R||taken[k].has(K(x,y))||(x===pl.x&&y===pl.y))continue;o.push({x,y,dd:Math.abs(x-pl.x)+Math.abs(y-pl.y)})}
          if(o.length){if(e.type==='hopper'&&Math.random()<.7){o.sort((a,b)=>a.dd-b.dd);n=o[0]}else if(e.type==='drifter'&&Math.random()<.6){o.sort((a,b)=>b.dd-a.dd);n=o[0]}else n=o[ri(o.length)]}}
        if(taken[k].has(K(n.x,n.y))&&n!==p)n=p;n={x:n.x,y:n.y};taken[k].add(K(n.x,n.y));e.plan.push(n);p=n}
      if(e.type==='hopper'){const q=e.plan[3];e.strikes[3]=N4.map(d=>({x:q.x+d[0],y:q.y+d[1]})).filter(s=>s.x>=0&&s.y>=0&&s.x<C&&s.y<R)}}}
  // one simulation drives both the preview and the real bar, so what you see is what happens
  function simulate(path){const r={pp:[],dead:en.map(e=>e.alive?-1:-2),hit:[false,false,false,false]};let p={x:pl.x,y:pl.y};
    for(let k=0;k<4;k++){const prev=p;p=path[k]?{x:path[k].x,y:path[k].y}:p;r.pp.push(p);
      en.forEach((e,i)=>{if(r.dead[i]!==-1)return;const q=e.plan[k],qp=k?e.plan[k-1]:{x:e.x,y:e.y};
        if((q.x===p.x&&q.y===p.y)||(qp.x===p.x&&qp.y===p.y&&q.x===prev.x&&q.y===prev.y))r.dead[i]=k});
      en.forEach((e,i)=>{if(r.dead[i]===-1&&e.strikes[k].some(s=>s.x===p.x&&s.y===p.y))r.hit[k]=true})}
    return r}
  function setTray(){readyBtn.classList.toggle('on',!!ready);document.getElementById('tray').style.display=game===self&&phase==='plan'&&!over?'flex':'none'}
  function reset(){level=1;hearts=3;score=0;over=false;fx=[];cycle=0;phase='intro';path=[];ready=false;curB=-1;pl={x:2,y:R-1,px:2,py:R-1,mt:0,hitT:-9};spawn();plan();sim=simulate(path);stats()}
  function start(){reset();clockStart(bpmFor(level));setTray()}
  function layout(){const top=58,bot=76;cs=Math.floor(Math.min((W-24)/C,(H-top-bot)/R));bx=Math.round((W-cs*C)/2);by=Math.round(top+(H-top-bot-cs*R)/2)}
  function startPlan(){plan();path=[];sim=simulate(path);planLeft=PLAN_BARS;ready=false;phase='plan';setTray()}
  function startPlay(){sim=simulate(path);phase='play';dragging=false;setTray()}
  function hurt(t){pl.hitT=t;hearts--;S.thud(t);if(hearts<=0&&!over){over=true;at(t+.8,()=>{CLK.on=false;setTray();showOv('Out of hearts','Level '+level+', score '+score,'Play again',start)})}}
  function finishPlay(t){en=en.filter(e=>e.alive);
    if(!en.length){level++;hearts=Math.min(3,hearts+1);setBpm(bpmFor(level));spawn();fx.push({k:'text',text:'Level '+level,t,col:P.ink})}}
  function resolveStep(k,t){const bar=Math.floor(curB/4)%4,p=sim.pp[k];
    if(p.x!==pl.x||p.y!==pl.y){pl.px=pl.x;pl.py=pl.y;pl.x=p.x;pl.y=p.y;pl.mt=t;S.lead(t,ROWN[p.y],CLK.spb*.8)}
    let hop=false;
    en.forEach((e,i)=>{if(!e.alive)return;const q=e.plan[k];if(q.x!==e.x||q.y!==e.y){e.px=e.x;e.py=e.y;e.x=q.x;e.y=q.y;e.mt=t;hop=true}
      if(sim.dead[i]===k){e.alive=false;e.deadT=t;score+=100*level;fx.push({k:'pop',x:e.x,y:e.y,t,col:P.gold,text:'+'+100*level});S.stab(t,CH[bar].map(m=>m+12))}});
    if(hop)S.wood(t,88,.7);
    let any=false;for(const e of en)if(e.alive&&e.strikes[k].length){any=true;fx.push({k:'tiles',tiles:e.strikes[k],t,col:P.bad})}

  function beatsLeft(b){const idx=b%4,eff=ready?1:planLeft;return (eff-1)*4+(4-idx)}
  function groove(b,t){const idx=b%4,spb=CLK.spb,ch=CH[Math.floor(b/4)%4];
    if(idx%2===0)S.kick(t,.85);
    S.hat(t+spb/2,.7);
    if(phase==='play'){S.hat(t,.5);if(idx%2===1)S.snare(t,.55)}
    S.bass(t,ch[0]-24,spb*.4,.8);S.bass(t+spb/2,ch[0]-12,spb*.35,.55);
    if(phase==='plan'){const L=beatsLeft(b);if(L<=4)S.wood(t,L===1?100:93,.9)}}
  function onBeat(b,t){if(over)return;const idx=b%4;curB=b;
    if(idx===0){if(phase==='play'){finishPlay(t);startPlan()}else if(phase==='plan'){planLeft--;if(planLeft<=0||ready)startPlay()}else startPlan()}
    if(phase==='play')resolveStep(idx,t);

  // ---- planning input: tap tiles next to the end of your path, or drag through them; tap the last step to undo
  function tileAt(x,y){const tx=Math.floor((x-bx)/cs),ty=Math.floor((y-by)/cs);return tx>=0&&ty>=0&&tx<C&&ty<R?{x:tx,y:ty}:null}
  function endPos(){return path.length?path[path.length-1]:pl}
  const adj=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y)===1,same=(a,b)=>a.x===b.x&&a.y===b.y;
  function changed(grew){sim=simulate(path);if(grew&&ac){const q=path[path.length-1];S.pluck(ac.currentTime+.01,ROWN[q.y],.8)}}
  function tap(t){if(same(t,pl)){path=[];changed();return}
    const i=path.findIndex(p=>same(p,t));
    if(i>=0){path=path.slice(0,i+1);changed();return}
    if(path.length<4&&adj(t,endPos())){path.push(t);changed(true)}}
  function drag(t){const prev=path.length>=2?path[path.length-2]:pl;if(path.length&&same(t,prev)){path.pop();changed();return}
    if(path.length<4&&adj(t,endPos())){path.push(t);changed(true)}}
  function down(x,y){if(phase!=='plan')return;const t=tileAt(x,y);if(!t)return;dragging=true;moved=false;downTile=t;
    if(same(t,endPos()))downAct='end';else{downAct='tap';tap(t)}}
  function move(x,y){if(!dragging||phase!=='plan')return;const t=tileAt(x,y);if(!t||same(t,downTile))return;moved=true;downTile=t;drag(t)}
  function up(){if(!dragging)return;dragging=false;if(!moved&&downAct==='end'&&path.length&&phase==='plan'){path.pop();changed()}}
  function tileFill(q,col,a){g.globalAlpha=a;g.fillStyle=col;rr(bx+q.x*cs+1,by+q.y*cs+1,cs-2,cs-2,6);g.fill();g.globalAlpha=1}
  function draw(now){
    const v=vis(now),ha=now-pl.hitT,sh=ha>=0&&ha<.25?(1-ha/.25)*7:0,planning=phase==='plan'||phase==='intro',step=phase==='play'?((curB%4)+4)%4:-1;
    g.save();if(sh)g.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);
    for(let y=0;y<R;y++)for(let x=0;x<C;x++){g.fillStyle=(x+y)%2?P.tA:P.tB;rr(bx+x*cs+1,by+y*cs+1,cs-2,cs-2,6);g.fill()}
    // strike tiles, numbered by the beat they hit on
    g.font='600 10px Inter,system-ui,sans-serif';
    en.forEach((e,i)=>{if(!e.alive)return;for(let k=0;k<4;k++){if(!e.strikes[k].length)continue;if(phase==='play'&&k<=step)continue;
      const dead=sim&&sim.dead[i]!==-1&&sim.dead[i]<=k,a=dead?.05:(phase==='play'&&k===step+1?.3:.15);
      for(const q of e.strikes[k]){tileFill(q,P.bad,a);if(!dead){g.globalAlpha=.85;g.fillStyle=P.bad;g.textAlign='right';g.textBaseline='top';g.fillText(String(k+1),bx+(q.x+1)*cs-5,by+q.y*cs+4);g.globalAlpha=1}}}});

      let last={x:e.x,y:e.y};for(let k=0;k<4;k++){if(dk>=0&&k>dk)break;const q=e.plan[k];if(!same(q,last)){const cx=bx+(q.x+.5)*cs,cy=by+(q.y+.5)*cs;circle(cx,cy,7,col);label(String(k+1),cx,cy+.5,9,P.bg,'center',700)}last=q}});
    // your path
    if(path.length&&(planning||phase==='play')){g.strokeStyle=P.acc;g.lineWidth=4;g.lineCap='round';g.lineJoin='round';g.globalAlpha=phase==='play'?.35:.9;g.beginPath();
      const s0=phase==='play'?(step>=0?sim.pp[Math.max(0,step)]:pl):pl;g.moveTo(bx+(pl.x+.5)*cs,by+(pl.y+.5)*cs);
      for(let k=phase==='play'?step+1:0;k<path.length;k++){g.lineTo(bx+(path[k].x+.5)*cs,by+(path[k].y+.5)*cs)}g.stroke();g.globalAlpha=1;
      for(let k=phase==='play'?step+1:0;k<path.length;k++){const q=path[k],cx=bx+(q.x+.5)*cs,cy=by+(q.y+.5)*cs,killHere=sim&&sim.dead.some(d=>d===k),hit=sim&&sim.hit[k];
        if(hit){g.strokeStyle=P.bad;g.lineWidth=3;g.beginPath();g.arc(cx,cy,cs*.36,0,7);g.stroke()}
        else if(killHere){g.strokeStyle=P.gold;g.lineWidth=3;g.beginPath();g.arc(cx,cy,cs*.36,0,7);g.stroke()}
        circle(cx,cy,9,hit?P.bad:killHere?P.gold:P.acc);label(String(k+1),cx,cy+.5,10,'#fff','center',700)}}
    // enemies
    for(const e of en){const da=now-e.deadT;if(!e.alive&&da>=0&&da>.3)continue;const p=epos(e,now),cx=bx+(p.x+.5)*cs,cy=by+(p.y+.5)*cs,s=cs*.28,col=P[COL[e.type]];

      else{g.beginPath();g.moveTo(cx,cy-s*1.2);g.lineTo(cx+s*1.2,cy);g.lineTo(cx,cy+s*1.2);g.lineTo(cx-s*1.2,cy);g.closePath();g.fill()}
      g.globalAlpha=1}
    // player
    const p=epos(pl,now),cx=bx+(p.x+.5)*cs,cy=by+(p.y+.5)*cs;circle(cx,cy,cs*.3,ha>=0&&ha<.3?P.bad:P.ink);g.strokeStyle=P.acc;g.lineWidth=3;g.beginPath();g.arc(cx,cy,cs*.3+4,0,7);g.stroke();
    drawFx(fx,now,bx,by,cs);
    g.restore();
    // top line: phase on the left, the beat in the middle, the plan countdown on the right
    if(CLK.on&&!over){const ty=Math.max(22,by-22);label(phase==='play'?'Play':'Plan',bx+4,ty,15,phase==='play'?P.acc:P.ink,'left',650);
      beatDots(now,ty,phase==='play'?P.acc:P.mute);
      if(phase==='plan'&&curB>=0){const L=beatsLeft(curB);label(String(L),bx+cs*C-4,ty,L<=4?20:15,L<=4?P.bad:P.mute,'right',700)}}
  }
  const self={name:'Bar Plan',blurb:'Draw up to four steps while the bar counts down. Next bar they play out on the beat, as a melody. Land on enemies, stay off red tiles.',reset,start,layout,onBeat,draw,down,move,up,tray:true,dbg:()=>({level,hearts,score,over,phase,pl,en,path,sim}),setPath:p=>{path=p;sim=simulate(path)}};
  return self;
}

// ---------------- shell
const statsEl=document.getElementById('stats');
function setStats(a){statsEl.innerHTML=a.map(([k,v])=>`<span><i>${k}</i>${v}</span>`).join('')}
const ov=document.getElementById('ov'),ovT=ov.querySelector('.t'),ovS=ov.querySelector('.s'),ovB=ov.querySelector('button');let ovCb=null;
function showOv(t,s,b,cb){ovT.textContent=t;ovS.textContent=s;ovB.textContent=b;ovCb=cb;ov.style.display='flex'}
ovB.onclick=()=>{audioInit();ov.style.display='none';const f=ovCb;ovCb=null;if(f)f()};
const games=[makeBandRoom(),makeBarPlan()];
let gi=clamp(parseInt(Q.get('g')||'0',10)||0,0,games.length-1),game=games[gi];
const nav=document.getElementById('nav');
games.forEach((G,i)=>{const b=document.createElement('button');b.textContent=G.name;b.onclick=()=>select(i);nav.appendChild(b)});
function select(i){CLK.on=false;later.length=0;gi=i;game=games[i];[...nav.children].forEach((b,j)=>b.classList.toggle('on',j===i));
  document.getElementById('name').textContent=game.name;document.getElementById('tray').style.display='none';game.reset();game.layout();showOv(game.name,game.blurb,'Play',()=>game.start())}
function resize(){const r=stage.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;cv.width=Math.round(W*d);cv.height=Math.round(H*d);cv.style.width=W+'px';cv.style.height=H+'px';g.setTransform(d,0,0,d,0,0);game.layout()}
addEventListener('resize',resize);
cv.addEventListener('pointerdown',e=>{if(ov.style.display!=='none')return;try{cv.setPointerCapture(e.pointerId)}catch(_){}game.down&&game.down(e.offsetX,e.offsetY)});
cv.addEventListener('pointermove',e=>{game.move&&game.move(e.offsetX,e.offsetY)});
cv.addEventListener('pointerup',e=>{game.up&&game.up(e.offsetX,e.offsetY)});
cv.addEventListener('pointercancel',e=>{game.up&&game.up(e.offsetX,e.offsetY)});
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow'))e.preventDefault();game.key&&game.key(e.key)});
