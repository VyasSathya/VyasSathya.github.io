<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Test</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4DE;--panel:#FFFFFF;--ink:#2B2340;--soft:#7A6F86;--line:#EADFCB;--accent:#FF8A5B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1A29;--panel:#2B2340;--ink:#FFF1DA;--soft:#C9BFD6;--line:#3A3150}}
:root[data-theme="dark"]{--bg:#1E1A29;--panel:#2B2340;--ink:#FFF1DA;--soft:#C9BFD6;--line:#3A3150}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px Fredoka,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h2{font-size:15px;font-weight:600;color:var(--soft);margin:26px 0 10px}
.r{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0;cursor:pointer}
.r button{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:15px;cursor:pointer}
.r.on{border-color:var(--accent)}
.r span{font-weight:500}
.bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent)}
</style></head><body><main id="m"></main>
<script>
const R=[{"g": "With the cute war band", "name": "Our current voices", "src": "a/mix_r9_current_lead.mp3"}, {"g": "With the cute war band", "name": "Our current voices, a group", "src": "a/mix_r9_current_multi.mp3"}, {"g": "With the cute war band", "name": "SoulX-Singer, singer 1", "src": "a/mix_r1_soulx_f2.mp3"}, {"g": "With the cute war band", "name": "SoulX-Singer, singer 1, the tune", "src": "a/mix_r1_soulx_f2_melody.mp3"}, {"g": "With the cute war band", "name": "SoulX-Singer, singer 2", "src": "a/mix_r1_soulx_f5.mp3"}, {"g": "With the cute war band", "name": "SoulX-Singer, low male", "src": "a/mix_r1_soulx_m2_low.mp3"}, {"g": "With the cute war band", "name": "DiffSinger, Ritsu", "src": "a/mix_r2_ritsu.mp3"}, {"g": "With the cute war band", "name": "DiffSinger, Qixuan", "src": "a/mix_r2_qixuan.mp3"}, {"g": "With the cute war band", "name": "DDSP (Blob Opera style model)", "src": "a/mix_r5_ddsp_f2.mp3"}, {"g": "With the cute war band", "name": "DDSP, small character", "src": "a/mix_r5_ddsp_f2_small.mp3"}, {"g": "With the cute war band", "name": "RAVE", "src": "a/mix_r6_rave_isis.mp3"}, {"g": "With the cute war band", "name": "Blob Opera style live voice, SoulX", "src": "a/mix_r8_blob_soulx.mp3"}, {"g": "With the cute war band", "name": "Blob Opera style live voice, Qixuan", "src": "a/mix_r8_blob_qixuan.mp3"}, {"g": "With the cute war band", "name": "Blob Opera style, with harmony", "src": "a/mix_r8_blob_harmony.mp3"}, {"g": "Character voices (voice alone)", "name": "Seed-VC, small cute character", "src": "a/r3_seedvc_small.mp3"}, {"g": "Character voices (voice alone)", "name": "Seed-VC, middle character", "src": "a/r3_seedvc_mid.mp3"}, {"g": "Character voices (voice alone)", "name": "Seed-VC, big deep character", "src": "a/r3_seedvc_big.mp3"}, {"g": "Character voices (voice alone)", "name": "Seed-VC, gang chant", "src": "a/r3_seedvc_gang.mp3"}, {"g": "Character voices (voice alone)", "name": "Qixuan, small character", "src": "a/r2_qixuan_small.mp3"}, {"g": "Character voices (voice alone)", "name": "Qixuan, big character", "src": "a/r2_qixuan_big.mp3"}, {"g": "Character voices (voice alone)", "name": "SoulX-Singer, small character", "src": "a/r1_soulx_f2_small.mp3"}];const m=document.getElementById('m');let cur=null;let last='';
R.forEach((r,i)=>{if(r.g!==last){m.insertAdjacentHTML('beforeend',`<h2>${r.g}</h2>`);last=r.g;}
 m.insertAdjacentHTML('beforeend',`<div class="r" data-i="${i}"><button aria-label="Play">&#9654;</button><span>${r.name}</span><div class="bar"><i></i></div></div>`);});
const audio=new Audio();
audio.ontimeupdate=()=>{if(cur)cur.querySelector('i').style.width=(100*audio.currentTime/(audio.duration||1))+'%';};
audio.onended=()=>stop();
function stop(){if(cur){cur.classList.remove('on');cur.querySelector('button').innerHTML='&#9654;';cur.querySelector('i').style.width='0';}cur=null;audio.pause();}
m.addEventListener('click',e=>{const row=e.target.closest('.r');if(!row)return;
 if(cur===row){stop();return;}stop();cur=row;row.classList.add('on');row.querySelector('button').innerHTML='&#10074;&#10074;';
 audio.src=R[+row.dataset.i].src;audio.play();});
</script></body></html>
