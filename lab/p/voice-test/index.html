<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Test</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4DE;--panel:#FFFFFF;--ink:#2B2340;--soft:#7A6F86;--line:#EADFCB;--accent:#FF8A5B;--accent2:#5B8CFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1A29;--panel:#2B2340;--ink:#FFF1DA;--soft:#C9BFD6;--line:#3A3150}}
:root[data-theme="dark"]{--bg:#1E1A29;--panel:#2B2340;--ink:#FFF1DA;--soft:#C9BFD6;--line:#3A3150}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px Fredoka,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h2{font-size:15px;font-weight:600;color:var(--soft);margin:26px 0 10px}
.r{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.r.on{border-color:var(--accent)}
.t{display:flex;align-items:center;gap:10px}
.t span{flex:1;font-weight:500;min-width:0}
.t button{flex:none;height:36px;border-radius:18px;border:0;padding:0 14px;font:inherit;font-size:14px;color:#fff;cursor:pointer;background:var(--accent)}
.t button.b{background:var(--accent2)}
.t button[disabled]{display:none}
@media (max-width:420px){.t{flex-wrap:wrap}.t span{flex-basis:100%;margin-bottom:6px}}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:var(--accent)}
</style></head><body><main id="m"></main>
<script>
const R=[{"g": "The band alone", "name": "Backing: toy army band", "v": "", "b": "a/backing.mp3"}, {"g": "Today's voices", "name": "ElevenLabs syllables + WORLD, the multi voice", "v": "a/r9_current_multi.mp3", "b": "a/r9_current_multi_band.mp3"}, {"g": "Today's voices", "name": "ElevenLabs syllables + WORLD, the lead voice", "v": "a/r9_current_lead.mp3", "b": "a/r9_current_lead_band.mp3"}, {"g": "SoulX-Singer, zero-shot from a VocalSet singer", "name": "Female 2, from the notes", "v": "a/r1_soulx_f2.mp3", "b": "a/r1_soulx_f2_band.mp3"}, {"g": "SoulX-Singer, zero-shot from a VocalSet singer", "name": "Female 2, WORLD formant up", "v": "a/r1_soulx_f2_small.mp3", "b": "a/r1_soulx_f2_small_band.mp3"}, {"g": "SoulX-Singer, zero-shot from a VocalSet singer", "name": "Female 2, sung to the DiffSinger pitch line", "v": "a/r1_soulx_f2_melody.mp3", "b": "a/r1_soulx_f2_melody_band.mp3"}, {"g": "SoulX-Singer, zero-shot from a VocalSet singer", "name": "Female 5, from the notes", "v": "a/r1_soulx_f5.mp3", "b": "a/r1_soulx_f5_band.mp3"}, {"g": "SoulX-Singer, zero-shot from a VocalSet singer", "name": "Male 2, an octave down", "v": "a/r1_soulx_m2_low.mp3", "b": "a/r1_soulx_m2_low_band.mp3"}, {"g": "DiffSinger in OpenUtau", "name": "Ritsu", "v": "a/r2_ritsu.mp3", "b": "a/r2_ritsu_band.mp3"}, {"g": "DiffSinger in OpenUtau", "name": "Qixuan", "v": "a/r2_qixuan.mp3", "b": "a/r2_qixuan_band.mp3"}, {"g": "DiffSinger in OpenUtau", "name": "Qixuan, small (its own size knob)", "v": "a/r2_qixuan_small.mp3", "b": "a/r2_qixuan_small_band.mp3"}, {"g": "DiffSinger in OpenUtau", "name": "Qixuan, big, an octave down", "v": "a/r2_qixuan_big.mp3", "b": "a/r2_qixuan_big_band.mp3"}, {"g": "DiffSinger in OpenUtau", "name": "Qixuan, bare notes (no pitch model)", "v": "a/r2_qixuan_flat.mp3", "b": ""}, {"g": "Seed-VC into three family voices", "name": "Small and cute: Chorus", "v": "a/r3_seedvc_small_raw.mp3", "b": "a/r3_seedvc_small_raw_band.mp3"}, {"g": "Seed-VC into three family voices", "name": "Middle: Session", "v": "a/r3_seedvc_mid.mp3", "b": "a/r3_seedvc_mid_band.mp3"}, {"g": "Seed-VC into three family voices", "name": "Big and deep: Brass, an octave down", "v": "a/r3_seedvc_big_raw.mp3", "b": "a/r3_seedvc_big_raw_band.mp3"}, {"g": "Seed-VC into three family voices", "name": "All three as a gang", "v": "a/r3_seedvc_gang_raw.mp3", "b": "a/r3_seedvc_gang_raw_band.mp3"}, {"g": "Seed-VC into three family voices", "name": "Chorus, from Qixuan instead", "v": "a/r3_seedvc_qixuan_chorus.mp3", "b": "a/r3_seedvc_qixuan_chorus_band.mp3"}, {"g": "Seed-VC into three family voices", "name": "Chorus, WORLD formant up", "v": "a/r3_seedvc_small.mp3", "b": "a/r3_seedvc_small_band.mp3"}, {"g": "Seed-VC into three family voices", "name": "Brass, WORLD formant down", "v": "a/r3_seedvc_big.mp3", "b": "a/r3_seedvc_big_band.mp3"}, {"g": "RVC, one model trained on a family", "name": "Chorus", "v": "a/r4_rvc_chorus.mp3", "b": "a/r4_rvc_chorus_band.mp3"}, {"g": "DDSP trained on VocalSet, the Blob Opera way", "name": "Female 2", "v": "a/r5_ddsp_f2.mp3", "b": "a/r5_ddsp_f2_band.mp3"}, {"g": "DDSP trained on VocalSet, the Blob Opera way", "name": "Female 2, small body", "v": "a/r5_ddsp_f2_small.mp3", "b": "a/r5_ddsp_f2_small_band.mp3"}, {"g": "RAVE, test only", "name": "ISiS singing model", "v": "a/r6_rave_isis.mp3", "b": "a/r6_rave_isis_band.mp3"}, {"g": "RAVE, test only", "name": "VCTK speech model", "v": "a/r6_rave_vctk.mp3", "b": "a/r6_rave_vctk_band.mp3"}, {"g": "Blob Opera style: stored frames, new pitch line", "name": "Qixuan frames", "v": "a/r8_blob_qixuan.mp3", "b": "a/r8_blob_qixuan_band.mp3"}, {"g": "Blob Opera style: stored frames, new pitch line", "name": "SoulX frames", "v": "a/r8_blob_soulx.mp3", "b": "a/r8_blob_soulx_band.mp3"}, {"g": "Blob Opera style: stored frames, new pitch line", "name": "Lead plus a harmony line it made", "v": "a/r8_blob_harmony.mp3", "b": "a/r8_blob_harmony_band.mp3"}];const m=document.getElementById('m');let cur=null,curBtn=null;let last='';
R.forEach((r,i)=>{if(r.g!==last){m.insertAdjacentHTML('beforeend',`<h2>${r.g}</h2>`);last=r.g;}
 m.insertAdjacentHTML('beforeend',`<div class="r" data-i="${i}"><div class="t"><span>${r.name}</span>`+
  `<button data-k="v" ${r.v?'':'disabled'}>Voice</button><button class="b" data-k="b" ${r.b?'':'disabled'}>In the band</button></div><div class="bar"><i></i></div></div>`);});
const audio=new Audio();
audio.ontimeupdate=()=>{if(cur)cur.querySelector('i').style.width=(100*audio.currentTime/(audio.duration||1))+'%';};
audio.onended=()=>stop();
function label(b){return b.dataset.k==='v'?'Voice':'In the band';}
function stop(){if(cur){cur.classList.remove('on');cur.querySelector('i').style.width='0';}if(curBtn)curBtn.textContent=label(curBtn);cur=null;curBtn=null;audio.pause();}
m.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const row=b.closest('.r');
 if(curBtn===b){stop();return;}stop();cur=row;curBtn=b;row.classList.add('on');b.textContent='Stop';
 audio.src=R[+row.dataset.i][b.dataset.k];audio.play();});
</script></body></html>
