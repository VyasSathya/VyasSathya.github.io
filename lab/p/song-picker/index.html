<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Song Picker</title><link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4DE;--panel:#FFFFFF;--ink:#2B2340;--soft:#7A6F86;--line:#EADFCB;--accent:#FF8A5B;--off:#CFC6BA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1A29;--panel:#2B2340;--ink:#FFF1DA;--soft:#C9BFD6;--line:#3A3150;--off:#4A4060}}
:root[data-theme="dark"]{--bg:#1E1A29;--panel:#2B2340;--ink:#FFF1DA;--soft:#C9BFD6;--line:#3A3150;--off:#4A4060}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--ink);font:16px Fredoka,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px 48px}
h2{font-size:15px;font-weight:600;color:var(--soft);margin:22px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.c{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:9px 15px;font:inherit;font-size:15px;cursor:pointer}
.c.on{background:var(--accent);border-color:var(--accent);color:#fff}
.c:disabled{color:var(--off);cursor:default}
.play{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:24px 0 6px}
.play button{flex:none;width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:18px;cursor:pointer}
.bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent)}
.r{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0;cursor:pointer}
.r button{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:15px;cursor:pointer}
.r.on{border-color:var(--accent)}
</style></head><body><main>
<h2>Song</h2><div class="opts" data-k="song"><button class="c" data-v="1">Song 1</button><button class="c" data-v="2">Song 2</button><button class="c" data-v="3">Song 3</button></div>
<h2>Voices</h2><div class="opts" data-k="voice"><button class="c" data-v="el">Old voices</button><button class="c" data-v="qixuan">Qixuan</button><button class="c" data-v="soulx">SoulX</button><button class="c" data-v="none">No voices</button></div>
<h2>Band</h2><div class="opts" data-k="size"><button class="c" data-v="3">3</button><button class="c" data-v="5">5</button><button class="c" data-v="8">8</button><button class="c" data-v="13">13</button><button class="c" data-v="25">25</button></div>
<h2>Style</h2><div class="opts" data-k="style"><button class="c" data-v="composed">Composed parts</button><button class="c" data-v="live">Live notes</button><button class="c" data-v="both">Both</button></div>
<h2>Tempo</h2><div class="opts" data-k="tempo"><button class="c" data-v="slow">100</button><button class="c" data-v="written">As written</button><button class="c" data-v="fast">132</button></div>
<h2>Feel</h2><div class="opts" data-k="feel"><button class="c" data-v="march">March</button><button class="c" data-v="light">Lighter</button><button class="c" data-v="punch">Punchier</button></div>
<div class="play"><button id="pb" aria-label="Play">&#9654;</button><div class="bar"><i id="pi"></i></div></div>
<h2>In a level</h2>
<div class="r" data-src="a/level/composed.mp3"><button aria-label="Play">&#9654;</button><span>Composed parts</span></div>
<div class="r" data-src="a/level/live.mp3"><button aria-label="Play">&#9654;</button><span>Live notes</span></div>
<div class="r" data-src="a/level/both.mp3"><button aria-label="Play">&#9654;</button><span>Both</span></div>
</main>
