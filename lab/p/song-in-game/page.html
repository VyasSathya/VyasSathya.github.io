<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Song in the game</title><link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4DE;--panel:#FFFFFF;--ink:#2B2340;--soft:#7A6F86;--line:#EADFCB;--accent:#FF8A5B;--accent2:#6C5CE7;--grass1:#9EDC7E;--grass2:#8BD06D;--seat:#F3E7D3;--danger:#E8505B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1A29;--panel:#2B2340;--ink:#FFF1DA;--soft:#C9BFD6;--line:#3A3150;--seat:#3A3150;--grass1:#5FA04A;--grass2:#548F41}}
:root[data-theme="dark"]{--bg:#1E1A29;--panel:#2B2340;--ink:#FFF1DA;--soft:#C9BFD6;--line:#3A3150;--seat:#3A3150;--grass1:#5FA04A;--grass2:#548F41}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px Fredoka,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 16px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
h1{font-size:20px;font-weight:700;margin:0}
.beats{display:flex;gap:5px}.beats i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .05s}.beats i.on{background:var(--accent)}.beats i.on.d{background:var(--accent2)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--soft);font:inherit;font-weight:600;padding:9px 0;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.view{display:none}.view.on{display:block}
.lawn{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#6FB257;padding:6px;border-radius:18px}
.tile{aspect-ratio:1;border-radius:10px;background:var(--grass1);position:relative;display:flex;align-items:flex-end;justify-content:center;overflow:visible;cursor:pointer}
.tile:nth-child(even){background:var(--grass2)}
.tile.can{box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.mu{position:relative;height:88%;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.mu img{height:100%;width:auto;max-width:110%;object-fit:contain;transform-origin:50% 100%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.18));transition:filter .06s}
.mu.wait img{opacity:.45;filter:grayscale(.6)}
.mu.pop img{animation:pop .38s cubic-bezier(.2,1.6,.4,1)}
.mu.gone img{animation:gone .3s ease-in forwards}
.mu.eat img{animation:shake .5s linear infinite}
.mu.hit img{filter:brightness(1.35) drop-shadow(0 0 6px rgba(255,255,255,.9))}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
@keyframes gone{to{transform:scale(0) rotate(-20deg);opacity:0}}
@keyframes shake{0%,100%{translate:0 0}25%{translate:-2px 0}75%{translate:2px 0}}
.bar{display:flex;gap:8px;margin:12px 0}
.btn{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:600;font-size:15px;padding:11px 6px;border-radius:14px;cursor:pointer}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.bad{color:var(--danger)}
.btn.on{border-color:var(--accent2);color:var(--accent2)}
.tray{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px}
.card{border:2px solid transparent;border-radius:14px;background:var(--bg);padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.card img{height:52px;width:auto;max-width:100%;object-fit:contain}
.card span{font-size:11px;font-weight:500;color:var(--soft);text-align:center;line-height:1.1}
.card.sel{border-color:var(--ink)}
.card.used{opacity:.35}
.stage{background:linear-gradient(180deg,#3B2F5C,#5B3F7A);border-radius:18px;padding:16px 10px 14px}
.seats{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 8px}
.seat{width:calc(25% - 6px);aspect-ratio:.9;border-radius:14px;background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.25);display:flex;align-items:flex-end;justify-content:center;cursor:pointer;position:relative}
.seat.full{border-style:solid;border-color:rgba(255,255,255,.35);background:radial-gradient(ellipse at 50% 92%,rgba(255,255,255,.22) 0 30%,transparent 31%)}
.seat .mu{height:86%}
</style></head><body><main>
<header><h1>Song in the game</h1><div class="beats" id="beats"><i></i><i></i><i></i><i></i></div></header>
<div class="seg" id="seg"><button class="on" data-v="lanes">Pull Lanes</button><button data-v="battle">Music Battler</button></div>
<section class="view on" id="lanes">
 <div class="lawn" id="lawn"></div>
 <div class="bar"><button class="btn bad" id="eat">Enemy eats</button><button class="btn" id="auto">Auto</button><button class="btn" id="clear">Clear</button></div>
 <div class="tray" id="tray"></div>
</section>
<section class="view" id="battle">
 <div class="stage"><div class="seats" id="seats"></div></div>
 <div class="bar"><button class="btn main" id="fight">Fight</button><button class="btn" id="full">Full band</button><button class="btn" id="thin">Thin band</button></div>
 <div class="tray" id="roster"></div>
</section>
</main>
<script>
const D=__DATA__;const P={};D.parts.forEach(p=>P[p.id]=p);
const BEAT=60/D.bpm;let ctx=null,t0=0,bufs={},gains={},running=false,loading=null,lastS=0;
const on={};D.parts.forEach(p=>on[p.id]=false);   // what is audible (after its bar line)
async function engine(){if(running)return;if(loading)return loading;
 loading=(async()=>{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')await ctx.resume();
  await Promise.all(D.parts.map(async p=>{if(bufs[p.id])return;const b=await (await fetch('parts/'+p.id+'.mp3')).arrayBuffer();bufs[p.id]=await new Promise((ok,no)=>ctx.decodeAudioData(b,ok,no));}));
  const at=ctx.currentTime+.1;D.parts.forEach(p=>{const s=ctx.createBufferSource();s.buffer=bufs[p.id];s.loop=true;s.loopStart=D.fd;s.loopEnd=D.loopEnd;
   const g=gains[p.id]=ctx.createGain();g.gain.value=on[p.id]?1:0;s.connect(g);g.connect(ctx.destination);s.start(at);p.src=s;});
  t0=at;running=true;loading=null;})();return loading;}
function stopEngine(){if(!running)return;D.parts.forEach(p=>{try{p.src.stop()}catch(e){}});running=false;}
function songPos(){const e=ctx.currentTime-t0;if(e<D.loopEnd)return Math.max(0,e);return D.fd+((e-D.fd)%(D.loopEnd-D.fd));}
function nextBar(){const s=songPos();const nb=s<D.fd?D.fd:D.fd+Math.ceil((s-D.fd+.04)/D.bar)*D.bar;return {at:ctx.currentTime+(nb-s),wait:nb-s};}
async function setPart(id,val,ui){await engine();const {at,wait}=nextBar();gains[id].gain.setTargetAtTime(val?1:0,at,.008);
 setTimeout(()=>{on[id]=val;ui&&ui();},wait*1000);}
// --- the frame loop: beat dots, bobbing, flashes on each part's notes
const dots=[...document.querySelectorAll('#beats i')];
function frame(){if(running){const s=songPos();const b=(s-D.fd)/BEAT;const beat=((Math.floor(b)%4)+4)%4,ph=b-Math.floor(b);
  dots.forEach((d,i)=>{d.classList.toggle('on',i===beat&&ph<.35);d.classList.toggle('d',i===0);});
  const hop=s<D.fd?0:-7*Math.pow(1-ph,3);
  document.querySelectorAll('.mu[data-id]').forEach(m=>{const id=m.dataset.id;const img=m.firstChild;img.style.translate=on[id]&&!m.classList.contains('gone')?`0 ${hop}px`:'0 0';});
  const a=lastS,z=s;D.parts.forEach(p=>{if(!on[p.id])return;const hit=p.on.some(t=>z>=a?(t>a&&t<=z):(t>a||t<=z));
   if(hit)document.querySelectorAll(`.mu[data-id="${p.id}"]`).forEach(m=>{m.classList.add('hit');clearTimeout(m._h);m._h=setTimeout(()=>m.classList.remove('hit'),110);});});
  lastS=s;}requestAnimationFrame(frame);}
requestAnimationFrame(frame);
function mu(id){return `<div class="mu" data-id="${id}"><img src="${P[id].img}" alt=""></div>`;}
function card(id){return `<div class="card" data-id="${id}"><img src="${P[id].img}" alt=""><span>${P[id].name}</span></div>`;}
// --- Pull Lanes
const lawn=document.getElementById('lawn'),tray=document.getElementById('tray');let sel=null;const placed={};   // id -> tile
for(let i=0;i<25;i++)lawn.insertAdjacentHTML('beforeend',`<div class="tile" data-i="${i}"></div>`);
tray.innerHTML=D.parts.map(p=>card(p.id)).join('');
function paintTray(){tray.querySelectorAll('.card').forEach(c=>{c.classList.toggle('used',!!placed[c.dataset.id]);c.classList.toggle('sel',c.dataset.id===sel);});
 lawn.querySelectorAll('.tile').forEach(t=>t.classList.toggle('can',!!sel&&!t.firstChild));}
function plant(id,tile){if(placed[id]||tile.firstChild)return;placed[id]=tile;tile.innerHTML=mu(id);const m=tile.firstChild;m.classList.add('wait');sel=null;paintTray();
 setPart(id,true,()=>{m.classList.remove('wait');m.classList.add('pop');});}
function unplant(id,eaten){const tile=placed[id];if(!tile)return;const m=tile.firstChild;if(m._leaving)return;m._leaving=1;if(eaten)m.classList.add('eat');
 setPart(id,false,()=>{m.classList.remove('eat');m.classList.add('gone');setTimeout(()=>{tile.innerHTML='';delete placed[id];paintTray();},300);});}
tray.addEventListener('click',e=>{const c=e.target.closest('.card');if(!c||placed[c.dataset.id])return;sel=sel===c.dataset.id?null:c.dataset.id;paintTray();});
lawn.addEventListener('click',e=>{const t=e.target.closest('.tile');if(!t)return;stopAuto();
 if(t.firstChild){unplant(t.firstChild.dataset.id,false);return;}if(sel)plant(sel,t);});
document.getElementById('eat').addEventListener('click',()=>{stopAuto();const ids=Object.keys(placed).filter(id=>!placed[id].firstChild._leaving);if(!ids.length)return;unplant(ids[Math.floor(Math.random()*ids.length)],true);});
document.getElementById('clear').addEventListener('click',()=>{stopAuto();Object.keys(placed).forEach(id=>unplant(id,false));});
let autoT=null;function stopAuto(){if(autoT){clearTimeout(autoT);autoT=null;document.getElementById('auto').classList.remove('on');}}
const LEVEL=[['p','drums',12],['p','bass',10],['p','voice_bom',2],['p','brass',7],['p','voice_lead',17],['p','woodwinds',22],['p','guitar',5],['p','voice_doowah_lo',15],['p','strings',20],['p','voice_scat',24],
 ['e','brass'],['e','voice_lead'],['w'],['p','brass',7],['p','voice_lead',17],['w'],['e','drums'],['e','woodwinds'],['e','strings'],['w'],['c']];
document.getElementById('auto').addEventListener('click',async()=>{if(autoT){stopAuto();return;}
 Object.keys(placed).forEach(id=>unplant(id,false));await engine();document.getElementById('auto').classList.add('on');let k=0;
 const step=()=>{const s=LEVEL[k++];if(!s){stopAuto();return;}
  if(s[0]==='p'){const t=lawn.children[s[2]];if(!t.firstChild&&!placed[s[1]])plant(s[1],t);}
  else if(s[0]==='e')unplant(s[1],true);else if(s[0]==='c')Object.keys(placed).forEach(id=>unplant(id,false));
  autoT=setTimeout(step,D.bar*1000*(s[0]==='e'?1:2));};autoT=setTimeout(step,400);});
// --- Music Battler
const seatsEl=document.getElementById('seats'),roster=document.getElementById('roster');const seats=Array(7).fill(null);let fighting=false;
roster.innerHTML=D.parts.map(p=>card(p.id)).join('');
function paintSeats(){seatsEl.innerHTML=seats.map((id,i)=>`<div class="seat${id?' full':''}" data-i="${i}">${id?mu(id):''}</div>`).join('');
 roster.querySelectorAll('.card').forEach(c=>c.classList.toggle('used',seats.includes(c.dataset.id)));}
function applySeats(){if(!fighting)return;D.parts.forEach(p=>{setPart(p.id,seats.includes(p.id));});}
roster.addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;const id=c.dataset.id;const i=seats.indexOf(id);
 if(i>=0)seats[i]=null;else{const f=seats.indexOf(null);if(f<0)return;seats[f]=id;}paintSeats();applySeats();});
seatsEl.addEventListener('click',e=>{const s=e.target.closest('.seat');if(!s)return;seats[+s.dataset.i]=null;paintSeats();applySeats();});
function preset(list){for(let i=0;i<7;i++)seats[i]=list[i]||null;paintSeats();applySeats();}
document.getElementById('full').addEventListener('click',()=>preset(['drums','bass','voice_bom','brass','voice_lead','woodwinds','voice_doowah_lo']));
document.getElementById('thin').addEventListener('click',()=>preset(['bass','voice_lead']));
document.getElementById('fight').addEventListener('click',async()=>{const b=document.getElementById('fight');
 if(fighting){fighting=false;b.textContent='Fight';D.parts.forEach(p=>setPart(p.id,false));return;}
 fighting=true;b.textContent='Stop';await engine();applySeats();});
preset(['drums','bass','voice_bom','brass','voice_lead','woodwinds','voice_doowah_lo']);
// --- tabs: one song, one clock; leaving a mode silences it
document.getElementById('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===b.dataset.v));
 stopAuto();D.parts.forEach(p=>{if(gains[p.id])gains[p.id].gain.setTargetAtTime(0,ctx.currentTime,.02);on[p.id]=false;});
 Object.keys(placed).forEach(id=>{placed[id].innerHTML='';delete placed[id];});sel=null;paintTray();fighting=false;document.getElementById('fight').textContent='Fight';});
</script></body></html>
