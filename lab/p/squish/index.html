<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Squish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--sky1:#BDE7FF;--sky2:#EAF7FF;--deck:#FFD9A8;--deck2:#FFCB8E;--trim:#FF8A5B;--ink:#2B2340;--panel:#FFF4DE;--shade:43,35,64;--horizon:70%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#2A3558;--sky2:#1E2643;--deck:#B98C63;--deck2:#A67A54;--trim:#D9663C;--ink:#FFF1DA;--panel:#2B2340;--shade:10,8,20}}
:root[data-theme="dark"]{--sky1:#2A3558;--sky2:#1E2643;--deck:#B98C63;--deck2:#A67A54;--trim:#D9663C;--ink:#FFF1DA;--panel:#2B2340;--shade:10,8,20}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky1);font-family:Fredoka,system-ui,sans-serif;color:var(--ink);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#stage{position:fixed;inset:0;background:linear-gradient(var(--sky2),var(--sky1) var(--horizon),var(--deck) var(--horizon),var(--deck2) 100%)}
#stage::before{content:"";position:absolute;left:0;right:0;top:var(--horizon);height:7px;margin-top:-3px;background:var(--trim)}
#stage::after{content:"";position:absolute;left:var(--cx);top:var(--ground);width:var(--spot);height:calc(var(--spot)*.34);
  transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.34),rgba(255,255,255,0))}
#shadow{position:fixed;left:0;top:0;width:100px;height:20px;border-radius:50%;pointer-events:none;will-change:transform,opacity;
  background:radial-gradient(closest-side,rgba(var(--shade),.34),rgba(var(--shade),.18) 55%,rgba(var(--shade),0))}
#gl{position:fixed;inset:0;width:100%;height:100%;cursor:grab;opacity:0;transition:opacity .35s}
#gl.ready{opacity:1}
#gl.held{cursor:grabbing}
#tray{position:fixed;display:flex;gap:6px;padding:6px;background:var(--panel);border-radius:999px;z-index:2;
  box-shadow:0 4px 0 rgba(var(--shade),.12),0 10px 24px rgba(var(--shade),.10)}
#tray.bottom{left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);flex-direction:row}
#tray.side{right:max(12px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);flex-direction:column}
#tray button{width:46px;height:46px;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;position:relative;
  transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
#tray button img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;transform:translateY(2px)}
#tray button::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 3px var(--trim);opacity:0;transition:opacity .15s}
#tray button.on{background:var(--deck)}
#tray button.on::after{opacity:1}
#tray button:active{transform:scale(.88)}
@media (max-height:420px){#tray button{width:40px;height:40px}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="shadow"></div>
<canvas id="gl"></canvas>
<div id="tray"></div>
<script src="cast.js"></script>
<script src="loops.js"></script>
<script>
/* Squish: grab one of the Music Battler cast anywhere and pull. The body stretches like soft vinyl jelly (a 24x24 WebGL
   mesh warp of the character render), springs back with overshoot and wobble, and the character sings while you pull:
   pull further = higher, on the D major pentatonic. Letting go gives a sung "boing" that follows the spring.
   Vyas 2026-11-22, on David Li's pieces: "in the rick and morty the way he pulls the face and pulls bak is interetng",
   "even the way he moves he blobs and stuffi s interesitng to me"; "well first make htmls of things".

const PACKS = {};

const CAST = [

  {id:'skip_chorister',  name:'Skip Chorister',  base:57, packs:['el_multi_doo','el_multi_la'],      gain:0.85},
  {id:'mire_gatherer',   name:'Mire Gatherer',   base:62, packs:['el_back_ooh','el_back_wah'],       gain:0.8},
  {id:'tiny_peep',       name:'Tiny Peep',       base:69, packs:['el_lead_lo','el_lead_la'],         gain:0.75},
  {id:'undergrowth_tom', name:'Undergrowth Tom', base:54, packs:['el_overdrive_ow','el_overdrive_ha'], gain:0.9},
  {id:'gong_golem',      name:'Gong Golem',      base:64, packs:['el_chorus_ooh','el_chorus_la'],    gain:0.7},

const packNames = [...new Set(CAST.flatMap(c => c.packs))];

/* ---------- music: D major pentatonic ---------- */
const PENT = [0,2,4,7,9];
CAST.forEach(c => {
  const all = []; for (let m = c.base - 14; m <= c.base + 26; m++) if (PENT.includes(((m - 62) % 12 + 12) % 12)) all.push(m);
  const i = all.indexOf(c.base); c.notes = all.slice(i - STEPS_DOWN, i + STEPS_UP + 1);

  }
  stop(rel = 0.2) { if (this.cur) { this.fade(this.cur, rel); this.cur = null; } }

  boing(amount, fallbackNote) {

    try { pr.setValueCurveAtTime(curve, t, dur); } catch (e) { pr.setTargetAtTime(curve[63], t + 0.04, 0.06); }

    const g = v.g.gain; g.cancelScheduledValues(0); g.setValueAtTime(g.value, ctx.currentTime);
    g.linearRampToValueAtTime(1.1, t + 0.025); g.setTargetAtTime(0, t + 0.07, 0.1);

    v.g.gain.setValueAtTime(0, t); v.g.gain.linearRampToValueAtTime(gain, t + 0.015); v.g.gain.setTargetAtTime(0, t + 0.06, 0.06);

}

function silenceAll() { CAST.forEach(c => c.voice && c.voice.stop(0.05)); }

/* ---------- WebGL ---------- */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', {premultipliedAlpha: true, alpha: true, antialias: true});
const VS = `attribute vec2 aPos; attribute vec2 aUV; attribute float aStr; uniform vec2 uView; varying vec2 vUV; varying float vStr;
void main(){ vUV = aUV; vStr = aStr; gl_Position = vec4(aPos.x / uView.x * 2.0 - 1.0, 1.0 - aPos.y / uView.y * 2.0, 0.0, 1.0); }`;
const FS = `precision mediump float; varying vec2 vUV; varying float vStr; uniform sampler2D uA, uB; uniform float uMix, uFade, uRim; uniform vec2 uTexel;
void main(){ vec4 c = mix(texture2D(uA, vUV), texture2D(uB, vUV), uMix);
  // a soft white rim while held (Blob Opera fades one in to 0.4): the body's inner edge, found from the alpha around it
  float n = min(min(texture2D(uA, vUV + vec2(uTexel.x, 0.0)).a, texture2D(uA, vUV - vec2(uTexel.x, 0.0)).a),
                min(texture2D(uA, vUV + vec2(0.0, uTexel.y)).a, texture2D(uA, vUV - vec2(0.0, uTexel.y)).a));
  c.rgb = mix(c.rgb, vec3(c.a), uRim * c.a * c.a * smoothstep(0.0, 1.0, 1.0 - n));
  float l = clamp((vStr - 1.0) * 0.22, -0.10, 0.16);            // stretched vinyl gets thinner and lighter, squashed darker
  c.rgb = l > 0.0 ? mix(c.rgb, vec3(c.a), l) : c.rgb * (1.0 + l);
  gl_FragColor = c * uFade; }`;

const POS = new Float32Array(NV * 2), UV = new Float32Array(NV * 2), STR = new Float32Array(NV);
for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const k = j * N + i; UV[k * 2] = i / (N - 1); UV[k * 2 + 1] = j / (N - 1); }
const IDX = new Uint16Array((N - 1) * (N - 1) * 6); { let p = 0;
  for (let j = 0; j < N - 1; j++) for (let i = 0; i < N - 1; i++) { const a = j * N + i, b = a + 1, c = a + N, d = c + 1; IDX.set([a, b, c, b, d, c], p); p += 6; } }

  const m = c.img.mask, S = Math.round(Math.sqrt(m.length)); c.mask = (u, v) => {

/* ---------- body state ---------- */

let cur = CAST[0], next = null;

const pointers = new Map();

function layout() {

const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

/* the pull of one finger, soft-limited (tanh) with separate limits up, sideways and down */
function pullOf(p) {

function targets() {

  for (const p of pointers.values()) {
    const P = pullOf(p); p.amt = P.amt; p.push = P.push;

      const rx = R[k * 2] - p.gx, ry = R[k * 2 + 1] - p.gy, d2 = rx * rx + ry * ry;
      const g = Math.exp(-d2 / s2), w = g * ANC[k], wy = g * ANCY[k], wb = Math.exp(-d2 / s2b) * ANC[k];

function step(dt) {

/* a squash: the top drops into the base and bounces back (landing, poke, idle hop) */

/* ---------- render ---------- */
const OUT = new Float32Array(NV * 2);
const shadowEl = document.getElementById('shadow');
function render(time) {

    gl.bindBuffer(gl.ARRAY_BUFFER, strBuf); gl.bufferData(gl.ARRAY_BUFFER, STR, gl.DYNAMIC_DRAW); attrib(strBuf, 'aStr', 1);
    attrib(uvBuf, 'aUV', 2);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, ta); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tb);
    gl.uniform1f(uni('uMix'), mouth.t); gl.uniform1f(uni('uFade'), 1); gl.uniform1f(uni('uRim'), rim);
    gl.uniform2f(uni('uTexel'), 5 / cur.img.w, 5 / cur.img.h);

  }

  const sw = Math.max(cur.footW * L.iw, L.bodyH * 0.6) * 1.08 * (1 + widen * 0.8) * (1 + b * 0.5) * sx;
  const lift = Math.min(1, Math.max(0, -yoff) / (L.bodyH * 1.2));
  const so = (1 - lift * 0.85) * (hr > 1 ? 1 - Math.min(0.25, (hr - 1) * 0.5) : 1) * (outT >= 0 ? 1 - Math.min(1, outT / 0.16) * 0.6 : 1);
  shadowEl.style.width = sw + 'px'; shadowEl.style.height = (sw * 0.2) + 'px';
  shadowEl.style.transform = `translate(${L.cx - sw / 2}px,${L.ground - sw * 0.1}px) scale(${1 - lift * 0.4})`;
  shadowEl.style.opacity = so.toFixed(3);
}

/* ---------- mouth and voice from the pull ---------- */
function setMouth(m) {
  const want = m; const shown = mouth.t >= 0.5 ? mouth.b : mouth.a;
  if (want === mouth.b) return;
  mouth = {a: shown, b: want, t: 0};
}
let held = {note: -1, vowel: -1, idx: -1, sounding: false};
function sing(dt) {
  const ps = [...pointers.values()];
  if (!ps.length) return;
  let amt = 0, push = false; for (const p of ps) if ((p.amt || 0) > amt) { amt = p.amt; push = p.push; }
  const pos = STEPS_DOWN + (push ? -STEPS_DOWN * amt : STEPS_UP * amt);
  // snap to a scale step with hysteresis (move 0.3 of a step past the edge to change), as Blob Opera does
  const idx = held.idx >= 0 && Math.abs(pos - held.idx) < 0.8 ? held.idx : Math.max(0, Math.min(cur.notes.length - 1, Math.round(pos)));
  const vowel = held.vowel === 1 ? (amt > 0.38 && !push ? 1 : 0) : (amt > 0.5 && !push ? 1 : 0);
  if (time - cheerUntil > 0) setMouth(vowel ? 'ah' : 'oh');
  const v = voiceOf(cur);
  if (v && buffers[cur.packs[0]] && Object.keys(buffers[cur.packs[0]]).length) {
    const note = cur.notes[idx];
    if (!held.sounding) { if (v.start(note, vowel)) held.sounding = true; }
    else if (note !== held.note || vowel !== held.vowel) v.glide(note, vowel);
    held.note = note; held.vowel = vowel; held.idx = idx;
    if (held.sounding) v.bend((pos - idx) * 45);       // between steps the voice leans toward the next one
  } else { held.idx = idx; held.vowel = vowel; }
}

/* ---------- input ---------- */
function toLocal(e) { return {x: e.clientX, y: e.clientY}; }
function pick(x, y) {
  // nearest solid vertex in the current (deformed) shape, within finger slop
  let best = -1, bd = 1e9; for (let k = 0; k < NV; k++) { if (!SOLID[k]) continue;
    const dx = OUT[k * 2] - x, dy = OUT[k * 2 + 1] - y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = k; } }
  const slop = Math.max(26, L.bodyH * 0.07);
  return best >= 0 && bd < slop * slop ? best : -1;
}
let swipe = null;
canvas.addEventListener('pointerdown', e => {
  unlock(); lastTouch = time;
  if (falling || outT >= 0) return;
  const {x, y} = toLocal(e), k = pick(x, y);
  if (k < 0) { swipe = {id: e.pointerId, x, y, t: time}; return; }
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {} canvas.classList.add('held');
  pointers.set(e.pointerId, {gx: R[k * 2], gy: R[k * 2 + 1], dx0: D[k * 2], dy0: D[k * 2 + 1], sx: x, sy: y, x, y, t: time, moved: false, amt: 0});
  if (pointers.size === 1) { held = {note: -1, vowel: -1, idx: -1, sounding: false}; cheerUntil = 0; }
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  p.x = e.clientX; p.y = e.clientY; if (Math.hypot(p.x - p.sx, p.y - p.sy) > 8) p.moved = true;
});
function release(e) {
  if (swipe && swipe.id === e.pointerId) {
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y; swipe = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) choose(CAST[(CAST.indexOf(cur) + (dx < 0 ? 1 : -1) + CAST.length) % CAST.length]);
    return;
  }
  const p = pointers.get(e.pointerId); if (!p) return;
  if (ctx && ctx.state === 'suspended' && !document.hidden) ctx.resume();   // iOS can need the touch end to unlock

  // the finger's grip is gone: carry over where the body is, the spring takes it home
  if (!pointers.size) {
    canvas.classList.remove('held');
    const v = voiceOf(cur), poke = !p.moved && time - p.t < 0.3;
    if (poke) thump(160 + Math.random() * 40);
    if (v) v.boing(poke ? 0.1 : p.amt || 0, cur.notes[STEPS_DOWN + 2]);

  } else {
    // re-anchor the remaining fingers on the current shape so nothing jumps
    for (const q of pointers.values()) { const P = pullOf(q); q.dx0 += P.x; q.dy0 += P.y; q.sx = q.x; q.sy = q.y; }

canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('lostpointercapture', e => { if (pointers.has(e.pointerId)) release(e); });

document.addEventListener('visibilitychange', () => { if (document.hidden) { releaseAll(); if (ctx) ctx.suspend(); } });
window.addEventListener('blur', releaseAll);
window.addEventListener('pagehide', () => { releaseAll(); if (ctx) ctx.suspend(); });

/* ---------- switching: the old one flattens away, the new one drops in and lands with a squash ---------- */
const tray = document.getElementById('tray');
CAST.forEach(c => { const b = document.createElement('button'); b.setAttribute('aria-label', c.name);
  b.innerHTML = `<img src="img/${c.id}-thumb.webp" alt="">`; b.onclick = () => { unlock(); choose(c); }; c.btn = b; tray.appendChild(b); });
function choose(c) {
  if (c === cur || falling || outT >= 0) return;
  releaseAll(); next = c; outT = 0; loadChar(c);
  CAST.forEach(x => x.btn.classList.toggle('on', x === c));
}
function landNext() {
  cur = next; next = null; outT = -1; D.fill(0); V.fill(0); mouth = {a: 'oh', b: 'oh', t: 1}; layout();

/* ---------- loop ---------- */
let time = 0, last = performance.now(), acc = 0;

  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  if (outT >= 0) { outT += dt; if (outT > 0.18 && next && next.tex.smile && next.tex.oh) landNext(); }

addEventListener('resize', () => { layout(); });
window.__squish = () => ({cur: cur.id, held: {...held}, mouth: mouth.b, ctx: ctx && ctx.state, voice: !!(cur.voice && cur.voice.cur), decoded: Object.keys(buffers).filter(n => Object.keys(buffers[n]).length).length, maxD: Math.max(...D.map(Math.abs))});
loadChar(cur).then(() => {
  layout(); cur.btn.classList.add('on'); canvas.classList.add('ready'); render(0);
  setTimeout(() => thump(150), 350);
  requestAnimationFrame(t => { last = t; frame(t); });
  CAST.forEach(c => loadChar(c));
});
</script>
