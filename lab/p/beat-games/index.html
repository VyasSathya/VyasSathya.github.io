<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Beat Games</title>
<style>
:root{--bg:#f4f4f2;--field:#fff;--ink:#16181d;--mute:#6b7080;--line:rgba(0,0,0,.09);--acc:#119c80;--panel:rgba(255,255,255,.88)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1014;--field:#151820;--ink:#e8eaee;--mute:#8a90a0;--line:rgba(255,255,255,.08);--acc:#4fd1b5;--panel:rgba(21,24,32,.88)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column}
#hud{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);flex:none}
#name{font-weight:600;font-size:15px;letter-spacing:-.01em}
#stats{display:flex;gap:14px;font-variant-numeric:tabular-nums}
#stats span{font-size:15px;font-weight:600}
#stats i{font-style:normal;font-size:12px;color:var(--mute);font-weight:500;margin-right:4px}
#stage{position:relative;flex:1;min-height:0}
canvas{display:block;touch-action:none}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#ov .p{pointer-events:auto;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:22px 24px;text-align:center;width:340px;max-width:86%}
#ov .t{font-size:22px;font-weight:650;letter-spacing:-.02em}
#ov .s{font-size:14px;color:var(--mute);margin-top:6px;line-height:1.45}
button{font:inherit;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:10px;padding:10px 18px;font-size:15px;font-weight:600}
#ov button{margin-top:16px;background:var(--acc);color:#fff;border:0;width:100%}
#tray{position:absolute;left:0;right:0;bottom:0;height:72px;display:none;align-items:center;justify-content:center;pointer-events:none}
#tray button{pointer-events:auto;min-width:140px}
#tray button.on{background:var(--acc);color:#fff;border-color:transparent}
nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);flex:none}
nav button{flex:1;min-width:0;border:0;border-radius:0;background:none;color:var(--mute);font-size:12px;font-weight:600;padding:14px 0;white-space:nowrap}
nav button.on{color:var(--ink);box-shadow:inset 0 2px 0 var(--acc)}
</style>
</head>
<body>
<div id="hud"><div id="name"></div><div id="stats"></div></div>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="tray"><button id="ready">Ready</button></div>
  <div id="ov"><div class="p"><div class="t"></div><div class="s"></div><button>Play</button></div></div>
</div>
<nav id="nav"></nav>
<script>
"use strict";
const Q=new URLSearchParams(location.search);
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
const P=dark?{bg:'#0e1014',tA:'#141821',tB:'#181d27',ink:'#e8eaee',mute:'#8a90a0',line:'rgba(255,255,255,.08)',acc:'#4fd1b5',bad:'#f0606e',gold:'#f5b544',wall:'#2c3344',
  kick:'#f0606e',snare:'#f5b544',hat:'#8b9bff',bass:'#c08cff',lead:'#4fd1b5'}
 :{bg:'#f4f4f2',tA:'#ffffff',tB:'#ebebe7',ink:'#16181d',mute:'#6b7080',line:'rgba(0,0,0,.09)',acc:'#119c80',bad:'#d9384a',gold:'#d98a0b',wall:'#cdd2db',
  kick:'#d9384a',snare:'#d98a0b',hat:'#5566e0',bass:'#8a4fd8',lead:'#119c80'};
const ri=n=>Math.floor(Math.random()*n),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,f)=>a+(b-a)*f,ease=f=>1-Math.pow(1-f,3);
const stage=document.getElementById('stage'),cv=document.getElementById('c'),g=cv.getContext('2d');
let W=0,H=0;

// ---------------- audio
let ac=null,out=null,noise=null,wildBus=null,bus=null;
function audioInit(){
  if(!ac){
    try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
    out=ac.createGain();out.gain.value=Q.has('mute')?0:.8;out.connect(comp);comp.connect(ac.destination);
    const n=ac.sampleRate;noise=ac.createBuffer(1,n*2,n);const d=noise.getChannelData(0);for(let i=0;i<n*2;i++)d[i]=Math.random()*2-1;
    wildBus=ac.createBiquadFilter();wildBus.type='lowpass';wildBus.frequency.value=650;const wg=ac.createGain();wg.gain.value=.6;wildBus.connect(wg);wg.connect(out);
  }
  if(ac.state!=='running')ac.resume();
}
document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();else ac.resume()});
const mf=m=>440*Math.pow(2,(m-69)/12);
function env(node,t,a,peak,d){const gn=ac.createGain();gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+a);gn.gain.exponentialRampToValueAtTime(.0001,t+a+d);node.connect(gn);gn.connect(bus||out);return gn}
function osc(type,f,t,dur){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(t+dur+.06);return o}
function nz(t,dur){const s=ac.createBufferSource();s.buffer=noise;s.start(t,Math.random()*.5);s.stop(t+dur+.06);return s}
function filt(type,f,q){const b=ac.createBiquadFilter();b.type=type;b.frequency.value=f;if(q)b.Q.value=q;return b}
const S={
  kick(t,v=1){const o=osc('sine',150,t,.35);o.frequency.exponentialRampToValueAtTime(42,t+.13);env(o,t,.002,.9*v,.3)},
  snare(t,v=1){const n=nz(t,.2),f=filt('highpass',1400);n.connect(f);env(f,t,.002,.42*v,.16);const o=osc('triangle',190,t,.1);env(o,t,.002,.22*v,.08)},
  hat(t,v=1){const n=nz(t,.06),f=filt('highpass',7500);n.connect(f);env(f,t,.001,.15*v,.035)},
  clap(t,v=1){for(let i=0;i<3;i++){const tt=t+i*.011,n=nz(tt,.14),f=filt('bandpass',1300,1.2);n.connect(f);env(f,tt,.001,.38*v,i===2?.14:.02)}},
  bass(t,m,dur,v=1){const o=osc('sawtooth',mf(m),t,dur),f=filt('lowpass',520,2);o.connect(f);env(f,t,.005,.3*v,dur)},
  sub(t,m){const o=osc('sine',mf(m),t,.6);o.frequency.exponentialRampToValueAtTime(mf(m)/2,t+.5);env(o,t,.005,.7,.55);const n=nz(t,.3),f=filt('lowpass',900);n.connect(f);env(f,t,.002,.35,.25)},
  lead(t,m,dur,v=1){const o=osc('square',mf(m),t,dur),f=filt('lowpass',2400);o.connect(f);env(f,t,.008,.12*v,dur);const o2=osc('triangle',mf(m+12),t,dur);env(o2,t,.008,.06*v,dur*.8)},
  pluck(t,m,v=1){const o=osc('triangle',mf(m),t,.3);env(o,t,.003,.2*v,.24)},
  wood(t,m=84,v=1){const o=osc('sine',mf(m),t,.08);env(o,t,.001,.25*v,.05)},
  click(t,v=1){const o=osc('sine',1800,t,.03);env(o,t,.001,.07*v,.02)},
  stab(t,ms,v=1){for(const m of ms){const o=osc('sawtooth',mf(m),t,.35),f=filt('lowpass',1800);o.connect(f);env(f,t,.004,.09*v,.3)}},
  thud(t){const o=osc('sine',95,t,.3);o.frequency.exponentialRampToValueAtTime(40,t+.25);env(o,t,.002,.8,.25);const n=nz(t,.15),f=filt('lowpass',600);n.connect(f);env(f,t,.002,.4,.12)},
  pad(t,ms,dur,v=1){for(const m of ms){const o=osc('triangle',mf(m),t,dur);env(o,t,.15,.05*v,dur)}},
  ohat(t,v=1){const n=nz(t,.3),f=filt('highpass',6500);n.connect(f);env(f,t,.002,.13*v,.25)},
  shaker(t,v=1){const n=nz(t,.08),f=filt('bandpass',5200,1.5);n.connect(f);env(f,t,.01,.12*v,.05)},
  crash(t,v=1){const n=nz(t,1.4),f=filt('highpass',4200);n.connect(f);env(f,t,.002,.22*v,1.3)},
  bell(t,m,v=1){const o=osc('sine',mf(m),t,1);env(o,t,.002,.14*v,.9);const o2=osc('sine',mf(m)*2.01,t,.5);env(o2,t,.002,.05*v,.4)},
  slide(t,a,b,dur){const o=osc('sawtooth',mf(a),t,dur);o.frequency.exponentialRampToValueAtTime(mf(b),t+dur*.6);const f=filt('lowpass',900,3);o.connect(f);env(f,t,.005,.35,dur)},
  subnote(t,m,dur,v=1){const o=osc('sine',mf(m),t,dur);env(o,t,.01,.35*v,dur)}
};

// ---------------- clock: game logic resolves each beat a hair early so its sounds can be scheduled exactly on the beat
const CLK={on:false,spb:.6,b:0,next:0,lastB:-1,lastT:0};
const LOOK=.045;
function clockStart(bpm){CLK.spb=60/bpm;CLK.b=0;CLK.next=ac.currentTime+.35;CLK.lastB=-1;CLK.lastT=0;CLK.on=true}
function setBpm(bpm){CLK.spb=60/bpm}
function tickClock(){if(!CLK.on)return;while(CLK.on&&ac.currentTime>=CLK.next-LOOK){const b=CLK.b,t=CLK.next;CLK.lastB=b;CLK.lastT=t;CLK.b++;CLK.next+=CLK.spb;game.onBeat(b,t)}}
function vis(now){let b=CLK.lastB,t=CLK.lastT;if(b>=0&&now<t){b--;t-=CLK.spb}return{b,idx:((b%4)+4)%4,ph:CLK.on&&b>=0?clamp((now-t)/CLK.spb,0,1):1}}
const later=[];function at(t,fn){later.push({t,fn})}

// ---------------- drawing helpers
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function circle(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function epos(o,now){let f=1;if(o.mt){f=now<o.mt?0:ease(clamp((now-o.mt)/.1,0,1))}return{x:lerp(o.px,o.x,f),y:lerp(o.py,o.y,f)}}
function chev(cx,cy,dx,dy,s,col,a){g.globalAlpha=a;g.fillStyle=col;const px=-dy,py=dx;g.beginPath();g.moveTo(cx+dx*s,cy+dy*s);g.lineTo(cx-dx*s*.3+px*s*.8,cy-dy*s*.3+py*s*.8);g.lineTo(cx-dx*s*.3-px*s*.8,cy-dy*s*.3-py*s*.8);g.closePath();g.fill();g.globalAlpha=1}
function beatDots(now,y,col){const v=vis(now);for(let i=0;i<4;i++){const x=W/2+(i-1.5)*20,on=CLK.on&&v.b>=0&&i===v.idx,k=on?Math.max(0,1-v.ph*2.2):0;
  if(on)circle(x,y,4+3*k,col||P.acc);else{g.globalAlpha=.35;circle(x,y,3.5,P.mute);g.globalAlpha=1}}}
function label(text,x,y,size,col,align,weight){g.fillStyle=col;g.font=`${weight||600} ${size}px Inter,system-ui,-apple-system,sans-serif`;g.textAlign=align||'center';g.textBaseline='middle';g.fillText(text,x,y)}
function drawFx(list,now,bx,by,cs){for(let i=list.length-1;i>=0;i--){const f=list[i],a=now-f.t;if(a<0)continue;
  if(f.k==='pop'){const T=.45;if(a>T){list.splice(i,1);continue}const k=a/T,cx=bx+(f.x+.5)*cs,cy=by+(f.y+.5)*cs;
    g.globalAlpha=1-k;g.strokeStyle=f.col;g.lineWidth=3;g.beginPath();g.arc(cx,cy,cs*(.25+.45*k),0,7);g.stroke();
    if(f.text)label(f.text,cx,cy-cs*.3-k*cs*.4,14,f.col,'center',700);g.globalAlpha=1}
  else if(f.k==='tiles'){const T=.35;if(a>T){list.splice(i,1);continue}g.globalAlpha=(1-a/T)*.55;g.fillStyle=f.col;for(const q of f.tiles){rr(bx+q.x*cs+1,by+q.y*cs+1,cs-2,cs-2,6);g.fill()}g.globalAlpha=1}
  else if(f.k==='text'){const T=1.1;if(a>T){list.splice(i,1);continue}g.globalAlpha=Math.min(1,(T-a)*3);label(f.text,W/2,by+cs*2-a*14,22,f.col||P.ink,'center',700);g.globalAlpha=1}}}

// =====================================================================
// shared: instruments as enemies (same rules as Band Room)
const MEL=[76,null,74,72, 69,null,72,74, 76,79,76,null, 74,72,69,null];
const CH=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];          // Am F C G
const COLT={thumper:'kick',snapper:'snare',ticker:'hat',rumbler:'bass',singer:'lead'};
const D4=[[1,0],[0,1],[-1,0],[0,-1]];
const same=(a,b)=>a.x===b.x&&a.y===b.y,adj=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y)===1;
function acts(type,idx,b){switch(type){case'thumper':return idx%2===0;case'snapper':return idx%2===1;case'ticker':return true;case'rumbler':return idx<2;case'singer':return MEL[b%16]!=null}return false}
function mkE(type,x,y){return{type,x,y,px:x,py:y,mt:0,dir:Math.random()<.5?[1,0]:[0,1],li:ri(4),ls:0,beatT:-9,lunge:null,bornT:-9}}
function chaseE(e,ctx){const pl=ctx.pl,dx=pl.x-e.x,dy=pl.y-e.y,ax=[Math.sign(dx),0],ay=[0,Math.sign(dy)],o=[];
  if(Math.abs(dx)>=Math.abs(dy)){if(dx)o.push(ax);if(dy)o.push(ay)}else{if(dy)o.push(ay);if(dx)o.push(ax)}
  for(const d of o){const x=e.x+d[0],y=e.y+d[1];if(!ctx.blocked(x,y))return{x,y}}return null}
function intentE(e,idx,b,ctx){
  if(!acts(e.type,idx,b))return null;const pl=ctx.pl;
  switch(e.type){
    case'thumper':return chaseE(e,ctx);
    case'rumbler':return idx===0?{blast:true}:chaseE(e,ctx);
    case'snapper':{let x=e.x+e.dir[0],y=e.y+e.dir[1];if(!ctx.blocked(x,y))return{x,y};x=e.x-e.dir[0];y=e.y-e.dir[1];if(!ctx.blocked(x,y))return{x,y,rev:true};return null}
    case'ticker':{const d=D4[e.li],x=e.x+d[0],y=e.y+d[1];return ctx.blocked(x,y)?{stuck:true}:{x,y}}
    case'singer':{let best=null,bd=Math.abs(e.x-pl.x)+Math.abs(e.y-pl.y);for(const d of D4){const x=e.x+d[0],y=e.y+d[1];if(ctx.blocked(x,y)||(x===pl.x&&y===pl.y))continue;const dd=Math.abs(x-pl.x)+Math.abs(y-pl.y);if(dd>bd){bd=dd;best={x,y}}}return best||{stay:true}}
  }return null}
function stepE(e,b,t,ctx){const it=intentE(e,b%4,b,ctx);e.beatT=t;if(!it)return;
  if(it.blast){ctx.blast(e,t);return}
  if(it.stuck){e.li=(e.li+1)%4;e.ls=0;return}
  if(it.stay)return;
  if(it.x===ctx.pl.x&&it.y===ctx.pl.y){if(e.type!=='singer'){e.lunge={x:it.x-e.x,y:it.y-e.y,t};ctx.hitPlayer(e,t)}return}
  if(ctx.blocked(it.x,it.y))return;
  if(it.rev)e.dir=[-e.dir[0],-e.dir[1]];
  e.px=e.x;e.py=e.y;e.x=it.x;e.y=it.y;e.mt=t;
  if(e.type==='ticker'&&++e.ls>=2){e.ls=0;e.li=(e.li+1)%4}
  ctx.entered(e,t)}
function blastOf(e,stop){const o=[];for(const d of D4){let x=e.x+d[0],y=e.y+d[1];while(!stop(x,y)){o.push({x,y});x+=d[0];y+=d[1]}}return o}
// ---------------- the band you build: each catch adds a part or makes one richer, up to the full ensemble
const PARTS=['ticker','thumper','snapper','rumbler','singer'],PNAME={ticker:'Hats',thumper:'Kick',snapper:'Snare',rumbler:'Bass',singer:'Melody'};
function makeCrew(){return{lv:{ticker:0,thumper:0,snapper:0,rumbler:0,singer:0},full:false}}
function crewSize(c){return PARTS.filter(p=>c.lv[p]>0).length}
function third(m){const sc=[0,2,4,5,7,9,11],pc=((m%12)+12)%12,i=sc.indexOf(pc);if(i<0)return m+3;const j=i+2;return m-pc+sc[j%7]+12*Math.floor(j/7)}
// one part at its level: 1 plain, 2 busier, 3 full
function part(ty,lv,b,t,v){const idx=b%4,bar=Math.floor(b/4),ch=CH[bar%4],spb=CLK.spb,h=spb/2,q=spb/4,r=ch[0]-24;
  switch(ty){
    case'ticker':S.hat(t,.7*v);S.hat(t+h,v);if(lv>=2){S.hat(t+q,.4*v);S.hat(t+3*q,.5*v);if(idx===3)S.ohat(t+h,.8*v)}if(lv>=3){S.shaker(t+q,.7*v);S.shaker(t+3*q,.7*v)}break;
    case'thumper':if(idx%2===0)S.kick(t,v);if(lv>=2&&idx===1)S.kick(t+h,.75*v);if(lv>=3&&idx===3)S.kick(t+3*q,.6*v);break;
    case'snapper':if(idx%2===1)S.snare(t,v);if(lv>=2){S.snare(t+3*q,.14*v);if(idx===2)S.snare(t+q,.1*v)}if(lv>=3){if(idx%2===1)S.clap(t,.55*v);if(bar%4===3&&idx===3)for(let i=0;i<4;i++)S.snare(t+i*q,(.25+i*.18)*v)}break;
    case'rumbler':if(lv>=2){const L=[[0,12],[7,12],[0,7],[12,7]][idx];S.bass(t,r+L[0],h*.85,v);S.bass(t+h,r+L[1],h*.8,v)}else{S.bass(t,r,h*.85,v);S.bass(t+h,idx===3?r+7:r+12,h*.8,v)}if(lv>=3&&idx===0)S.subnote(t,r-12,spb*3.6,v);break;
    case'singer':{const m=MEL[b%16];if(m){S.lead(t,m,spb*.85,v);if(lv>=2)S.lead(t,third(m),spb*.85,.5*v);if(lv>=3)S.lead(t+spb*.75,m+12,spb*.22,.28*v)}break}
  }}
function playBand(b,t,crew,wild,full){full=full||5;const idx=b%4,bar=Math.floor(b/4),ch=CH[bar%4],spb=CLK.spb,q=spb/4,n=crewSize(crew);
  // instruments still loose in the room sound far away and muffled
  bus=wildBus;for(const ty of wild)if(!crew.lv[ty])part(ty,1,b,t,.8);bus=null;
  for(const ty of PARTS)if(crew.lv[ty])part(ty,crew.lv[ty],b,t,1);
  if(!n)S.click(t,wild.size?.3:(idx?.6:1));
  // the ensemble fills in around them as the band grows
  if(n>=Math.min(3,full)&&idx===0)S.pad(t,ch.map(m=>m+12),spb*4,n>=full?1.8:1.1);
  if(n>=Math.min(4,full)){const tones=[ch[0],ch[1],ch[2],ch[0]+12];for(let i=0;i<4;i++)S.pluck(t+i*q,tones[i]+24,.3)}
  if(n>=full&&idx===0&&bar%2===0)S.crash(t,.45)}
// a catch: the instrument plays its own fill, the chord rings, and it joins the band or gets richer
function stinger(ty,t,isNew){const spb=CLK.spb,q=spb/4,e=q/2,ch=CH[Math.floor(Math.max(0,CLK.lastB)/4)%4];
  switch(ty){
    case'ticker':for(let i=0;i<8;i++)S.hat(t+i*e,.3+i*.1);S.ohat(t+8*e,1);break;
    case'thumper':S.kick(t,1);S.kick(t+q,.8);S.kick(t+2*q,1);S.kick(t+3*q,1);break;
    case'snapper':for(let i=0;i<8;i++)S.snare(t+i*e,.2+i*.1);S.clap(t+8*e,1);break;
    case'rumbler':S.slide(t,ch[0]-24,ch[0]-12,spb);break;
    case'singer':[ch[0]+12,ch[1]+12,ch[2]+12,ch[0]+24].forEach((m,i)=>S.lead(t+i*q,m,q*1.3,.9));break}
  ch.map(m=>m+24).forEach((m,i)=>S.bell(t+i*.04,m,isNew?1:.6));
  if(isNew)S.crash(t,.6)}
function joinBand(crew,ty,t,fx,x,y,full){full=full||5;const was=crew.lv[ty];crew.lv[ty]=Math.min(3,was+1);
  stinger(ty,t,!was);
  fx.push({k:'pop',x,y,t,col:P[COLT[ty]],text:was?PNAME[ty]+' up':PNAME[ty]+' joins'});
  if(!crew.full&&crewSize(crew)>=full){crew.full=true;fx.push({k:'text',text:'Full band',t:t+.2,col:P.acc});S.crash(t+CLK.spb,1)}}
// the lineup: one mark per part, lit once it is in your band, dots for how rich it is
function drawLineup(crew,xr,y,parts){parts=parts||PARTS;parts.slice().reverse().forEach((ty,i)=>{const cx=xr-6-i*20,lv=crew.lv[ty];

function shape(type,cx,cy,s,col){g.fillStyle=col;
  if(type==='thumper'){rr(cx-s,cy-s,2*s,2*s,s*.35);g.fill()}
  else if(type==='snapper'){g.beginPath();g.moveTo(cx,cy-s*1.2);g.lineTo(cx+s*1.2,cy);g.lineTo(cx,cy+s*1.2);g.lineTo(cx-s*1.2,cy);g.closePath();g.fill()}

  else{g.beginPath();g.moveTo(cx,cy-s*1.25);g.lineTo(cx+s*1.15,cy+s*.9);g.lineTo(cx-s*1.15,cy+s*.9);g.closePath();g.fill()}}
function drawE(e,now,bx,by,cs,inBand){

  shape(e.type,cx,cy,s,P[COLT[e.type]])}
function drawArrows(en,curB,ctx,bx,by,cs,danger){if(curB<0)return;const nb=curB+1,ni=nb%4;

    const dx=it.x-e.x,dy=it.y-e.y,d=danger(it.x,it.y);chev(bx+(e.x+.5+dx*.5)*cs,by+(e.y+.5+dy*.5)*cs,dx,dy,cs*.13,d?P.bad:P[COLT[e.type]],d?1:.75)}}
function drawBlastWarn(en,curB,stop,bx,by,cs){if(curB<0)return;const ni=(curB+1)%4,a=ni===0?.34:ni===3?.12:0;if(!a)return;
  for(const e of en)if(e.type==='rumbler'){g.globalAlpha=a;g.fillStyle=P.bad;for(const q of blastOf(e,stop)){rr(bx+q.x*cs+1,by+q.y*cs+1,cs-2,cs-2,6);g.fill()}g.globalAlpha=1}}
function drawPlayer(pl,now,bx,by,cs){const p=epos(pl,now);let ox=0,oy=0;if(pl.bump){const a=now-pl.bump.t;if(a>=0&&a<.16){const k=Math.sin(Math.PI*a/.16)*.28;ox=pl.bump.x*k;oy=pl.bump.y*k}}
  const cx=bx+(p.x+.5+ox)*cs,cy=by+(p.y+.5+oy)*cs,ha=now-pl.hitT;circle(cx,cy,cs*.3,ha>=0&&ha<.3?P.bad:P.ink);g.strokeStyle=P.acc;g.lineWidth=3;g.beginPath();g.arc(cx,cy,cs*.3+4,0,7);g.stroke();return{x:cx,y:cy}}
function shakeFor(pl,now){const ha=now-pl.hitT;return ha>=0&&ha<.25?(1-ha/.25)*7:0}
function checker(C,R,bx,by,cs){for(let y=0;y<R;y++)for(let x=0;x<C;x++){g.fillStyle=(x+y)%2?P.tA:P.tB;rr(bx+x*cs+1,by+y*cs+1,cs-2,cs-2,6);g.fill()}}
function tile(x,y,bx,by,cs,col,a,inset){const i=inset||1;g.globalAlpha=a;g.fillStyle=col;rr(bx+x*cs+i,by+y*cs+i,cs-2*i,cs-2*i,6);g.fill();g.globalAlpha=1}
function trailLine(pts,bx,by,cs,w,col,a){if(pts.length<2)return;g.globalAlpha=a;g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.beginPath();pts.forEach((p,i)=>{const x=bx+(p.x+.5)*cs,y=by+(p.y+.5)*cs;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.globalAlpha=1}
// cells the barrier closes off from the board edge
function enclosed(C,R,isBar){const seen=new Uint8Array(C*R),st=[];const push=(x,y)=>{const i=y*C+x;if(seen[i]||isBar(x,y))return;seen[i]=1;st.push(i)};
  for(let x=0;x<C;x++){push(x,0);push(x,R-1)}for(let y=0;y<R;y++){push(0,y);push(C-1,y)}
  while(st.length){const i=st.pop(),x=i%C,y=(i-x)/C;if(x>0)push(x-1,y);if(x<C-1)push(x+1,y);if(y>0)push(x,y-1);if(y<R-1)push(x,y+1)}
  const out=[];for(let i=0;i<C*R;i++){const x=i%C,y=(i-x)/C;if(!seen[i]&&!isBar(x,y))out.push(i)}return out}
function regions(C,R,isFree){const seen=new Uint8Array(C*R),out=[];
  for(let s=0;s<C*R;s++){const sx=s%C,sy=(s-sx)/C;if(seen[s]||!isFree(sx,sy))continue;const reg=[],st=[s];seen[s]=1;
    while(st.length){const i=st.pop(),x=i%C,y=(i-x)/C;reg.push(i);for(const d of D4){const nx=x+d[0],ny=y+d[1];if(nx<0||ny<0||nx>=C||ny>=R)continue;const j=ny*C+nx;if(!seen[j]&&isFree(nx,ny)){seen[j]=1;st.push(j)}}}

// beat stepping: a tap counts for the next beat, or for the beat that just passed if it was a hair late
function makeStepper(){const s={queued:null,actedB:-1,curB:-1,curT:0,

  input(d,fn){const now=ac.currentTime;if(s.curB>=0&&s.actedB!==s.curB&&now-s.curT<=.14){s.actedB=s.curB;fn(d,Math.max(now,s.curT),Math.abs(now-s.curT)<.1);return}s.queued={d,at:now}},
  reset(){s.queued=null;s.actedB=-1}};return s}
function tapDir(x,y,pl,bx,by,cs){const dx=x-(bx+(pl.x+.5)*cs),dy=y-(by+(pl.y+.5)*cs);if(Math.abs(dx)<cs*.4&&Math.abs(dy)<cs*.4)return null;return Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]}
const KEYS={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
function gameOver(text,start){CLK.on=false;document.getElementById('tray').style.display='none';showOv('Out of hearts',text,'Play again',start)}

// Band Paper ('paper') and Cut the Room ('cut'): your trail claims ground, caught instruments join your band
function makeTerritory(mode){
  const C=9,R=13,N=C*R,I=(x,y)=>y*C+x,GOAL=mode==='paper'?.55:.7;
  const ROOMS=[['ticker','ticker','snapper'],['ticker','snapper','thumper'],['thumper','snapper','ticker','rumbler'],['thumper','ticker','rumbler','singer']];
  const POOL=['thumper','snapper','ticker','rumbler','ticker','snapper'];
  let room=1,hearts=3,score=0,over=false,fx=[],own=new Uint8Array(N),init=0,trail=[],tset=new Set(),from={x:0,y:0},en=[],band=[],crew=makeCrew(),pl=null,clearing=false,steps=0,curBar=0,bx=0,by=0,cs=40;
  const st=makeStepper();
  const OOB=(x,y)=>x<0||y<0||x>=C||y>=R;
  const ctx={blocked:(x,y)=>OOB(x,y)||own[I(x,y)]===1||en.some(e=>e.x===x&&e.y===y),get pl(){return pl},
    blast(e,t){const tl=blastOf(e,(x,y)=>OOB(x,y)||own[I(x,y)]===1);fx.push({k:'tiles',tiles:tl,t,col:P.bad});S.sub(t,CH[curBar][0]-24);
      if(tl.some(q=>tset.has(I(q.x,q.y))))cut(t);else if(tl.some(q=>same(q,pl)))hurt(t)},
    hitPlayer(e,t){if(trail.length)cut(t);else hurt(t)},
    entered(e,t){if(tset.has(I(e.x,e.y)))cut(t)}};
  function bpmFor(r){return Math.min(132,90+r*5)}
  function count(){let n=0;for(let i=0;i<N;i++)n+=own[i];return n}
  function progress(){return (count()-init)/(N-init)}
  function stats(){setStats([['Room',room],['HP',hearts],['Score',score]])}
  function newRoom(){
    own=new Uint8Array(N);trail=[];tset=new Set();en=[];band=[];clearing=false;
    if(mode==='paper'){for(let y=R-3;y<R;y++)for(let x=3;x<6;x++)own[I(x,y)]=1;pl={x:4,y:R-2}}
    else{for(let x=0;x<C;x++){own[I(x,0)]=1;own[I(x,R-1)]=1}for(let y=0;y<R;y++){own[I(0,y)]=1;own[I(C-1,y)]=1}pl={x:4,y:R-1}}
    Object.assign(pl,{px:pl.x,py:pl.y,mt:0,hitT:-9,bump:null});from={x:pl.x,y:pl.y};init=count();
    const list=room<=ROOMS.length?ROOMS[room-1]:Array.from({length:Math.min(6,2+Math.floor(room/2))},()=>POOL[ri(POOL.length)]).concat(['singer']);
    for(const type of list)for(let k=0;k<100;k++){const x=ri(C),y=ri(R-4);if(own[I(x,y)]||en.some(e=>e.x===x&&e.y===y)||Math.abs(x-pl.x)+Math.abs(y-pl.y)<5)continue;en.push(mkE(type,x,y));break}}
  function reset(){room=1;hearts=3;score=0;over=false;fx=[];steps=0;crew=makeCrew();st.reset();st.curB=-1;newRoom();stats()}
  function start(){reset();clockStart(bpmFor(room))}
  function layout(){const top=58,bot=20;cs=Math.floor(Math.min((W-24)/C,(H-top-bot)/R));bx=Math.round((W-cs*C)/2);by=Math.round(top+(H-top-bot-cs*R)/2)}
  function hurt(t){if(over||t-pl.hitT<.05)return;pl.hitT=t;hearts--;S.thud(t);at(t,stats);
    if(hearts<=0){over=true;at(t+.7,()=>gameOver('Room '+room+', score '+score,start))}}
  function cut(t){const tl=trail.slice();hurt(t);fx.push({k:'tiles',tiles:tl,t,col:P.bad});trail=[];tset.clear();
    pl.px=pl.x;pl.py=pl.y;pl.x=from.x;pl.y=from.y;pl.mt=t+.06}
  function close(t){
    const tl=trail.slice();for(const c of tl)own[I(c.x,c.y)]=1;trail=[];tset.clear();
    let fill=[];
    if(mode==='paper')fill=enclosed(C,R,(x,y)=>own[I(x,y)]===1);
    else for(const reg of regions(C,R,(x,y)=>!own[I(x,y)])){const s=new Set(reg),w=en.filter(e=>s.has(I(e.x,e.y)));if(!w.length||reg.length<=4*w.length)fill.push(...reg)}
    const fs=new Set(fill);for(const i of fill)own[i]=1;
    const caught=[];for(const e of en.slice())if(fs.has(I(e.x,e.y))){en.splice(en.indexOf(e),1);band.push(e);caught.push(e)}
    fx.push({k:'tiles',tiles:tl.concat(fill.map(i=>({x:i%C,y:(i-i%C)/C}))),t,col:P.acc});
    score+=tl.length+fill.length+caught.length*caught.length*50;
    caught.forEach((e,i)=>joinBand(crew,e.type,t+i*CLK.spb,fx,e.x,e.y));
    if(!caught.length)S.pluck(t,CH[curBar][0]+24,.8);
    at(t,stats);
    if(progress()>=GOAL||!en.length){clearing=true;fx.push({k:'text',text:'Room clear',t,col:P.acc})}}
  function doPlayer(d,t){
    const x=pl.x+d[0],y=pl.y+d[1];
    if(OOB(x,y)||en.some(e=>e.x===x&&e.y===y)||tset.has(I(x,y))){pl.bump={x:d[0],y:d[1],t};return}
    pl.px=pl.x;pl.py=pl.y;pl.x=x;pl.y=y;pl.mt=t;
    if(own[I(x,y)]){if(trail.length)close(t)}
    else{if(!trail.length)from={x:pl.px,y:pl.py};trail.push({x,y});tset.add(I(x,y))}
    S.pluck(t,CH[curBar][steps++%3]+12,.9)}
  function onBeat(b,t){if(over)return;const idx=b%4;curBar=Math.floor(b/4)%4;
    if(clearing&&idx===0){room++;newRoom();setBpm(bpmFor(room));st.reset();fx.push({k:'text',text:'Room '+room,t,col:P.ink});at(t,stats)}
    st.beat(b,t,doPlayer);
    if(!clearing)for(const e of en.slice())if(!over&&en.includes(e)&&acts(e.type,idx,b))stepE(e,b,t,ctx);
    for(const e of band)if(acts(e.type,idx,b))e.beatT=t;
    playBand(b,t,crew,new Set(en.map(e=>e.type)))}
  function input(d){if(!over&&CLK.on&&d)st.input(d,doPlayer)}
  function draw(now){
    const sh=shakeFor(pl,now);g.save();if(sh)g.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);
    checker(C,R,bx,by,cs);
    for(let y=0;y<R;y++)for(let x=0;x<C;x++)if(own[I(x,y)])tile(x,y,bx,by,cs,P.acc,.26);
    if(CLK.on){const v=vis(now),k=Math.max(0,1-v.ph*3);if(k>0){g.globalAlpha=k*.06;g.fillStyle=P.acc;rr(bx,by,cs*C,cs*R,8);g.fill();g.globalAlpha=1}}
    for(const c of trail)tile(c.x,c.y,bx,by,cs,P.acc,.22,cs*.18);
    if(trail.length){const pts=[from,...trail];const p=epos(pl,now);pts[pts.length-1]={x:p.x,y:p.y};trailLine(pts,bx,by,cs,cs*.22,P.acc,.95)}
    if(CLK.on&&!over&&!clearing){drawBlastWarn(en,st.curB,(x,y)=>OOB(x,y)||own[I(x,y)]===1,bx,by,cs);
      drawArrows(en,st.curB,ctx,bx,by,cs,(x,y)=>same({x,y},pl)||tset.has(I(x,y)))}
    for(const e of band)drawE(e,now,bx,by,cs,true);
    for(const e of en)drawE(e,now,bx,by,cs,false);
    drawPlayer(pl,now,bx,by,cs);
    drawFx(fx,now,bx,by,cs);
    g.restore();
    const ty=Math.max(22,by-22);beatDots(now,ty);
    label(Math.round(progress()*100)+'%',bx+4,ty,13,P.mute,'left',650);
    drawLineup(crew,bx+cs*C-4,ty)}
  const blurb=mode==='paper'
    ?'Step off your ground to draw a trail, step back on to claim everything inside. Instruments you close in join your band. Anything that touches your trail cuts it.'
    :'Walk the walls, then cut across the room. A pocket with no instruments fills in. Trap an instrument in a small pocket and it joins your band. Anything that touches your trail cuts it.';
  return{name:mode==='paper'?'Paper':'Cut',title:mode==='paper'?'Band Paper':'Cut the Room',blurb,reset,start,layout,onBeat,draw,
    down:(x,y)=>input(tapDir(x,y,pl,bx,by,cs)),key:k=>input(KEYS[k]),
    dbg:()=>({room,hearts,score,over,pl,en,band,crew,trail,progress:progress(),clearing,own}),tray:false};
}

// Loop Catch: no territory, just your last steps. Close a loop around instruments to catch them.
function makeLoopCatch(){
  const C=9,R=13,I=(x,y)=>y*C+x,MAXT=18;
  let hearts=3,score=0,caught=0,over=false,fx=[],trail=[],en=[],crew=makeCrew(),pl=null,curBar=0,steps=0,want=3,bx=0,by=0,cs=40;
  const st=makeStepper(),OOB=(x,y)=>x<0||y<0||x>=C||y>=R;
  const ctx={blocked:(x,y)=>OOB(x,y)||en.some(e=>e.x===x&&e.y===y),get pl(){return pl},
    blast(e,t){const tl=blastOf(e,OOB);fx.push({k:'tiles',tiles:tl,t,col:P.bad});S.sub(t,CH[curBar][0]-24);
      if(tl.some(q=>same(q,pl)))hurt(t);if(trail.slice(0,-1).some(c=>tl.some(q=>same(q,c))))snip(t)},
    hitPlayer(e,t){hurt(t);snip(t)},

  function snip(t){if(trail.length>1){fx.push({k:'tiles',tiles:trail.slice(0,-1),t,col:P.bad});S.wood(t,60)}trail=[{x:pl.x,y:pl.y}]}

    const type=pool[ri(pool.length)];
    for(let k=0;k<100;k++){const edge=ri(4),x=edge===0?0:edge===1?C-1:ri(C),y=edge===2?0:edge===3?R-1:ri(R);
      if(en.some(e=>e.x===x&&e.y===y)||trail.some(c=>c.x===x&&c.y===y)||Math.abs(x-pl.x)+Math.abs(y-pl.y)<5)continue;
      const e=mkE(type,x,y);e.bornT=t;en.push(e);return}}
  function reset(){hearts=3;score=0;caught=0;over=false;fx=[];en=[];crew=makeCrew();steps=0;want=3;st.reset();st.curB=-1;
    pl={x:4,y:R-3,px:4,py:R-3,mt:0,hitT:-9,bump:null};trail=[{x:pl.x,y:pl.y}];for(let i=0;i<3;i++)spawnOne(-9);stats()}
  function start(){reset();clockStart(bpmFor())}
  function layout(){const top=58,bot=20;cs=Math.floor(Math.min((W-24)/C,(H-top-bot)/R));bx=Math.round((W-cs*C)/2);by=Math.round(top+(H-top-bot-cs*R)/2)}
  function hurt(t){if(over||t-pl.hitT<.05)return;pl.hitT=t;hearts--;S.thud(t);at(t,stats);
    if(hearts<=0){over=true;at(t+.7,()=>gameOver('Caught '+caught+', score '+score,start))}}
  function doPlayer(d,t){
    const x=pl.x+d[0],y=pl.y+d[1];
    if(OOB(x,y)||en.some(e=>e.x===x&&e.y===y)){pl.bump={x:d[0],y:d[1],t};return}
    pl.px=pl.x;pl.py=pl.y;pl.x=x;pl.y=y;pl.mt=t;

    if(i>=0){const loop=trail.slice(i),bar=new Set(loop.map(c=>I(c.x,c.y))),inside=enclosed(C,R,(a,b)=>bar.has(I(a,b))),ins=new Set(inside);

  function input(d){if(!over&&CLK.on&&d)st.input(d,doPlayer)}
  function draw(now){

    checker(C,R,bx,by,cs);
    if(CLK.on){const v=vis(now),k=Math.max(0,1-v.ph*3);if(k>0){g.globalAlpha=k*.06;g.fillStyle=P.acc;rr(bx,by,cs*C,cs*R,8);g.fill();g.globalAlpha=1}}

    for(const e of en)drawE(e,now,bx,by,cs,false);
    drawPlayer(pl,now,bx,by,cs);
    drawFx(fx,now,bx,by,cs);
    g.restore();

    if(path.length&&(planning||phase==='play')){g.strokeStyle=P.acc;g.lineWidth=4;g.lineCap='round';g.lineJoin='round';g.globalAlpha=phase==='play'?.35:.9;g.beginPath();
      const s0=phase==='play'?(step>=0?sim.pp[Math.max(0,step)]:pl):pl;g.moveTo(bx+(pl.x+.5)*cs,by+(pl.y+.5)*cs);
      for(let k=phase==='play'?step+1:0;k<path.length;k++){g.lineTo(bx+(path[k].x+.5)*cs,by+(path[k].y+.5)*cs)}g.stroke();g.globalAlpha=1;
      for(let k=phase==='play'?step+1:0;k<path.length;k++){const q=path[k],cx=bx+(q.x+.5)*cs,cy=by+(q.y+.5)*cs,killHere=sim&&sim.dead.some(d=>d===k),hit=sim&&sim.hit[k];
        if(hit){g.strokeStyle=P.bad;g.lineWidth=3;g.beginPath();g.arc(cx,cy,cs*.36,0,7);g.stroke()}
        else if(killHere){g.strokeStyle=P.gold;g.lineWidth=3;g.beginPath();g.arc(cx,cy,cs*.36,0,7);g.stroke()}
        circle(cx,cy,9,hit?P.bad:killHere?P.gold:P.acc);label(String(k+1),cx,cy+.5,10,'#fff','center',700)}}
    // enemies
    for(const e of en){const da=now-e.deadT;if(!e.alive&&da>=0&&da>.3)continue;const p=epos(e,now),cx=bx+(p.x+.5)*cs,cy=by+(p.y+.5)*cs,s=cs*.28,col=P[COL[e.type]];
      g.globalAlpha=!e.alive&&da>=0?1-da/.3:1;g.fillStyle=col;
      if(e.type==='hopper')circle(cx,cy,s,col);
      else if(e.type==='turret'){rr(cx-s,cy-s,2*s,2*s,s*.3);g.fill();g.fillStyle=P.bg;rr(cx-s*.6,cy-s*.12,s*1.2,s*.24,2);g.fill();rr(cx-s*.12,cy-s*.6,s*.24,s*1.2,2);g.fill()}
      else{g.beginPath();g.moveTo(cx,cy-s*1.2);g.lineTo(cx+s*1.2,cy);g.lineTo(cx,cy+s*1.2);g.lineTo(cx-s*1.2,cy);g.closePath();g.fill()}
      g.globalAlpha=1}
    // player
    const p=epos(pl,now),cx=bx+(p.x+.5)*cs,cy=by+(p.y+.5)*cs;circle(cx,cy,cs*.3,ha>=0&&ha<.3?P.bad:P.ink);g.strokeStyle=P.acc;g.lineWidth=3;g.beginPath();g.arc(cx,cy,cs*.3+4,0,7);g.stroke();
    drawFx(fx,now,bx,by,cs);
    g.restore();
    // top line: phase on the left, the beat in the middle, the plan countdown on the right
    if(CLK.on&&!over){const ty=Math.max(22,by-22);label(phase==='play'?'Play':'Plan',bx+4,ty,15,phase==='play'?P.acc:P.ink,'left',650);
      beatDots(now,ty,phase==='play'?P.acc:P.mute);
      if(phase==='plan'&&curB>=0){const L=beatsLeft(curB);label(String(L),bx+cs*C-4,ty,L<=4?20:15,L<=4?P.bad:P.mute,'right',700)}}
  }
  const self={name:'Bar Plan',title:'Bar Plan',blurb:'Draw up to four steps while the bar counts down. Next bar they play out on the beat, as a melody. Land on enemies, stay off red tiles.',reset,start,layout,onBeat,draw,down,move,up,key:planKey,tray:true,dbg:()=>({level,hearts,score,over,phase,pl,en,path,sim}),setPath:p=>{path=p;sim=simulate(path)}};
  return self;
}

// ---------------- shell
const statsEl=document.getElementById('stats');
function setStats(a){statsEl.innerHTML=a.map(([k,v])=>`<span><i>${k}</i>${v}</span>`).join('')}
const ov=document.getElementById('ov'),ovT=ov.querySelector('.t'),ovS=ov.querySelector('.s'),ovB=ov.querySelector('button');let ovCb=null;
function showOv(t,s,b,cb){ovT.textContent=t;ovS.textContent=s;ovB.textContent=b;ovCb=cb;ov.style.display='flex'}
ovB.onclick=()=>{audioInit();ov.style.display='none';const f=ovCb;ovCb=null;if(f)f()};
const games=[makeBandRoom(),makeBarPlan(),makeTerritory('paper'),makeTerritory('cut'),makeLoopCatch(),makeLoopPlan()];
let gi=clamp(parseInt(Q.get('g')||'0',10)||0,0,games.length-1),game=games[gi];
const nav=document.getElementById('nav');
games.forEach((G,i)=>{const b=document.createElement('button');b.textContent=G.name;b.onclick=()=>select(i);nav.appendChild(b)});
function select(i){CLK.on=false;later.length=0;gi=i;game=games[i];[...nav.children].forEach((b,j)=>b.classList.toggle('on',j===i));
  document.getElementById('name').textContent=game.title;document.getElementById('tray').style.display='none';game.reset();game.layout();showOv(game.title,game.blurb,'Play',()=>game.start())}
function resize(){const r=stage.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;cv.width=Math.round(W*d);cv.height=Math.round(H*d);cv.style.width=W+'px';cv.style.height=H+'px';g.setTransform(d,0,0,d,0,0);game.layout()}
addEventListener('resize',resize);
cv.addEventListener('pointerdown',e=>{if(ov.style.display!=='none')return;try{cv.setPointerCapture(e.pointerId)}catch(_){}game.down&&game.down(e.offsetX,e.offsetY)});
cv.addEventListener('pointermove',e=>{game.move&&game.move(e.offsetX,e.offsetY)});
cv.addEventListener('pointerup',e=>{game.up&&game.up(e.offsetX,e.offsetY)});
cv.addEventListener('pointercancel',e=>{game.up&&game.up(e.offsetX,e.offsetY)});
const WASD={w:'ArrowUp',a:'ArrowLeft',s:'ArrowDown',d:'ArrowRight',W:'ArrowUp',A:'ArrowLeft',S:'ArrowDown',D:'ArrowRight'};
addEventListener('keydown',e=>{if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;const k=WASD[e.key]||e.key;if(k.startsWith('Arrow')||k===' '||k==='Backspace')e.preventDefault();if(ov.style.display!=='none'){if(k===' '||k==='Enter')ovB.click();return}game.key&&game.key(k)});
function frame(){requestAnimationFrame(frame);const now=ac?ac.currentTime:0;
  if(ac){tickClock();for(let i=later.length-1;i>=0;i--)if(now>=later[i].t){const f=later[i].fn;later.splice(i,1);f()}}
  g.fillStyle=P.bg;g.fillRect(0,0,W,H);game.draw(now)}
select(gi);resize();requestAnimationFrame(frame);
</script>
