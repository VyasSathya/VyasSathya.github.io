<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Band Roundup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9e6df;
  --out-a:#b9c3a4; --out-b:#a3ae8d;          /* grass outside the fence */
  --in-a:#d9dcc6;  --in-b:#c6cbb0;           /* festival ground inside */
  --path:#cdbf9f;                            /* worn ring round the stage */
  --fence:#7d7464; --post:#5f584c;
  --stage-top:#f6f1e7; --stage-top-2:#e9e1d1; --stage-side:#cfc3ad; --stage-side-2:#b5a88f;
  --trim:#2b2a2e;
  --tent:#f3efe6; --tent-stripe:#d9d2c2;
  --shadow:rgba(40,34,24,.22);
  --accent:#ff9f1c;                          /* warm: cable, van, active */
  --accent-2:#ff4f7b;                        /* hot: lights, warning */
  --ok:#3fbf6f; --warn:#f0b23a; --bad:#e2483d;
  --hud-bg:rgba(255,255,255,.72); --hud-line:rgba(30,28,24,.12); --hud-ink:#1f1d1a; --hud-mute:rgba(31,29,26,.52);
  --beam:rgba(255,214,140,.30);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121317;
    --out-a:#26302a; --out-b:#1d2520;
    --in-a:#323a33; --in-b:#2a312b;
    --path:#3d3b33;
    --fence:#8b8371; --post:#a1977f;
    --stage-top:#2c2b31; --stage-top-2:#24232a; --stage-side:#1b1a1f; --stage-side-2:#141318;
    --trim:#ff9f1c;
    --tent:#3a3a40; --tent-stripe:#303036;
    --shadow:rgba(0,0,0,.45);
    --hud-bg:rgba(22,22,26,.72); --hud-line:rgba(255,255,255,.10); --hud-ink:#f3f1ec; --hud-mute:rgba(243,241,236,.55);
    --beam:rgba(255,190,110,.26);
  }
}
:root[data-theme="dark"]{
  --bg:#121317;
  --out-a:#26302a; --out-b:#1d2520;
  --in-a:#323a33; --in-b:#2a312b;
  --path:#3d3b33;
  --fence:#8b8371; --post:#a1977f;
  --stage-top:#2c2b31; --stage-top-2:#24232a; --stage-side:#1b1a1f; --stage-side-2:#141318;
  --trim:#ff9f1c;
  --tent:#3a3a40; --tent-stripe:#303036;
  --shadow:rgba(0,0,0,.45);
  --hud-bg:rgba(22,22,26,.72); --hud-line:rgba(255,255,255,.10); --hud-ink:#f3f1ec; --hud-mute:rgba(243,241,236,.55);
  --beam:rgba(255,190,110,.26);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--hud-ink);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.scene{position:fixed;inset:0;overflow:hidden}
svg.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
.actors{position:absolute;inset:0}
.actor{position:absolute;left:0;top:0;transform-origin:50% 100%;will-change:transform}
.actor img{display:block;width:100%;height:auto;transform-origin:50% 100%;pointer-events:none;user-select:none;-webkit-user-drag:none}
.actor .shadow{position:absolute;left:50%;bottom:-6%;width:86%;height:18%;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,var(--shadow),transparent);z-index:-1}
.actor.fly .shadow{bottom:-38%;width:62%;opacity:.7}
.actor.feature img{filter:drop-shadow(0 0 10px rgba(255,159,28,.9)) drop-shadow(0 0 2px rgba(255,159,28,.9))}

/* motion: 124 bpm, one beat = 0.484 s */
@keyframes onbeat{0%,100%{transform:scale(1,1)}12%{transform:scale(1.07,.9)}35%{transform:scale(.96,1.06) translateY(-3%)}60%{transform:scale(1,1)}}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-3deg) scale(1,1)}25%{transform:translateY(-6%) rotate(0deg) scale(.97,1.04)}50%{transform:translateY(0) rotate(3deg) scale(1.04,.95)}75%{transform:translateY(-6%) rotate(0deg) scale(.97,1.04)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-9%)}}
@keyframes vanbob{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-2.5%) rotate(.8deg)}}
@keyframes beam{0%,100%{opacity:.35}12%{opacity:1}50%{opacity:.5}}
@keyframes ring{0%{transform:scale(.35);opacity:.95}80%{opacity:.15}100%{transform:scale(1.25);opacity:0}}
@keyframes warn{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,159,28,.0)}40%{box-shadow:0 0 0 3px rgba(255,159,28,.85)}}
@keyframes tick{0%,100%{background:var(--hud-line)}10%,40%{background:var(--accent)}}
.stage-member img{animation:onbeat .484s ease-in-out infinite}
.loose img{animation:walk .62s ease-in-out infinite}
.fly img{animation:hover 1.1s ease-in-out infinite}
.van-body{animation:vanbob .24s ease-in-out infinite;transform-origin:50% 100%}
.beam{animation:beam .968s ease-out infinite}
.beam.b2{animation-delay:.484s}
.snare{transform-box:fill-box;transform-origin:center;animation:ring 1.45s ease-out infinite}
.warn{animation:warn .9s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

/* HUD */
.hud{position:absolute;inset:0;pointer-events:none;padding:max(12px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom))}
.panel{background:var(--hud-bg);border:1px solid var(--hud-line);border-radius:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.crowd{position:absolute;left:16px;top:max(12px,env(safe-area-inset-top));padding:9px 11px 10px;width:min(220px,30vw)}
.crowd .lbl{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--hud-mute);margin-bottom:6px}
.bar{height:8px;border-radius:99px;background:var(--hud-line);overflow:hidden}
.bar i{display:block;height:100%;width:72%;border-radius:99px;background:linear-gradient(90deg,var(--bad),var(--warn) 45%,var(--ok));
  background-size:calc(100% / .72) 100%}
.clock{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);padding:7px 12px;text-align:center}
.clock b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.1}
.beats{display:flex;gap:4px;justify-content:center;margin-top:5px}
.beats span{width:6px;height:6px;border-radius:50%;background:var(--hud-line);animation:tick 1.936s linear infinite}
.beats span:nth-child(2){animation-delay:.484s}.beats span:nth-child(3){animation-delay:.968s}.beats span:nth-child(4){animation-delay:1.452s}
.mini{position:absolute;right:16px;top:max(12px,env(safe-area-inset-top));width:min(120px,24vw);aspect-ratio:1;border-radius:50%;padding:0;overflow:hidden}
.mini svg{width:100%;height:100%;display:block}
.bottom{position:absolute;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px}
.feel{display:flex;padding:3px;gap:2px;font-size:11px;font-weight:600}
.feel span{padding:5px 10px;border-radius:8px;color:var(--hud-mute)}
.feel span.on{background:var(--accent);color:#1f1608}
.lineup{display:flex;gap:6px;padding:7px 9px;max-width:100%}
.slot{width:38px;height:38px;border-radius:50%;flex:0 0 auto;background-color:var(--hud-line);background-repeat:no-repeat;
  background-size:170% auto;background-position:50% 8%;filter:grayscale(1);opacity:.38;border:1px solid var(--hud-line)}
.slot.on{filter:none;opacity:1;border:2px solid var(--accent);background-color:rgba(255,159,28,.18)}
.slot.feat{opacity:.85;filter:grayscale(.2);animation:pulse .968s ease-out infinite}
@media (max-width:520px){
  .lineup{gap:3px;padding:5px 6px}
  .slot{width:calc((100vw - 32px - 12px - 36px) / 13);height:calc((100vw - 32px - 12px - 36px) / 13)}
  .clock b{font-size:17px}
  .crowd{padding:7px 9px 8px}
  .feel{font-size:10px}.feel span{padding:4px 8px}
}
</style>
</head>
<body>
<main class="scene" id="scene">
  <svg class="layer" id="ground" aria-hidden="true"></svg>
  <div class="actors" id="actors"></div>
  <svg class="layer" id="over" aria-hidden="true" style="pointer-events:none"></svg>
  <div class="hud">
    <div class="panel crowd"><div class="lbl">Crowd</div><div class="bar"><i></i></div></div>
    <div class="panel clock"><b>4:12</b><div class="beats"><span></span><span></span><span></span><span></span></div></div>
    <div class="panel mini"><svg id="mini" viewBox="-110 -110 220 220"></svg></div>
    <div class="bottom">
      <div class="panel feel"><span>Half</span><span>Normal</span><span class="on">Double</span></div>
      <div class="panel lineup" id="lineup"></div>
    </div>
  </div>
</main>
<script>
(function(){
try{const th=new URLSearchParams(location.search).get('theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}
const R=100, STAGE=28, TENT=60;
const NS='http://www.w3.org/2000/svg';
const ground=document.getElementById('ground'), over=document.getElementById('over'), actors=document.getElementById('actors');

/* world: x right, y toward the viewer; fence at R, stage radius STAGE in the middle */
const stageSpots={drumline:[0,-15],'low-end':[-16,-6],clockwork:[16,-6],chorus:[-7,9],overdrive:[9,11]};
const loose=[
  {id:'strings',x:-56,y:46,cable:true},
  {id:'brass',x:30,y:38,feature:true},
  {id:'drumline-2',x:42,y:50},
  {id:'weather',x:54,y:-18,fly:true},
  {id:'shanty',x:-60,y:-16},
  {id:'requiem',x:22,y:-56},
  {id:'undertone',x:-28,y:-60},
  {id:'session',x:66,y:14},
  {id:'multi',x:-24,y:76,warn:true}
];
const van={x:-30,y:30,heading:-0.55};
const tents=[18,90,162,234,306].map((d,i)=>({a:d*Math.PI/180,open:i===1}));
const families=['drumline','low-end','brass','strings','weather','overdrive','clockwork','chorus','shanty','requiem','undertone','session','multi'];
const onStage=new Set(Object.keys(stageSpots)); const featured='brass';

let W,H,s,tilt,cx,cy,unit;
function proj(x,y){const k=.88+.22*((y+R)/(2*R));return{X:cx+x*s,Y:cy+y*s*tilt,k};}
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(parent)parent.appendChild(e);return e;}
function ell(x,y,rx,ry,attrs,parent){const p=proj(x,y);return el('ellipse',Object.assign({cx:p.X,cy:p.Y,rx:rx*s,ry:ry*s*tilt},attrs),parent);}

function layout(){
  W=innerWidth;H=innerHeight;
  const portrait=H>W*1.1;
  tilt=portrait?0.86:0.56;
  s=portrait?W/(2*R*0.62):Math.min(W/(2*R*1.04),(H*0.86)/(2*R*tilt));
  cx=W/2; cy=portrait?H*0.50:H*0.53;
  unit=Math.max(portrait?50:40,s*(portrait?15:13.5));
  draw();
}

function draw(){
  ground.innerHTML='';over.innerHTML='';actors.innerHTML='';
  ground.setAttribute('viewBox',`0 0 ${W} ${H}`);over.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const defs=el('defs',{},ground);
  const g1=el('radialGradient',{id:'gin',cx:'50%',cy:'45%',r:'60%'},defs);
  el('stop',{offset:'0%','stop-color':'var(--in-a)'},g1);el('stop',{offset:'100%','stop-color':'var(--in-b)'},g1);
  const g2=el('linearGradient',{id:'gtop',x1:'0',y1:'0',x2:'0',y2:'1'},defs);
  el('stop',{offset:'0%','stop-color':'var(--stage-top-2)'},g2);el('stop',{offset:'100%','stop-color':'var(--stage-top)'},g2);
  const g3=el('linearGradient',{id:'gside',x1:'0',y1:'0',x2:'1',y2:'0'},defs);
  el('stop',{offset:'0%','stop-color':'var(--stage-side-2)'},g3);el('stop',{offset:'45%','stop-color':'var(--stage-side)'},g3);el('stop',{offset:'100%','stop-color':'var(--stage-side-2)'},g3);
  const g4=el('linearGradient',{id:'gbeam',x1:'0',y1:'0',x2:'0',y2:'1'},defs);
  el('stop',{offset:'0%','stop-color':'var(--beam)'},g4);el('stop',{offset:'100%','stop-color':'rgba(255,214,140,0)'},g4);
  const g5=el('radialGradient',{id:'gpool',cx:'50%',cy:'50%',r:'50%'},defs);
  el('stop',{offset:'0%','stop-color':'rgba(255,190,110,.35)'},g5);el('stop',{offset:'100%','stop-color':'rgba(255,190,110,0)'},g5);

  /* grass outside, ground inside */
  el('rect',{x:0,y:0,width:W,height:H,fill:'var(--out-b)'},ground);
  ell(0,0,R*1.55,R*1.55,{fill:'var(--out-a)'},ground);
  ell(0,0,R,R,{fill:'url(#gin)'},ground);
  /* worn path ring round the stage */
  ell(0,0,STAGE+12,STAGE+12,{fill:'none',stroke:'var(--path)','stroke-width':9*s,opacity:.75},ground);
  /* van tracks */
  const trail=[];for(let t=0;t<=1.0001;t+=.05){const a=-2.5+t*1.55;trail.push(proj(-30+Math.cos(a)*34+20, 30+Math.sin(a)*22+12));}
  el('path',{d:'M'+trail.map(p=>p.X.toFixed(1)+' '+p.Y.toFixed(1)).join(' L'),fill:'none',stroke:'var(--path)','stroke-width':2.2*s,'stroke-linecap':'round','stroke-dasharray':`${1.2*s} ${2.4*s}`,opacity:.9},ground);

  /* tents (green rooms the members break out of) */
  for(const t of tents){
    const x=Math.cos(t.a)*TENT,y=Math.sin(t.a)*TENT,p=proj(x,y),w=11*s*p.k,h=10*s*p.k;
    ell(x,y,7,7,{fill:'var(--shadow)',opacity:.5},ground);
    const g=el('g',{},ground);
    el('path',{d:`M${p.X-w/2} ${p.Y} L${p.X} ${p.Y-h} L${p.X+w/2} ${p.Y} Z`,fill:'var(--tent)',stroke:'var(--hud-line)'},g);
    el('path',{d:`M${p.X-w/6} ${p.Y} L${p.X} ${p.Y-h} L${p.X+w/6} ${p.Y} Z`,fill:'var(--tent-stripe)'},g);
    el('path',{d:`M${p.X-w*.13} ${p.Y} L${p.X} ${p.Y-h*.42} L${p.X+w*.13} ${p.Y} Z`,fill:t.open?'var(--accent)':'var(--trim)',opacity:t.open?.95:.55},g);
    el('circle',{cx:p.X,cy:p.Y-h-2,r:1.6*s*p.k/2+1,fill:'var(--accent-2)'},g);
  }

  /* fence ring with posts; the back half first */
  const fence=(from,to)=>{const pts=[];for(let a=from;a<=to+1e-6;a+=Math.PI/90)pts.push(proj(Math.cos(a)*R,Math.sin(a)*R));
    el('path',{d:'M'+pts.map(p=>p.X.toFixed(1)+' '+p.Y.toFixed(1)).join(' L'),fill:'none',stroke:'var(--fence)','stroke-width':1.2,opacity:.85},ground);
    const up=pts.map(p=>({X:p.X,Y:p.Y-2.6*s*p.k}));
    el('path',{d:'M'+up.map(p=>p.X.toFixed(1)+' '+p.Y.toFixed(1)).join(' L'),fill:'none',stroke:'var(--fence)','stroke-width':1.2,opacity:.85},ground);};
  fence(Math.PI,2*Math.PI);
  for(let i=0;i<72;i++){const a=i/72*2*Math.PI,p=proj(Math.cos(a)*R,Math.sin(a)*R);
    el('rect',{x:p.X-1.2,y:p.Y-3.4*s*p.k,width:2.4,height:3.4*s*p.k,rx:1,fill:'var(--post)'},ground);}
  fence(0,Math.PI);
  /* the crossing point of the member about to leave */
  const wa=Math.atan2(76,-24);const wpts=[];for(let a=wa-.16;a<=wa+.16;a+=.02)wpts.push(proj(Math.cos(a)*R,Math.sin(a)*R));
  el('path',{class:'warn',d:'M'+wpts.map(p=>p.X.toFixed(1)+' '+p.Y.toFixed(1)).join(' L'),fill:'none',stroke:'var(--accent-2)','stroke-width':Math.max(4,1.4*s),'stroke-linecap':'round'},ground);

  /* snare crack ring round the featured bunch */
  { const p=proj(36,44); el('ellipse',{class:'snare',cx:p.X,cy:p.Y,rx:14*s,ry:14*s*tilt,fill:'none',stroke:'var(--accent)','stroke-width':2.5},ground); }

  /* stage: cylinder, top, spots, speaker stacks, truss and beams */
  const c=proj(0,0), rx=STAGE*s, ry=STAGE*s*tilt, th=Math.max(10,3.6*s);
  el('ellipse',{cx:c.X,cy:c.Y+th+2,rx:rx*1.04,ry:ry*1.04,fill:'var(--shadow)'},ground);
  el('path',{d:`M${c.X-rx} ${c.Y} L${c.X-rx} ${c.Y+th} A${rx} ${ry} 0 0 0 ${c.X+rx} ${c.Y+th} L${c.X+rx} ${c.Y} Z`,fill:'url(#gside)'},ground);
  el('ellipse',{cx:c.X,cy:c.Y,rx,ry,fill:'url(#gtop)',stroke:'var(--trim)','stroke-width':1.5},ground);
  el('ellipse',{cx:c.X,cy:c.Y,rx:rx*.92,ry:ry*.92,fill:'none',stroke:'var(--hud-line)','stroke-width':1},ground);
  el('ellipse',{cx:c.X,cy:c.Y+ry*.1,rx:rx*.7,ry:ry*.62,fill:'url(#gpool)'},ground);
  for(const [k,[x,y]] of Object.entries(stageSpots)){ell(x,y,5,5,{fill:'none',stroke:'var(--accent)','stroke-width':1.4,opacity:.7},ground);}
  /* gate gaps toward each tent: little steps */
  for(const t of tents){const p=proj(Math.cos(t.a)*STAGE,Math.sin(t.a)*STAGE);
    if(Math.sin(t.a)>0) el('rect',{x:p.X-3*s,y:p.Y-1,width:6*s,height:th*.55,rx:2,fill:'var(--stage-side)',opacity:.9},ground);}
  /* speaker stacks at the back */
  for(const sx of [-1,1]){const p=proj(sx*(STAGE-3),-STAGE*.72),w=5.6*s,h=9*s;
    el('rect',{x:p.X-w/2,y:p.Y-h,width:w,height:h,rx:3,fill:'var(--trim)'},ground);
    for(const f of [.28,.68]){el('circle',{cx:p.X,cy:p.Y-h*(1-f),r:w*.3,fill:'none',stroke:'var(--stage-side)','stroke-width':1.5},ground);
      el('circle',{cx:p.X,cy:p.Y-h*(1-f),r:w*.1,fill:'var(--stage-side)'},ground);}}
  /* truss and lights */
  const tl=proj(-STAGE*.92,-STAGE*.55), tr=proj(STAGE*.92,-STAGE*.55), top=c.Y-ry-22*s*tilt-10*s;
  el('path',{d:`M${tl.X} ${tl.Y} L${tl.X} ${top} L${tr.X} ${top} L${tr.X} ${tr.Y}`,fill:'none',stroke:'var(--trim)','stroke-width':Math.max(3,.9*s),'stroke-linejoin':'round'},ground);
  const lamps=[-.7,-.35,0,.35,.7];
  lamps.forEach((f,i)=>{const lx=c.X+f*rx*.95; const tx=c.X+f*rx*.55+(i%2?8:-8)*s*.2, ty=c.Y+ry*.25;
    el('path',{class:'beam'+(i%2?' b2':''),d:`M${lx-2} ${top+4} L${tx-rx*.12} ${ty} L${tx+rx*.12} ${ty} L${lx+2} ${top+4} Z`,fill:'url(#gbeam)'},over);
    el('rect',{x:lx-3.5,y:top-1,width:7,height:8,rx:2,fill:i%2?'var(--accent-2)':'var(--accent)'},ground);});

  /* actors: stage members, loose members, van; sorted back to front */
  const list=[];
  for(const [id,[x,y]] of Object.entries(stageSpots)) list.push({id,x,y,stage:true});
  for(const m of loose) list.push(Object.assign({},m));
  list.push({id:'van',x:van.x,y:van.y,van:true});
  list.sort((a,b)=>a.y-b.y);
  const pos={};
  for(const m of list){
    const p=proj(m.x,m.y);
    if(m.van){ actors.appendChild(makeVan(p)); pos.van={X:p.X,Y:p.Y-unit*.55*p.k}; continue; }
    const d=document.createElement('div'); d.className='actor '+(m.stage?'stage-member':m.fly?'fly':'loose')+(m.feature?' feature':'');
    const hgt=unit*p.k*(m.stage?0.95:1), wid=hgt*0.78;
    const lift=(m.stage?th:0)+(m.fly?unit*.5:0);
    d.style.width=wid+'px';
    d.style.transform=`translate(${p.X-wid/2}px,${p.Y-hgt-lift}px)`;
    d.style.zIndex=Math.round(1000+m.y*5);
    const img=new Image();img.src='img/'+m.id+'.webp';img.alt='';img.style.animationDelay=(-(Math.abs(m.x*7+m.y*3)%60)/100)+'s';
    img.onload=()=>{const r=img.naturalHeight/img.naturalWidth;const realH=wid*r;d.style.transform=`translate(${p.X-wid/2}px,${p.Y-realH-lift}px)`;};
    const sh=document.createElement('div');sh.className='shadow';
    d.appendChild(sh);d.appendChild(img);actors.appendChild(d);
    pos[m.id]={X:p.X,Y:p.Y-hgt*.5-lift};
  }
  /* mic cable from the van to the member it has roped */
  const a=pos.van,b=pos.strings;
  if(a&&b){const mx=(a.X+b.X)/2,my=Math.max(a.Y,b.Y)+22*s*.25+18;
    el('path',{d:`M${a.X} ${a.Y} Q${mx} ${my} ${b.X} ${b.Y}`,fill:'none',stroke:'var(--trim)','stroke-width':3.2,'stroke-linecap':'round',opacity:.85},over);
    el('path',{d:`M${a.X} ${a.Y} Q${mx} ${my} ${b.X} ${b.Y}`,fill:'none',stroke:'var(--accent)','stroke-width':1.4,'stroke-linecap':'round'},over);
    el('circle',{cx:b.X,cy:b.Y,r:4,fill:'var(--accent)',stroke:'var(--trim)','stroke-width':1.5},over);}
  drawMini();
}

function makeVan(p){
  const w=unit*1.9*p.k, h=w*0.82;
  const d=document.createElement('div');d.className='actor';d.style.width=w+'px';
  d.style.transform=`translate(${p.X-w/2}px,${p.Y-h*.92}px)`;d.style.zIndex=Math.round(1000+van.y*5);
  d.innerHTML=`
  <div class="shadow" style="bottom:4%;width:92%;height:22%"></div>
  <div class="van-body" style="position:relative;width:100%;aspect-ratio:1/.82">
    <img src="img/driver.webp" alt="" style="position:absolute;left:30%;top:-30%;width:34%;animation:none">
    <svg viewBox="0 0 200 164" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible">
      <defs>
        <linearGradient id="vb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc35c"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient>
        <linearGradient id="vs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f08a0a"/><stop offset="1" stop-color="#d47200"/></linearGradient>
        <linearGradient id="vg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bfe3f2"/><stop offset="1" stop-color="#7fb4cc"/></linearGradient>
      </defs>
      <!-- body side (facing us) -->
      <path d="M18 70 Q18 54 34 54 L150 54 Q176 54 184 76 L188 104 Q188 120 172 120 L30 120 Q18 120 18 106 Z" fill="url(#vs)"/>
      <!-- roof / top -->
      <path d="M26 44 Q28 28 46 28 L140 28 Q162 28 172 44 L182 70 L20 70 Z" fill="url(#vb)"/>
      <!-- cut-out where the driver sits -->
      <path d="M58 36 Q58 31 64 31 L112 31 Q118 31 118 36 L118 58 L58 58 Z" fill="#2b2a2e" opacity=".9"/>
      <!-- windscreen -->
      <path d="M150 58 L168 58 Q178 60 182 78 L184 92 L150 92 Z" fill="url(#vg)"/>
      <path d="M154 62 L164 62 L170 80 L158 80 Z" fill="#fff" opacity=".45"/>
      <!-- side window band -->
      <rect x="34" y="72" width="104" height="20" rx="8" fill="#2b2a2e"/>
      <circle cx="56" cy="82" r="6" fill="none" stroke="#ff9f1c" stroke-width="2.5"/>
      <circle cx="56" cy="82" r="2" fill="#ff9f1c"/>
      <circle cx="80" cy="82" r="6" fill="none" stroke="#ff9f1c" stroke-width="2.5"/>
      <circle cx="80" cy="82" r="2" fill="#ff9f1c"/>
      <path d="M100 76 q6 6 0 12 M108 74 q9 8 0 16 M116 72 q12 10 0 20" fill="none" stroke="#ff4f7b" stroke-width="2.4" stroke-linecap="round"/>
      <!-- roof speaker -->
      <rect x="122" y="10" width="34" height="26" rx="7" fill="#2b2a2e"/>
      <circle cx="139" cy="23" r="9" fill="none" stroke="#ffc35c" stroke-width="2.5"/>
      <circle cx="139" cy="23" r="3" fill="#ffc35c"/>
      <!-- bumper and lights -->
      <rect x="164" y="104" width="26" height="9" rx="4" fill="#2b2a2e"/>
      <circle cx="182" cy="96" r="5" fill="#fff6dc"/>
      <!-- wheels -->
      <g><ellipse cx="52" cy="122" rx="20" ry="20" fill="#2b2a2e"/><ellipse cx="52" cy="122" rx="9" ry="9" fill="#d9d2c2"/></g>
      <g><ellipse cx="150" cy="122" rx="20" ry="20" fill="#2b2a2e"/><ellipse cx="150" cy="122" rx="9" ry="9" fill="#d9d2c2"/></g>
      <!-- speed lines -->
      <path d="M-4 66 h-22 M-2 86 h-34 M-6 106 h-20" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    </svg>
  </div>`;
  return d;
}

function drawMini(){
  const m=document.getElementById('mini');m.innerHTML='';
  el('circle',{cx:0,cy:0,r:108,fill:'var(--out-a)'},m);
  el('circle',{cx:0,cy:0,r:R,fill:'var(--in-a)',stroke:'var(--fence)','stroke-width':2},m);
  el('circle',{cx:0,cy:0,r:STAGE,fill:'var(--stage-top)',stroke:'var(--trim)','stroke-width':2},m);
  for(const t of tents) el('path',{d:`M${Math.cos(t.a)*TENT-5} ${Math.sin(t.a)*TENT+4} l5 -9 l5 9 z`,fill:t.open?'var(--accent)':'var(--fence)'},m);
  for(const x of loose){el('circle',{cx:x.x,cy:x.y,r:x.warn?5:4,fill:x.warn?'var(--accent-2)':x.feature?'var(--accent)':'var(--hud-ink)',opacity:x.warn?1:.75},m);}
  const wa=Math.atan2(76,-24);
  el('path',{d:`M${Math.cos(wa-.15)*R} ${Math.sin(wa-.15)*R} A${R} ${R} 0 0 1 ${Math.cos(wa+.15)*R} ${Math.sin(wa+.15)*R}`,fill:'none',stroke:'var(--accent-2)','stroke-width':6,'stroke-linecap':'round'},m);
  const g=el('g',{transform:`translate(${van.x} ${van.y}) rotate(${van.heading*180/Math.PI})`},m);
  el('path',{d:'M11 0 L-7 -8 L-3 0 L-7 8 Z',fill:'var(--accent)',stroke:'var(--trim)','stroke-width':1.5},g);
}

/* band lineup: one head per family, lit when it is on stage */
const lu=document.getElementById('lineup');
for(const f of families){const sl=document.createElement('div');sl.className='slot'+(onStage.has(f)?' on':'')+(f===featured?' feat':'');
  sl.style.backgroundImage=`url(img/${f}.webp)`;lu.appendChild(sl);}

addEventListener('resize',layout);
layout();
})();
</script>
