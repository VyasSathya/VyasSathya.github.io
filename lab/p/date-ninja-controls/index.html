<!doctype html>
<html lang="en">

<style>

<script>
// Date Ninja. The prototype's canvas game (prototype/match-ninja.html) inside the native app: no Tune panel,
// full screen at any phone height, safe areas, and native sound, haptics and best score through window.DN / "dn".
const W=450;let H=800;
const P={g:760,toss:640,gap:1.6,max:4,hot:50,minSpeed:250};
const DN=window.DN||{native:false,best:0,muted:false,me:'m',want:'f',qa:location.search.includes('qa')};
// Choice previews for Vyas (2026-11-19, Web Lab only; the app loads the page with no query, so none of this ships on):
// ?flag=Name  the named red flag replaces Your Boss;  ?bgpal=1  parody backgrounds tinted into the game palette;
// ?bg=id  that background equipped;  ?voice=1  an AI voice reads the game-over line and THE ONE (Kokoro, local TTS).
const PREV=(()=>{const q=new URLSearchParams(DN.native?'':location.search);return{flag:q.get('flag'),bgpal:q.get('bgpal')==='1',bg:q.get('bg'),voice:q.get('voice')==='1'}})();
// modes (Fruit Ninja's three, themed): Classic = strikes; Arcade = 60 s, a red flag costs 10, power cards, THE ONE at
// the end, end-of-round bonuses; Zen = 90 s, no red flags, no strikes
const MODES={classic:{t:'Classic',c:'#19b36b'},arcade:{t:'Arcade',c:'#ff8a1f',secs:60},zen:{t:'Zen',c:'#16a5b8',secs:90}};
let mode=MODES[DN.mode]?DN.mode:'classic';
const BEST={classic:+(DN.best||0),arcade:+(DN.bestArcade||0),zen:+(DN.bestZen||0)};
let musicOn=DN.music!==false,best=BEST[mode],muted=!!DN.muted,newBest=false,swishAt=-9,endT=0,timeUp=false,bonusT=0,bonuses=[],oneTossed=false,flagsHit=0,wrongs=0,combos=0;
try{if(!DN.native){for(const m in BEST)BEST[m]=+(localStorage.getItem('dateninja-best-'+m)||0);best=BEST[mode]}}catch(e){}
const post=m=>{try{window.webkit.messageHandlers.dn.postMessage(m)}catch(e){}};
const sfx=(n,v)=>{if(!muted)post({t:'sfx',n,v:v==null?1:v})};
const hap=n=>{if(!save.hapOff)post({t:'hap',n})};

// ---- roses (the currency), the shop and saved progress ----
// One JSON blob: native key "save" (post {t:'save'}, read back as DN.save), localStorage in a browser.
// A QA run (DN.qa) never writes it: the autoplay works on an in-memory copy.
const ROSE='#e0457b',SHIELD='#4f86f7',BURST='#f5b800',CLOCK='#16a5b8';
// Shop 2 (2026-11-12, Vyas: "polish up and add more thigns to the shops for date ninaj"): four shelves, each item paid in

// description line below was written by the build, not by Vyas. Nothing here costs real money.
// trails (Fruit Ninja's blades): the direction colours stay green-ish for LIKE and red-ish for NOPE on every trail
const TRAILS=[
  {id:'classic',t:'Swipe',p:0,w:[2,8],d:'The one you came in with.'},
  {id:'neon',t:'Neon Sign',p:40,w:[1.5,4.5],glow:14,core:1,like:'#1ff29a',nope:'#ff2e74',d:'Lit up like a bar at last call.'},
  {id:'glitter',t:'Glitter',p:80,w:[2,5],glow:5,fx:'spark',like:'#2fd487',nope:'#ff5a70',d:'Gets everywhere. Like your ex.'},
  {id:'notes',t:'Love Notes',p:120,w:[3,9],fx:'heart',d:'Hearts on every swipe.'},
  {id:'kiss',t:'Lipstick',lv:6,w:[3,10],fx:'kiss',like:'#2fd487',nope:'#ff3d7f',d:'Leaves a mark.'},
  {id:'flame',t:'Hot Streak',p:200,w:[3,11],glow:10,fx:'flame',like:'#38e07b',nope:'#ff5a1f',d:'For when you are on fire.'},
  {id:'ghost',t:'Ghosted',p:260,w:[2,7],glow:6,fx:'ghost',like:'#7fe8b8',nope:'#ff9db1',d:'Gone without a word.'},
  {id:'zap',t:'Chemistry',lv:12,w:[1.5,4],zig:1,glow:16,core:1,like:'#3dffb0',nope:'#ff3d6e',d:'You felt that, right?'},
  {id:'cash',t:'Big Spender',p:350,w:[3,8],fx:'bill',d:'Pays for the first date.'},
  {id:'arrow',t:'Cupid',p:500,w:[2,6],glow:6,fx:'arrow',like:'#2fd487',nope:'#ff4f7a',d:'Arrows fly with every swipe.'},
  {id:'ring',t:'Put a Ring on It',lv:20,w:[2.5,9],glow:8,fx:'ring',like:'#3ee08e',nope:'#ff5470',d:'Commitment, in trail form.'}];
// backgrounds (its dojos): parody dating-app screens, our own names (written by the build); the plain one stays free.
// ay = which part of the tall screen the shop thumbnail shows. OLDBG maps build 1's scenes onto them so what was
// bought stays owned.
const BGS=[{id:'field',t:'Plain',p:0,d:'Nothing in the way.'},
  {id:'kindling',t:'Kindling',p:50,ay:.2,d:'The classic swipe deck.'},{id:'buzzkill',t:'Buzzkill',p:100,ay:.08,d:'Fresh disappointments daily.'},
  {id:'lurkr',t:'Lurkr',p:150,ay:.08,d:'Everyone nearby. Nobody texts.'},{id:'unhinged',t:'Unhinged',p:250,ay:.38,d:'Prompts, roses, regret.'},
  {id:'crossd',t:'Crossd',p:300,ay:.1,d:'You keep crossing paths.'},{id:'okstupid',t:'OkStupid',lv:8,ay:.12,d:'Answer 400 questions first.'},
  {id:'velvet',t:'Velvet Rope',p:450,ay:.1,d:'The waitlist is the app.'}];
const OLDBG={bar:'kindling',beach:'buzzkill',roof:'lurkr',wedding:'unhinged'};
// stamps: the two words that slam onto a swiped card (right word, left word)
const STAMPS=[{id:'like',t:'Like / Nope',p:0,w:['LIKE','NOPE'],d:'The words that started it all.'},
  {id:'hot',t:'Hot / Not',p:60,w:['HOT','NOT'],d:'A rating system older than apps.'},
  {id:'wl',t:'W / L',p:90,w:['W','L'],d:'Short and final.'},
  {id:'date',t:'Date / Dump',p:120,w:['DATE','DUMP'],d:'Decide before dessert.'},
  {id:'yum',t:'Yum / Yuck',p:160,w:['YUM','YUCK'],d:'Taste is personal.'},
  {id:'marry',t:'Marry / Ghost',lv:10,w:['MARRY','GHOST'],d:'There is no middle ground.'},
  {id:'mine',t:'Mine / Bye',p:240,w:['MINE','BYE'],d:'Claim them or wave them off.'},
  {id:'ten',t:'10 / 0',p:400,w:['10/10','0/10'],d:'Scores, out loud.'}];
// bought power-ups, one use per run: three for Arcade (burst hotties, +2 s cards, a shield for the first three red
// flags) and one for Classic (the first strike does not count)
const PUS=[{id:'burst',t:'Heartthrob',p:25,m:'arcade',d:'Arcade: glowing hotties worth +5.'},
  {id:'time',t:'One More Drink',p:25,m:'arcade',d:'Arcade: some cards add 2 seconds.'},
  {id:'shield',t:'Block Button',p:25,m:'arcade',d:'Arcade: the first three red flags bounce off.'},
  {id:'rebound',t:'Rebound',p:40,m:'classic',d:'Classic: your first strike does not count.'}];
// the four shelves: k = the save key (own / eq); pu is counted, not owned
const SHELF=[{t:'Trails',k:'trail',list:TRAILS},{t:'Backgrounds',k:'bg',list:BGS},{t:'Stamps',k:'stamp',list:STAMPS},{t:'Power-ups',k:'pu',list:PUS}];
// daily roses (the free gift): once a calendar day, more for each day in a row; a missed day costs one step, not all
const GIFT=[15,20,25,30,35,40,50];
// player level ranks (names written by the build); defined here because the save reads the level
const RANKS=[[1,'Shy'],[3,'Lurker'],[5,'Swiper'],[8,'Flirt'],[12,'Crush'],[16,'Catch'],[21,'Hot Commodity'],[27,'Heartthrob'],[35,'Adored']];
const xpNeed=L=>80+40*(L-1);
function cleanSave(s){
  s=s&&typeof s==='object'?s:{};const o=s.own||{},e=Object.assign({},s.eq||{}),u=s.pu||{},gf=s.gift||{};
  const mapBg=id=>OLDBG[id]||id;if(Array.isArray(o.bg))o.bg=o.bg.map(mapBg);e.bg=mapBg(e.bg);
  const ids=(list,arr,free)=>[...new Set([free].concat((Array.isArray(arr)?arr:[]).filter(id=>list.some(x=>x.id===id))))];
  const own={trail:ids(TRAILS,o.trail,'classic'),bg:ids(BGS,o.bg,'field'),stamp:ids(STAMPS,o.stamp,'like')};
  const pu={};for(const x of PUS)pu[x.id]=Math.max(0,Math.floor(+u[x.id]||0));
  const xp=Math.max(0,Math.floor(+s.xp||0)),L=lvl(xp).L;
  // an item given at a level counts as owned once the level is reached (so it can be equipped)
  const eqOk=(k,list,id,free)=>own[k].includes(id)||list.some(x=>x.id===id&&x.lv&&L>=x.lv)?id:free;
  return{roses:Math.max(0,Math.floor(+s.roses||0)),xp,ob:!!s.ob,own,pu,runs:Math.max(0,Math.floor(+s.runs||0)),
    eq:{trail:eqOk('trail',TRAILS,e.trail,'classic'),bg:eqOk('bg',BGS,e.bg,'field'),stamp:eqOk('stamp',STAMPS,e.stamp,'like')},
    gift:{day:typeof gf.day==='string'?gf.day:'',n:Math.max(0,Math.floor(+gf.n||0))},
    seen:Array.isArray(s.seen)?s.seen.filter(x=>typeof x==='string').slice(0,200):[],thumb:!!s.thumb,hapOff:!!s.hapOff,see:Math.max(40,Math.min(100,Math.round(+s.see||100)))};
}
let save=cleanSave((()=>{try{return JSON.parse(DN.native?(DN.save||'null'):(localStorage.getItem('dateninja-save')||'null'))}catch(e){return null}})());
if(PREV.bg&&BGS.some(b=>b.id===PREV.bg)){save.eq.bg=PREV.bg;if(!save.own.bg.includes(PREV.bg))save.own.bg.push(PREV.bg)}
function persist(){
  const j=JSON.stringify(save);window.__dnLastSave=j;
  if(DN.qa)return;
  post({t:'save',v:j});
  if(!DN.native)try{localStorage.setItem('dateninja-save',j)}catch(e){}
}
const modePU=m=>PUS.some(x=>x.m===m&&save.pu[x.id]>0);
const TR=()=>TRAILS.find(x=>x.id===save.eq.trail)||TRAILS[0];
const STAMP=()=>(STAMPS.find(x=>x.id===save.eq.stamp)||STAMPS[0]).w;
let runPU={burst:false,time:false,rebound:false},shieldN=0,shieldMax=0,lastEarned=0,tfx=[],partAcc=0,shopTab=0,shopFlash=-9,
  pick={burst:false,time:false,shield:false,rebound:false},bgc=null,pvc={},INK={},shopSel={},shopNew=[],giftAt=-9;
// ---- the daily gift: local calendar days ----
const dayKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function giftState(){
  const d=new Date(),today=dayKey(d),y=new Date(d);y.setDate(d.getDate()-1);
  // a missed day only drops the streak back one day (research 2026-11-12 section 5.5: forgiving streaks)
  const ready=save.gift.day!==today,next=ready?(save.gift.day===dayKey(y)?save.gift.n+1:Math.max(1,save.gift.n)):save.gift.n;
  return{ready,day:next,amt:GIFT[Math.min(next,GIFT.length)-1],today};
}
function claimGift(){
  const G=giftState();if(!G.ready)return 0;
  save.gift={day:G.today,n:G.day};save.roses+=G.amt;persist();giftAt=now;return G.amt;
}
// items a level gives that the player has not seen in the shop yet (a dot on the Shop ring and the tile)
function unseen(){const L=lvl(save.xp).L,out=[];for(const S of SHELF)for(const it of S.list)if(it.lv&&L>=it.lv&&!save.seen.includes(it.id))out.push(it.id);return out}
// test hook for qa.js
window.__dnTest={grant(n){save.roses+=n;persist()},reset(){save=cleanSave(null)},restore(j){try{save=cleanSave(JSON.parse(j))}catch(e){}}};

const cv=document.getElementById('c'),safeEl=document.getElementById('safe');let g=cv.getContext('2d');
const F='Inter,system-ui,-apple-system,sans-serif';
let scale=1,col={},base={},ST=0,SB=0,hs=1,PX=1,OX=0;
let nativeSafe=[0,0];window.DNSafe=(t,b)=>{nativeSafe=[t,b];fit()};
function fit(){
  // the width is always 450 game units; the height follows the phone, so the field fills the screen
  scale=Math.min(innerWidth/W,innerHeight/700);H=innerHeight/scale;hs=H/800;
  // iPad (2026-11-19): a screen wider than the game gets OX game units of field on each side, drawn on the same canvas,
  // so cards fly off the real screen edge instead of being cut at the game's edge. Phones keep OX = 0.
  OX=Math.max(0,(innerWidth/scale-W)/2);const VW=W+2*OX;
  const dpr=window.devicePixelRatio||1;
  cv.style.width=VW*scale+'px';cv.style.height=H*scale+'px';
  cv.width=Math.round(VW*scale*dpr);cv.height=Math.round(H*scale*dpr);
  g.setTransform(cv.width/VW,0,0,cv.height/H,OX*cv.width/VW,0);
  // env(safe-area-inset-*) reads 0 inside the app's web view, so the native side also sends the window's insets (DNSafe)
  const sc=getComputedStyle(safeEl);
  ST=Math.max(parseFloat(sc.paddingTop)||0,nativeSafe[0])/scale;SB=Math.max(parseFloat(sc.paddingBottom)||0,nativeSafe[1])/scale;
  const cs=getComputedStyle(document.documentElement);
  for(const k of['bg','field','card','sel','line','mute','hair','like','nope'])base[k]=cs.getPropertyValue('--'+k).trim();
  base.scrim='transparent';col=base;PX=cv.width/(W+2*OX);
  // the parody screens are washed toward the field, so play keeps the field's ink; a scrim keeps the HUD clear of them
  const fh=base.field.replace('#',''),rgb=[0,2,4].map(i=>parseInt(fh.slice(i,i+2),16)).join(',');
  INK={field:base};for(const b of BGS)if(b.id!=='field')INK[b.id]=Object.assign({},base,{scrim:'rgba('+rgb+',.85)'});
  bgc=null;pvc={};
  layoutAsk();
}
addEventListener('resize',fit);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',fit);

const rnd=(a,b)=>a+Math.random()*(b-a);
const NAMES={fh:['Mia','Zoe','Ava','Lena','Ruby','Kira','Nina','Jade','Skye','Elle'],
  mh:['Leo','Kai','Jake','Theo','Dante','Cole','Finn','Zane','Luca','Rhys'],
  fu:['Blorba','Mildew','Wartha','Moist','Gertha','Phlegma','Crustina','Sludge','Grubby','Burpa'],
  mu:['Gurt','Crusty','Dregg','Skunk','Phlegm','Grub','Stench','Lumpo','Krud','Belch']};
const HAIR=['#2a1a14','#5a3418','#d9a441','#b5442c','#111118'];
const SKIN=['#f6cdb0','#e8b48e','#c98a62','#8d5a3c'];

let cards=[],fx=[],queue=[],trail=[],score=0,strikes=0,over=false,overT=0,now=0,nextWave=0.6,tossed=0,shake=0;
let ptr=null,swipeN=0,phase=save.ob?0:6,me=DN.me==='f'?'f':'m',want=['f','m','b'].includes(DN.want)?DN.want:'f';
// start screen: man looking for women is picked already (or the last pick), any option can be tapped, then Start
// First launch (phase 6) is a dating app's onboarding: the two picks as full-width option rows (Hinge, Cal AI) and
// one Continue pill. The same picks, plus Sound, live in Settings (phase 5), a ring on the home screen.
let ASK=[],HOME={},MENU=null,OVER=null;
const LINKH=46,LINKS=[{t:'Support',url:'https://thumbyard.com/date-ninja/support/'},{t:'Privacy',url:'https://thumbyard.com/date-ninja/privacy/'},{t:'by Thumbyard',url:'https://thumbyard.com/'}];
const X0=20,RW=W-40;
function layoutAsk(){
  const set=phase===5,top=ST+8,rowH=Math.round(Math.min(58,Math.max(48,50*hs))),gap=8,headH=48,gapB=26;
  const btnH=60,btnY=H-SB-(SB?14:24)-btnH;
  const block=headH+2*rowH+gap+gapB+headH+3*rowH+2*gap+(set?gapB+3*rowH+2*gap+(DN.hasMusic?gap+rowH:0)+LINKH:0);
  const y0=set?ST+66:top+44,avail=(set?H-SB-24:btnY-14)-y0;let y=y0+Math.max(8,(avail-block)*(set?0.15:0.4));
  const head1=y;y+=headH;ASK=[];
  for(const[t,v]of[['Man','m'],['Woman','f']]){ASK.push({x:X0,y,w:RW,h:rowH,t,k:'me',v});y+=rowH+gap}
  y+=gapB-gap;const head2=y;y+=headH;
  for(const[t,v]of[['Women','f'],['Men','m'],['Both','b']]){ASK.push({x:X0,y,w:RW,h:rowH,t,k:'want',v});y+=rowH+gap}
  if(set){y+=gapB-gap;ASK.push({x:X0,y,w:RW,h:rowH,t:'Sound',k:'snd'});if(DN.hasMusic){y+=rowH+gap;ASK.push({x:X0,y,w:RW,h:rowH,t:'Music',k:'mus'})}
    y+=rowH+gap;ASK.push({x:X0,y,w:RW,h:rowH,t:'Haptics',k:'hap'});
    // controls standard rule 11: how see-through the play buttons and displays are, 40 to 100 percent
    y+=rowH+gap;ASK.push({x:X0,y,w:RW,h:rowH,t:'Button see-through',k:'see'});
    // Support and Privacy open the Thumbyard pages; the credit line says who made it (Thumbyard brand standard)
    y+=rowH+18;const lw=RW/3;LINKS.forEach((l,i)=>ASK.push({x:X0+i*lw,y,w:lw,h:LINKH-12,t:l.t,k:'link',url:l.url}))}
  else ASK.push({x:X0,y:btnY,w:RW,h:btnH,t:'Continue',k:'cont'});
  HOME={top,head1,head2};
  layoutHome();
  OVER=overLay();MENU=OVER.menu;
}
// ---- home: Fruit Ninja's rings, our version ----
// Profile cards sit in coloured rings with the label written around the top; swipe right through one (or tap it) to
// pick it. Classic is the big one, Arcade and Zen under it, then Shop, Ranks (Game Center) and Settings. The swipe
// trail shows on home; a left swipe through a ring only wobbles it. Level badge and XP bar top-left, roses top-right.
let RINGS=[],homeSel=null,homeDown=null,homeCards={};
const RDEF=[{k:'classic',t:'CLASSIC',c:ROSE},{k:'arcade',t:'ARCADE',c:'#ff8a1f'},{k:'zen',t:'ZEN',c:'#16a5b8'},
  {k:'shop',t:'SHOP',c:'#e9a800'},{k:'lb',t:'RANKS',c:'#4f86f7'},{k:'set',t:'SETTINGS',c:'#8b5cf6'}];
function layoutHome(){
  const top=ST+118,bot=H-SB-(SB?10:22),sp=bot-top;
  const R1=Math.min(132,sp*0.205),R2=R1*0.72,R3=R1*0.5,gap=Math.max(26,(sp-2*(R1+R2+R3))/3.2);
  const y1=top+R1+gap*0.35,y2=y1+R1+gap+R2,y3=y2+R2+gap+R3;
  const at=[[W/2,y1,R1],[W*0.28,y2,R2],[W*0.72,y2,R2],[W*0.19,y3,R3],[W/2,y3,R3],[W*0.81,y3,R3]];
  RINGS=RDEF.map((d,i)=>{const[cx,cy,r]=at[i];return Object.assign({},d,{cx,cy,r,x:cx-r,y:cy-r,w:2*r,h:2*r,ph:i*1.7,wob:0,inside:false})});
}
function goHome(){phase=0;resetFx();fx=[];trail=[];homeSel=null;homeDown=null;ptr=null;layoutHome()}
function homeCard(k){return homeCards[k]||(homeCards[k]=demoCard(true))}
function ringAt(p){return RINGS.find(R=>Math.hypot(p.x-R.cx,p.y-R.cy)<R.r)}
function homeSeg(a,b,dir,fast){
  if(homeDown)homeDown.moved+=Math.hypot(b.x-a.x,b.y-a.y);
  if(homeSel)return;
  const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;
  for(const R of RINGS){
    let t=l2?((R.cx-a.x)*dx+(R.cy-a.y)*dy)/l2:0;t=t<0?0:t>1?1:t;
    if(Math.hypot(R.cx-a.x-dx*t,R.cy-a.y-dy*t)<R.r*0.75){
      if(!R.inside&&fast&&dir){R.inside=true;if(dir>0)pickRing(R,true);else{R.wob=now;sfx('nope',0.5);hap('light');say(R.cx,R.cy-R.r-10,'YOUR LOSS',col.nope,22,{st:'bad',home:1})}}
    }else R.inside=false;
  }
}
function pickRing(R,swiped){
  if(homeSel)return;
  sfx(swiped?'like':'tap');hap('light');
  if(!swiped){doRing(R);return}
  // a swipe tears the ring's card (the same slice as in play), then the pick goes through
  homeSel={R,t:now};burst(R.cx,R.cy,1,R.c,'conf',22);
  if(['classic','arcade','zen'].includes(R.k)){
    const c=homeCard(R.k),s=(R.r-Math.max(11,R.r*0.16)-3)*0.98/62;
    c.x=R.cx;c.y=R.cy+R.r*0.06;c.a=Math.sin(now*0.9+R.ph)*0.1;c.vy=-120;c.dir=1;c.state=1;tear(c,1,s);homeSel.torn=true;
  }
}
function doRing(R){
  homeSel=null;delete homeCards[R.k];

function wave(){
  const t=runT(),r=Math.random();
  // mixed waves only after 20 s, about 1 in 10, and small (2 early, 3 later)
  const mixed=tossed>=4&&t>=20&&r<0.1;
  waveHot=tossed<4||mixed?null:r<0.72?true:false;
  const minN=Math.min(4,1+Math.floor(t/20)),maxN=Math.min(6,1+Math.floor(t/12));
  let n=tossed<4?1:minN+Math.floor(Math.random()*(maxN-minN+1));
  if(mixed)n=t<40?2:3;
  const stag=t>45?rnd(0.24,0.32):rnd(0.3,0.4),plans=[];
  for(let i=0;i<n;i++)plans.push(mixed?{hot:i%2===0,lane:1}:{});
  // red flags: the first one 12-14 s in, then about 8% of tosses (11% after 40 s), at most one a wave early
  if(mode!=='zen'&&tossed>=4&&now>=flagAt){
    const first=flagAt>0&&!flagsTossed,share=t<40?0.08:0.11;let nf=first?1:0;
    if(!first)for(let i=0;i<n;i++)if(Math.random()<share)nf++;
    nf=Math.min(nf,t>45?2:1);
    for(let i=0;i<nf;i++){
      // the flag goes up away from where the wave's cards rise, a beat behind them
      const side=Math.random()<0.5,fx=side?rnd(W*0.12,W*0.3):rnd(W*0.7,W*0.88);
      plans.splice(1+Math.floor(Math.random()*n),0,{flag:1,fx});flagsTossed++;
    }
  }
  plans.forEach((p,i)=>{p.t=now+i*stag;queue.push(p)});
  nextWave=now+plans.length*stag+Math.max(0.6,(tossed<4?1.85:1.75)-t*0.018);
  sfx('toss',0.5);
}

function step(dt){

    stepFx(dt);for(const f of fx)f.t+=dt;fx=fx.filter(f=>f.t<(f.life||1));trail=trail.filter(p=>now-p.t<0.2);
    if(homeSel&&phase===0&&now-homeSel.t>0.38)doRing(homeSel.R);
    return;
  }
  const k=now<slowT?0.4:1,cdt=dt*k;
  if(goAt&&now>=goAt){goAt=0;say(W/2,H*0.42,'GO',col.like,72,{st:'clock'});sfx('like');hap('medium')}
  if(!over&&endT){
    // SLOW-MO stops the clock (Fruit Ninja's Freeze)
    if(k<1)endT+=dt;
    // the last five seconds tick
    const left=Math.ceil(endT-now);if(!timeUp&&now>runStart&&left<=5&&left>0&&left!==tickAt){tickAt=left;sfx('tap',0.45);hap('light')}
    if(mode==='arcade'&&!oneTossed&&endT-now<=4){oneTossed=true;window.__force=(window.__force||[]).concat('one');queue.unshift({t:now})}

  }

  if(!over&&!timeUp){
    if(k<1){nextWave+=dt*(1-k);for(let i=0;i<queue.length;i++)queue[i].t+=dt*(1-k)}
    if(now<frenzyT){
      if(now>=frenzyNext){toss(Math.random()<0.5?1:-1);frenzyNext=now+0.2}
      nextWave=Math.max(nextWave,frenzyT+0.6);
    }
    if(now>=nextWave)wave();
    while(queue.length&&queue[0].t<=now)toss(0,queue.shift());
  }
  for(const c of cards){
    if(c.holdT){
      if(now<c.holdT)continue;
      c.holdT=0;fling(c,1);tear(c,1);burst(c.x,c.y,1,'#b05cff','heart',24);splat(c.x,c.y,'#b05cff',1.6);hitStop(0.08);say(c.x,c.y-110,'+'+c.hits,'#b05cff',48,{st:'one',sub:'THE ONE'});continue;

function seg(a,b){
  // the blade only cuts while it is moving fast, and the sideways direction of the cut is the answer
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),dt=Math.max(1,b.t-a.t)/1000;
  const dir=Math.abs(dx)<0.3*d?0:Math.sign(dx);
  trail.push({x:b.x,y:b.y,t:now,dir,brk:false});
  if(phase===0){homeSeg(a,b,dir,d/dt>=P.minSpeed);return}
  if(d/dt<P.minSpeed||!dir||over)return;
  // trail particles (sparkles, hearts, flames) every 14 units along a fast stroke
  if(TR().fx){partAcc+=d;while(partAcc>=14){partAcc-=14;const u=d?1-partAcc/d:1;tfx.push({x:a.x+dx*u,y:a.y+dy*u,dir,t:now,s:Math.random()*999})}if(tfx.length>160)tfx.splice(0,tfx.length-160)}
  if(now-swishAt>0.3){swishAt=now;sfx('swish',0.55)}
  cutAng=Math.atan2(dy,dx);
  for(const c of cards){
    if(c.state)continue;
    const l2=d*d;let t=l2?((c.x-a.x)*dx+(c.y-a.y)*dy)/l2:0;t=t<0?0:t>1?1:t;
    if(Math.hypot(c.x-a.x-dx*t,c.y-a.y-dy*t)<50){if(!c.inside){c.inside=true;swipeCard(c,dir)}}else c.inside=false;
  }
}

// A right swipe on a hottie or a left swipe on an uggo tears the card in two along the swipe line. The card is drawn

// tumble: in a frame lined up with the cut the card is squashed by cos(flip), so it turns over around the cut line and
// shows its shaded back side. Splats stay on the background and fade over about 2 s; a short particle burst; a few

function shopTap(p){
  const L=shopLay(),T=L.tabs;
  if(hit(p,topBar().back)){goHome();sfx('tap');hap('light');return}
  if(hit(p,L.gift)){
    const amt=claimGift();
    if(amt){const gb=L.gift;burst(gb.x+gb.w-67,gb.y+gb.h/2,1,ROSE,'heart',16);sfx('best');hap('good')}
    return;
  }
  if(hit(p,T)){const i=Math.max(0,Math.min(SHELF.length-1,Math.floor((p.x-T.x)/(T.w/SHELF.length))));if(i!==shopTab){shopTab=i;sfx('tap');hap('light')}return}
  if(hit(p,L.act)){shopAct(selIt());return}
  for(const r of L.rows)if(hit(p,r)){if(shopSel[shopTab]!==r.it.id){shopSel[shopTab]=r.it.id;sfx('tap');hap('light')}return}
}
function shopAct(it){
  const k=SHELF[shopTab].k,st=itemState(it,k);
  if(st==='off'||st==='lock'){shopFlash=now;sfx('nope',0.6);hap('bad');return}
  if(st==='done')return;
  if(st==='equip'){save.eq[k]=it.id;persist();sfx('tap');hap('light');return}
  // buying a look puts it on straight away
  save.roses-=it.p;
  if(k==='pu')save.pu[it.id]++;else{save.own[k].push(it.id);save.eq[k]=it.id}
  persist();sfx('power');hap('good');
  const A=shopLay().act;burst(A.x+A.w/2,A.y+A.h/2,1,ROSE,'heart',10);
}
function preLay(){

function preTap(p){
  const L=preLay();
  if(hit(p,topBar().back)){goHome();sfx('tap');hap('light');return}
  for(const r of L.rows)if(hit(p,r)){pick[r.p.id]=!pick[r.p.id];sfx('tap');hap('light');return}

function playArcade(){

  const use=PUS.filter(x=>x.m===mode&&pick[x.id]&&save.pu[x.id]>0).map(x=>x.id);
  for(const k of use)save.pu[k]--;
  if(use.length)persist();
  best=BEST[mode];phase=2;restart();
  runPU={burst:use.includes('burst'),time:use.includes('time'),rebound:use.includes('rebound')};shieldN=shieldMax=use.includes('shield')?3:0;
  post({t:'pick',me,want,mode});sfx('tap');hap('light');
}
let last=performance.now(),lastScene='';
function frame(t){
  rdt=Math.min(0.1,Math.max(0,(t-last)/1000));rnow=t/1000;
  let dt=Math.min(0.033,(t-last)/1000);last=t;
  // a 32x32 ring cursor in play on keyboard and mouse; the normal arrow everywhere else
  const cur=mouseMode&&phase===2&&!over&&!paused?CURSOR:'default';if(cur!==lastCur){lastCur=cur;cv.style.cursor=cur}
  // hit-stop: the game holds a few frames on big hits (the drawing goes on); pause holds everything
  if(t<stopUntil||paused)dt=0;
  now+=dt;

  step(dt);draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
