<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Six base games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafaf9;--panel:#ffffff;--line:#e4e4e1;--text:#1c1c1a;--dim:#8a8a85;--accent:#2f6fed;--warn:#e5532d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111112;--panel:#1a1a1c;--line:#2c2c30;--text:#ededeb;--dim:#7d7d82;--accent:#6b9bff;--warn:#ff7a52}}
:root[data-theme="dark"]{--bg:#111112;--panel:#1a1a1c;--line:#2c2c30;--text:#ededeb;--dim:#7d7d82;--accent:#6b9bff;--warn:#ff7a52}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;overflow-y:auto;overscroll-behavior:none}
nav{width:100%;max-width:440px;display:flex;gap:2px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;overflow-x:auto;scrollbar-width:none;flex:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;font:500 13px Inter,system-ui,sans-serif;color:var(--dim);background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--text);background:var(--panel);box-shadow:0 0 0 1px var(--line)}
main{flex:1 0 auto;min-height:600px;height:0;width:100%;max-width:440px;padding:0 12px calc(12px + env(safe-area-inset-bottom));display:flex}
canvas{flex:1;width:100%;height:100%;max-height:780px;border:1px solid var(--line);border-radius:14px;background:var(--panel);touch-action:none;display:block;user-select:none}
</style>
</head>
<body>
<nav id="nav" role="tablist"></nav>
<main><canvas id="c"></canvas></main>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),nav=document.getElementById('nav');
let W=0,H=0,C={},fx=[],game=null,T=0;
const R=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>n<1000?Math.floor(n)+'':n<1e6?(n/1e3).toFixed(1)+'k':(n/1e6).toFixed(2)+'m';
function theme(){const s=getComputedStyle(document.documentElement);for(const k of['bg','panel','line','text','dim','accent','warn'])C[k]=s.getPropertyValue('--'+k).trim()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(s,x,y,size,col,align,w){ctx.font=(w||500)+' '+size+'px Inter,system-ui,sans-serif';ctx.fillStyle=col;ctx.textAlign=align||'left';ctx.textBaseline='middle';ctx.fillText(s,x,y)}
function row(n,i){const g=8,p=12,w=(W-p*2-g*(n-1))/n;return{x:p+i*(w+g),y:H-64,w,h:52}}
function btn(b,label,sub,ok){ctx.fillStyle=C.bg;rr(b.x,b.y,b.w,b.h,10);ctx.fill();ctx.lineWidth=1;ctx.strokeStyle=ok?C.accent:C.line;ctx.stroke();txt(label,b.x+b.w/2,b.y+19,13,ok?C.text:C.dim,'center',600);txt(sub,b.x+b.w/2,b.y+36,12,ok?C.accent:C.dim,'center')}
const hit=(b,x,y)=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;
function pop(x,y,col,n){for(let i=0;i<(n||8);i++){const a=R(0,6.28),s=R(40,180);fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.45,col})}}
function float(x,y,text,col){fx.push({x,y,vx:0,vy:-50,life:.8,text,col})}
function fxStep(dt){for(const f of fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.life-=dt}fx=fx.filter(f=>f.life>0)}
function fxDraw(){for(const f of fx){ctx.globalAlpha=cl(f.life*2.2,0,1);if(f.text)txt(f.text,f.x,f.y,14,f.col,'center',600);else{ctx.fillStyle=f.col;ctx.fillRect(f.x-2,f.y-2,4,4)}}ctx.globalAlpha=1}
function over(s){ctx.globalAlpha=.82;ctx.fillStyle=C.panel;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;txt(s,W/2,H/2-12,26,C.text,'center',600);txt('Tap',W/2,H/2+20,14,C.dim,'center')}

/* 1 Tower: one button, wall jump, rising lava */
const Tower={name:'Tower',init(){this.p={x:W/2,y:-10,dir:1,vy:0,g:true,wall:0,air:1,cw:null};this.ws=[];this.pl=[{x:0,y:0,w:W}];this.top=0;this.cam=-H*.7;this.lava=340;this.best=0;this.dead=false;this.jb=0;this.t=0},
 gen(){while(this.top>this.cam-200){this.top-=R(78,104);const w=R(64,128);this.pl.push({x:R(6,W-w-6),y:this.top,w});
   if(this.top<-260&&Math.random()<.4){const h=R(90,170),x=R(70,W-78),y0=this.top-R(20,60)-h;this.ws.push({x,y0,y1:y0+h});this.pl.push({x,y:y0,w:8})}}
  this.pl=this.pl.filter(p=>p.y<this.lava+40);this.ws=this.ws.filter(w=>w.y0<this.lava+40)},
 down(){if(this.dead){this.init();return}this.jb=.14},
 update(dt){if(this.dead)return;this.t+=dt;const p=this.p;this.jb-=dt;
  if(this.jb>0&&(p.g||p.wall)){if(p.wall){p.dir=-p.wall;p.wall=0;p.cw=null}p.vy=-610;p.g=false;p.air=1;this.jb=0;pop(p.x,p.y+10,C.dim,5)}
  else if(this.jb>0&&p.air>0){p.air--;p.vy=-560;this.jb=0;pop(p.x,p.y+10,C.accent,9)}
  if(p.cw&&(p.y-10>p.cw.y1||p.y+10<p.cw.y0)){p.wall=0;p.cw=null}
  if(!p.wall){const px=p.x,nx=px+p.dir*200*dt;let hw=null;
   for(const w of this.ws)if(p.y+10>w.y0+1&&p.y-10<w.y1){if(p.dir>0&&px+10<=w.x&&nx+10>w.x){hw=w;p.x=w.x-10}else if(p.dir<0&&px-10>=w.x+8&&nx-10<w.x+8){hw=w;p.x=w.x+18}}
   if(hw){if(p.g)p.dir=-p.dir;else{p.wall=p.dir;p.cw=hw}}else p.x=nx}
  if(p.x<12){p.x=12;if(p.g)p.dir=1;else p.wall=-1}
  if(p.x>W-12){p.x=W-12;if(p.g)p.dir=-1;else p.wall=1}
  if(!p.g){p.vy+=1500*dt;if(p.wall&&p.vy>70)p.vy=70;const py=p.y;p.y+=p.vy*dt;
   if(p.vy>0)for(const q of this.pl)if(py+10<=q.y&&p.y+10>=q.y&&p.x>q.x-8&&p.x<q.x+q.w+8){p.y=q.y-10;p.vy=0;p.g=true;p.air=1;if(p.wall){p.dir=-p.wall;p.wall=0;p.cw=null}break}}
  else{let on=false;for(const q of this.pl)if(Math.abs(p.y+10-q.y)<1&&p.x>q.x-8&&p.x<q.x+q.w+8)on=true;if(!on)p.g=false}
  this.cam=Math.min(this.cam,p.y-H*.55);this.best=Math.max(this.best,-p.y);
  this.lava-=(22+this.best*.01)*dt;this.lava=Math.min(this.lava,this.cam+H+50);
  if(p.y+10>this.lava){this.dead=true;pop(p.x,p.y-this.cam,C.warn,24)}this.gen()},
 draw(){const c=this.cam,p=this.p;ctx.fillStyle=C.text;for(const q of this.pl){rr(q.x,q.y-c,q.w,8,4);ctx.fill()}
  ctx.fillStyle=C.dim;for(const w of this.ws){rr(w.x,w.y0-c,8,w.y1-w.y0,4);ctx.fill()}
  ctx.fillStyle=C.line;ctx.fillRect(0,0,3,H);ctx.fillRect(W-3,0,3,H);
  ctx.fillStyle=C.accent;rr(p.x-10,p.y-10-c,20,20,5);ctx.fill();
  const ly=this.lava-c+Math.sin(this.t*4)*3;ctx.globalAlpha=.85;ctx.fillStyle=C.warn;ctx.fillRect(0,ly,W,H);ctx.globalAlpha=1;
  txt(Math.floor(this.best/10)+' m',16,24,15,C.dim);if(this.dead)over(Math.floor(this.best/10)+' m')}};

/* 2 Targets: short clicker; each unlock adds a new kind of target */
const KINDS=[{n:'Ring',v:1,life:2.4},{n:'Runner',v:4,life:3.2},{n:'Balloon',v:10,life:5},{n:'Crate',v:30,life:4.5},{n:'Blob',v:20,life:3.5},{n:'Ghost',v:150,life:3.2},{n:'Star',v:300,life:2.4}];
const Targets={name:'Targets',init(){this.m=0;this.val=0;this.more=0;this.auto=0;this.ts=[];this.sp=0;this.at=0},
 cost(k){return k=='val'?(this.val>=KINDS.length-1?Infinity:12*Math.pow(2.7,this.val)):k=='more'?25*Math.pow(2,this.more):50*Math.pow(1.8,this.auto)},
 spawn(){const n=this.val+1;let k=Math.floor(Math.pow(Math.random(),.6)*n);k=Math.min(k,n-1);const K=KINDS[k],t={k,x:R(44,W-44),y:R(80,H-130),r:30,life:K.life,max:K.life,hp:1,s:R(0,6)};
  if(k==1){t.vx=(Math.random()<.5?-1:1)*R(130,210);t.r=24}if(k==2){t.y=H-100;t.vy=-R(70,110);t.r=26}if(k==3){t.hp=3;t.r=28}if(k==4)t.r=40;if(k==5){t.bt=.8;t.r=26}if(k==6)t.r=26;this.ts.push(t)},
 pay(t,mult){const v=KINDS[t.k].v*(mult||1);this.m+=v;float(t.x,t.y-t.r,'+'+fmt(v),mult>1||t.k>3?C.warn:C.accent)},
 kill(t){const i=this.ts.indexOf(t);if(i>=0)this.ts.splice(i,1)},
 hitT(t,d){const k=t.k;
  if(k==3&&t.hp>1){t.hp--;t.sh=.15;pop(t.x,t.y,C.dim,5);return}
  if(k==0){const bull=d<t.r/3;this.pay(t,bull?3:1);pop(t.x,t.y,bull?C.warn:C.accent,bull?16:8)}
  else if(k==2){this.pay(t);pop(t.x,t.y,C.warn,18)}
  else if(k==4){this.pay(t);pop(t.x,t.y,C.dim,10);if(!t.mini)for(let i=0;i<3;i++){const a=R(0,6.28);this.ts.push({k:4,mini:1,x:t.x,y:t.y,r:17,vx:Math.cos(a)*150,vy:Math.sin(a)*150,life:2.6,max:2.6,hp:1,s:R(0,6)})}}
  else if(k==6){this.pay(t);pop(t.x,t.y,C.accent,30);this.kill(t);for(const o of[...this.ts])if(o.k!=6){fx.push({x:t.x,y:t.y,vx:(o.x-t.x)/.12,vy:(o.y-t.y)/.12,life:.12,col:C.accent});o.hp=1;this.hitT(o,99)}return}
  else{this.pay(t);pop(t.x,t.y,k==5?C.dim:C.accent,12)}
  this.kill(t)},
 down(x,y){const ks=['val','more','auto'];for(let i=0;i<3;i++)if(hit(row(3,i),x,y)){const c=this.cost(ks[i]);if(this.m>=c){this.m-=c;this[ks[i]]++;if(i==0){this.spawn();const t=this.ts[this.ts.length-1];t.k=this.val;Object.assign(t,{life:KINDS[t.k].life,max:KINDS[t.k].life})}}return}
  for(let i=this.ts.length-1;i>=0;i--){const t=this.ts[i],d=Math.hypot(x-t.x,y-t.y);if(d<t.r+8){this.hitT(t,d);return}}
  fx.push({x,y,vx:0,vy:0,life:.2,col:C.dim})},
 update(dt){this.sp-=dt;if(this.ts.filter(t=>!t.mini).length<1+this.more&&this.sp<=0){this.spawn();this.sp=.3}
  for(const t of this.ts){t.life-=dt;if(t.sh)t.sh-=dt;const k=t.k;
   if(k==0)t.r=12+20*cl(t.life/t.max,0,1);
   if(t.vx){t.x+=t.vx*dt;if(t.x<t.r||t.x>W-t.r)t.vx=-t.vx}
   if(t.vy){t.y+=t.vy*dt;if(t.mini&&(t.y<60||t.y>H-110))t.vy=-t.vy}
   if(k==2)t.x+=Math.sin(T*3+t.s)*30*dt;
   if(k==5){t.bt-=dt;if(t.bt<=0){t.bt=.8;pop(t.x,t.y,C.dim,4);t.x=R(44,W-44);t.y=R(80,H-130)}}}
  this.ts=this.ts.filter(t=>t.life>0&&t.y>-40);
  if(this.auto){this.at-=dt;if(this.at<=0&&this.ts.length){this.hitT(this.ts[0],99);this.at=1.4/this.auto}}},
 draw(){for(const t of this.ts){const k=t.k,x=t.x+(t.sh>0?R(-3,3):0),y=t.y,r=t.r;ctx.globalAlpha=cl(t.life*3,0,1);ctx.lineWidth=3;
   if(k==0){ctx.strokeStyle=C.text;ctx.beginPath();ctx.arc(x,y,r,0,6.3);ctx.stroke();ctx.beginPath();ctx.arc(x,y,r*.62,0,6.3);ctx.stroke();ctx.fillStyle=C.warn;ctx.beginPath();ctx.arc(x,y,r/3,0,6.3);ctx.fill()}
   else if(k==1){ctx.fillStyle=C.accent;ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r,y);ctx.fill();ctx.fillStyle=C.panel;const e=Math.sign(t.vx)*6;ctx.beginPath();ctx.arc(x+e,y-3,3.5,0,6.3);ctx.fill()}
   else if(k==2){ctx.strokeStyle=C.dim;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y+r);ctx.quadraticCurveTo(x+8,y+r+18,x-2,y+r+34);ctx.stroke();ctx.fillStyle=C.warn;ctx.beginPath();ctx.ellipse(x,y,r*.85,r,0,0,6.3);ctx.fill();ctx.fillStyle=C.panel;ctx.globalAlpha*=.5;ctx.beginPath();ctx.ellipse(x-r*.3,y-r*.4,r*.16,r*.26,-.5,0,6.3);ctx.fill()}
   else if(k==3){ctx.fillStyle=C.text;rr(x-r,y-r,r*2,r*2,7);ctx.fill();ctx.strokeStyle=C.panel;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-r,y-r);ctx.lineTo(x+r,y+r);ctx.moveTo(x+r,y-r);ctx.lineTo(x-r,y+r);ctx.stroke();ctx.fillStyle=C.warn;for(let i=0;i<t.hp;i++){ctx.beginPath();ctx.arc(x-12+i*12,y-r-9,3.5,0,6.3);ctx.fill()}}
   else if(k==4){ctx.fillStyle=C.dim;ctx.beginPath();for(let i=0;i<=24;i++){const a=i/24*6.283,q=r*(1+.1*Math.sin(a*3+T*5+t.s));ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}ctx.fill();ctx.fillStyle=C.panel;ctx.beginPath();ctx.arc(x-r*.28,y-r*.1,r*.13,0,6.3);ctx.arc(x+r*.28,y-r*.1,r*.13,0,6.3);ctx.fill()}
   else if(k==5){ctx.globalAlpha*=.35+.65*Math.abs(Math.sin(t.bt/.8*3.14));ctx.fillStyle=C.text;ctx.beginPath();ctx.arc(x,y-4,r*.8,3.14,0);ctx.lineTo(x+r*.8,y+r*.7);for(let i=0;i<4;i++){const xx=x+r*.8-(i+.5)*r*.4;ctx.lineTo(xx,y+r*.4);ctx.lineTo(xx-r*.2,y+r*.7)}ctx.fill();ctx.fillStyle=C.panel;ctx.beginPath();ctx.arc(x-7,y-6,3.5,0,6.3);ctx.arc(x+7,y-6,3.5,0,6.3);ctx.fill()}
   else{ctx.fillStyle=C.accent;ctx.beginPath();for(let i=0;i<10;i++){const a=i/10*6.283+T*2,q=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}ctx.fill()}}
  ctx.globalAlpha=1;txt('$'+fmt(this.m),16,26,20,C.text,'left',600);const nx=KINDS[this.val+1];
  btn(row(3,0),nx?'New: '+nx.n:'All in',nx?'$'+fmt(this.cost('val')):'7 of 7',this.m>=this.cost('val'));
  btn(row(3,1),'On screen '+(1+this.more),'$'+fmt(this.cost('more')),this.m>=this.cost('more'));
  btn(row(3,2),'Auto '+this.auto,'$'+fmt(this.cost('auto')),this.m>=this.cost('auto'))}};

/* 3 Traffic: weave, speed climbs */
const Traffic={name:'Traffic',init(){this.rw=Math.min(W-40,280);this.rx=(W-this.rw)/2;this.lw=this.rw/4;this.x=W/2;this.tx=W/2;this.sp=250;this.t=0;this.d=0;this.next=200;this.cars=[];this.dead=false;this.sc=0},
 lane(i){return this.rx+this.lw*(i+.5)},
 down(x){if(this.dead){this.init();return}this.tx=x},move(x){this.tx=x},
 key(k){const i=cl(Math.round((this.tx-this.rx)/this.lw-.5)+(k=='ArrowLeft'?-1:k=='ArrowRight'?1:0),0,3);this.tx=this.lane(i)},
 update(dt){if(this.dead)return;this.t+=dt;const e=cl(this.t/90,0,1);this.sp=Math.min(900,this.sp+2.6*dt);this.d+=this.sp*dt;this.sc+=this.sp*dt/40;
  this.x+=(cl(this.tx,this.rx+20,this.rx+this.rw-20)-this.x)*Math.min(1,16*dt);
  if(this.d>this.next){this.next=this.d+R(380-150*e,520-200*e);const a=Math.floor(R(0,4));this.cars.push({l:a,y:-80,v:R(.45,.7)});if(Math.random()<.1+.35*e){let b=Math.floor(R(0,4));if(b!=a)this.cars.push({l:b,y:-80-R(0,90),v:R(.45,.7)})}}
  const py=H-130;for(const c of this.cars){const y0=c.y;c.y+=this.sp*c.v*dt;const dx=Math.abs(this.lane(c.l)-this.x);
   if(dx<37&&Math.abs(c.y-py)<54){this.dead=true;pop(this.x,py,C.warn,30)}
   else if(!c.p&&y0<py+60&&c.y>=py+60){c.p=1;if(dx<this.lw*.95){this.sc+=25;float(this.x,py-50,'+25',C.accent)}}}
  this.cars=this.cars.filter(c=>c.y<H+90)},
 draw(){ctx.fillStyle=C.bg;ctx.fillRect(this.rx,0,this.rw,H);const beat=.35+.65*Math.abs(Math.sin(T*6.283));ctx.globalAlpha=beat;ctx.fillStyle=C.dim;
  for(let i=1;i<4;i++)for(let y=(this.d%60)-60;y<H;y+=60)ctx.fillRect(this.rx+this.lw*i-1.5,y,3,28);ctx.globalAlpha=1;
  ctx.fillStyle=C.line;ctx.fillRect(this.rx-3,0,3,H);ctx.fillRect(this.rx+this.rw,0,3,H);
  ctx.fillStyle=C.text;for(const c of this.cars){rr(this.lane(c.l)-20,c.y-30,40,60,8);ctx.fill()}
  ctx.fillStyle=C.accent;rr(this.x-20,H-160,40,60,8);ctx.fill();
  txt(fmt(this.sc),16,24,15,C.dim);txt(Math.round(this.sp/6)+' mph',W-16,24,15,C.dim,'right');if(this.dead)over(fmt(this.sc))}};

/* 4 Tank: feed, collect, defend */
const Tank={name:'Tank',init(){this.m=30;this.fd=6;this.fish=[];this.food=[];this.coins=[];this.al=null;this.at=30;this.fc=50;this.cx=0;this.add();this.add()},
 floor(){return H-84},
 add(){this.fish.push({x:R(40,W-40),y:R(80,this.floor()-60),tx:W/2,ty:200,tt:0,s:1,h:R(0,.3),ct:R(3,6),d:1})},
 down(x,y){const b0=row(2,0),b1=row(2,1);
  if(hit(b0,x,y)){if(this.m>=this.fc){this.m-=this.fc;this.fc=Math.round(this.fc*1.3);this.add()}return}
  if(hit(b1,x,y)){const c=150*Math.pow(2.2,this.cx);if(this.m>=c){this.m-=c;this.cx++}return}
  const a=this.al;if(a&&Math.hypot(x-a.x,y-a.y)<40){a.hp--;a.x+=(a.x-x)*.5;a.y+=(a.y-y)*.5;pop(x,y,C.warn,6);if(a.hp<=0){this.m+=60;float(a.x,a.y,'+60',C.accent);pop(a.x,a.y,C.warn,26);this.al=null;this.at=R(28,40)}return}
  for(const c of this.coins)if(Math.hypot(x-c.x,y-c.y)<28){this.m+=c.v;float(c.x,c.y,'+'+c.v,C.accent);c.life=0;return}
  if(y<this.floor()){if(this.fd>=1){this.fd--;this.food.push({x,y})}else this.ff=.3}},
 update(dt){const fl=this.floor();this.fd=Math.min(6,this.fd+dt/1.4);if(this.ff)this.ff=Math.max(0,this.ff-dt);for(const f of this.food)f.y+=45*dt;this.food=this.food.filter(f=>f.y<fl);
  for(const c of this.coins){c.y=Math.min(fl-8,c.y+60*dt);c.life-=dt}this.coins=this.coins.filter(c=>c.life>0);
  for(const f of this.fish){f.h+=.055*dt;let sp=45;f.tt-=dt;
   if(f.h>.25&&this.food.length){let b=null,bd=1e9;for(const o of this.food){const d=Math.hypot(o.x-f.x,o.y-f.y);if(d<bd){bd=d;b=o}}f.tx=b.x;f.ty=b.y;sp=120;
    if(bd<16){this.food.splice(this.food.indexOf(b),1);f.h=0;f.s=Math.min(2.2,f.s+.15);pop(f.x,f.y,C.dim,4)}}
   else if(f.tt<=0){f.tx=R(30,W-30);f.ty=R(70,fl-30);f.tt=R(2,4)}
   const dx=f.tx-f.x,dy=f.ty-f.y,d=Math.hypot(dx,dy)||1;if(d>4){f.x+=dx/d*sp*dt;f.y+=dy/d*sp*dt;if(Math.abs(dx)>3)f.d=Math.sign(dx)}
   f.ct-=dt;if(f.ct<=0&&f.h<.8){f.ct=R(5,7);this.coins.push({x:f.x,y:f.y,v:Math.round(10*f.s*Math.pow(2,this.cx)),life:9})}}
  this.fish=this.fish.filter(f=>{if(f.h>=1){pop(f.x,f.y,C.dim,10);return false}return true});
  if(!this.fish.length&&this.m<this.fc)this.m=this.fc;
  if(!this.al){this.at-=dt;if(this.at<=0&&this.fish.length)this.al={x:Math.random()<.5?-30:W+30,y:R(100,fl-80),hp:8,bt:0}}
  else{const a=this.al;let b=null,bd=1e9;for(const f of this.fish){const d=Math.hypot(f.x-a.x,f.y-a.y);if(d<bd){bd=d;b=f}}a.bt-=dt;
   if(b){a.x+=(b.x-a.x)/bd*70*dt;a.y+=(b.y-a.y)/bd*70*dt;if(bd<24&&a.bt<=0){this.fish.splice(this.fish.indexOf(b),1);pop(b.x,b.y,C.warn,14);a.bt=1.5}}}},
 draw(){const fl=this.floor();ctx.fillStyle=C.line;ctx.fillRect(0,fl,W,2);
  ctx.fillStyle=C.dim;for(const f of this.food){ctx.beginPath();ctx.arc(f.x,f.y,4,0,6.3);ctx.fill()}
  for(const f of this.fish){const r=13*f.s;ctx.fillStyle=f.h>.65?C.warn:C.text;ctx.beginPath();ctx.ellipse(f.x,f.y,r,r*.6,0,0,6.3);ctx.fill();ctx.beginPath();ctx.moveTo(f.x-f.d*r*.8,f.y);ctx.lineTo(f.x-f.d*r*1.6,f.y-r*.55);ctx.lineTo(f.x-f.d*r*1.6,f.y+r*.55);ctx.fill();
   ctx.fillStyle=C.panel;ctx.beginPath();ctx.arc(f.x+f.d*r*.5,f.y-r*.12,2.2,0,6.3);ctx.fill()}
  for(const c of this.coins){ctx.globalAlpha=cl(c.life,0,1);ctx.fillStyle=C.accent;ctx.beginPath();ctx.arc(c.x,c.y,8,0,6.3);ctx.fill()}ctx.globalAlpha=1;
  const a=this.al;if(a){ctx.fillStyle=C.warn;ctx.beginPath();for(let i=0;i<16;i++){const g=i/16*6.283,r=i%2?26:17;ctx.lineTo(a.x+Math.cos(g+T*2)*r,a.y+Math.sin(g+T*2)*r)}ctx.fill()}
  txt('$'+fmt(this.m),16,26,20,C.text,'left',600);for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(W-22-i*16,26,5,0,6.3);if(i<Math.floor(this.fd)){ctx.fillStyle=C.dim;ctx.fill()}else{ctx.lineWidth=1.5;ctx.strokeStyle=this.ff?C.warn:C.line;ctx.stroke()}}const c=150*Math.pow(2.2,this.cx);
  btn(row(2,0),'Fish','$'+fmt(this.fc),this.m>=this.fc);btn(row(2,1),'Coins x'+Math.pow(2,this.cx+1),'$'+fmt(c),this.m>=c)}};

/* 5 Bricks: the balls run themselves, you place the bricks */
const Bricks={name:'Bricks',init(){this.cols=8;this.cs=(W-24)/8;this.ox=12;this.oy=50;this.rows=Math.floor((H-80-this.oy)/this.cs);this.m=40;this.b={};this.balls=[];this.bc=30;this.vl=0;this.ball();this.ball()},
 ball(){const a=R(.5,2.6);this.balls.push({x:this.ox+this.cs*4,y:this.oy+this.cs*this.rows-20,vx:Math.cos(a)*430,vy:-Math.abs(Math.sin(a)*430)})},
 pay(){return 2*Math.pow(2,this.vl)},
 cell(x,y){const c=Math.floor((x-this.ox)/this.cs),r=Math.floor((y-this.oy)/this.cs);return c<0||c>=this.cols||r<0||r>=this.rows?null:c+','+r},
 strike(k,x,y){const q=this.b[k];if(!q)return false;q.hp--;q.f=.12;this.m+=this.pay();if(q.hp<=0){delete this.b[k];this.m+=this.pay()*4;pop(x,y,C.accent,12);float(x,y,'+'+fmt(this.pay()*5),C.accent)}return true},
 down(x,y){if(hit(row(2,0),x,y)){if(this.m>=this.bc){this.m-=this.bc;this.bc=Math.round(this.bc*1.7);this.ball()}return}
  const vc=40*Math.pow(1.9,this.vl);if(hit(row(2,1),x,y)){if(this.m>=vc){this.m-=vc;this.vl++}return}
  const k=this.cell(x,y);if(!k||this.b[k]||this.m<5)return;for(const o of this.balls)if(this.cell(o.x,o.y)==k)return;this.m-=5;this.b[k]={hp:8,f:0}},
 update(dt){const x0=this.ox,x1=this.ox+this.cs*this.cols,y0=this.oy,y1=this.oy+this.cs*this.rows,r=6;
  for(const k in this.b)this.b[k].f-=dt;
  for(const o of this.balls){let nx=o.x+o.vx*dt;if(nx<x0+r||nx>x1-r)o.vx=-o.vx;else{const k=this.cell(nx+Math.sign(o.vx)*r,o.y);if(k&&this.strike(k,nx,o.y))o.vx=-o.vx;else o.x=nx}
   let ny=o.y+o.vy*dt;if(ny<y0+r||ny>y1-r)o.vy=-o.vy;else{const k=this.cell(o.x,ny+Math.sign(o.vy)*r);if(k&&this.strike(k,o.x,ny))o.vy=-o.vy;else o.y=ny}}},
 draw(){const s=this.cs;ctx.strokeStyle=C.line;ctx.lineWidth=1;ctx.strokeRect(this.ox,this.oy,s*this.cols,s*this.rows);
  ctx.fillStyle=C.line;for(let c=1;c<this.cols;c++)for(let r=1;r<this.rows;r++)ctx.fillRect(this.ox+c*s-1,this.oy+r*s-1,2,2);
  for(const k in this.b){const[c,r]=k.split(',').map(Number),q=this.b[k];ctx.globalAlpha=.35+.65*q.hp/8;ctx.fillStyle=q.f>0?C.accent:C.text;rr(this.ox+c*s+3,this.oy+r*s+3,s-6,s-6,6);ctx.fill()}ctx.globalAlpha=1;
  ctx.fillStyle=C.accent;for(const o of this.balls){ctx.beginPath();ctx.arc(o.x,o.y,6,0,6.3);ctx.fill()}
  txt('$'+fmt(this.m),16,26,20,C.text,'left',600);const vc=40*Math.pow(1.9,this.vl);
  btn(row(2,0),'Ball '+this.balls.length,'$'+fmt(this.bc),this.m>=this.bc);btn(row(2,1),'Hit x'+fmt(this.pay()),'$'+fmt(vc),this.m>=vc)}};

/* 6 Lanes: troops or income; buying a unit grows it toward its next tier, and each tier is a pick of two */
const UT=[{n:'Rock',hp:95,dmg:10,rate:.8,range:20,sp:30,cost:30},{n:'Scissors',hp:60,dmg:11,rate:.55,range:20,sp:46,cost:30},{n:'Paper',hp:42,dmg:8,rate:.7,range:70,sp:54,cost:30}];
const TREE=[
 [[{n:'Boulder',d:'Double health',m:{hp:2.1}},{n:'Pebbles',d:'Two for the price of one',m:{twin:1,hp:.8}}],
  [{n:'Lava',d:'Burns whoever hits it',m:{thorns:.6,hp:1.3}},{n:'Quake',d:'Hits everything near it',m:{splash:36,dmg:1.2}}]],
 [[{n:'Shears',d:'Cuts much harder',m:{dmg:1.6}},{n:'Runners',d:'Much faster',m:{sp:1.6,rate:.8}}],
  [{n:'Chainsaw',d:'Wrecks the base',m:{ram:3,dmg:1.2}},{n:'Whetstone',d:'Heals itself',m:{regen:8,hp:1.3}}]],
 [[{n:'Plane',d:'Flies in from far',m:{range:1.7}},{n:'Cardboard',d:'Double health',m:{hp:2.1}}],
  [{n:'Confetti',d:'Hits three at once',m:{pierce:3,dmg:1.2}},{n:'Papercut',d:'Twice as fast',m:{rate:.5}}]]];
const MUL=['hp','sp','dmg','rate','range'];
const Lanes={name:'Lanes',init(){this.u=[];this.hp=[600,600];this.m=[40,40];this.inc=6;this.ic=40;this.t=0;this.ai=0;this.want=0;this.end='';this.pick=null;
  this.ty=UT.map(d=>({...d,name:d.n,tier:1,buys:0,thorns:0,twin:0,pierce:1,ram:1,splash:0,regen:0}))},
 ly(){return (H-90)/2+20},
 need(t){return t.tier==1?3:t.tier==2?5:Infinity},
 card(j){return{x:24,y:H/2-96+j*100,w:W-48,h:84}},
 spawn(s,t){let d;if(s){const k=1+this.t/80;d={...UT[t],hp:UT[t].hp*k,dmg:UT[t].dmg*k,tier:Math.min(3,1+Math.floor(this.t/60)),thorns:0,pierce:1,ram:1,splash:0,regen:0}}else d={...this.ty[t]};
  this.u.push({s,t,d,x:s?W-34:34,y:this.ly()+R(-16,16),hp:d.hp,cd:0,f:0})},
 down(x,y){if(this.end){this.init();return}
  if(this.pick){for(let j=0;j<2;j++)if(hit(this.card(j),x,y)){const t=this.ty[this.pick.i],o=this.pick.o[j];for(const k in o.m){if(MUL.includes(k))t[k]*=o.m[k];else t[k]=o.m[k]}t.tier++;t.name=o.n;t.cost=Math.round(t.cost*1.35);this.pick=null}return}
  for(let i=0;i<3;i++)if(hit(row(4,i),x,y)){const t=this.ty[i];if(this.m[0]>=t.cost){this.m[0]-=t.cost;this.spawn(0,i);if(t.twin)this.spawn(0,i);t.buys++;if(t.buys>=this.need(t)){t.buys=0;fx=[];this.pick={i,o:TREE[i][t.tier-1]}}}return}
  if(hit(row(4,3),x,y)&&this.m[0]>=this.ic){this.m[0]-=this.ic;this.ic=Math.round(this.ic*1.5);this.inc+=3}},
 hurt(a,o){const w=(a.t+1)%3==o.t;o.hp-=a.d.dmg*(w?3:1);o.f=.1;if(w)pop(o.x,o.y,C.warn,3);if(o.d.thorns&&a.d.range<40){a.hp-=a.d.dmg*o.d.thorns;a.f=.1}},
 update(dt){if(this.end||this.pick)return;this.t+=dt;this.m[0]+=this.inc*dt;this.m[1]+=(6+this.t*.09)*dt;
  this.ai-=dt;if(this.ai<=0){this.ai=.5;if(this.m[1]>=UT[this.want].cost){this.m[1]-=UT[this.want].cost;this.spawn(1,this.want);this.want=Math.floor(R(0,3))}}
  for(const a of this.u){const d=a.d,dir=a.s?-1:1;a.cd-=dt;a.f-=dt;if(d.regen)a.hp=Math.min(d.hp,a.hp+d.regen*dt);
   const foes=this.u.filter(b=>b.s!=a.s&&b.hp>0).sort((p,q)=>Math.abs(p.x-a.x)-Math.abs(q.x-a.x)),tg=foes[0],bd=tg?Math.abs(tg.x-a.x):1e9;
   const bx=a.s?24:W-24,bdist=Math.abs(bx-a.x);
   if(tg&&bd<=d.range){if(a.cd<=0){a.cd=d.rate;let hits=d.pierce>1?foes.filter(b=>Math.abs(b.x-a.x)<=d.range).slice(0,d.pierce):[tg];if(d.splash){hits=foes.filter(b=>Math.abs(b.x-tg.x)<=d.splash);fx.push({x:tg.x,y:tg.y,vx:0,vy:0,life:.2,col:C.warn});pop(tg.x,tg.y,C.dim,6)}
     for(const o of hits){this.hurt(a,o);if(a.d.range>40)fx.push({x:a.x,y:a.y,vx:(o.x-a.x)/.15,vy:(o.y-a.y)/.15,life:.15,col:a.s?C.dim:C.accent})}}}
   else if(bdist<=d.range+10){if(a.cd<=0){this.hp[a.s?0:1]-=d.dmg*d.ram;a.cd=d.rate;pop(bx,this.ly(),C.warn,d.ram>1?10:4)}}
   else a.x+=dir*d.sp*dt}
  this.u=this.u.filter(a=>{if(a.hp<=0){pop(a.x,a.y,a.s?C.text:C.accent,8);return false}return true});
  if(this.hp[1]<=0)this.end='Won';if(this.hp[0]<=0)this.end='Lost'},
 draw(){const y=this.ly();ctx.fillStyle=C.line;ctx.fillRect(12,y+26,W-24,2);
  for(let s=0;s<2;s++){const x=s?W-36:12;ctx.fillStyle=s?C.text:C.accent;rr(x,y-44,24,70,6);ctx.fill();ctx.fillStyle=C.line;ctx.fillRect(x-4,y-58,32,5);ctx.fillStyle=s?C.text:C.accent;ctx.fillRect(x-4,y-58,32*cl(this.hp[s]/600,0,1),5)}
  for(const a of this.u){const z=1+.25*(a.d.tier-1),col=a.s?C.text:C.accent;ctx.fillStyle=a.f>0?C.warn:col;ctx.beginPath();
   if(a.t==0){for(let i=0;i<7;i++){const g=i/7*6.283+.3,q=(i%2?9:11)*z;ctx.lineTo(a.x+Math.cos(g)*q,a.y+Math.sin(g)*q)}ctx.fill()}
   else if(a.t==2){ctx.rect(a.x-8*z,a.y-11*z,16*z,22*z);ctx.fill();ctx.fillStyle=C.panel;ctx.beginPath();ctx.moveTo(a.x+8*z,a.y-11*z);ctx.lineTo(a.x+8*z,a.y-4*z);ctx.lineTo(a.x+1*z,a.y-11*z);ctx.fill();ctx.fillRect(a.x-5*z,a.y,10*z,1.5);ctx.fillRect(a.x-5*z,a.y+5*z,10*z,1.5)}
   else{ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=3.5*z;ctx.lineCap='round';const q=a.s?-1:1;ctx.beginPath();ctx.moveTo(a.x-q*7*z,a.y-5*z);ctx.lineTo(a.x+q*11*z,a.y+7*z);ctx.moveTo(a.x-q*7*z,a.y+5*z);ctx.lineTo(a.x+q*11*z,a.y-7*z);ctx.stroke();ctx.lineWidth=2.5*z;ctx.beginPath();ctx.arc(a.x-q*10*z,a.y-7*z,4*z,0,6.3);ctx.stroke();ctx.beginPath();ctx.arc(a.x-q*10*z,a.y+7*z,4*z,0,6.3);ctx.stroke()}
   for(let i=1;i<a.d.tier;i++){ctx.fillStyle=col;ctx.fillRect(a.x-5+(i-1)*7-(a.d.tier-2)*3.5,a.y-16*z-6,4,4)}}
  txt('$'+fmt(this.m[0]),16,26,20,C.text,'left',600);txt('+'+this.inc+'/s',W-16,26,14,C.dim,'right');
  for(let i=0;i<3;i++){const t=this.ty[i],b=row(4,i),n=this.need(t);btn(b,t.name,'$'+t.cost,this.m[0]>=t.cost);
   if(n<99){ctx.fillStyle=C.line;ctx.fillRect(b.x+10,b.y+b.h-6,b.w-20,2);ctx.fillStyle=C.accent;ctx.fillRect(b.x+10,b.y+b.h-6,(b.w-20)*t.buys/n,2)}}
  btn(row(4,3),'Invest','$'+this.ic,this.m[0]>=this.ic);
  if(this.pick){ctx.globalAlpha=.86;ctx.fillStyle=C.panel;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
   for(let j=0;j<2;j++){const c=this.card(j),o=this.pick.o[j];ctx.fillStyle=C.bg;rr(c.x,c.y,c.w,c.h,12);ctx.fill();ctx.lineWidth=1;ctx.strokeStyle=C.accent;ctx.stroke();txt(o.n,c.x+18,c.y+32,17,C.text,'left',600);txt(o.d,c.x+18,c.y+56,13,C.dim)}}
  if(this.end)over(this.end)}};

const games=[Tower,Targets,Traffic,Tank,Bricks,Lanes];
function pick(i){game=games[i];fx=[];game.init();[...nav.children].forEach((b,j)=>b.setAttribute('aria-selected',j==i));try{localStorage.setItem('g',i)}catch(e){}}
games.forEach((g,i)=>{const b=document.createElement('button');b.textContent=g.name;b.setAttribute('role','tab');b.onclick=()=>pick(i);nav.appendChild(b)});
function resize(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);if(game){fx=[];game.init()}}
const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{e.preventDefault();const[x,y]=pt(e);game.down&&game.down(x,y)});
cv.addEventListener('pointermove',e=>{if(game.move&&(e.buttons||e.pointerType!='mouse')){const[x,y]=pt(e);game.move(x,y)}});
addEventListener('keydown',e=>{if(e.key==' '){e.preventDefault();game.down&&game.down(W/2,H/2)}else if(game.key)game.key(e.key)});
addEventListener('resize',resize);matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);
let last=0;function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;T+=dt;game.update(dt);fxStep(dt);ctx.clearRect(0,0,W,H);game.draw();fxDraw();requestAnimationFrame(loop)}
const SOLO=new URLSearchParams(location.search).get('g');if(SOLO!==null){nav.style.display='none';document.querySelector('main').style.paddingTop='12px'}
theme();resize();let s=0;try{s=+localStorage.getItem('g')||0}catch(e){}if(SOLO!==null)s=+SOLO||0;pick(cl(s,0,5));requestAnimationFrame(loop);
</script>
