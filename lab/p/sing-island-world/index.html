<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sing Island</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1D2230;--sub:#626A7C;--line:rgba(29,34,48,.10);--panel:rgba(255,255,255,.9);--btn:#1D2230;
  --sky1:#D6EEF7;--sky2:#A3D3E6;--land:#9CCF7E;--land2:#8AC16D;--sand:#F2E4BC;--rim:#D9C48F;--deco:#7DB862}
body[data-isl=night]{--sky1:#161B36;--sky2:#2A3563;--land:#4F7464;--land2:#466A5B;--sand:#9C977F;--rim:#6F6B59;--deco:#5E8A75}
body[data-isl=fog]{--sky1:#DDE3E4;--sky2:#9FB4B9;--land:#89AC95;--land2:#7C9F88;--sand:#DDD6C3;--rim:#BBB29A;--deco:#9DBDA8}
body[data-isl=stage]{--sky1:#231A30;--sky2:#47294C;--land:#B98450;--land2:#A97546;--sand:#E3BA63;--rim:#7E5433;--deco:#D49A5B}
body[data-isl=roof]{--sky1:#FBE3D2;--sky2:#E9AF9C;--land:#C98C74;--land2:#BC8069;--sand:#EBD3C0;--rim:#9F6C5A;--deco:#B87763}
body[data-isl=canal]{--sky1:#D8F1EE;--sky2:#8FCBC8;--land:#8CC29A;--land2:#7FB58E;--sand:#E8DDBE;--rim:#B9AB86;--deco:#6FAE86}
body[data-isl=marsh]{--sky1:#DCE5CC;--sky2:#9DB38A;--land:#7F9A55;--land2:#738E4C;--sand:#BBAE7E;--rim:#8E825C;--deco:#6C8A49}
body[data-isl=bell]{--sky1:#FBE6F1;--sky2:#D9B3DC;--land:#A9CF8E;--land2:#9CC382;--sand:#F4E2D8;--rim:#D3B6A8;--deco:#8FBE74}
body[data-isl=lantern]{--sky1:#2A1B36;--sky2:#6A3450;--land:#7C5A63;--land2:#72515A;--sand:#E0A45E;--rim:#8A5A38;--deco:#A8717A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(var(--sky1),var(--sky2));font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:background .6s}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg.i{display:block}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.0)}50%{box-shadow:0 0 0 5px rgba(255,255,255,.55)}}
@keyframes glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes wisp{0%{transform:translateX(-30%);opacity:0}15%{opacity:.7}85%{opacity:.7}100%{transform:translateX(130%);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sweep{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes poke{0%,100%{transform:translate(0,0)}50%{transform:translate(-5px,-7px)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:0s!important}}

/* hud */
#top{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 16px 6px;z-index:40;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#top>*{pointer-events:auto;width:100%;max-width:600px}
.row1{display:flex;align-items:center;gap:6px}
.pill{height:34px;border-radius:17px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 12px 0 6px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;backdrop-filter:blur(8px)}
.pill.bad{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.sp{flex:1}
.tg{height:34px;border-radius:17px;background:var(--panel);border:1px solid var(--line);padding:0 12px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;backdrop-filter:blur(8px)}
.tg .sw{width:26px;height:16px;border-radius:8px;background:#C9CDD6;position:relative;transition:background .2s}
.tg .sw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .2s}
.tg.on .sw{background:#2F8F67}.tg.on .sw::after{transform:translateX(10px)}
.ib{width:34px;height:34px;border-radius:17px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(8px);flex:none}
#isles{display:flex;gap:6px}
.nav{height:40px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap;backdrop-filter:blur(8px);position:relative;padding:0 14px;min-width:0}
.nav i{width:11px;height:11px;border-radius:50%;flex:none}.nav span{overflow:hidden;text-overflow:ellipsis}
.nav.map{flex:1}.nav.new{animation:pulse 1.1s ease-in-out infinite}
body.visit #bot,body.visit #eggs,body.visit #structs{display:none}
.full{position:fixed;inset:0;z-index:120;display:none;flex-direction:column;background:#FBFAF7}
.full.on{display:flex}
.full .fh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(14px,env(safe-area-inset-top)) 16px 10px;width:100%;max-width:640px;margin:0 auto}
.full .fh h3{font-size:22px;font-weight:700;letter-spacing:-.02em}
.full .fb{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 16px max(24px,env(safe-area-inset-bottom))}
.full .col{width:100%;max-width:640px;margin:0 auto}
#map{background:linear-gradient(#BFE3EE,#7FBBD3)}
#route{position:relative;width:100%;max-width:420px;margin:0 auto}
#route>svg{position:absolute;left:0;top:0;width:100%;height:100%}
.mi{position:absolute;width:66%;height:118px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;transition:transform .1s}
.mi:active{transform:scale(.97)}
.mi .land{position:absolute;left:0;right:0;top:34px;bottom:20px;border-radius:50%;background:var(--g);box-shadow:0 0 0 6px var(--e),0 12px 18px rgba(20,60,80,.28)}
.mi .crew{position:relative;display:flex;justify-content:center;align-items:flex-end;height:66px;margin-bottom:6px}
.mi .crew img{height:48px;margin:0 -7px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.mi .crew img:nth-child(even){height:40px}
.mi .crew img.no{filter:brightness(0) opacity(.22)}
.mi b{position:relative;display:flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;background:#fff;font-size:14px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.18);white-space:nowrap}
.mi.cur b{background:var(--btn);color:#fff}
.mi.lock .land{filter:grayscale(.8) brightness(1.08);opacity:.6}
.mi.lock b{color:var(--sub)}
.mi.new b{animation:pulse 1.1s ease-in-out infinite}
.mi.visit .land{box-shadow:0 0 0 6px var(--e),0 0 28px 10px rgba(255,205,110,.85)}
#voyage{position:fixed;inset:0;z-index:110;display:none;overflow:hidden;background:linear-gradient(#C3D3DB 0,#AFC6D0 34%,#5E97AB 36%,#2F6D84 100%);touch-action:none}
#voyage.on{display:block}
#voyage .fogv{position:absolute;left:-20%;width:90%;height:110px;border-radius:60px;background:rgba(236,241,243,.9);filter:blur(22px);animation:wisp 18s linear infinite;pointer-events:none}
#vIsle{position:absolute;top:30%;width:230px;margin-left:-115px;height:90px;opacity:0;pointer-events:none}
#vIsle .g{position:absolute;left:0;right:0;bottom:0;height:46px;border-radius:50%;background:var(--g);box-shadow:0 0 0 6px var(--e)}
#vIsle img{position:absolute;bottom:20px;height:64px}
#vShip{position:absolute;bottom:128px;width:240px;margin-left:-120px;height:150px;pointer-events:none;animation:bob 2.2s ease-in-out infinite}
#vShip .hull{position:absolute;left:6px;right:6px;bottom:0;height:56px;background:#9A6544;border-radius:10px 10px 90px 90px;box-shadow:inset 0 11px 0 #C08A5E,0 14px 18px rgba(0,30,45,.35)}
#vCrew{position:absolute;left:14px;right:14px;bottom:38px;display:flex;justify-content:center;align-items:flex-end}
#vCrew img{height:76px;margin:0 -6px;transform-origin:50% 100%;pointer-events:auto;cursor:pointer;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.vnote{position:absolute;color:#fff;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,40,60,.6))}
#vPass{position:absolute;top:52%;width:92px;height:84px;display:none;cursor:pointer}
#vPass .hull{position:absolute;left:0;right:0;bottom:0;height:28px;background:#7A4E36;border-radius:6px 6px 46px 46px}
#vPass img{position:absolute;left:22px;bottom:18px;height:60px}
#vBar{position:absolute;left:16px;right:16px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
#vTrack{width:100%;max-width:520px;height:10px;border-radius:5px;background:rgba(255,255,255,.28);overflow:hidden}
#vTrack i{display:block;height:100%;width:0;background:#FFD87A;border-radius:5px}
#vSteer{width:100%;max-width:520px;pointer-events:auto;accent-color:#FFD87A;height:44px}
#vHead{position:absolute;left:16px;right:16px;top:max(16px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;gap:10px}
#vHead b{height:36px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:18px;background:var(--panel);font-size:14px}
.mi.fogged{pointer-events:none}.mi.fogged .land,.mi.fogged .crew{display:none}
.mi.fogged::before{content:"";position:absolute;left:-6%;right:-6%;top:30px;bottom:6px;border-radius:50%;background:rgba(240,246,248,.92);filter:blur(14px)}
.mi.voice b{color:var(--ink)}
.sl{cursor:pointer}
/* map: where you are, and the one next thing */
.mi .me{position:absolute;right:6px;top:30px;width:36px;height:36px;border-radius:18px;background:#fff;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.25);animation:bob 1.8s ease-in-out infinite;z-index:2}
.mi.next::after{content:"";position:absolute;left:-4%;right:-4%;top:26px;bottom:12px;border-radius:50%;border:3px solid #FFD87A;animation:ring 1.5s ease-out infinite}
@keyframes ring{0%{transform:scale(.94);opacity:1}100%{transform:scale(1.08);opacity:0}}
#goal{flex:none;width:calc(100% - 24px);max-width:420px;margin:0 auto max(12px,env(safe-area-inset-bottom));background:#fff;border-radius:20px;box-shadow:0 8px 24px rgba(10,50,70,.28);padding:10px;display:none;align-items:center;gap:10px}
#goal.on{display:flex}
.recipe{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.face{width:48px;height:48px;border-radius:14px;display:flex;align-items:flex-end;justify-content:center;flex:none;overflow:hidden}
.face img{height:44px}
.face.hid img{filter:brightness(0) opacity(.28)}
.recipe .op{color:var(--sub);flex:none;display:flex;font-weight:700}
.cta{flex:none;height:48px;padding:0 20px;border-radius:16px;background:var(--btn);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.bk .how{display:flex;align-items:center;justify-content:center;gap:3px;height:18px}
.bk .how img{height:18px;width:18px;object-fit:contain}
.bk{position:relative}
.bk .nu{position:absolute;left:8px;top:8px;height:18px;padding:0 7px;border-radius:9px;background:#FFD23F;font-size:10.5px;font-weight:800;letter-spacing:.03em;display:flex;align-items:center;z-index:1}
.howcard{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;margin-bottom:12px}
#vWheel{position:absolute;bottom:206px;width:240px;margin-left:-120px;display:flex;justify-content:space-between;pointer-events:none;color:#fff;font-size:40px;line-height:1;font-weight:300}
#vWheel i{font-style:normal;animation:nudge 1s ease-in-out infinite}#vWheel i:last-child{animation-name:nudge2}
#vWheel.off{display:none}
@keyframes nudge{50%{transform:translateX(-10px)}}@keyframes nudge2{50%{transform:translateX(10px)}}
#voyage{cursor:grab}
#vSteer{position:absolute;opacity:0;pointer-events:none!important;height:1px!important;bottom:0}
#bookGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.bk{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;font-weight:600}
.bk .pic{height:84px;width:100%;border-radius:12px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px}
.bk .pic img{height:76px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.18))}
.bk.met .pic img{filter:grayscale(.75) opacity(.7)}
.bk.unk .pic img{filter:brightness(0) opacity(.2)}
.bk.unk{color:var(--sub)}
.who{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0 14px}
.who .stage{height:210px;width:100%;border-radius:24px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;position:relative}
.who .stage img{height:176px;filter:drop-shadow(0 6px 4px rgba(0,0,0,.2));transform-origin:50% 100%}
.who .stage button{position:absolute;top:50%;margin-top:-18px;width:36px;height:36px;border-radius:18px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.14);font-size:22px;line-height:1}
.who .stage .pv{left:10px}.who .stage .nx{right:10px}
.pl{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:8px;width:100%;text-align:left}
.pl i{width:14px;height:14px;border-radius:50%;flex:none}
.pl .nm{flex:1;min-width:0;font-weight:600;font-size:15px}
.pl .nm small{display:block;font-size:12.5px;font-weight:500;color:var(--sub);margin-top:2px}
.pl .go{width:40px;height:40px;border-radius:20px;padding:0;justify-content:center}
.pl.lock{opacity:.55}
.isl{flex:1;min-width:0;height:36px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13px;white-space:nowrap;backdrop-filter:blur(8px);position:relative;transition:background .2s,color .2s}
.isl i{width:10px;height:10px;border-radius:50%;flex:none}
.isl.cur{background:var(--btn);color:#fff;border-color:transparent}
.isl.lock{opacity:.45;cursor:default}
.isl.new{animation:pulse 1.1s ease-in-out infinite}
.isl svg{flex:none}
#song{height:40px;border-radius:20px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:3px;padding:0 8px;backdrop-filter:blur(8px)}
.sl{flex:0 1 27px;min-width:0;aspect-ratio:1;border-radius:50%;position:relative;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1.5px var(--c,#999);transition:background .3s}
.sl img{position:absolute;left:50%;top:7%;height:126%;transform:translateX(-50%);pointer-events:none}
.sl.e{background:rgba(29,34,48,.05);box-shadow:inset 0 0 0 1.5px rgba(29,34,48,.16)}
.sl.e img{filter:brightness(0) opacity(.22)}
.sl.c{background:transparent;box-shadow:none;outline:1.5px dashed rgba(29,34,48,.28);outline-offset:-1.5px}
.sl.c img{filter:brightness(0) opacity(.12)}
.sl.c.h{outline-color:var(--c)}
.sl.c.h img{filter:grayscale(.6) opacity(.55)}
.sl.w{box-shadow:inset 0 0 0 2px var(--c);background:#FFF8E6}
.sl.w img{filter:brightness(0) opacity(.35)}
#song.all{box-shadow:0 0 0 2px #F2C14E,0 0 18px rgba(242,193,78,.6)}

/* scene */
#scene{position:absolute;left:0;top:0;transform-origin:0 0;z-index:5}
#land{position:absolute;left:0;top:0;pointer-events:none}
.plot{position:absolute;width:0;height:0}
.plot.lock{display:none}
.plot .pad{position:absolute;left:-36px;top:-11px;width:72px;height:22px;border-radius:50%;background:rgba(0,0,0,.10);transition:background .2s}
.plot.free .pad{background:rgba(255,255,255,.62);box-shadow:0 0 0 2px rgba(255,255,255,.9);animation:glow 1.1s ease-in-out infinite;cursor:pointer}
.plot .hit{position:absolute;left:-46px;top:-70px;width:92px;height:86px;display:none;cursor:pointer}
.plot.free .hit{display:block}
.mon{position:absolute;cursor:pointer;transition:filter .3s}
.mon.rest{filter:brightness(.8) saturate(.75)}
.mon.soon{filter:brightness(.9) saturate(.5) opacity(.9)}
.bod{position:absolute;inset:0;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
.fig{position:absolute;inset:0;transform-origin:50% 100%}
.fig img{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 4px 3px rgba(0,0,0,.2));pointer-events:none}
.mouth{position:absolute;background-repeat:no-repeat;pointer-events:none}
.bub{position:absolute;left:0;width:24px;height:24px;justify-content:center;display:none;align-items:center;background:#fff;border-radius:14px;font-weight:600;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.14);cursor:pointer;animation:bob 1.8s ease-in-out infinite;white-space:nowrap;font-variant-numeric:tabular-nums;z-index:2}
.bub.full{background:#FFE9A8;box-shadow:0 0 0 2px #F2C14E,0 2px 6px rgba(0,0,0,.14)}
.fx{position:absolute;pointer-events:none}
.deco{position:absolute;pointer-events:none}
.st{position:absolute;cursor:pointer;transform-origin:50% 100%}
.st svg{display:block;filter:drop-shadow(0 4px 3px rgba(0,0,0,.18))}
.st:active{transform:scale(.96)}
.st .bdg{position:absolute;left:50%;top:-14px;margin-left:-15px;width:30px;height:30px;border-radius:15px;background:#fff;display:none;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.16);animation:bob 1.8s ease-in-out infinite}
.st .bdg.on{display:grid}
.st .bdg.ready{background:#FFE9A8;box-shadow:0 0 0 2px #F2C14E,0 2px 6px rgba(0,0,0,.14)}
.st .bdg svg{filter:none}
.st .ring{position:absolute;left:50%;top:-14px;margin-left:-15px;width:30px;height:30px;display:none}
.st .ring.on{display:block}

/* eggs + bottom */
#eggs{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:30;pointer-events:none;height:52px}
.egg{width:52px;height:52px;position:relative;pointer-events:auto;cursor:pointer}
.egg svg{position:absolute;inset:0}
.egg.ready{animation:bob 1s ease-in-out infinite}
.egg.ready::after{content:"";position:absolute;inset:-3px;border-radius:50%;box-shadow:0 0 0 2px #F2C14E,0 0 14px rgba(242,193,78,.8)}
.egg b{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:11px;font-weight:600;color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff;font-variant-numeric:tabular-nums}
.egg .tag{position:absolute;right:-3px;top:-3px;width:18px;height:18px;border-radius:9px;background:#fff;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}
body[data-isl=night] .egg b,body[data-isl=stage] .egg b,body[data-isl=lantern] .egg b{color:#fff;text-shadow:0 0 3px #000}
#bot{position:absolute;left:0;right:0;bottom:0;padding:6px 16px max(14px,env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:40}
#bot .bar{display:flex;gap:6px;width:100%;max-width:600px}
.bb{flex:1;min-width:0;height:58px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-size:12px;position:relative;backdrop-filter:blur(8px);transition:transform .08s}
.bb:active{transform:scale(.96)}
.bb.main{background:var(--btn);color:#fff;border-color:transparent}
.bb .dot{position:absolute;right:10px;top:8px;width:8px;height:8px;border-radius:50%;background:#E0533D;display:none}
.bb.has .dot{display:block}
.bb[disabled]{opacity:.4;cursor:default}
.bb.hide{display:none}

/* short landscape (phone sideways): hud on one row, buttons as a rail on the right */
body.rail #top{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;padding:max(6px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 4px max(10px,env(safe-area-inset-left));gap:6px}
body.rail #top>*{max-width:none}
body.rail #top>.row1{width:auto;flex:none}
body.rail .row1 .sp{display:none}
body.rail #top>#isles{width:auto;min-width:0}
body.rail #top>#song{grid-column:1 / -1;width:auto;height:34px}
body.rail #bot{left:auto;top:0;bottom:0;right:0;width:auto;padding:0 max(8px,env(safe-area-inset-right)) 8px 0;align-items:flex-end}
body.rail #bot .bar{flex-direction:column;width:68px;pointer-events:auto}
body.rail #bot{pointer-events:none}
body.rail #top{padding-right:calc(84px + env(safe-area-inset-right))}
body.rail .bb{flex:none;height:50px;font-size:11px}
body.rail #eggs{left:max(10px,env(safe-area-inset-left));right:auto;bottom:8px!important;justify-content:flex-start}

/* sheet */
#scrim{position:absolute;inset:0;background:rgba(15,18,30,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:80}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:50%;bottom:0;width:min(560px,100%);max-height:80%;transform:translate(-50%,105%);transition:transform .3s cubic-bezier(.2,.9,.3,1);z-index:90;background:#FBFAF7;border-radius:22px 22px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#sheet.on{transform:translate(-50%,0)}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:10px}
.sh-h h3{font-size:18px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.x{width:32px;height:32px;border-radius:16px;background:rgba(29,34,48,.07);display:grid;place-items:center;flex:none}
#shBody{overflow:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile .pic{height:92px;width:100%;border-radius:12px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.tile .pic img{height:84px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.18))}
.tile .nm{font-weight:600;font-size:14px}
.els{display:flex;gap:3px;justify-content:center}
.els i{width:9px;height:9px;border-radius:50%}
.price{display:flex;align-items:center;gap:4px;font-weight:600;font-size:13px;height:28px;padding:0 12px 0 6px;border-radius:14px;background:var(--btn);color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile.poor .price,.go.poor{background:#C9CDD6;color:#fff}
.tile.own .price{background:#E7F3EC;color:#2F8F67;padding:0 12px}
.tile.own .pic img{opacity:.6}
.tile.no,.go.no{animation:shake .35s}
.rowi{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 10px;margin-bottom:8px}
.av{width:48px;height:48px;border-radius:50%;flex:none;position:relative;overflow:hidden;background:var(--t,#eee)}
.av img{position:absolute;left:50%;top:4px;height:60px;transform:translateX(-50%)}
.av.miss img{filter:grayscale(1) opacity(.35)}
.av.sil{background:rgba(29,34,48,.06);box-shadow:inset 0 0 0 1.5px rgba(29,34,48,.15)}
.av.sil img{filter:brightness(0) opacity(.28)}
.av.slot{background:rgba(29,34,48,.04);box-shadow:inset 0 0 0 1.5px rgba(29,34,48,.18)}
.av.sm{width:38px;height:38px}.av.sm img{height:48px;top:3px}
.op{color:var(--sub);font-weight:500;font-size:16px}
.rowi .nm{flex:1;min-width:0;font-weight:600;font-size:14px;line-height:1.25}
.rowi .nm small{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--sub)}
.go{flex:none;height:34px;border-radius:17px;padding:0 14px;font-weight:600;font-size:14px;background:var(--btn);color:#fff;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.go[disabled]{background:#DADDE3;color:#8A90A0;cursor:default}
.go.lite{background:#E7F3EC;color:#2F8F67}
.ok{flex:none;width:30px;height:30px;border-radius:15px;background:#E7F3EC;display:grid;place-items:center}
@media (max-width:480px){.av{width:40px;height:40px}.av img{height:50px;top:3px}.rowi{gap:5px;padding:7px 8px}.op{font-size:13px}.rowi .nm{font-size:13px}.go{padding:0 12px}}
.tm{white-space:nowrap}
.empty{color:var(--sub);font-size:14px;text-align:center;padding:24px 0 18px}
.fdots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}.fdots i{width:6px;height:6px;border-radius:3px;background:rgba(29,34,48,.15)}.fdots i.f{background:#C98A4B}
.pips{display:flex;gap:3px}
.pips i{width:8px;height:8px;border-radius:4px;background:rgba(29,34,48,.12)}
.pips i.f{background:var(--c,#2F8F67)}
.pips i.g{box-shadow:0 0 0 1.5px #F2C14E}
.hero{display:flex;gap:14px;align-items:flex-end;padding:4px 0 12px}
.hero .big{width:118px;height:118px;border-radius:20px;flex:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.hero .big img{height:108px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.18))}
.hero .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.hero .part{font-size:13px;color:var(--sub);font-weight:500;display:flex;align-items:center;gap:6px}
.pairbar{display:flex;align-items:center;gap:8px;padding:2px 0 12px}
.outs{display:flex;gap:6px;flex-wrap:wrap;padding:0 0 12px;min-height:50px;align-items:center}
.outs .o{position:relative}
.outs .o.u::after{content:"";position:absolute;inset:-2px;border-radius:50%;box-shadow:0 0 0 2px #F2C14E}
.pick{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pick.sel{box-shadow:0 0 0 2px var(--btn)}
.pick.low{opacity:.5}
.pick .pic{height:62px;width:100%;border-radius:10px;display:flex;align-items:flex-end;justify-content:center}
.pick .pic img{height:58px}
.pick .pips{gap:2px}.pick .pips i{width:5px;height:5px;border-radius:3px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.sec{font-size:12px;font-weight:600;color:var(--sub);margin:14px 0 8px;letter-spacing:.02em}

/* toast + start + loader + pointer */
#toast{position:absolute;left:50%;transform:translate(-50%,-20px);opacity:0;pointer-events:none;z-index:70;background:var(--btn);color:#fff;border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}

#start{position:absolute;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:linear-gradient(#D6EEF7,#A3D3E6);transition:opacity .4s}
#start h1{font-size:40px;font-weight:700;letter-spacing:-.03em}

.ring{width:88px;height:88px;border-radius:44px;background:var(--btn);display:grid;place-items:center;position:relative;cursor:pointer}
.ring svg.ld{position:absolute;inset:-8px}
.ring.load{background:#C9CDD6;cursor:default}
#loader{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;pointer-events:none}
#loader.on{display:flex}
#loader .ring{background:var(--panel);width:64px;height:64px;cursor:default}
#party{position:absolute;inset:0;pointer-events:none;z-index:65;overflow:hidden}
.cf{position:absolute;width:8px;height:13px;border-radius:2px;top:-20px}
#ptr{position:fixed;left:0;top:0;z-index:95;pointer-events:none;display:none}
#ptr.on{display:block}
#ptr .hand{position:absolute;left:0;top:0;animation:poke .9s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
#ptr .lbl{position:absolute;left:46px;top:8px;height:30px;border-radius:15px;background:var(--btn);color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;padding:0 4px 0 12px;white-space:nowrap;pointer-events:auto;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#ptr .lbl button{width:22px;height:22px;border-radius:11px;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center}
#ptr.flip .lbl{left:auto;right:4px}
#placing{position:absolute;left:50%;transform:translateX(-50%);z-index:45;display:none;align-items:center;gap:8px;height:40px;border-radius:20px;background:var(--btn);color:#fff;padding:0 5px 0 4px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#placing.on{display:flex}
#placing .av{width:32px;height:32px}#placing .av img{height:40px;top:3px}
#placing button{width:30px;height:30px;border-radius:15px;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
</style>

var prevT=null,puffs=0;
function lowerBound(a,t){var lo=0,hi=a.length;while(lo<hi){var m=(lo+hi)>>1;if(a[m][0]<=t)lo=m+1;else hi=m;}return lo;}
function notesBetween(stem,t0,t1,fn){var a=AU.notes[stem];if(!a)return;for(var i=lowerBound(a,t0);i<a.length&&a[i][0]<=t1;i++)fn(a[i]);}
/* every species squashes its own way: small singles snap, big triples and leads sway slower and deeper */
function onNote(i,pe,n,now){
  var p=SP[pe.id],stem=pe.stem,sing=isSing(stem);pe.heard=now;
  if(sing){setMouth(pe,(stem==='voice_bom'||stem==='voice_doowah_lo')?3:((n[2]||0)>=.4?2:4));pe.mUntil=now+Math.max(.12,Math.min(n[2]||.2,1.2));}
  else{setMouth(pe,1);pe.mUntil=now+.11;}
  var beat=stem==='drums'||stem==='kit'||stem==='percussion'||stem==='hats';
  if(now-pe.lastHit>(beat?.1:.14)){pe.lastHit=now;var len=Math.max(.12,Math.min(.45,n[2]||.2)),tier=p.tier,soft=1/p.size;
    pe.pic.animate([{filter:'drop-shadow(0 0 8px '+p.col+') drop-shadow(0 0 3px '+p.col+') brightness(1.25)'},{filter:'drop-shadow(0 0 0 transparent) drop-shadow(0 4px 3px rgba(0,0,0,.2)) brightness(1)'}],{duration:240,easing:'ease-out'});
    if(sing){var lean=(n[1]%2?-1:1)*(2+tier);pe.fig.animate([{transform:'scale(1,1)'},{transform:'scale('+(1-.03*tier)+','+(1+.04+.02*tier)+') rotate('+lean+'deg)',offset:.3},{transform:'scale(1,1)'}],{duration:len*1000+100+tier*40,easing:'ease-out'});}
    else{var amt=(beat||stem==='bass'?.12:.08)*(1.25-.12*tier)*soft;pe.fig.animate([{transform:'scale(1,1)'},{transform:'scale('+(1+amt)+','+(1-amt)+')',offset:.2},{transform:'scale('+(1-amt*.5)+','+(1+amt*.6)+') translateY(-'+(6-tier)+'px)',offset:.55},{transform:'scale(1,1)'}],{duration:Math.min(340,len*1000+120+tier*25),easing:'ease-out'});}
    var sl=slots[stem];if(sl)sl.animate([{transform:'scale(1.2)'},{transform:'scale(1)'}],{duration:200});}
  var pt=LAY[lay].pts[i],h=monH(pe.id);
  if(now-pe.lastNote>.16&&puffs<40){pe.lastNote=now;puffs++;var sz=sing?17:13,dx=(Math.random()*2-1)*14,rot=(Math.random()*2-1)*18;
    var d=el('div','fx','left:'+(pt[0]+h*.18-sz/2)+'px;top:'+(pt[1]-h-4)+'px;color:'+p.col+';z-index:1000;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1px #fff)','<svg class="i" width="'+sz+'" height="'+sz+'"><use href="#note"/></svg>');fxl.appendChild(d);
    d.animate([{transform:'translate(0,0) scale(.5)',opacity:0},{transform:'translate('+(dx*.3)+'px,-10px) scale(1) rotate('+(rot*.4)+'deg)',opacity:1,offset:.18},{transform:'translate('+dx+'px,-44px) scale(.85) rotate('+rot+'deg)',opacity:0}],{duration:760,easing:'ease-out'}).onfinish=function(){d.remove();puffs--;};}
}
var lastWall=performance.now(),lastSlow=0,lastSig='';
/* re-draw sheets and buttons only when a timer changes state, so a tap never lands on a re-drawn button */
function timerSig(){var x=X();return [x.bake?(done(x.bake)?2:1):0,x.breeds.length,x.nest.map(function(e){return done(e)?1:0;}).join(''),x.wait.length,x.build?1:0,x.castle,x.tree,x.nurs,S.coins>=0?Math.floor(Math.log2(1+S.coins)):0].join('|');}
function accrue(dt){ORDER.forEach(function(k){var x=S.isl[k];if(ISL[k].visit)return;x.plots.forEach(function(m){if(!m)return;m.st=Math.min(cap(m),m.st+ratePerSec(m)*dt);});});}
function frame(){
  requestAnimationFrame(frame);
  var wall=performance.now(),dt=Math.min(1,(wall-lastWall)/1000);lastWall=wall;
  if(!S)return;
  if(started)accrue(dt);
  shownCoins+=(S.coins-shownCoins)*.2;if(Math.abs(S.coins-shownCoins)<.6)shownCoins=S.coins;$('coinN').textContent=fmt(shownCoins);
  shownTreats+=(S.treats-shownTreats)*.2;if(Math.abs(S.treats-shownTreats)<.6)shownTreats=S.treats;$('treatN').textContent=fmt(shownTreats);
  if(wall-lastSlow>250){lastSlow=wall;if(started){tick();save();}renderEggs();for(var b=0;b<15;b++)updBub(b);refreshStructs();
    $('bCollect').classList.toggle('has',X().plots.some(function(m){return m&&m.st>=1;})||!!(X().bake&&done(X().bake)));refreshSong();
    document.querySelectorAll('#shBody [data-end]').forEach(function(s){s.textContent=fmtT(+s.dataset.end-Date.now());});
    var sig=timerSig();if(sig!==lastSig){lastSig=sig;refresh();}
    updPtr();}
  else if(ptrStep)updPtr();
  if(!playing()||ac.currentTime<AU.T0)return;
  var vt=ac.currentTime-(ac.outputLatency||0)-(ac.baseLatency||0);if(vt<AU.T0)return;
  var cur=songT(vt),now=wall/1000;
  if(prevT!=null&&cur<prevT&&prevT-cur<AU.L*.5)cur=prevT;
  if(prevT!=null&&cur!==prevT){
    plotEls.forEach(function(pe,i){if(!pe.id||!pe.live)return;var on=AU.partOn[pe.stem];if(on==null||vt<on)return;
      var fn=function(n){onNote(i,pe,n,now);};
      if(cur>prevT){if(cur-prevT<1)notesBetween(pe.stem,prevT,cur,fn);}else{notesBetween(pe.stem,prevT,AU.LE,fn);notesBetween(pe.stem,AU.LS-1e-6,cur,fn);}});
  }
  prevT=cur;
  plotEls.forEach(function(pe){if(!pe.id)return;var on=AU.partOn[pe.stem];var rest=!pe.live||on==null||vt<on||now-pe.heard>.7;if(rest!==pe.rest){pe.rest=rest;pe.mon.classList.toggle('rest',rest);}if(now>=pe.mUntil)setMouth(pe,isSing(pe.stem)?0:5);});
}

  S.sailed=S.sailed||{};S.neu=S.neu||{};S.got=S.got||{};S.met=S.met||{};ORDER.forEach(function(k){if(!ISL[k].visit)mons(k).forEach(function(m){S.got[m.id]=1;});});

  requestAnimationFrame(frame);
});
