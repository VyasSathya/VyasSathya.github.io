<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sing Island World</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1D2230;--sub:#626A7C;--line:rgba(29,34,48,.10);--panel:rgba(255,255,255,.9);--btn:#1D2230;
  --sky1:#D6EEF7;--sky2:#A3D3E6;--land:#9CCF7E;--land2:#8AC16D;--sand:#F2E4BC;--rim:#D9C48F;--deco:#7DB862}
body[data-isl=night]{--sky1:#161B36;--sky2:#2A3563;--land:#4F7464;--land2:#466A5B;--sand:#9C977F;--rim:#6F6B59;--deco:#5E8A75}
body[data-isl=fog]{--sky1:#DDE3E4;--sky2:#9FB4B9;--land:#89AC95;--land2:#7C9F88;--sand:#DDD6C3;--rim:#BBB29A;--deco:#9DBDA8}
body[data-isl=stage]{--sky1:#231A30;--sky2:#47294C;--land:#B98450;--land2:#A97546;--sand:#E3BA63;--rim:#7E5433;--deco:#D49A5B}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(var(--sky1),var(--sky2));font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:background .6s}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg.i{display:block}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.0)}50%{box-shadow:0 0 0 5px rgba(255,255,255,.55)}}
@keyframes wisp{0%{transform:translateX(-30%);opacity:0}15%{opacity:.7}85%{opacity:.7}100%{transform:translateX(130%);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes sweep{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:0s!important}}

/* hud */
#top{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 16px 6px;z-index:40;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#top>*{pointer-events:auto;width:100%;max-width:560px}
.row1{display:flex;align-items:center;gap:8px}
.pill{height:34px;border-radius:17px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 12px 0 6px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;backdrop-filter:blur(8px)}
.pill.bad{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.sp{flex:1}
.tg{height:34px;border-radius:17px;background:var(--panel);border:1px solid var(--line);padding:0 12px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;backdrop-filter:blur(8px)}
.tg .sw{width:26px;height:16px;border-radius:8px;background:#C9CDD6;position:relative;transition:background .2s}
.tg .sw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .2s}
.tg.on .sw{background:#2F8F67}.tg.on .sw::after{transform:translateX(10px)}
.ib{width:34px;height:34px;border-radius:17px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(8px)}
#isles{display:flex;gap:6px}
.isl{flex:1;min-width:0;height:36px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13px;white-space:nowrap;backdrop-filter:blur(8px);position:relative;transition:background .2s,color .2s}
.isl i{width:10px;height:10px;border-radius:50%;flex:none}
.isl.cur{background:var(--btn);color:#fff;border-color:transparent}
.isl.lock{opacity:.45;cursor:default}
.isl.new{animation:pulse 1.1s ease-in-out infinite}
.isl svg{flex:none}
#song{height:40px;border-radius:20px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:3px;padding:0 8px;backdrop-filter:blur(8px)}
.sl{width:27px;height:27px;border-radius:50%;flex:none;position:relative;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1.5px var(--c,#999);transition:background .3s}
.sl img{position:absolute;left:50%;top:2px;height:34px;transform:translateX(-50%);pointer-events:none}
.sl.e{background:rgba(29,34,48,.05);box-shadow:inset 0 0 0 1.5px rgba(29,34,48,.16)}
.sl.e img{filter:brightness(0) opacity(.22)}
.sl.w{box-shadow:inset 0 0 0 2px var(--c);background:#FFF8E6}
.sl.w img{filter:brightness(0) opacity(.35)}
#song.all{box-shadow:0 0 0 2px #F2C14E,0 0 18px rgba(242,193,78,.6)}

/* scene */
#scene{position:absolute;left:0;top:0;transform-origin:0 0;z-index:5}
#land{position:absolute;left:0;top:0;pointer-events:none}
.plot{position:absolute;width:0;height:0}
.plot .pad{position:absolute;left:-36px;top:-11px;width:72px;height:22px;border-radius:50%;background:rgba(0,0,0,.10)}
.plot.open .pad{background:rgba(255,255,255,.28)}
.mon{position:absolute;cursor:pointer;transition:filter .3s}
.mon.rest{filter:brightness(.78) saturate(.75)}
.bod{position:absolute;inset:0;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
.fig{position:absolute;inset:0;transform-origin:50% 100%}
.fig img{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 4px 3px rgba(0,0,0,.2));pointer-events:none}
.mouth{position:absolute;background-repeat:no-repeat;pointer-events:none}
.bub{position:absolute;left:0;margin-left:-14px;width:28px;height:28px;justify-content:center;display:none;align-items:center;background:#fff;border-radius:14px;font-weight:600;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.14);cursor:pointer;animation:bob 1.8s ease-in-out infinite;white-space:nowrap;font-variant-numeric:tabular-nums}
.bub.full{background:#FFE9A8;box-shadow:0 0 0 2px #F2C14E,0 2px 6px rgba(0,0,0,.14)}
.fx{position:absolute;pointer-events:none}
.deco{position:absolute;pointer-events:none}

/* eggs + bottom */
#eggs{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:30;pointer-events:none;height:52px}
.egg{width:52px;height:52px;position:relative}
.egg svg{position:absolute;inset:0}
.egg b{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:11px;font-weight:600;color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff;font-variant-numeric:tabular-nums}
body[data-isl=night] .egg b,body[data-isl=stage] .egg b{color:#fff;text-shadow:0 0 3px #000}
#bot{position:absolute;left:0;right:0;bottom:0;padding:6px 16px max(14px,env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:40}
#bot .bar{display:flex;gap:6px;width:100%;max-width:560px}
.bb{flex:1;height:58px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-size:12px;position:relative;backdrop-filter:blur(8px);transition:transform .08s}
.bb:active{transform:scale(.96)}
.bb.main{background:var(--btn);color:#fff;border-color:transparent}
.bb .dot{position:absolute;right:10px;top:8px;width:8px;height:8px;border-radius:50%;background:#E0533D;display:none}
.bb.has .dot{display:block}
.bb[disabled]{opacity:.4;cursor:default}

/* sheet */
#scrim{position:absolute;inset:0;background:rgba(15,18,30,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:80}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:50%;bottom:0;width:min(560px,100%);max-height:78%;transform:translate(-50%,105%);transition:transform .3s cubic-bezier(.2,.9,.3,1);z-index:90;background:#FBFAF7;border-radius:22px 22px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#sheet.on{transform:translate(-50%,0)}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.sh-h h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
.x{width:32px;height:32px;border-radius:16px;background:rgba(29,34,48,.07);display:grid;place-items:center}
#shBody{overflow:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile .pic{height:92px;width:100%;border-radius:12px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.tile .pic img{height:84px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.18))}
.tile .nm{font-weight:600;font-size:14px}
.els{display:flex;gap:3px;justify-content:center}
.els i{width:9px;height:9px;border-radius:50%}
.price{display:flex;align-items:center;gap:4px;font-weight:600;font-size:13px;height:28px;padding:0 12px 0 6px;border-radius:14px;background:var(--btn);color:#fff;font-variant-numeric:tabular-nums}
.tile.poor .price{background:#C9CDD6}
.tile.own .price{background:#E7F3EC;color:#2F8F67;padding:0 12px}
.tile.own .pic img{opacity:.6}
.tile.no{animation:shake .35s}
.rowi{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 10px;margin-bottom:8px}
.av{width:48px;height:48px;border-radius:50%;flex:none;position:relative;overflow:hidden;background:var(--t,#eee)}
.av img{position:absolute;left:50%;top:4px;height:60px;transform:translateX(-50%)}
.av.miss img{filter:grayscale(1) opacity(.35)}
.av.sil{background:rgba(29,34,48,.06);box-shadow:inset 0 0 0 1.5px rgba(29,34,48,.15)}
.av.sil img{filter:brightness(0) opacity(.28)}
.op{color:var(--sub);font-weight:500;font-size:16px}
.rowi .nm{flex:1;min-width:0;font-weight:600;font-size:14px;line-height:1.25}
.rowi .nm small{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--sub)}
.go{flex:none;height:34px;border-radius:17px;padding:0 16px;font-weight:600;font-size:14px;background:var(--btn);color:#fff}
.go[disabled]{background:#DADDE3;color:#8A90A0;cursor:default}
.ok{flex:none;width:30px;height:30px;border-radius:15px;background:#E7F3EC;display:grid;place-items:center}
@media (max-width:480px){.av{width:40px;height:40px}.av img{height:50px;top:3px}.rowi{gap:5px;padding:7px 8px}.op{font-size:13px}.rowi .nm{font-size:13px}.go{padding:0 12px}}
.tm{white-space:nowrap}
.empty{color:var(--sub);font-size:14px;text-align:center;padding:24px 0 18px}

/* toast + start + loader */
#toast{position:absolute;left:50%;transform:translate(-50%,-20px);opacity:0;pointer-events:none;z-index:70;background:var(--btn);color:#fff;border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:14px;transition:opacity .25s,transform .25s;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{height:32px;border-radius:16px;background:#fff;color:var(--ink);padding:0 14px;font-weight:600;font-size:13px}
#toast img{height:34px;margin:-6px 0}
#start{position:absolute;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:linear-gradient(#D6EEF7,#A3D3E6);transition:opacity .4s}
#start h1{font-size:40px;font-weight:700;letter-spacing:-.03em}
#start .row{display:flex;gap:2px;align-items:flex-end}
#start .row img{height:70px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2));animation:bob 1.4s ease-in-out infinite}
.ring{width:88px;height:88px;border-radius:44px;background:var(--btn);display:grid;place-items:center;position:relative;cursor:pointer}
.ring svg.ld{position:absolute;inset:-8px}
.ring.load{background:#C9CDD6;cursor:default}
#loader{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;pointer-events:none}
#loader.on{display:flex}
#loader .ring{background:var(--panel);width:64px;height:64px;cursor:default}
#party{position:absolute;inset:0;pointer-events:none;z-index:65;overflow:hidden}
.cf{position:absolute;width:8px;height:13px;border-radius:2px;top:-20px}
</style>
</head>

 <symbol id="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="#E9A82B"/><circle cx="12" cy="11.2" r="9.4" fill="#F6C94A"/><circle cx="12" cy="11.2" r="6" fill="none" stroke="#E0A12A" stroke-width="1.6"/></symbol>

 <symbol id="shop" viewBox="0 0 24 24"><path d="M4 9l1.5-5h13L20 9M4 9h16v1.5a2.7 2.7 0 0 1-5.3 0 2.7 2.7 0 0 1-5.4 0 2.7 2.7 0 0 1-5.3 0zM5.5 13v7h13v-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>

 <symbol id="snd" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>

 <symbol id="play" viewBox="0 0 24 24"><path d="M8.5 5.8v12.4a.8.8 0 0 0 1.2.7l9.6-6.2a.8.8 0 0 0 0-1.4L9.7 5.1a.8.8 0 0 0-1.2.7z" fill="#fff"/></symbol>
</defs></svg>

<div id="scene"><svg id="land"></svg><div id="decos"></div><div id="plots"></div><div id="fxl" class="fx" style="left:0;top:0"></div></div>

<div id="top">
  <div class="row1">
    <div class="pill" id="coinPill"><svg class="i" id="coinIc" width="22" height="22"><use href="#coin"/></svg><span id="coinN">0</span></div>
    <div class="sp"></div>
    <button class="tg" id="fastBtn" aria-pressed="false">Fast<span class="sw"></span></button>
    <button class="ib" id="sndBtn" aria-label="Sound"><svg class="i" width="18" height="18"><use href="#snd"/></svg></button>
    <button class="ib" id="resetBtn" aria-label="Start over"><svg class="i" width="18" height="18"><use href="#redo"/></svg></button>
  </div>
  <div id="isles"></div>
  <div id="song"></div>
</div>

<div id="eggs"></div>
<div id="bot"><div class="bar">
  <button class="bb" id="bShop"><svg class="i" width="22" height="22"><use href="#shop"/></svg>Shop<i class="dot"></i></button>
  <button class="bb" id="bBreed"><svg class="i" width="22" height="22"><use href="#heart"/></svg>Breed<i class="dot"></i></button>
  <button class="bb" id="bMove"><svg class="i" width="22" height="22"><use href="#boat"/></svg>Move here<i class="dot"></i></button>
  <button class="bb main" id="bCollect"><svg class="i" width="22" height="22"><use href="#coin"/></svg>Collect<i class="dot"></i></button>
</div></div>

<div id="scrim"></div>
<div id="sheet"><div class="sh-h"><h3 id="shTitle"></h3><button class="x" id="shX" aria-label="Close"><svg class="i" width="16" height="16"><use href="#x"/></svg></button></div><div id="shBody"></div></div>
<div id="toast"></div>
<div id="party"></div>
<div id="loader"><div class="ring"><svg class="ld" width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="36" fill="none" stroke="rgba(29,34,48,.1)" stroke-width="5"/><circle id="ldArc2" cx="40" cy="40" r="36" fill="none" stroke="#2F8F67" stroke-width="5" stroke-dasharray="0 227" transform="rotate(-90 40 40)" stroke-linecap="round"/></svg><svg class="i" width="24" height="24" style="color:var(--ink)"><use href="#boat"/></svg></div></div>

<div id="start">
  <h1>Sing Island World</h1>
  <div class="row" id="startRow"></div>
  <button class="ring load" id="playBtn" aria-label="Play"><svg class="ld" width="104" height="104" viewBox="0 0 104 104"><circle cx="52" cy="52" r="48" fill="none" stroke="rgba(29,34,48,.12)" stroke-width="5"/><circle id="ldArc" cx="52" cy="52" r="48" fill="none" stroke="#2F8F67" stroke-width="5" stroke-dasharray="0 302" transform="rotate(-90 52 52)" stroke-linecap="round"/></svg><svg class="i" width="38" height="38"><use href="#play"/></svg></button>
</div>

<script>
(function(){
'use strict';
var IMG='img/';
/* ---------- the world ---------- */
var EL={thump:{n:'Thump',c:'#E0694B'},hum:{n:'Hum',c:'#3F9E6C'},chime:{n:'Chime',c:'#D9A22C'},twang:{n:'Twang',c:'#8467D3'},puff:{n:'Puff',c:'#3E97CF'}};
/* one species = one role = one stem kind; it plays that island's stem for its role wherever it lives */
var SP={
 thumpling:{n:'Thumpling',els:['thump'],role:'drums',pic:'drums',col:'#E0694B'},
 bommo:{n:'Bommo',els:['hum'],role:'voice_bom',pic:'voice_bom',col:'#3F9E6C'},
 tinka:{n:'Tinka',els:['chime'],role:'percussion',pic:'bell_bear',col:'#D9A22C'},
 plinker:{n:'Plinker',els:['twang'],role:'bass',pic:'bass',col:'#8467D3'},
 hoot:{n:'Hoot',els:['puff'],role:'bass',pic:'bone_thimble',col:'#3E97CF'},
 doowop:{n:'Doowop',els:['thump','hum'],role:'voice_doowah_lo',pic:'voice_doowah_lo',col:'#7C8F3F'},
 clonk:{n:'Clonk',els:['thump','chime'],role:'keyboard',pic:'rib_whisper',col:'#D9873A'},
 fizz:{n:'Fizz',els:['hum','chime'],role:'synth',pic:'skip_chorister',col:'#5BAE3A'},
 strummer:{n:'Strummer',els:['chime','twang'],role:'guitar',pic:'guitar',col:'#C65BA8'},
 reedle:{n:'Reedle',els:['hum','twang'],role:'woodwinds',pic:'woodwinds',col:'#5D7FC9'},
 flutey:{n:'Flutey',els:['chime','puff'],role:'woodwinds',pic:'island_whistler',col:'#2FA7A0'},
 shanty:{n:'Shanty',els:['hum','puff'],role:'voice_suno_line',pic:'cutlass_baritone',col:'#3C8DA8'},
 blarp:{n:'Blarp',els:['thump','hum','chime'],role:'brass',pic:'brass',col:'#E8923A'},
 fiddlewisp:{n:'Fiddlewisp',els:['hum','chime','twang'],role:'strings',pic:'strings',col:'#9A5FD0'},

  pool.forEach(function(a){pool.forEach(function(b){if(a===b)return;var A=SP[a],B=SP[b];
    var big=A.tier>=B.tier?A:B,sm=A.tier>=B.tier?B:A;if(sm.tier!==1||big.tier!==ch.tier-1)return;

  else{setMouth(pe,1);pe.mUntil=now+.11;}
  if(now-pe.lastHit>(stem==='drums'||stem==='percussion'?.1:.14)){pe.lastHit=now;var len=Math.max(.12,Math.min(.45,n[2]||.2));
    pe.pic.animate([{filter:'drop-shadow(0 0 8px '+p.col+') drop-shadow(0 0 3px '+p.col+') brightness(1.25)'},{filter:'drop-shadow(0 0 0 transparent) drop-shadow(0 4px 3px rgba(0,0,0,.2)) brightness(1)'}],{duration:240,easing:'ease-out'});
    if(sing)pe.fig.animate([{transform:'scale(1,1)'},{transform:'scale(.94,1.1) rotate('+(n[1]%2?-3:3)+'deg)',offset:.3},{transform:'scale(1,1)'}],{duration:len*1000+120,easing:'ease-out'});
    else{var amt=stem==='drums'||stem==='bass'?.1:.07;pe.fig.animate([{transform:'scale(1,1)'},{transform:'scale('+(1+amt)+','+(1-amt)+')',offset:.2},{transform:'scale('+(1-amt*.5)+','+(1+amt*.6)+') translateY(-4px)',offset:.55},{transform:'scale(1,1)'}],{duration:Math.min(320,len*1000+140),easing:'ease-out'});}
    var sl=slots[stem];if(sl)sl.animate([{transform:'scale(1.2)'},{transform:'scale(1)'}],{duration:200});}
  var pt=LAY[mode].pts[i],h=monH(pe.id);
  if(now-pe.lastNote>.16&&puffs<40){pe.lastNote=now;puffs++;var sz=sing?17:13,dx=(Math.random()*2-1)*14,rot=(Math.random()*2-1)*18;
    var d=el('div','fx','left:'+(pt[0]+h*.18-sz/2)+'px;top:'+(pt[1]-h-4)+'px;color:'+p.col+';z-index:1000;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1px #fff)','<svg class="i" width="'+sz+'" height="'+sz+'"><use href="#note"/></svg>');fxl.appendChild(d);
    d.animate([{transform:'translate(0,0) scale(.5)',opacity:0},{transform:'translate('+(dx*.3)+'px,-10px) scale(1) rotate('+(rot*.4)+'deg)',opacity:1,offset:.18},{transform:'translate('+dx+'px,-44px) scale(.85) rotate('+rot+'deg)',opacity:0}],{duration:760,easing:'ease-out'}).onfinish=function(){d.remove();puffs--;};}
}
var lastWall=performance.now(),lastSlow=0;
function frame(){
  requestAnimationFrame(frame);
  var wall=performance.now(),dt=Math.min(1,(wall-lastWall)/1000);lastWall=wall;
  if(started){
    /* coins: monsters here fill their bubbles; monsters on other islands pay straight in */
    ORDER.forEach(function(k){var X=S.isl[k];X.plots.forEach(function(id,i){if(!id)return;var r=RATE[SP[id].tier]*dt;if(k===S.cur)X.store[i]=Math.min(cap(id),X.store[i]+r);else S.coins+=r;});
      var now=Date.now();for(var e=X.eggs.length-1;e>=0;e--){if(now>=X.eggs[e].end){var eg=X.eggs.splice(e,1)[0];hatch(k,eg);if(k===S.cur)refresh();}}});
  }
  shownCoins+=(S.coins-shownCoins)*.2;if(Math.abs(S.coins-shownCoins)<.6)shownCoins=S.coins;$('coinN').textContent=fmt(shownCoins);
  if(wall-lastSlow>250){lastSlow=wall;renderEggs();for(var b=0;b<12;b++)updBub(b);if(started){save();$('bCollect').classList.toggle('has',I().store.some(function(v){return v>=1;}));refreshSong();}}
  if(!playing()||ac.currentTime<AU.T0)return;
  var vt=ac.currentTime-(ac.outputLatency||0)-(ac.baseLatency||0);if(vt<AU.T0)return;
  var cur=songT(vt),now=wall/1000;
  if(prevT!=null&&cur<prevT&&prevT-cur<AU.L*.5)cur=prevT;
  if(prevT!=null&&cur!==prevT){
    plotEls.forEach(function(pe,i){if(!pe.id||!pe.stem)return;var on=AU.partOn[pe.stem];if(on==null||vt<on)return;
      var fn=function(n){onNote(i,pe,n,now);};
      if(cur>prevT){if(cur-prevT<1)notesBetween(pe.stem,prevT,cur,fn);}else{notesBetween(pe.stem,prevT,AU.LE,fn);notesBetween(pe.stem,AU.LS-1e-6,cur,fn);}});
  }
  prevT=cur;
  plotEls.forEach(function(pe){if(!pe.id)return;var on=AU.partOn[pe.stem];var rest=on==null||vt<on||now-pe.heard>.7;if(rest!==pe.rest){pe.rest=rest;pe.mon.classList.toggle('rest',rest);}if(now>=pe.mUntil)setMouth(pe,isSing(pe.stem)?0:5);});
}

['drums','voice_bom','tiny_peep','strings','masquerade_mezzo','guitar','voice_scat'].forEach(function(p,k){var im=el('img','','animation-delay:'+(k*.14)+'s');im.src=IMG+p+'.webp';im.alt='';$('startRow').appendChild(im);});
document.body.dataset.isl=S.cur;renderIsles();buildSong();layout();renderPlots();layout();refresh();

tap($('playBtn'),function(){
  if($('playBtn').classList.contains('load'))return;
  try{ac.resume();}catch(e){}started=true;lastWall=performance.now();
  var st=$('start');st.style.opacity=0;st.style.pointerEvents='none';setTimeout(function(){st.remove();},450);
  enterIsland();refresh();save();
});

document.addEventListener('visibilitychange',function(){save();if(!ac||!started)return;if(document.hidden)ac.suspend();else ac.resume();});
requestAnimationFrame(frame);
