<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rollybully early access</title>
<meta name="description" content="Join the Rollybully early access waitlist. Windows, by Thumbyard.">
<meta property="og:title" content="Rollybully early access">
<meta property="og:image" content="https://rollybully.com/assets/still-goal.jpg">
<link rel="icon" href="../assets/ball.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--floor:#e8e6df;--ink:#14172c;--cyan:#2fd6f5;--cyan2:#12a6c6;--cream:#f6efdc;--muted:#6f6c62}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:var(--floor);min-height:100vh;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(rgba(20,23,44,.05) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(20,23,44,.05) 1.5px,transparent 1.5px);background-size:72px 72px;background-position:center}
a{color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px clamp(16px,4vw,48px)}
.top img{width:clamp(180px,22vw,280px)}
.top a.home{font-weight:800;font-size:14px;text-decoration:none;border-bottom:3px solid var(--cyan)}
main{max-width:1040px;margin:0 auto;padding:clamp(12px,3vw,40px) clamp(16px,4vw,48px) 80px;display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,5vw,64px);align-items:center}
h1{font-weight:900;font-size:clamp(46px,7vw,92px);line-height:.9;text-transform:uppercase;letter-spacing:-.01em}
h1 span{color:var(--cyan2)}
.lede{font-weight:600;font-size:clamp(16px,1.6vw,19px);margin:18px 0 28px;max-width:40ch;color:#3b3a36}
form{background:#fff;border:4px solid var(--ink);border-radius:24px;padding:22px;box-shadow:0 10px 0 rgba(20,23,44,.12)}
label{display:block;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
input[type=email]{width:100%;font:600 18px Poppins,sans-serif;color:var(--ink);background:var(--floor);border:3px solid var(--ink);border-radius:14px;padding:14px 16px;outline:none}
input[type=email]:focus{border-color:var(--cyan2);box-shadow:0 0 0 4px rgba(47,214,245,.35)}
.pick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:18px 0 6px;max-width:380px}
.pick button{width:100%;aspect-ratio:1;border-radius:50%;border:3px solid transparent;background:none;padding:0;cursor:pointer;transition:transform .15s}
.pick button img{width:100%;height:100%;display:block}
.pick button:hover{transform:translateY(-3px) rotate(-20deg)}
.pick button.on{border-color:var(--cyan2);transform:scale(1.1)}
.pickname{font-weight:700;font-size:13px;color:var(--muted);min-height:20px}
.go{width:100%;margin-top:16px;font:900 22px Poppins,sans-serif;color:var(--ink);background:var(--cyan);border:4px solid var(--ink);border-radius:16px;padding:14px 0;box-shadow:0 7px 0 var(--cyan2);cursor:pointer}
.go:active{transform:translateY(4px);box-shadow:0 3px 0 var(--cyan2)}
.go:disabled{opacity:.6}
.small{font-weight:600;font-size:12px;color:var(--muted);margin-top:12px}
.err{color:#c8402f;font-weight:700;font-size:14px;margin-top:10px;min-height:20px}
.hp{position:absolute;left:-9999px}
.done{display:none;text-align:center;padding:24px 8px}
.done img{width:110px;margin:0 auto 14px;animation:hop 1s cubic-bezier(.3,1.6,.5,1) infinite alternate}
.done b{display:block;font-weight:900;font-size:28px;text-transform:uppercase}
.done p{font-weight:600;color:#3b3a36;margin-top:8px}
form.sent .fields{display:none}form.sent .done{display:block}
@keyframes hop{from{transform:translateY(0) rotate(0)}to{transform:translateY(-14px) rotate(25deg)}}
.shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:1040px;margin:0 auto;padding:0 clamp(16px,4vw,48px) 60px}
.shots img{width:100%;aspect-ratio:16/10;object-fit:cover;border:4px solid var(--ink);border-radius:18px;display:block}
footer{background:var(--ink);color:#9aa1c8;padding:24px clamp(16px,4vw,48px);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700;font-size:14px}
footer b{color:var(--cream);font-weight:900}
@media (max-width:820px){main{grid-template-columns:1fr}.shots{grid-template-columns:1fr 1fr}.shots img:last-child{display:none}}
</style>
</head>
<body>
<div class="top"><a href="../"><img src="../assets/logo.webp" alt="Rollybully"></a><a class="home" href="../">Back to the arena</a></div>
<main>
  <div>
    <h1>Early<br><span>access</span></h1>
    <p class="lede">Rollybully is in early access on Windows. Leave your email and we'll let you in as spots open.</p>
  </div>
  <form id="f" novalidate>
    <div class="fields">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="pick" id="pick" aria-label="Your bully"></div>
      <div class="pickname" id="pickname">Pick your bully (optional)</div>
      <button class="go" type="submit" id="go">JOIN THE WAITLIST</button>
      <div class="err" id="err"></div>
      <div class="small">One email when your spot opens. Nothing else.</div>
    </div>
    <div class="done"><img id="doneimg" src="../assets/pillbug-ball.webp" alt=""><b>You're on the list</b><p>We'll email you when your spot opens.</p></div>
  </form>
</main>
<div class="shots"><img src="../assets/still-goal.jpg" alt="Goal mode"><img src="../assets/still-gems.jpg" alt="Gems mode"><img src="../assets/still-zone.jpg" alt="Zone mode"></div>
<footer><span><b>Thumbyard</b> made this.</span><span>&copy; 2026 Thumbyard</span></footer>
<script>
const B=[['pillbug','Pill bug'],['woollybear','Woolly bear'],['millipede','Millipede'],['wheelspider','Wheel spider'],['wasp','Cuckoo wasp'],['cockroach','Cockroach'],['boxmite','Box mite']];
let bully='';const pick=document.getElementById('pick');
B.forEach(([id,n])=>{const b=document.createElement('button');b.type='button';b.title=n;b.innerHTML=`<img src="../assets/${id}-ball.webp" alt="${n}">`;
  b.onclick=()=>{bully=bully===id?'':id;pick.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b&&bully===id));
    document.getElementById('pickname').textContent=bully?n:'Pick your bully (optional)'};pick.appendChild(b)});
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';
  const email=f.email.value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){err.textContent='That email does not look right.';f.email.focus();return}
  go.disabled=true;go.textContent='JOINING...';
  try{const r=await fetch('/api/waitlist',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,bully,website:f.website.value})});
    const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw 0;
    if(bully)document.getElementById('doneimg').src=`../assets/${bully}-ball.webp`;f.classList.add('sent')}
  catch(_){err.textContent='Could not join just now. Try again in a minute.';go.disabled=false;go.textContent='JOIN THE WAITLIST'}});
</script>
</body>
</html>
