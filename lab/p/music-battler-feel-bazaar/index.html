<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bazaar Stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efeeeb;--surface:#ffffff;--surface2:#f7f6f4;--ink:#18181b;--muted:#6f6f78;--line:rgba(0,0,0,.10);--slot:rgba(0,0,0,.035);
  --accent:#c47a1c;--accentInk:#fff;
  --hit:#e5484d;--hold:#6e8fb0;--swell:#2f9e65;--fb:#f2711c;--dis:#8e4ec6;--haste:#2f9e65;--slow:#3e63dd;--rest:#5bc4e6;
  --bronze:#b0764a;--silver:#9aa3ad;--gold:#d4a72c;--diamond:#43bfd6;
  --sw:60px;--sh:96px;--gap:4px;--hp:52px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101012;--surface:#1a1a1e;--surface2:#151518;--ink:#ececef;--muted:#8d8d96;--line:rgba(255,255,255,.09);--slot:rgba(255,255,255,.035);
  --accent:#e0952f;--accentInk:#1a1206;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#101012;--surface:#1a1a1e;--surface2:#151518;--ink:#ececef;--muted:#8d8d96;--line:rgba(255,255,255,.09);--slot:rgba(255,255,255,.035);--accent:#e0952f;--accentInk:#1a1206;color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{position:fixed;left:0;top:0;padding-top:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--gap)*2);overflow:hidden;background:var(--bg)}
#app.finale{background:color-mix(in srgb,var(--bg) 88%,#d9822b)}
.where{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px;flex:none}
.stops{display:flex;gap:5px;align-items:center}
.stops i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.stops i.on{background:var(--ink)}
.stops i.done{background:var(--muted);opacity:.5}
.stops i.m{border-radius:1px}
.stops i.p{width:9px;height:9px;border-radius:2px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.hero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;min-height:calc(var(--hp) + 4px);width:var(--midW);flex:none}
.narrow .hero{grid-template-columns:auto 1fr;width:var(--rowW)}.narrow .hero .pic{grid-column:1}.narrow .hero .info{grid-column:2;min-width:0}.narrow .hero .sub{flex-wrap:wrap;gap:2px 10px}
.hero .pic{grid-column:2}.hero .info{grid-column:3}.hero>.sub{grid-column:1/4;justify-self:center}
.hero .pic{width:var(--hp);height:var(--hp);border-radius:10px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);flex:none;position:relative}
.hero .pic img{width:100%;height:100%;object-fit:cover;display:block}
.hero .info{display:flex;flex-direction:column;gap:4px;min-width:180px}
.hero .nm{font-weight:600;font-size:12.5px;white-space:nowrap}
.hero .sub{color:var(--muted);font-size:11.5px;display:flex;gap:10px;align-items:center;white-space:nowrap}
.hero .sub b{color:var(--ink);font-weight:600}
.hpbar{position:relative;height:14px;width:min(260px,calc(var(--sw)*3.2));border-radius:4px;background:var(--slot);border:1px solid var(--line);overflow:hidden}
.hpbar .h{position:absolute;left:0;top:0;bottom:0;background:var(--swell);transition:width .12s}
.hpbar .s{position:absolute;top:0;bottom:0;background:var(--hold);opacity:.85}
.hpbar .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:var(--ink);mix-blend-mode:normal;text-shadow:0 0 3px var(--surface)}
.fx{display:flex;gap:5px;min-height:14px}
.fx span{font-size:10.5px;font-weight:600;padding:0 5px;border-radius:4px;color:#fff;line-height:14px}
.fx .fb{background:var(--fb)}.fx .dis{background:var(--dis)}.fx .sus{background:var(--swell)}.fx .inv{background:var(--muted)}
.row{position:relative;height:var(--rowH);width:var(--rowW);flex:none}
.slot{position:absolute;top:0;height:var(--sh);width:var(--sw);border-radius:8px;background:var(--slot);border:1px dashed var(--line)}
.slot.locked{border-style:solid;opacity:.35;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px)}
.card{position:absolute;top:0;height:var(--sh);border-radius:9px;overflow:hidden;background:var(--surface);border:2px solid var(--bronze);box-shadow:0 1px 2px rgba(0,0,0,.12);transition:transform .08s}
.card.t1{border-color:var(--silver)}.card.t2{border-color:var(--gold)}.card.t3{border-color:var(--diamond)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.card .nm{position:absolute;left:0;right:0;bottom:0;padding:12px 4px 3px;font-size:clamp(8.5px,calc(var(--sw)*.15),11.5px);font-weight:600;line-height:1.12;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72) 45%);text-align:center}
.card .bd{position:absolute;top:3px;left:3px;right:3px;display:flex;gap:2px;flex-wrap:wrap}
.card .bd b{font-size:clamp(8.5px,calc(var(--sw)*.16),12px);font-weight:700;color:#fff;border-radius:4px;padding:0 3px;line-height:1.35}
.bd .dmg{background:var(--hit)}.bd .sh{background:var(--hold)}.bd .hl{background:var(--swell)}.bd .bn{background:var(--fb)}.bd .ps{background:var(--dis)}
.card .cd{position:absolute;right:3px;top:calc(var(--sh)*.5);font-size:9.5px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;border-radius:4px;padding:0 3px}
.card .am{position:absolute;left:3px;top:calc(var(--sh)*.5);display:flex;gap:1.5px}
.card .am i{width:4px;height:7px;border-radius:1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.card .am i.x{opacity:.25}
.card .fill{position:absolute;left:0;right:0;top:0;background:rgba(10,10,14,.42);pointer-events:none}
.card .st{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .1s}
.card.haste .st{opacity:1;box-shadow:inset 0 0 0 3px var(--haste)}
.card.slow .st{opacity:1;box-shadow:inset 0 0 0 3px var(--slow)}
.card.frz .st{opacity:1;background:rgba(160,225,255,.35);box-shadow:inset 0 0 0 3px var(--rest)}
.card.cont img{object-position:80% 20%}.card.cont{opacity:.92}
.choice.evt{flex-direction:row}.choice.evt .art{flex:0 0 40%}.choice.evt .tx{border-top:0;border-left:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;justify-content:center;gap:6px}.choice.evt .ss{font-size:13px;line-height:1.4;color:var(--ink)}
.narrow .choice.evt{flex-direction:column}.narrow .choice.evt .tx{border-left:0;border-top:1px solid var(--line)}
.card.ench::after{content:"";position:absolute;right:4px;bottom:calc(var(--sh)*.36);width:8px;height:8px;border-radius:50%;background:var(--ec,#fff);box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
.card.fire{transform:translateY(-7px)}
.card.foe.fire{transform:translateY(7px)}
.card.crit{box-shadow:0 0 0 3px var(--accent),0 2px 10px rgba(0,0,0,.25)}
.card.pick{box-shadow:0 0 0 3px var(--accent)}
.card.sel{box-shadow:0 0 0 3px var(--ink)}
.card.dim{opacity:.45}
.price{position:absolute;right:3px;top:3px;font-size:clamp(9px,calc(var(--sw)*.16),12px);font-weight:700;color:#1a1206;background:var(--gold);border-radius:4px;padding:0 4px;line-height:1.4;white-space:nowrap;z-index:2}
.price.up{background:var(--swell);color:#fff}
.choice{position:absolute;top:0;height:var(--rowH);border-radius:10px;background:var(--surface);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;text-align:left}
.choice .art{flex:1;min-height:0;position:relative;background:var(--surface2)}
.choice .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 50%}
.choice .art svg{position:absolute;inset:0;margin:auto;width:42%;height:42%;stroke:var(--muted);fill:none;stroke-width:1.4}
.choice .tx{padding:6px 8px 7px;border-top:1px solid var(--line)}
.choice .tt{font-weight:600;font-size:clamp(11px,calc(var(--sw)*.19),14px)}
.choice .ss{color:var(--muted);font-size:clamp(10px,calc(var(--sw)*.16),12px);margin-top:1px}
.choice .tag{position:absolute;top:6px;left:6px;font-size:10px;font-weight:700;color:#fff;border-radius:4px;padding:1px 5px}
.mid{min-height:var(--midH);width:var(--midW);display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex:none;flex-wrap:wrap}
.narrow .mid{width:var(--rowW)}.narrow .mid .r{flex:1 0 100%;justify-content:flex-end}
.mid .l{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mid .title{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid .r{display:flex;gap:6px}
.btn{height:44px;min-width:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:12.5px;white-space:nowrap}
.btn.go{background:var(--accent);color:var(--accentInk);border-color:transparent}
.btn:disabled{opacity:.4;cursor:default}
.song{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.song .bars{position:relative;flex:1;height:6px;border-radius:3px;background:var(--slot);border:1px solid var(--line);overflow:hidden;max-width:420px}
.song .bars i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);opacity:.55}
.song .bars u{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--fb)}
.song .ch{font-weight:700;font-size:12px;min-width:76px}
.song .beat{display:flex;gap:3px}
.song .beat i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.song .beat i.on{background:var(--ink)}
.float{position:absolute;font-weight:800;font-size:16px;pointer-events:none;animation:up .8s ease-out forwards;text-shadow:0 1px 2px rgba(0,0,0,.25);z-index:5}
@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-26px);opacity:0}}
.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;min-width:240px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.18);z-index:20}
.banner h2{margin:0 0 4px;font-size:20px}
.banner p{margin:0 0 12px;color:var(--muted)}
#sheet{position:absolute;right:10px;top:48px;bottom:10px;width:min(320px,46%);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.2);padding:14px;display:none;flex-direction:column;gap:8px;z-index:30;overflow:auto}
#sheet.on{display:flex}
.narrow #sheet{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:62%}
#sheet h3{margin:0;font-size:16px}
#sheet .meta{color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 10px}
#sheet .txt{font-size:13px;line-height:1.45}
#sheet .txt b{color:var(--accent)}
#sheet .tone{font-size:12px;border-left:3px solid var(--ec,var(--accent));padding-left:8px}
#sheet .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
#sheet .x{position:absolute;right:8px;top:8px}
.tierdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#start{position:absolute;inset:40px 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);z-index:40}
#start h1{margin:0;font-size:22px;letter-spacing:-.01em}
#start .opts{display:flex;gap:14px}
#start .opt{width:min(190px,30vmin);border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line);text-align:center}
#start .opt img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
#start .opt div{padding:9px 6px;font-weight:600}
#toast{position:absolute;left:50%;top:48px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;white-space:nowrap}
#toast.on{opacity:1}
.coin{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gold);margin-right:3px;vertical-align:-1px}
</style>
</head>
<body>
<div id="app">
  <section class="hero foe" id="foeHero"></section>
  <section class="row" id="upper"></section>
  <div class="mid" id="mid"></div>
  <section class="row mine" id="lower"></section>
  <section class="hero me" id="meHero"></section>
  <div id="sheet"></div>
  <div id="toast"></div>
  <div id="start"></div>
</div>
<script src="song.js"></script>
<script src="cards.js"></script>
<script src="game.js"></script>
</body>
</html>
